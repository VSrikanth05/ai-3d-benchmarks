<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snowy Log Cabin Diorama</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f3f6fa;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================================
    // 1. DETERMINISTIC SEEDED PRNG & NOISE UTILITIES
    // =========================================================================
    class PRNG {
      constructor(seed = 1337) {
        this.s = seed % 2147483647;
        if (this.s <= 0) this.s += 2147483646;
      }
      next() {
        this.s = (this.s * 16807) % 2147483647;
        return (this.s - 1) / 2147483646;
      }
      range(min, max) {
        return min + (max - min) * this.next();
      }
    }

    const rng = new PRNG(42079);

    function hash2(x, y) {
      const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return h - Math.floor(h);
    }

    function noise2D(x, y) {
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      const fx = x - ix;
      const fy = y - iy;
      const ux = fx * fx * (3.0 - 2.0 * fx);
      const uy = fy * fy * (3.0 - 2.0 * fy);
      const a = hash2(ix, iy);
      const b = hash2(ix + 1, iy);
      const c = hash2(ix, iy + 1);
      const d = hash2(ix + 1, iy + 1);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }

    function fbm2(x, y, octaves = 4) {
      let val = 0.0;
      let amp = 0.5;
      let freq = 1.0;
      for (let i = 0; i < octaves; i++) {
        val += amp * (noise2D(x * freq, y * freq) * 2.0 - 1.0);
        freq *= 2.03;
        amp *= 0.5;
      }
      return val;
    }

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0.0, Math.min(1.0, (x - edge0) / (edge1 - edge0)));
      return t * t * (3.0 - 2.0 * t);
    }

    // =========================================================================
    // 2. PARAMETRIC LOFTING ENGINE WITH ANALYTIC NORMALS
    // =========================================================================
    /**
     * Evaluates a 2D parametric surface S(u, v) for u in [0, 1], v in [0, 1],
     * computing analytic partial derivatives dS/du and dS/dv via exact surface
     * differentials, plus optional closed caps at u=0 and u=1.
     */
    function buildParametricLoft({
      uSegments = 32,
      vSegments = 24,
      closedV = true,
      capStart = false,
      capEnd = false,
      evalPos,     // (u, v, targetVec3) => void
      evalColor,   // optional (u, v, pos, normal, targetColor) => void
      uvScaleU = 1.0,
      uvScaleV = 1.0,
      flipNormal = false
    }) {
      const ringCount = uSegments + 1;
      const stride = vSegments + 1;
      const positions = [];
      const normals = [];
      const uvs = [];
      const colors = [];
      const indices = [];

      const p = new THREE.Vector3();
      const pu1 = new THREE.Vector3();
      const pu2 = new THREE.Vector3();
      const pv1 = new THREE.Vector3();
      const pv2 = new THREE.Vector3();
      const dU = new THREE.Vector3();
      const dV = new THREE.Vector3();
      const norm = new THREE.Vector3();
      const col = new THREE.Color(1, 1, 1);

      const epsU = 1e-4;
      const epsV = 1e-4;

      const rawNormals = [];
      const ringCenters = [];

      for (let iu = 0; iu <= uSegments; iu++) {
        const u = iu / uSegments;
        const uMinus = Math.max(0.0, u - epsU);
        const uPlus = Math.min(1.0, u + epsU);
        const rCenter = new THREE.Vector3();

        for (let iv = 0; iv <= vSegments; iv++) {
          const v = iv / vSegments;
          const vActual = (closedV && iv === vSegments) ? 0.0 : v;

          evalPos(u, vActual, p);
          rCenter.add(p);

          evalPos(uPlus, vActual, pu2);
          evalPos(uMinus, vActual, pu1);
          dU.subVectors(pu2, pu1);

          let vMinus = vActual - epsV;
          let vPlus = vActual + epsV;
          if (closedV) {
            if (vMinus < 0.0) vMinus += 1.0;
            if (vPlus >= 1.0) vPlus -= 1.0;
          } else {
            vMinus = Math.max(0.0, vMinus);
            vPlus = Math.min(1.0, vPlus);
          }

          evalPos(u, vPlus, pv2);
          evalPos(u, vMinus, pv1);
          dV.subVectors(pv2, pv1);

          // dU x dV matches counter-clockwise triangle winding (a, b, d)
          norm.crossVectors(dU, dV);

          positions.push(p.x, p.y, p.z);
          rawNormals.push(norm.x, norm.y, norm.z);
          uvs.push(u * uvScaleU, v * uvScaleV);
        }

        rCenter.multiplyScalar(1.0 / stride);
        ringCenters.push(rCenter);
      }

      // Determine outward orientation sign:
      // 1) For radial disks/skirts expanding from center (snow rise, pine boughs, snow caps),
      //    ensure upper surface normals point upward (+Y).
      // 2) For tubular/axial lofts and closed 3D cobbles, use Green's / Divergence theorem
      //    around the cross-section rings.
      const globalCenter = new THREE.Vector3();
      for (let i = 0; i < ringCenters.length; i++) globalCenter.add(ringCenters[i]);
      globalCenter.multiplyScalar(1.0 / ringCenters.length);

      const getRingRadius = (iu) => {
        const c = ringCenters[iu];
        let rSum = 0.0;
        for (let iv = 0; iv < vSegments; iv++) {
          const idx = (iu * stride + iv) * 3;
          rSum += Math.hypot(positions[idx] - c.x, positions[idx + 1] - c.y, positions[idx + 2] - c.z);
        }
        return rSum / vSegments;
      };

      const rStart = getRingRadius(0);
      const rMid = getRingRadius(Math.max(1, Math.floor(uSegments * 0.75)));
      const isRadialConeOrDisk = closedV && !capStart && (rStart < rMid * 0.35);

      let orientVote = 0.0;
      if (isRadialConeOrDisk) {
        const upperLimit = Math.max(1, Math.floor(uSegments * 0.78));
        for (let iu = 0; iu <= upperLimit; iu++) {
          for (let iv = 0; iv < vSegments; iv++) {
            const idx = (iu * stride + iv) * 3;
            orientVote += rawNormals[idx + 1]; // Y component on upper dome/cone
          }
        }
      } else {
        let spineSpanSq = 0.0;
        for (let i = 0; i < ringCenters.length; i++) {
          spineSpanSq = Math.max(spineSpanSq, ringCenters[i].distanceToSquared(globalCenter));
        }
        for (let iu = 0; iu <= uSegments; iu++) {
          const refCenter = spineSpanSq > 0.04 ? ringCenters[iu] : globalCenter;
          for (let iv = 0; iv < vSegments; iv++) {
            const idx = (iu * stride + iv) * 3;
            const rx = positions[idx] - refCenter.x;
            const ry = positions[idx + 1] - refCenter.y;
            const rz = positions[idx + 2] - refCenter.z;
            orientVote += rx * rawNormals[idx] + ry * rawNormals[idx + 1] + rz * rawNormals[idx + 2];
          }
        }
      }

      let sign = (closedV && orientVote < 0.0) ? -1.0 : 1.0;
      if (flipNormal) sign *= -1.0;

      for (let i = 0; i < rawNormals.length; i += 3) {
        norm.set(rawNormals[i] * sign, rawNormals[i + 1] * sign, rawNormals[i + 2] * sign);
        if (norm.lengthSq() < 1e-12) {
          norm.set(0, 1, 0);
        } else {
          norm.normalize();
        }
        normals.push(norm.x, norm.y, norm.z);

        if (evalColor) {
          const vertIdx = i / 3;
          const iu = Math.floor(vertIdx / stride);
          const iv = vertIdx % stride;
          const u = iu / uSegments;
          const vActual = (closedV && iv === vSegments) ? 0.0 : (iv / vSegments);
          p.set(positions[i], positions[i + 1], positions[i + 2]);
          evalColor(u, vActual, p, norm, col);
          colors.push(col.r, col.g, col.b);
        } else {
          colors.push(1, 1, 1);
        }
      }

      for (let iu = 0; iu < uSegments; iu++) {
        for (let iv = 0; iv < vSegments; iv++) {
          const a = iu * stride + iv;
          const b = (iu + 1) * stride + iv;
          const c = (iu + 1) * stride + (iv + 1);
          const d = iu * stride + (iv + 1);
          if (sign > 0.0) {
            indices.push(a, b, d);
            indices.push(b, c, d);
          } else {
            indices.push(a, d, b);
            indices.push(b, d, c);
          }
        }
      }

      // Helper for smooth analytic end caps
      const addCap = (uVal, isEnd) => {
        const ringStartIdx = isEnd ? uSegments * stride : 0;
        const center = new THREE.Vector3();
        for (let iv = 0; iv < vSegments; iv++) {
          const idx = (ringStartIdx + iv) * 3;
          center.x += positions[idx];
          center.y += positions[idx + 1];
          center.z += positions[idx + 2];
        }
        center.multiplyScalar(1.0 / vSegments);

        // Compute outward cap normal from two perpendicular chords on the cap ring
        const p0 = new THREE.Vector3(
          positions[ringStartIdx * 3],
          positions[ringStartIdx * 3 + 1],
          positions[ringStartIdx * 3 + 2]
        );
        const qIdx = ringStartIdx + Math.max(1, Math.floor(vSegments / 4));
        const pQuarter = new THREE.Vector3(
          positions[qIdx * 3],
          positions[qIdx * 3 + 1],
          positions[qIdx * 3 + 2]
        );
        const c1 = new THREE.Vector3().subVectors(p0, center);
        const c2 = new THREE.Vector3().subVectors(pQuarter, center);
        const capNormal = new THREE.Vector3().crossVectors(c1, c2).normalize();
        const adjCenter = isEnd ? ringCenters[Math.max(0, uSegments - 1)] : ringCenters[Math.min(uSegments, 1)];
        const outDir = new THREE.Vector3().subVectors(center, adjCenter);
        if (outDir.lengthSq() > 1e-6) {
          if (capNormal.dot(outDir) < 0.0) capNormal.negate();
        } else if (!isEnd) {
          capNormal.negate();
        }
        if (flipNormal) capNormal.negate();

        const baseVertex = positions.length / 3;
        // Center vertex
        positions.push(center.x, center.y, center.z);
        normals.push(capNormal.x, capNormal.y, capNormal.z);
        uvs.push(0.5, 0.5);
        if (evalColor) {
          evalColor(uVal, 0.5, center, capNormal, col);
          colors.push(col.r, col.g, col.b);
        } else {
          colors.push(1, 1, 1);
        }

        // Rim vertices with slightly blended chamfer normals
        for (let iv = 0; iv <= vSegments; iv++) {
          const srcIdx = (ringStartIdx + iv) * 3;
          const vx = positions[srcIdx];
          const vy = positions[srcIdx + 1];
          const vz = positions[srcIdx + 2];
          const snx = normals[srcIdx];
          const sny = normals[srcIdx + 1];
          const snz = normals[srcIdx + 2];

          const blendedN = new THREE.Vector3(
            capNormal.x * 0.82 + snx * 0.18,
            capNormal.y * 0.82 + sny * 0.18,
            capNormal.z * 0.82 + snz * 0.18
          ).normalize();

          positions.push(vx, vy, vz);
          normals.push(blendedN.x, blendedN.y, blendedN.z);
          const ang = (iv / vSegments) * Math.PI * 2.0;
          uvs.push(0.5 + 0.5 * Math.cos(ang), 0.5 + 0.5 * Math.sin(ang));
          if (evalColor) {
            evalColor(uVal, iv / vSegments, new THREE.Vector3(vx, vy, vz), blendedN, col);
            colors.push(col.r, col.g, col.b);
          } else {
            colors.push(1, 1, 1);
          }
        }

        const windCheck = c1.cross(c2).dot(capNormal);
        for (let iv = 0; iv < vSegments; iv++) {
          const r1 = baseVertex + 1 + iv;
          const r2 = baseVertex + 1 + iv + 1;
          if (windCheck >= 0.0) {
            indices.push(baseVertex, r1, r2);
          } else {
            indices.push(baseVertex, r2, r1);
          }
        }
      };

      if (capStart) addCap(0.0, false);
      if (capEnd) addCap(1.0, true);

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geom.setIndex(indices);
      return geom;
    }

    // =========================================================================
    // 3. PROCEDURAL PBR TEXTURE GENERATORS
    // =========================================================================
    function createTimberTextures() {
      const size = 512;
      const diffCanvas = document.createElement('canvas');
      const roughCanvas = document.createElement('canvas');
      const normCanvas = document.createElement('canvas');
      diffCanvas.width = roughCanvas.width = normCanvas.width = size;
      diffCanvas.height = roughCanvas.height = normCanvas.height = size;

      const dCtx = diffCanvas.getContext('2d');
      const rCtx = roughCanvas.getContext('2d');
      const nCtx = normCanvas.getContext('2d');

      const dImg = dCtx.createImageData(size, size);
      const rImg = rCtx.createImageData(size, size);
      const nImg = nCtx.createImageData(size, size);

      const heightField = new Float32Array(size * size);

      for (let y = 0; y < size; y++) {
        const v = y / size;
        for (let x = 0; x < size; x++) {
          const u = x / size;
          // Periodic wrap approximations for wood grain along U (log axis) and V (circumference)
          const grain1 = Math.sin(v * Math.PI * 28.0 + fbm2(u * 6.0, v * 14.0, 3) * 3.2);
          const grain2 = fbm2(u * 18.0, v * 52.0, 4);
          const adzeMarks = Math.sin(u * Math.PI * 16.0 + Math.cos(v * Math.PI * 6.0) * 1.4) * 0.25;
          const checks = Math.pow(Math.max(0.0, Math.sin(v * Math.PI * 10.0 + grain2 * 2.2)), 8.0);

          const h = grain1 * 0.35 + grain2 * 0.45 + adzeMarks * 0.2 - checks * 0.55;
          heightField[y * size + x] = h;

          const idx = (y * size + x) * 4;
          const tone = 0.84 + 0.16 * (grain1 * 0.5 + grain2 * 0.5) - checks * 0.28;
          dImg.data[idx] = Math.min(255, Math.max(0, Math.floor(235 * tone)));
          dImg.data[idx + 1] = Math.min(255, Math.max(0, Math.floor(220 * tone)));
          dImg.data[idx + 2] = Math.min(255, Math.max(0, Math.floor(205 * tone)));
          dImg.data[idx + 3] = 255;

          const roughVal = Math.min(255, Math.max(120, Math.floor((0.76 - adzeMarks * 0.12 + checks * 0.22 - grain1 * 0.06) * 255)));
          rImg.data[idx] = roughVal;
          rImg.data[idx + 1] = roughVal;
          rImg.data[idx + 2] = roughVal;
          rImg.data[idx + 3] = 255;
        }
      }

      for (let y = 0; y < size; y++) {
        const yPrev = (y - 1 + size) % size;
        const yNext = (y + 1) % size;
        for (let x = 0; x < size; x++) {
          const xPrev = (x - 1 + size) % size;
          const xNext = (x + 1) % size;
          const dx = (heightField[y * size + xNext] - heightField[y * size + xPrev]) * 2.2;
          const dy = (heightField[yNext * size + x] - heightField[yPrev * size + x]) * 3.0;
          const nz = 1.0;
          const len = Math.hypot(dx, dy, nz);
          const idx = (y * size + x) * 4;
          nImg.data[idx] = Math.floor(((-dx / len) * 0.5 + 0.5) * 255);
          nImg.data[idx + 1] = Math.floor(((-dy / len) * 0.5 + 0.5) * 255);
          nImg.data[idx + 2] = Math.floor(((nz / len) * 0.5 + 0.5) * 255);
          nImg.data[idx + 3] = 255;
        }
      }

      dCtx.putImageData(dImg, 0, 0);
      rCtx.putImageData(rImg, 0, 0);
      nCtx.putImageData(nImg, 0, 0);

      const wrap = (tex) => {
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.needsUpdate = true;
        return tex;
      };

      const diffTex = wrap(new THREE.CanvasTexture(diffCanvas));
      diffTex.colorSpace = THREE.SRGBColorSpace;
      const roughTex = wrap(new THREE.CanvasTexture(roughCanvas));
      const normTex = wrap(new THREE.CanvasTexture(normCanvas));

      return { diffTex, roughTex, normTex };
    }

    function createSnowSparkleTextures() {
      const size = 512;
      const normCanvas = document.createElement('canvas');
      const roughCanvas = document.createElement('canvas');
      normCanvas.width = roughCanvas.width = size;
      normCanvas.height = roughCanvas.height = size;

      const nCtx = normCanvas.getContext('2d');
      const rCtx = roughCanvas.getContext('2d');
      const nImg = nCtx.createImageData(size, size);
      const rImg = rCtx.createImageData(size, size);

      const heightField = new Float32Array(size * size);
      const sparkleRng = new PRNG(98765);

      for (let y = 0; y < size; y++) {
        const v = y / size;
        for (let x = 0; x < size; x++) {
          const u = x / size;
          // Soft wind ripples + fine crystalline grains
          const ripple = Math.sin(u * Math.PI * 10.0 + fbm2(u * 8.0, v * 8.0, 3) * 2.5) * 0.25;
          const fine = fbm2(u * 32.0, v * 32.0, 3) * 0.35;
          heightField[y * size + x] = ripple + fine;
        }
      }

      for (let y = 0; y < size; y++) {
        const yPrev = (y - 1 + size) % size;
        const yNext = (y + 1) % size;
        for (let x = 0; x < size; x++) {
          const xPrev = (x - 1 + size) % size;
          const xNext = (x + 1) % size;
          let dx = (heightField[y * size + xNext] - heightField[y * size + xPrev]) * 1.4;
          let dy = (heightField[yNext * size + x] - heightField[yPrev * size + x]) * 1.4;

          // Sparse high-angle ice crystal micro-facets for snow sparkle
          const glint = sparkleRng.next();
          let rough = 0.62 + 0.12 * fbm2((x / size) * 20.0, (y / size) * 20.0, 2);
          if (glint > 0.968) {
            const ang = sparkleRng.next() * Math.PI * 2.0;
            const tilt = 1.65;
            dx += Math.cos(ang) * tilt;
            dy += Math.sin(ang) * tilt;
            rough = 0.08;
          } else if (glint > 0.92) {
            rough = 0.25;
          }

          const nz = 1.0;
          const len = Math.hypot(dx, dy, nz);
          const idx = (y * size + x) * 4;
          nImg.data[idx] = Math.floor(((-dx / len) * 0.5 + 0.5) * 255);
          nImg.data[idx + 1] = Math.floor(((-dy / len) * 0.5 + 0.5) * 255);
          nImg.data[idx + 2] = Math.floor(((nz / len) * 0.5 + 0.5) * 255);
          nImg.data[idx + 3] = 255;

          const rByte = Math.min(255, Math.max(15, Math.floor(rough * 255)));
          rImg.data[idx] = rByte;
          rImg.data[idx + 1] = rByte;
          rImg.data[idx + 2] = rByte;
          rImg.data[idx + 3] = 255;
        }
      }

      nCtx.putImageData(nImg, 0, 0);
      rCtx.putImageData(rImg, 0, 0);

      const normTex = new THREE.CanvasTexture(normCanvas);
      const roughTex = new THREE.CanvasTexture(roughCanvas);
      normTex.wrapS = normTex.wrapT = THREE.RepeatWrapping;
      roughTex.wrapS = roughTex.wrapT = THREE.RepeatWrapping;
      normTex.repeat.set(6, 6);
      roughTex.repeat.set(6, 6);
      return { normTex, roughTex };
    }

    function createFrostedWindowTexture() {
      const size = 512;
      const canvas = document.createElement('canvas');
      const roughCanvas = document.createElement('canvas');
      canvas.width = roughCanvas.width = size;
      canvas.height = roughCanvas.height = size;
      const ctx = canvas.getContext('2d');
      const rCtx = roughCanvas.getContext('2d');

      const img = ctx.createImageData(size, size);
      const rImg = rCtx.createImageData(size, size);

      // 3 columns x 2 rows of panes in UV space
      for (let y = 0; y < size; y++) {
        const v = y / size;
        const paneV = (v * 2.0) % 1.0;
        const distV = Math.min(paneV, 1.0 - paneV) * 2.0;

        for (let x = 0; x < size; x++) {
          const u = x / size;
          const paneU = (u * 3.0) % 1.0;
          const distU = Math.min(paneU, 1.0 - paneU) * 2.0;

          // Edge proximity inside each muntin pane creates crystalline frost border
          const edgeFactor = 1.0 - Math.min(1.0, Math.pow(distU * distV, 0.42) * 1.45);
          const crystal = fbm2(u * 28.0, v * 28.0, 4) * 0.5 + 0.5;
          const fern = Math.abs(Math.sin((u * 40.0 + crystal * 3.0) * Math.PI) * Math.cos((v * 40.0 - crystal * 3.0) * Math.PI));
          const frostMask = smoothstep(0.18, 0.72, edgeFactor + crystal * 0.32 + fern * 0.18);

          // Warm amber-gold center transitioning to frosted pale amber-white around pane edges
          const warmVertical = 0.85 + 0.15 * (1.0 - v);
          const r = Math.min(255, Math.floor((255 * (1.0 - frostMask * 0.08)) * warmVertical));
          const g = Math.min(255, Math.floor((182 + frostMask * 52) * warmVertical));
          const b = Math.min(255, Math.floor((78 + frostMask * 145) * warmVertical));

          const idx = (y * size + x) * 4;
          img.data[idx] = r;
          img.data[idx + 1] = g;
          img.data[idx + 2] = b;
          img.data[idx + 3] = 255;

          const roughByte = Math.min(255, Math.floor((0.18 + frostMask * 0.72) * 255));
          rImg.data[idx] = roughByte;
          rImg.data[idx + 1] = roughByte;
          rImg.data[idx + 2] = roughByte;
          rImg.data[idx + 3] = 255;
        }
      }

      ctx.putImageData(img, 0, 0);
      rCtx.putImageData(rImg, 0, 0);

      const map = new THREE.CanvasTexture(canvas);
      map.colorSpace = THREE.SRGBColorSpace;
      const roughMap = new THREE.CanvasTexture(roughCanvas);
      return { map, roughMap };
    }

    // =========================================================================
    // 4. SCENE, CAMERA, RENDERER & HIGH-KEY STUDIO SETUP
    // =========================================================================
    const scene = new THREE.Scene();
    const studioBgColor = new THREE.Color(0xf3f6fa);
    scene.background = studioBgColor;
    scene.fog = new THREE.FogExp2(0xf3f6fa, 0.014);

    // =========================================================================

    // Cabin placement constants (used by snow rise & warm light calculation)
