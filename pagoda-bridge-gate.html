      }), { pos: [sx * 0.34, pkFireY + pkFireH * 0.5, sz * 0.34] });
    }
  }
  // Slender central lattice mullions on each of the 4 sides of the peak lantern
  for (const dir of [[0, 0.36], [0, -0.36], [0.36, 0], [-0.36, 0]]) {
    push('columnStone', buildBeveledBlock(0.048, pkFireH, 0.048, {
      bevel: 0.01, cornerExp: 0.30, uSegs: 10, vSegs: 6, ao: 0.92, moss: 0.10, tone: 0.08
    }), { pos: [dir[0], pkFireY + pkFireH * 0.5, dir[1]] });
  }

  // Glowing peak lantern core
  const pkCoreGeom = buildAnalyticLathe((v) => {
    const a = v * Math.PI;
    const r = 0.015 + 0.24 * Math.pow(Math.sin(a), 0.50);
    const dr = 0.24 * 0.50 * Math.pow(Math.max(1e-4, Math.sin(a)), -0.50) * Math.cos(a) * Math.PI;
    return { r, dr, y: 0.05 + 0.52 * v, dy: 0.52, ao: 1, moss: 0 };
  }, 24, 14);
  const pkCoreMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(2.75, 1.65, 0.58),
    toneMapped: false,
  });
  const pkCoreMesh = new THREE.Mesh(pkCoreGeom, pkCoreMat);
  pkCoreMesh.position.set(0, pkFireY, 0);
  root.add(pkCoreMesh);

  lanterns.push({
    mesh: pkCoreMesh,
    mat: pkCoreMat,
    pos: new THREE.Vector3(0, pkFireY + pkFireH * 0.5, 0),
    baseColor: new THREE.Color(2.75, 1.65, 0.58),
    phase: 0.42,
    scale: 1.85,
    isPeak: true,
  });

  // 4) Overhanging curved square pagoda cap crowning the peak lantern
  const pkCapY = pkFireY + pkFireH - 0.03;
  addPagodaRoofTier({
    yBot: pkCapY,
    yTop: pkCapY + 0.52,
    rxTop: 0.12,
    rzTop: 0.12,
    rxBot: 0.88,
    rzBot: 0.88,
    liftY: 0.20,
    flareXY: 0.11,
    thickness: 0.09,
    uSegs: 16,
    vSegs: 10,
    tileRibs: 7,
    addCurledFinials: true,
    finialScale: 0.46,
    addRafters: false,
    bucket: 'roofTile',
  });

  // 5) Turned lotus-spire finial (hōju) at the apex
  const apexFinial = buildAnalyticLathe((v) => {
    const h = 0.58;
    const baseRing = 0.16 * Math.exp(-Math.pow((v - 0.10) / 0.08, 2));
    const bulb = 0.14 * Math.exp(-Math.pow((v - 0.36) / 0.16, 2));
    const spire = 0.08 * Math.pow(Math.max(0, 1 - v), 1.6);
    const r = 0.008 + baseRing + bulb + spire;
    const dBase = baseRing * (-2 * (v - 0.10) / 0.0064);
    const dBulb = bulb * (-2 * (v - 0.36) / 0.0256);
    const dSpire = -0.08 * 1.6 * Math.pow(Math.max(1e-4, 1 - v), 0.6);
    return { r, dr: dBase + dBulb + dSpire, y: v * h, dy: h, ao: 0.98, moss: 0.12 };
  }, 24, 24, { tone: 0.18 });
  push('accentBronze', apexFinial, { pos: [0, pkCapY + 0.48, 0] });

  // --------------------------------------------------------------------------
  // L. MERGE GEOMETRIES PER CALIBRATED MATERIAL FOR ULTRA-FAST 60FPS RENDERING
  // --------------------------------------------------------------------------
  const matMap = {
    limestone: materials.limestone,
    columnStone: materials.columnStone,
    recessDark: materials.recessDark,
    roofTile: materials.roofTile,
    accentBronze: materials.accentBronze,
  };

  for (const [key, list] of Object.entries(buckets)) {
    if (list.length === 0) continue;
    const merged = mergeGeometries(list, false);
    for (const g of list) g.dispose();
    const mesh = new THREE.Mesh(merged, matMap[key]);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    root.add(mesh);
  }

  return { root, lanterns };
}

// 6. SOFT STUDIO SKY DOME & PLANAR REFLECTIVE ANIMATED DARK BLUE WATER

function createStudioSkyDome() {
  const skyGeom = buildAnalyticLathe((v) => {
    const a = v * Math.PI;
    return {
      r: Math.sin(a) * 140,
      dr: Math.cos(a) * Math.PI * 140,
      y: -Math.cos(a) * 140,
      dy: Math.sin(a) * Math.PI * 140,
    };
  }, 36, 24);

  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {},
    vertexShader: `
      varying vec3 vWorldDir;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldDir = normalize(wp.xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      varying vec3 vWorldDir;
      void main() {
        float y = clamp(vWorldDir.y, -1.0, 1.0);
        // Calibrated soft-lit dark slate-blue studio cyclorama matching water horizon exactly
        vec3 deepZenith  = vec3(0.028, 0.052, 0.102);
        vec3 midStudio   = vec3(0.062, 0.112, 0.192);
        vec3 horizonGlow = vec3(0.092, 0.152, 0.242);
        vec3 lowerFloor  = vec3(0.024, 0.046, 0.090);

        vec3 col;
        if (y >= 0.0) {
          float hBand = exp(-y * 4.5);
          col = mix(midStudio, deepZenith, pow(y, 0.65));
          col = mix(col, horizonGlow, hBand);
        } else {
          col = mix(horizonGlow, lowerFloor, smoothstep(0.0, -0.30, y));
        }
        // Subtle soft studio backlight aura centered cleanly behind the upper pagoda
        float studioSoft = exp(-pow(y - 0.16, 2.0) * 14.0) * 0.032;
        col += vec3(0.45, 0.62, 0.85) * studioSoft;
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });

  const mesh = new THREE.Mesh(skyGeom, skyMat);
  mesh.renderOrder = -10;
  return mesh;
}

/**
 * Custom Planar Reflection + Animated Dark Blue Studio Water + Soft Contact Shadow.
 * Uses exact Lengyel oblique near-plane clipping for crisp zero-artifact reflections.
 */
function createReflectiveWater(renderer, initialWidth, initialHeight) {
  const getRTSize = (w, h) => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    return [
      Math.max(512, Math.floor(w * dpr)),
      Math.max(512, Math.floor(h * dpr)),
    ];
  };
  const [rtW, rtH] = getRTSize(initialWidth, initialHeight);
  const reflectionRT = new THREE.WebGLRenderTarget(rtW, rtH, {
    type: THREE.HalfFloatType,
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    depthBuffer: true,
    samples: 4,
  });

  // Parametric radial disc with analytic upward normal (0, 1, 0)
  const waterRadius = 128;
  const waterGeom = buildParametricSurface(64, 24, (u, v, pos, du, dv, weather) => {
    const th = u * Math.PI * 2;
    const r = v * v * waterRadius;
    const drdv = 2 * v * waterRadius;
    const c = Math.cos(th);
    const s = Math.sin(th);
    pos.set(r * c, 0, -r * s);
    if (v < 1e-4) {
      du.set(1, 0, 0); dv.set(0, 0, -1); // du x dv = (0, +1, 0)
    } else {
      du.set(-r * s * Math.PI * 2, 0, -r * c * Math.PI * 2);
      dv.set(drdv * c, 0, -drdv * s);
    }
    weather.set(1, 0, 0);
  }, { flipNormal: true }); // Check: du=(-s,0,-c), dv=(c,0,-s) => du x dv = (0, -c^2 - s^2, 0) = (0,-1,0), flipNormal -> (0,+1,0)!

  const textureMatrix = new THREE.Matrix4();
  const waterUniforms = {
    uTime: { value: 0 },
    uReflectionMap: { value: reflectionRT.texture },
    uTextureMatrix: { value: textureMatrix },
    uKeyLightDir: { value: new THREE.Vector3(-0.48, 0.72, 0.50).normalize() },
    uRimLightDir: { value: new THREE.Vector3(0.55, 0.45, -0.70).normalize() },
  };

  const waterMat = new THREE.ShaderMaterial({
    uniforms: waterUniforms,
    vertexShader: `
      uniform mat4 uTextureMatrix;
      varying vec4 vReflCoord;
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        vReflCoord = uTextureMatrix * wp;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform sampler2D uReflectionMap;
      uniform vec3 uKeyLightDir;
      uniform vec3 uRimLightDir;

      varying vec4 vReflCoord;
      varying vec3 vWorldPos;

      float sdBox2(vec2 p, vec2 b) {
        vec2 d = abs(p) - b;
        return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
      }

      // Ultra-clean, silky long-wavelength studio water ripples (zero noise or jagged distortion)
      vec2 evalRippleGrad(vec2 p, float t) {
        vec2 g = vec2(0.0);
        // Gentle, long-wavelength calm studio swells drifting slowly across the water
        vec2 k1 = vec2(0.28, 0.52);
        g += k1 * cos(dot(p, k1) + t * 0.72) * 0.0022;

        vec2 k2 = vec2(-0.42, 0.34);
        g += k2 * cos(dot(p, k2) - t * 0.58) * 0.0018;

        // Whisper-soft concentric ripple rings near the two main piers
        for (int i = 0; i < 2; i++) {
          vec2 c = vec2(i == 0 ? -3.38 : 3.38, 0.0);
          vec2 dp = p - c;
          float d = length(dp) + 0.001;
          float env = exp(-d * 0.34) * smoothstep(1.5, 3.0, d);
          float ph = d * 1.45 - t * 0.90;
          g += (dp / d) * cos(ph) * env * 0.0024;
        }
        return g;
      }

      void main() {
        vec2 p = vWorldPos.xz;
        float dist = length(p);
        vec3 viewDir = normalize(cameraPosition - vWorldPos);

        // Attenuate ripple amplitude softly far toward the studio horizon
        float rippleAtten = 1.0 - smoothstep(16.0, 48.0, dist);
        vec2 grad = evalRippleGrad(p, uTime) * rippleAtten;
        vec3 N = normalize(vec3(-grad.x, 1.0, -grad.y));

        // Crystal-clear full-res planar reflection with delicate glassy ripple shimmer
        vec2 reflUV = vReflCoord.xy / max(vReflCoord.w, 0.0001);
        vec2 distUV = reflUV + grad * 0.032 * (1.0 - smoothstep(20.0, 50.0, dist));
        distUV = clamp(distUV, vec2(0.001), vec2(0.999));
        vec3 reflCol = texture2D(uReflectionMap, distUV).rgb;

        // Deep calibrated studio dark-blue water body color
        vec3 deepWater = vec3(0.012, 0.036, 0.082);
        vec3 midWater  = vec3(0.024, 0.064, 0.135);
        vec3 waterBody = mix(midWater, deepWater, smoothstep(2.0, 26.0, dist));

        // Physically motivated Schlick Fresnel for clear mirror-like dark water
        float NoV = max(dot(N, viewDir), 0.0);
        float fresnel = 0.14 + 0.80 * pow(1.0 - NoV, 3.8);

        // Soft Contact Shadow & Ambient Occlusion anchoring the gate to the water
        float dPierL = sdBox2(p - vec2(-3.38, 0.0), vec2(1.36, 2.44));
        float dPierR = sdBox2(p - vec2( 3.38, 0.0), vec2(1.36, 2.44));
        float dWingL = sdBox2(p - vec2(-7.00, 0.0), vec2(2.34, 2.26));
        float dWingR = sdBox2(p - vec2( 7.00, 0.0), vec2(2.34, 2.26));
        float dArchTunnel = sdBox2(p - vec2(0.0, 0.0), vec2(2.02, 2.25));
        float dStruct = min(min(dPierL, dPierR), min(dWingL, dWingR));

        // Tight dark waterline contact AO + broad soft studio drop shadow
        float tightAO = smoothstep(-0.10, 1.25, dStruct);
        float broadShadow = smoothstep(-0.5, 4.6, min(dStruct, dArchTunnel));
        float tunnelDark = smoothstep(-0.30, 1.15, dArchTunnel);
        float contactShadow = mix(0.26, 1.0, tightAO) * mix(0.72, 1.0, broadShadow) * mix(0.56, 1.0, tunnelDark);

        // Combine deep dark-blue water & crystal-clear reflection
        vec3 col = mix(waterBody * contactShadow, reflCol * mix(0.68, 0.98, tightAO), fresnel * 0.88 + 0.08);

        // Clean cool studio specular glints on the gentle swells
        vec3 H1 = normalize(uKeyLightDir + viewDir);
        float spec1 = pow(max(dot(N, H1), 0.0), 260.0) * 0.24 * contactShadow;
        vec3 H2 = normalize(uRimLightDir + viewDir);
        float spec2 = pow(max(dot(N, H2), 0.0), 150.0) * 0.14 * contactShadow;
        col += vec3(0.78, 0.88, 1.0) * spec1 + vec3(0.44, 0.70, 0.98) * spec2;

        // Smooth seamless fade into the exact studio cyclorama horizon
        vec3 studioHorizon = vec3(0.092, 0.152, 0.242);
        float horizonFade = smoothstep(34.0, 116.0, dist);
        col = mix(col, studioHorizon, horizonFade);

        gl_FragColor = vec4(col, 1.0);
      }
    `,
  });

  const waterMesh = new THREE.Mesh(waterGeom, waterMat);
  waterMesh.receiveShadow = false; // Handled smoothly via planar reflection + analytic contact shadow

  // Reusable reflection math objects (zero per-frame GC allocations)
  const virtualCamera = new THREE.PerspectiveCamera();
  const reflectorWorldPos = new THREE.Vector3(0, 0, 0);
  const cameraWorldPos = new THREE.Vector3();
  const rotationMatrix = new THREE.Matrix4();
  const lookAtPos = new THREE.Vector3();
  const view = new THREE.Vector3();
  const target = new THREE.Vector3();
  const up = new THREE.Vector3();
  const normal = new THREE.Vector3(0, 1, 0);
  const waterClipPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0.0);
  const activeClipPlanes = [waterClipPlane];
  const emptyClipPlanes = [];

  function updateReflection(scene, camera, hideGroup = null) {
    waterMesh.visible = false;
    const prevHideVis = hideGroup ? hideGroup.visible : true;
    if (hideGroup) hideGroup.visible = false;

    cameraWorldPos.setFromMatrixPosition(camera.matrixWorld);
    rotationMatrix.extractRotation(camera.matrixWorld);

    view.subVectors(reflectorWorldPos, cameraWorldPos);
    if (view.dot(normal) > 0) {
      // Camera below water plane — skip reflection
      waterMesh.visible = true;
      if (hideGroup) hideGroup.visible = prevHideVis;
      return;
    }

    view.reflect(normal).negate().add(reflectorWorldPos);
    lookAtPos.set(0, 0, -1).applyMatrix4(rotationMatrix).add(cameraWorldPos);
    target.subVectors(reflectorWorldPos, lookAtPos).reflect(normal).negate().add(reflectorWorldPos);
    up.set(0, 1, 0).applyMatrix4(rotationMatrix).reflect(normal);

    virtualCamera.position.copy(view);
    virtualCamera.up.copy(up);
    virtualCamera.lookAt(target);
    virtualCamera.fov = camera.fov;
    virtualCamera.aspect = camera.aspect;
    virtualCamera.near = camera.near;
    virtualCamera.far = camera.far;
    virtualCamera.updateMatrixWorld();
    virtualCamera.updateProjectionMatrix();

    // Update texture matrix mapping world pos -> reflection UV
    textureMatrix.set(
      0.5, 0.0, 0.0, 0.5,
      0.0, 0.5, 0.0, 0.5,
      0.0, 0.0, 0.5, 0.5,
      0.0, 0.0, 0.0, 1.0
    );
    textureMatrix.multiply(virtualCamera.projectionMatrix);
    textureMatrix.multiply(virtualCamera.matrixWorldInverse);

    // Hardware plane clipping at Y >= 0 preserves 100% depth buffer precision in reflectionRT (zero z-fighting noise!)
    const prevRT = renderer.getRenderTarget();
    const prevXR = renderer.xr.enabled;
    const prevClip = renderer.clippingPlanes;
    renderer.xr.enabled = false;
    renderer.clippingPlanes = activeClipPlanes;
    renderer.setRenderTarget(reflectionRT);
    renderer.clear();
    renderer.render(scene, virtualCamera);
    renderer.clippingPlanes = prevClip || emptyClipPlanes;
    renderer.setRenderTarget(prevRT);
    renderer.xr.enabled = prevXR;

    waterMesh.visible = true;
    if (hideGroup) hideGroup.visible = prevHideVis;
  }

  function resize(w, h) {
    const [rw, rh] = getRTSize(w, h);
    reflectionRT.setSize(rw, rh);
  }

  return { waterMesh, waterUniforms, updateReflection, resize };
}

// 7. ATMOSPHERIC EFFECTS: LANTERN HALOS, DRIFTING WATER MIST, PETALS & FIREFLIES
// ============================================================================
function createLanternGlowTexture() {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0.0, 'rgba(255, 224, 155, 0.95)');
  g.addColorStop(0.24, 'rgba(255, 170, 74, 0.55)');
  g.addColorStop(0.55, 'rgba(255, 118, 36, 0.16)');
  g.addColorStop(1.0, 'rgba(255, 95, 20, 0.0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createDriftingMist() {
  // Whisper-soft, completely noise-free analytic Gaussian mist ribbons flowing gently through the arch
  const group = new THREE.Group();
  const mistUniforms = { uTime: { value: 0 } };
  const rand = mulberry32(409);

  const mistMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.NormalBlending,
    uniforms: mistUniforms,
    vertexShader: `
      attribute float aSeed;
      varying vec2 vUv;
      varying float vSeed;
      varying vec3 vWorldPos;
      void main() {
        vUv = uv;
        vSeed = aSeed;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform float uTime;
      varying vec2 vUv;
      varying float vSeed;
      varying vec3 vWorldPos;

      float sdBox2(vec2 p, vec2 b) {
        vec2 d = abs(p) - b;
        return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
      }

      void main() {
        vec2 d = (vUv - 0.5) * 2.0;
        float radial = exp(-dot(d, d) * 2.8) * smoothstep(1.0, 0.25, length(d));

        // Pure analytic cosine harmonics — 100% free of hash/value noise or blotchy grain
        vec2 p = vWorldPos.xz;
        float w1 = 0.5 + 0.5 * sin(p.x * 0.42 + p.y * 0.35 + uTime * 0.28 + vSeed);
        float w2 = 0.5 + 0.5 * cos(p.x * 0.28 - p.y * 0.48 - uTime * 0.22 + vSeed * 1.7);
        float wisp = smoothstep(0.35, 0.85, w1 * 0.55 + w2 * 0.45) * radial;

        // Carve smoothly around solid stone piers and stair wings so mist never clips into stone
        float dPierL = sdBox2(p - vec2(-3.38, 0.0), vec2(1.42, 2.48));
        float dPierR = sdBox2(p - vec2( 3.38, 0.0), vec2(1.42, 2.48));
        float dWingL = sdBox2(p - vec2(-7.00, 0.0), vec2(2.40, 2.30));
        float dWingR = sdBox2(p - vec2( 7.00, 0.0), vec2(2.40, 2.30));
        float dSolid = min(min(dPierL, dPierR), min(dWingL, dWingR));
        float clearStone = smoothstep(-0.05, 0.85, dSolid);

        float centerDist = length(p);
        float warmLift = exp(-centerDist * 0.18) * 0.25;
        vec3 mistCol = mix(vec3(0.34, 0.48, 0.68), vec3(0.72, 0.64, 0.54), warmLift);

        float alpha = wisp * clearStone * 0.032;
        if (alpha < 0.001) discard;
        gl_FragColor = vec4(mistCol, alpha);
      }
    `
  });

  // Subtle mist ribbons confined to the arch channel & distant background water (zero foreground water haze)
  const layers = [
    { x: 0.0, y: 0.48, z: 0.0, rx: 1.75, rz: 6.2, rotY: 0.0 },    // Arch-channel ribbon
    { x: 0.0, y: 0.32, z: -12.5, rx: 14.0, rz: 6.5, rotY: 0.08 }, // Distant background horizon mist
  ];

  layers.forEach((L, idx) => {
    const g = buildParametricSurface(12, 12, (u, v, pos, du, dv, w) => {
      const px = (u - 0.5) * L.rx * 2;
      const pz = (v - 0.5) * L.rz * 2;
      pos.set(px, 0, pz);
      du.set(L.rx * 2, 0, 0);
      dv.set(0, 0, L.rz * 2);
      w.set(1, 0, 0);
    }, { flipNormal: true });

    const count = g.attributes.position.count;
    const seeds = new Float32Array(count).fill(rand() * 10 + idx);
    g.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));

    const mesh = new THREE.Mesh(g, mistMat);
    mesh.position.set(L.x, L.y, L.z);
    mesh.rotation.y = L.rotY;
    mesh.renderOrder = 2;
    group.add(mesh);
  });

  return { group, mistUniforms };
}

/**
 * Floating stylized sakura petals (parametric curved petal geometry, InstancedMesh)
 * drifting lazily on a gentle breeze through the central round arch & over the water.
 */
function createFloatingPetals(count = 72) {
  const petalGeom = buildParametricSurface(8, 8, (u, v, pos, du, dv, w) => {
    // Heart-notched curved blossom petal with analytic normals
    const s = u * 2 - 1; // -1..1 width
    const len = 0.135;
    const widthEnv = Math.sin(v * Math.PI) * (0.65 + 0.35 * Math.pow(v, 0.5));
    const notch = v > 0.78 ? 0.014 * (1 - s * s) * ((v - 0.78) / 0.22) : 0;
    const x = s * 0.052 * widthEnv;
    const z = (v - 0.5) * len - notch;
    const cup = 0.016 * (s * s) + 0.012 * Math.sin(v * Math.PI);

    pos.set(x, cup, z);
    du.set(0.104 * widthEnv, 0.064 * s, 0);
    dv.set(0, 0.012 * Math.PI * Math.cos(v * Math.PI), len);
    w.set(1, 0, 0);
  }, { flipNormal: true });

  const petalMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(0xf6d9dc),
    emissive: new THREE.Color(0x3a1c22),
    emissiveIntensity: 0.25,
    roughness: 0.65,
    metalness: 0.0,
    side: THREE.DoubleSide,
  });

  const inst = new THREE.InstancedMesh(petalGeom, petalMat, count);
  const rand = mulberry32(9187);
  const data = [];
  for (let i = 0; i < count; i++) {
    const throughArch = i < count * 0.62;
    data.push({
      throughArch,
      xBase: throughArch ? (rand() * 2 - 1) * 1.55 : (rand() * 2 - 1) * 9.5,
      yBase: throughArch ? 0.28 + rand() * 1.75 : 0.45 + rand() * 5.2,
      zStart: (rand() * 2 - 1) * 12.0,
      speedZ: 0.38 + rand() * 0.42,
      swayAmp: 0.22 + rand() * 0.35,
      swayFreq: 0.55 + rand() * 0.65,
      phase: rand() * Math.PI * 2,
      rotSpeed: new THREE.Vector3((rand() - 0.5) * 1.4, (rand() - 0.5) * 1.6, (rand() - 0.5) * 1.2),
      scale: 0.72 + rand() * 0.58,
    });
  }

  const dummy = new THREE.Object3D();
  function update(t) {
    for (let i = 0; i < count; i++) {
      const p = data[i];
      // Continuous slow drift along -Z (passing cleanly under the central arch!)
      const zRange = 22.0;
      let z = ((p.zStart - t * p.speedZ + zRange * 0.5) % zRange);
      if (z < 0) z += zRange;
      z -= zRange * 0.5;

      let x = p.xBase + Math.sin(t * p.swayFreq + p.phase) * p.swayAmp;
      let y = p.yBase + Math.cos(t * p.swayFreq * 0.8 + p.phase) * 0.18;

      // Gently guide arch-channel petals through the round arch opening
      if (p.throughArch && Math.abs(z) < 3.4) {
        const archFit = 1.0 - Math.abs(z) / 3.4;
        x *= (1.0 - archFit * 0.22);
        const maxArchY = 0.35 + Math.sqrt(Math.max(0.1, 1.78 * 1.78 - x * x));
        y = Math.min(y, maxArchY);
      }
      y = Math.max(0.08, y);

      dummy.position.set(x, y, z);
      dummy.rotation.set(
        p.phase + t * p.rotSpeed.x,
        p.phase * 1.3 + t * p.rotSpeed.y,
        p.phase * 0.7 + t * p.rotSpeed.z
      );
      dummy.scale.setScalar(p.scale);
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;
  }

  update(0);
  return { mesh: inst, update };
}

/**
 * Warm golden fireflies drifting softly beneath the central arch and along the water.
 */
function createFireflies(count = 54) {
  const rand = mulberry32(2026);
  const positions = new Float32Array(count * 3);
  const phases = new Float32Array(count);
  const sizes = new Float32Array(count);
  const seeds = [];

  for (let i = 0; i < count; i++) {
    const inArch = i < count * 0.58;
    const x = inArch ? (rand() * 2 - 1) * 2.1 : (rand() * 2 - 1) * 8.5;
    const y = inArch ? 0.30 + rand() * 1.85 : 0.45 + rand() * 4.5;
    const z = inArch ? (rand() * 2 - 1) * 4.8 : (rand() * 2 - 1) * 6.5;
    positions[i * 3] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;
    phases[i] = rand() * Math.PI * 2;
    sizes[i] = 18.0 + rand() * 18.0;
    seeds.push({
      inArch, x, y, z,
      rx: 0.35 + rand() * 0.55,
      ry: 0.16 + rand() * 0.28,
      rz: 0.65 + rand() * 1.15,
      fx: 0.25 + rand() * 0.30,
      fy: 0.35 + rand() * 0.35,
      fz: 0.18 + rand() * 0.24,
      ph: phases[i],
    });
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
  geom.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

  const uniforms = {
    uTime: { value: 0 },
    uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
  };

  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms,
    vertexShader: `
      attribute float aPhase;
      attribute float aSize;
      uniform float uTime;
      uniform float uPixelRatio;
      varying float vPulse;
      void main() {
        float pulse = 0.35 + 0.65 * pow(0.5 + 0.5 * sin(uTime * 1.85 + aPhase * 3.0), 1.8);
        vPulse = pulse;
        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * uPixelRatio * (0.75 + 0.45 * pulse) * (12.0 / max(-mvPos.z, 1.0));
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      varying float vPulse;
      void main() {
        float d = length(gl_PointCoord - 0.5) * 2.0;
        float glow = exp(-d * d * 5.2);
        float core = smoothstep(0.35, 0.0, d);
        vec3 col = mix(vec3(1.1, 0.62, 0.16), vec3(1.8, 1.45, 0.72), core);
        float alpha = glow * vPulse * 0.92;
        if (alpha < 0.005) discard;
        gl_FragColor = vec4(col, alpha);
      }
    `
  });

  const points = new THREE.Points(geom, mat);
  points.renderOrder = 3;

  function update(t) {
    uniforms.uTime.value = t;
    const posArr = geom.attributes.position.array;
    for (let i = 0; i < count; i++) {
      const s = seeds[i];
      let x = s.x + Math.sin(t * s.fx + s.ph) * s.rx;
      let y = s.y + Math.sin(t * s.fy + s.ph * 1.7) * s.ry;
      let z = s.z + Math.cos(t * s.fz + s.ph * 0.9) * s.rz;
      if (s.inArch) {
        x = Math.max(-1.72, Math.min(1.72, x));
        const ceiling = 0.34 + Math.sqrt(Math.max(0.08, 1.82 * 1.82 - x * x));
        y = Math.max(0.22, Math.min(ceiling, y));
      } else {
        y = Math.max(0.26, y);
      }
      posArr[i * 3] = x;
      posArr[i * 3 + 1] = y;
      posArr[i * 3 + 2] = z;
    }
    geom.attributes.position.needsUpdate = true;
  }

  return { points, update, uniforms };
}

// ============================================================================
// 8. MAIN SCENE ASSEMBLY, LIGHTING, POST-PROCESSING & CINEMATIC LOOP
// ============================================================================
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x091322);
scene.fog = new THREE.FogExp2(0x0f1c2e, 0.0115);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.25, 240);
camera.position.set(17.6, 8.8, 23.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5.45, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.26;
controls.minDistance = 10.5;
controls.maxDistance = 42.0;
controls.minPolarAngle = 0.26;
controls.maxPolarAngle = Math.PI * 0.482; // Keep camera gracefully above the water plane
controls.enablePan = false;
controls.update();

// Studio PMREM reflections & Sky dome
scene.environment = createStudioEnvironment(renderer);
scene.environmentIntensity = 0.68;
scene.add(createStudioSkyDome());

// Calibrated Procedural PBR Materials
const stoneTex = createLimestoneTextures();
const tileTex = createRoofTileTextures();

const materials = {
  limestone: applyWeatheringShader(new THREE.MeshStandardMaterial({
    color: new THREE.Color(0xdcd6c8),
    map: stoneTex.map,
    bumpMap: stoneTex.bumpMap,
    bumpScale: 0.032,
    roughnessMap: stoneTex.roughnessMap,
    roughness: 0.90,
    metalness: 0.02,
  }), { mossStrength: 0.74, waterlineWetness: 0.72 }),

  columnStone: applyWeatheringShader(new THREE.MeshStandardMaterial({
    color: new THREE.Color(0xe6dfd0),
    map: stoneTex.map,
    bumpMap: stoneTex.bumpMap,
    bumpScale: 0.024,
    roughnessMap: stoneTex.roughnessMap,
    roughness: 0.82,
    metalness: 0.03,
  }), { mossStrength: 0.48, waterlineWetness: 0.55 }),

  recessDark: applyWeatheringShader(new THREE.MeshStandardMaterial({
    color: new THREE.Color(0x3a4048),
    map: stoneTex.map,
    bumpMap: stoneTex.bumpMap,
    bumpScale: 0.035,
    roughness: 0.95,
    metalness: 0.02,
  }), { mossStrength: 0.55, waterlineWetness: 0.45 }),

  roofTile: applyWeatheringShader(new THREE.MeshStandardMaterial({
    color: new THREE.Color(0x526470),
    map: tileTex.map,
    bumpMap: tileTex.bumpMap,
    bumpScale: 0.042,
    roughnessMap: tileTex.roughnessMap,
    roughness: 0.66,
    metalness: 0.08,
  }), {
    mossStrength: 0.56,
    waterlineWetness: 0.0,
    mossTintA: new THREE.Color(0x354b32),
    mossTintB: new THREE.Color(0x506944),
  }),

  accentBronze: new THREE.MeshStandardMaterial({
    color: new THREE.Color(0x7c745c),
    roughness: 0.42,
    metalness: 0.62,
  }),
};

// Build the Pagoda Bridge Gate
const { root: gateRoot, lanterns } = buildPagodaBridgeGate(materials);
scene.add(gateRoot);

// Soft Lantern Glow Halos (billboarded Gaussian sprites, included in water reflection!)
const glowTex = createLanternGlowTexture();
lanterns.forEach((L) => {
  const spriteMat = new THREE.SpriteMaterial({
    map: glowTex,
    color: new THREE.Color(0xffb454),
    transparent: true,
    opacity: L.isPeak ? 0.72 : 0.56,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.position.copy(L.pos);
  const s = L.isPeak ? 2.35 : 1.05 * L.scale;
  sprite.scale.set(s, s, 1);
  scene.add(sprite);
  L.halo = sprite;
  L.haloBaseScale = s;
  L.haloBaseOpacity = spriteMat.opacity;
});

// Soft-Lit Studio Lighting Rig
const hemiLight = new THREE.HemisphereLight(0x88acd4, 0x16263d, 0.85);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xf2ede4, 2.35);
keyLight.position.set(-14.5, 22.0, 15.0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 4;
keyLight.shadow.camera.far = 52;
const dShadow = 14.5;
keyLight.shadow.camera.left = -dShadow;
keyLight.shadow.camera.right = dShadow;
keyLight.shadow.camera.top = dShadow + 2;
keyLight.shadow.camera.bottom = -dShadow + 2;
keyLight.shadow.bias = -0.00045;
keyLight.shadow.normalBias = 0.025;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x6fa8e8, 1.35);
rimLight.position.set(16.0, 13.5, -17.5);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0x4b6e98, 0.52);
fillLight.position.set(12.0, 5.0, 14.0);
scene.add(fillLight);

// Warm Flickering Local Lantern Lights (clustered cleanly for rich warm limestone wash)
const lanternLights = [
  { light: new THREE.PointLight(0xffa642, 7.5, 9.5, 1.65), base: 7.5, phase: 0.42 }, // Peak roof lantern
  { light: new THREE.PointLight(0xffa03c, 5.2, 8.5, 1.6),  base: 5.2, phase: 1.70 }, // Upper clerestory inner glow
  { light: new THREE.PointLight(0xff9d3a, 4.6, 8.5, 1.65), base: 4.6, phase: 2.40 }, // Left upper bridge deck lanterns
  { light: new THREE.PointLight(0xff9d3a, 4.6, 8.5, 1.65), base: 4.6, phase: 4.10 }, // Right upper bridge deck lanterns
  { light: new THREE.PointLight(0xff9834, 3.8, 7.5, 1.7),  base: 3.8, phase: 5.30 }, // Left lower stairs lanterns
  { light: new THREE.PointLight(0xff9834, 3.8, 7.5, 1.7),  base: 3.8, phase: 0.95 }, // Right lower stairs lanterns
  { light: new THREE.PointLight(0xffa84c, 2.8, 7.0, 1.6),  base: 2.8, phase: 3.10 }, // Subtle warm bounce under central arch
];
lanternLights[0].light.position.set(0, 12.95, 0);
lanternLights[1].light.position.set(0, 8.85, 0);
lanternLights[2].light.position.set(-4.55, 4.65, 2.25);
lanternLights[3].light.position.set( 4.55, 4.65, 2.25);
lanternLights[4].light.position.set(-7.65, 2.25, 2.15);
lanternLights[5].light.position.set( 7.65, 2.25, 2.15);
lanternLights[6].light.position.set(0, 1.55, 0);
lanternLights.forEach((l) => scene.add(l.light));

// Reflective Dark Blue Water Floor
const water = createReflectiveWater(renderer, window.innerWidth, window.innerHeight);
scene.add(water.waterMesh);

// Drifting Mist, Floating Petals & Fireflies
const mist = createDriftingMist();
scene.add(mist.group);

const petals = createFloatingPetals(72);
scene.add(petals.mesh);

const fireflies = createFireflies(54);
scene.add(fireflies.points);

// Post-Processing: WebGL2 MSAA RenderTarget + Subtle HDR Bloom + ACES OutputPass
const rtSize = renderer.getDrawingBufferSize(new THREE.Vector2());
const composerRT = new THREE.WebGLRenderTarget(rtSize.x, rtSize.y, {
  type: THREE.HalfFloatType,
  samples: 4,
});
const composer = new EffectComposer(renderer, composerRT);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.34, // Subtle cinematic glow on lanterns & fireflies
  0.58,
  0.92  // High threshold so pale limestone stays crisp and never blows out
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// Responsive Resize Handler
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloomPass.setSize(w, h);
  water.resize(w, h);
  fireflies.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
});

// Smooth Cinematic Animation Loop
const clock = new THREE.Clock();

function evalLanternFlicker(t, phase) {
  return (
    1.0 +
    0.085 * Math.sin(t * 2.15 + phase) +
    0.055 * Math.sin(t * 5.40 + phase * 2.3) +
    0.030 * Math.sin(t * 11.7 + phase * 4.1)
  );
}

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Gentle vertical camera breathing on OrbitControls target
  controls.target.y = 5.45 + Math.sin(t * 0.24) * 0.14;
  controls.update();

  // Animate softly glowing & flickering lanterns
  for (let i = 0; i < lanterns.length; i++) {
    const L = lanterns[i];
    const f = evalLanternFlicker(t, L.phase);
    L.mat.color.copy(L.baseColor).multiplyScalar(f);
    L.halo.scale.setScalar(L.haloBaseScale * (0.94 + 0.08 * f));
    L.halo.material.opacity = L.haloBaseOpacity * (0.86 + 0.16 * f);
  }
  for (let i = 0; i < lanternLights.length; i++) {
    const item = lanternLights[i];
    item.light.intensity = item.base * evalLanternFlicker(t, item.phase);
  }

  // Animate water ripples, drifting mist, floating petals, and fireflies
  water.waterUniforms.uTime.value = t;
  mist.mistUniforms.uTime.value = t;
  petals.update(t);
  fireflies.update(t);

  // Render live planar reflection pass (excluding mist so reflection stays crystal-clear), then main frame
  water.updateReflection(scene, camera, mist.group);
  composer.render();
}

animate();
</script>
