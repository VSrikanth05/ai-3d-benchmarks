<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pocket World 3D — Monumental Equestrian Memorial</title>
  <style>
    :root {
      --bg-top: #cfe493;
      --bg-mid: #7ea353;
      --bg-bot: #2e431f;
      --glass-bg: rgba(20, 28, 18, 0.44);
      --glass-bg-hover: rgba(28, 40, 24, 0.62);
      --glass-border: rgba(255, 255, 240, 0.2);
      --glass-text: #f7f5ec;
      --glass-muted: rgba(244, 241, 228, 0.72);
      --accent: #e8cfa0;
      --accent-strong: #f6dca8;
      --shadow-soft: 0 10px 32px rgba(10, 16, 8, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--glass-text);
      user-select: none;
      -webkit-user-select: none;
      background: var(--bg-bot);
    }

    /* Soft out-of-focus pale-lime to deep-olive green background */
    #bg-gradient {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 85% 65% at 24% 16%, rgba(245, 255, 198, 0.55) 0%, transparent 62%),
        radial-gradient(ellipse 70% 55% at 82% 84%, rgba(28, 45, 18, 0.65) 0%, transparent 70%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-bot) 100%);
      transition: background 0.35s ease;
    }

    /* Animated soft bokeh layer behind transparent WebGL canvas */
    #bokeh-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Three.js WebGL stage */
    #webgl-container {
      position: fixed;
      inset: 0;
      z-index: 2;
      cursor: grab;
      touch-action: none;
    }

    #webgl-container:active {
      cursor: grabbing;
    }

    #webgl-container.pointer-hover {
      cursor: pointer;
    }

    /* Subtle tilt-shift depth-of-field + soft vignette overlay */
    #tilt-shift-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    #tilt-shift-overlay::before,
    #tilt-shift-overlay::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      pointer-events: none;
      backdrop-filter: blur(2.6px);
      -webkit-backdrop-filter: blur(2.6px);
    }

    #tilt-shift-overlay::before {
      top: 0;
      height: 18vh;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
    }

    #tilt-shift-overlay::after {
      bottom: 0;
      height: 18vh;
      mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
      -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
    }

    #vignette-layer {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(ellipse 72% 72% at 50% 50%, transparent 56%, rgba(16, 26, 11, 0.34) 100%);
    }

    /* Leader line SVG for active monument info card */
    #leader-svg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 6;
      pointer-events: none;
      overflow: visible;
    }

    /* Floating hover label */
    #hover-pill {
      position: fixed;
      z-index: 8;
      pointer-events: none;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(18, 24, 16, 0.72);
      border: 1px solid rgba(255, 250, 232, 0.24);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #f8f3e4;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, -135%);
      transition: opacity 0.16s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.24);
    }

    #hover-pill.visible {
      opacity: 1;
    }

    /* Floating Info Card */
    #info-card {
      position: fixed;
      z-index: 9;
      width: 268px;
      max-width: calc(100vw - 28px);
      padding: 15px 16px 14px;
      border-radius: 14px;
      background: rgba(18, 25, 16, 0.74);
      border: 1px solid rgba(255, 248, 228, 0.24);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 14px 40px rgba(8, 14, 6, 0.38);
      color: var(--glass-text);
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px) scale(0.97);
      transition: opacity 0.24s ease, transform 0.24s ease;
    }

    #info-card.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    #info-card .info-tag {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--accent);
      margin-bottom: 4px;
      font-weight: 600;
    }

    #info-card .info-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      margin-bottom: 7px;
      padding-right: 22px;
      color: #fffdf7;
    }

    #info-card .info-body {
      font-size: 12.2px;
      line-height: 1.52;
      color: rgba(246, 243, 232, 0.86);
      margin-bottom: 9px;
    }

    #info-card .info-meta {
      font-size: 10.5px;
      color: var(--glass-muted);
      border-top: 1px solid rgba(255, 255, 240, 0.12);
      padding-top: 7px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    #info-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 240, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #f6f3e8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1;
      transition: background 0.15s ease;
    }

    #info-close:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    /* HUD container */
    #ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #ui-layer.hidden {
      opacity: 0;
      pointer-events: none !important;
    }

    #ui-layer.hidden * {
      pointer-events: none !important;
    }

    /* Minimal Title */
    #title-block {
      position: fixed;
      top: 18px;
      left: 22px;
      pointer-events: auto;
    }

    #title-block h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 253, 244, 0.96);
      text-shadow: 0 2px 14px rgba(18, 28, 12, 0.32);
    }

    #title-block p {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(248, 246, 234, 0.78);
      margin-top: 3px;
      text-shadow: 0 1px 8px rgba(18, 28, 12, 0.32);
    }

    /* Top-right quick actions */
    #top-actions {
      position: fixed;
      top: 18px;
      right: 20px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--glass-text);
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.03em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.14s ease;
    }

    .icon-btn:hover {
      background: var(--glass-bg-hover);
      border-color: rgba(255, 250, 232, 0.36);
    }

    .icon-btn:active {
      transform: scale(0.97);
    }

    .icon-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Restore UI pill when UI is hidden */
    #restore-ui-btn {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 12;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, background 0.18s ease;
    }

    #restore-ui-btn.visible {
      opacity: 0.85;
      pointer-events: auto;
    }

    #restore-ui-btn.visible:hover {
      opacity: 1;
    }

    /* Right Glass Control Panel */
    #control-panel {
      position: fixed;
      top: 64px;
      right: 20px;
      width: 236px;
      padding: 14px 14px 13px;
      border-radius: 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow-soft);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .panel-section {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .panel-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--glass-muted);
      font-weight: 600;
    }

    .panel-value {
      font-variant-numeric: tabular-nums;
      color: var(--accent-strong);
      letter-spacing: 0.04em;
      font-weight: 600;
    }

    /* Range Slider */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, #f3a469 0%, #fff4c8 36%, #f4b25c 72%, #3a5078 100%);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fffdf5;
      border: 2px solid rgba(35, 45, 28, 0.75);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: transform 0.14s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.12);
    }

    input[type="range"]::-moz-range-thumb {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fffdf5;
      border: 2px solid rgba(35, 45, 28, 0.75);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      cursor: pointer;
    }

    /* Segmented Season Toggle */
    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 3px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 240, 0.1);
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--glass-muted);
      font-size: 11px;
      font-weight: 500;
      padding: 6px 4px;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .seg-btn:hover {
      color: #fff;
    }

    .seg-btn.active {
      background: rgba(245, 235, 206, 0.22);
      color: #fffdf5;
      box-shadow: inset 0 0 0 1px rgba(255, 246, 220, 0.28);
    }

    /* Feature Toggle Buttons */
    .toggle-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .toggle-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 7px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 240, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: var(--glass-text);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .toggle-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .toggle-btn.active {
      background: rgba(232, 207, 160, 0.24);
      border-color: rgba(246, 220, 168, 0.55);
      color: #fffdf6;
    }

    .toggle-dot {
      width: 26px;
      height: 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.16);
      position: relative;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    .toggle-dot::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 1px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 252, 242, 0.8);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .toggle-btn.active .toggle-dot {
      background: rgba(235, 202, 138, 0.72);
    }

    .toggle-btn.active .toggle-dot::after {
      transform: translateX(12px);
      background: #ffffff;
    }

    /* Camera Preset Chips Bar */
    #preset-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 28px);
      padding: 6px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      pointer-events: auto;
    }

    #preset-bar::-webkit-scrollbar {
      display: none;
    }

    .preset-chip {
      border: none;
      background: transparent;
      color: rgba(248, 245, 234, 0.82);
      font-size: 11.5px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .preset-chip:hover {
      background: rgba(255, 255, 255, 0.11);
      color: #fff;
    }

    .preset-chip.active {
      background: rgba(245, 233, 202, 0.25);
      color: #fffdf5;
      box-shadow: inset 0 0 0 1px rgba(255, 246, 220, 0.34);
    }

    /* Subtle interaction hint */
    #hint-bar {
      position: fixed;
      bottom: 26px;
      left: 22px;
      font-size: 10.5px;
      letter-spacing: 0.05em;
      color: rgba(244, 242, 230, 0.68);
      text-shadow: 0 1px 6px rgba(10, 18, 6, 0.4);
      pointer-events: none;
    }

    /* Loading Ring Overlay */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(circle at 50% 45%, rgba(126, 163, 83, 0.92), rgba(40, 60, 26, 0.97));
      transition: opacity 0.55s ease, visibility 0.55s ease;
    }

    #loader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 250, 235, 0.2);
      border-top-color: #f6e7c4;
      animation: spin 0.9s linear infinite;
    }

    .loader-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 252, 242, 0.88);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive Mobile Adjustments */
    @media (max-width: 900px) {
      #hint-bar {
        display: none;
      }
    }

    @media (max-width: 680px) {
      #title-block {
        top: 12px;
        left: 14px;
      }
      #title-block h1 {
        font-size: 15px;
      }
      #title-block p {
        font-size: 9.5px;
      }
      #top-actions {
        top: 12px;
        right: 12px;
        gap: 6px;
      }
      .icon-btn {
        height: 31px;
        padding: 0 9px;
        font-size: 10.5px;
      }
      .icon-btn span.btn-label {
        display: none;
      }
      #control-panel {
        top: 52px;
        right: 12px;
        width: 196px;
        padding: 11px;
        gap: 10px;
      }
      #preset-bar {
        bottom: 12px;
        padding: 4px;
      }
      .preset-chip {
        padding: 5px 10px;
        font-size: 10.5px;
      }
    }
  </style>
</head>
<body>
  <!-- Layered Green Bokeh Backdrop -->
  <div id="bg-gradient"></div>
  <canvas id="bokeh-canvas"></canvas>

  <!-- Three.js WebGL Stage -->
  <div id="webgl-container"></div>

  <!-- Subtle Tilt-Shift Depth of Field & Vignette -->
  <div id="tilt-shift-overlay"></div>
  <div id="vignette-layer"></div>

  <!-- Dynamic Leader Line for Selected Info Card -->
  <svg id="leader-svg" aria-hidden="true">
    <line id="leader-line" x1="0" y1="0" x2="0" y2="0" stroke="rgba(255, 246, 222, 0.85)" stroke-width="1.2" stroke-dasharray="3 3" visibility="hidden" />
    <circle id="leader-dot" cx="0" cy="0" r="3.6" fill="#f7e2b5" stroke="rgba(26, 36, 20, 0.85)" stroke-width="1.4" visibility="hidden" />
  </svg>

  <!-- Hover Label -->
  <div id="hover-pill"></div>

  <!-- Floating Monument Info Card -->
  <aside id="info-card" role="dialog" aria-live="polite">
    <button id="info-close" title="Close" aria-label="Close info card">&times;</button>
    <div class="info-tag" id="info-tag"></div>
    <h2 class="info-title" id="info-title"></h2>
    <p class="info-body" id="info-body"></p>
    <div class="info-meta">
      <span id="info-material"></span>
      <span id="info-scale"></span>
    </div>
  </aside>

  <!-- Minimal HUD -->
  <div id="ui-layer">
    <header id="title-block">
      <h1 id="header-title">Pocket World 3D</h1>
      <p>Monumental Equestrian Memorial</p>
    </header>

    <div id="top-actions">
      <button class="icon-btn" id="screenshot-btn" title="Save Screenshot PNG">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span class="btn-label">Screenshot</span>
      </button>
      <button class="icon-btn" id="hide-ui-btn" title="Hide Interface">
        <svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        <span class="btn-label">Hide UI</span>
      </button>
    </div>

    <aside id="control-panel">
      <div class="panel-section">
        <div class="panel-label-row">
          <span>Time of Day</span>
          <span class="panel-value" id="time-readout">10:30 AM</span>
        </div>
        <input id="time-slider" type="range" min="0" max="100" step="0.5" value="28" aria-label="Time of Day" />
      </div>

      <div class="panel-section">
        <div class="panel-label-row">
          <span>Season</span>
          <span class="panel-value" id="season-readout">Spring</span>
        </div>
        <div class="segmented" role="group" aria-label="Season">
          <button class="seg-btn active" data-season="spring">Spring</button>
          <button class="seg-btn" data-season="autumn">Autumn</button>
          <button class="seg-btn" data-season="winter">Snow</button>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-label-row">
          <span>Architectural View</span>
        </div>
        <div class="toggle-grid">
          <button class="toggle-btn" id="toggle-section" aria-pressed="false">
            <span>Cross-Section</span>
            <span class="toggle-dot"></span>
          </button>
          <button class="toggle-btn" id="toggle-explode" aria-pressed="false">
            <span>Explode Layers</span>
            <span class="toggle-dot"></span>
          </button>
          <button class="toggle-btn" id="toggle-wireframe" aria-pressed="false">
            <span>Wireframe</span>
            <span class="toggle-dot"></span>
          </button>
        </div>
      </div>
    </aside>

    <nav id="preset-bar" aria-label="Camera Presets">
      <button class="preset-chip active" data-preset="overview">Overview</button>
      <button class="preset-chip" data-preset="equestrian">Equestrian Statue</button>
      <button class="preset-chip" data-preset="pedestal">Pedestal Plaques</button>
      <button class="preset-chip" data-preset="colonnade">Colonnade</button>
      <button class="preset-chip" data-preset="stairs">Front Stairs</button>
      <button class="preset-chip" data-preset="animals">Animal Statues</button>
      <button class="preset-chip" data-preset="topdown">Top-Down Plan</button>
    </nav>

    <div id="hint-bar">Drag to orbit &middot; Scroll to zoom &middot; Click parts to inspect &middot; Double-click to reset</div>
  </div>

  <!-- Restore UI Button -->
  <button class="icon-btn" id="restore-ui-btn" title="Show Interface">

  <!-- Three.js r128 & GSAP from cdnjs -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    (function () {
      "use strict";

      /* =========================================================================
         1. EDITABLE CONFIGURATION & CONTENT DATA
         ========================================================================= */

      // Change this constant to rename the miniature's nameplate and title.
      const PLAQUE_TEXT = "Pocket World 3D";

      // Editable info-card content for clickable monument elements.
      const MONUMENT_INFO = {
        equestrian: {
          tag: "Crowning Sculpture",
          title: "Monumental Equestrian Statue",
          body: "Cast in deep bluish-grey bronze with subtle green verdigris nestled in the drapery and recessed folds. The steed lifts one foreleg in mid-stride while the commander extends a guiding hand across the plaza.",
          material: "Patinated Bronze",
          scale: "Height 11.9m (scale)"
        },
        pedestal: {
          tag: "Central Core",
          title: "Tiered Pedestal & Bronze Plaques",
          body: "Rising from a stepped octagonal base, the cream limestone tower pairs four corner bronze-capitalled columns with engraved commemorative plaques, classical bas-reliefs, standing allegorical figures, and a ribbed oxidised-copper dome.",
          material: "Limestone & Copper",
          scale: "Hollow Vaulted Core"
        },
        colonnade: {
          tag: "Sweeping Peristyle",
          title: "Asymmetrical Curved Colonnade",
          body: "A graceful semi-circular screen of slender stone columns supporting a continuous entablature and hundreds of turned roof balusters. Its right arm curves tighter forward and inward for dramatic compositional asymmetry.",
          material: "Warm Cream Stone",
          scale: "360+ Turned Balusters"
        },
        pavilions: {
          tag: "Architectural Anchors",
          title: "Corner & End Pavilions",
          body: "Four square pavilions punctuate the colonnade at varied radii from the centre. Each features paired pilasters, a projecting cornice, a domed pyramidal roof with bronze finial, and an arched niche housing a standing statue.",
          material: "Ashlar Stone & Bronze",
          scale: "4 Asymmetric Nodes"
        },
        plaza: {
          tag: "Ceremonial Forecourt",
          title: "Radial Patterned Plaza",
          body: "Paved in alternating cream, sand, and soft-grey stone tiles arranged in concentric rings, checkerboard fields, and radiating sightlines around the memorial, bounded along the front lip by a low balustraded terrace rail.",
          material: "Cut Stone Pavers",
          scale: "Elevated Terrace"
        },
        stairs: {
          tag: "Grand Approach",
          title: "Front Steps & Bronze Lions",
          body: "A broad, shallow flight of stone steps descends to the lower landing, guarded by four crouching bronze lions set upon square pedestals and softened with terracotta planters and classical bronze lanterns.",
          material: "Limestone & Bronze",
          scale: "4 Guardian Beasts"
        }
      };

      // Camera preset definitions (spherical coordinates around target).
      const CAMERA_PRESETS = {
        overview:   { theta: 0.42,  phi: 1.06, radius: 37.5, target: [-0.3, 3.2, 0.2] },
        equestrian: { theta: 0.58,  phi: 1.24, radius: 7.8,  target: [0.0, 10.0, -0.25] },
        pedestal:   { theta: 0.30,  phi: 1.32, radius: 11.2, target: [0.0, 4.4, 0.0] },
        colonnade:  { theta: -0.68, phi: 1.12, radius: 22.0, target: [1.4, 3.3, -1.6] },
        stairs:     { theta: 0.22,  phi: 1.24, radius: 13.0, target: [0.0, 1.3, 6.2] },
        animals:    { theta: -0.48, phi: 1.28, radius: 8.8,  target: [2.8, 1.35, 6.3] },
        topdown:    { theta: 0.02,  phi: 0.16, radius: 34.5, target: [0.0, 1.0, 0.5] }
      };

      document.getElementById("header-title").textContent = PLAQUE_TEXT;
      document.title = PLAQUE_TEXT + " — Monumental Equestrian Memorial";

      /* =========================================================================
         2. RESOURCE TRACKER & DISPOSAL
         ========================================================================= */

      const trackedGeometries = new Set();
      const trackedMaterials = new Set();
      const trackedTextures = new Set();

      function trackGeo(g) { trackedGeometries.add(g); return g; }
      function trackMat(m) { trackedMaterials.add(m); return m; }
      function trackTex(t) { trackedTextures.add(t); return t; }

      function disposeAllResources() {
        trackedGeometries.forEach(function (g) { if (g && g.dispose) g.dispose(); });
        trackedMaterials.forEach(function (m) { if (m && m.dispose) m.dispose(); });
        trackedTextures.forEach(function (t) { if (t && t.dispose) t.dispose(); });
        trackedGeometries.clear();
        trackedMaterials.clear();
        trackedTextures.clear();
        if (renderer) renderer.dispose();
      }

      /* =========================================================================
         3. ANIMATED BOKEH BACKGROUND (2D CANVAS BEHIND WEBGL)
         ========================================================================= */

      const bokehCanvas = document.getElementById("bokeh-canvas");
      const bokehCtx = bokehCanvas.getContext("2d");
      const bokehBlobs = [];
      let bokehPalette = {
        top: [207, 228, 147],
        mid: [126, 163, 83],
        bot: [46, 67, 31],
        glowA: "rgba(246, 255, 206, 0.24)",
        glowB: "rgba(204, 232, 134, 0.17)",
        glowC: "rgba(255, 250, 214, 0.19)"
      };

      for (let i = 0; i < 24; i++) {
        bokehBlobs.push({
          x: Math.random(),
          y: Math.random(),
          r: 0.045 + Math.random() * 0.115,
          vx: (Math.random() - 0.5) * 0.008,
          vy: (Math.random() - 0.5) * 0.006,
          phase: Math.random() * Math.PI * 2,
          speed: 0.35 + Math.random() * 0.55,
          tone: i % 3
        });
      }

      function resizeBokeh() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        bokehCanvas.width = Math.floor(window.innerWidth * dpr);
        bokehCanvas.height = Math.floor(window.innerHeight * dpr);
      }
      resizeBokeh();

      function drawBokehToContext(ctx, w, h, elapsed, includeBaseGradient) {
        if (includeBaseGradient) {
          const grad = ctx.createLinearGradient(0, 0, 0, h);
          grad.addColorStop(0, "rgb(" + bokehPalette.top.join(",") + ")");
          grad.addColorStop(0.5, "rgb(" + bokehPalette.mid.join(",") + ")");
          grad.addColorStop(1, "rgb(" + bokehPalette.bot.join(",") + ")");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);

          const sunGlow = ctx.createRadialGradient(w * 0.24, h * 0.16, 0, w * 0.24, h * 0.16, Math.max(w, h) * 0.65);
          sunGlow.addColorStop(0, "rgba(245, 255, 202, 0.42)");
          sunGlow.addColorStop(1, "rgba(245, 255, 202, 0)");
          ctx.fillStyle = sunGlow;
          ctx.fillRect(0, 0, w, h);
        } else {
          ctx.clearRect(0, 0, w, h);
        }

        const minDim = Math.min(w, h);
        for (let i = 0; i < bokehBlobs.length; i++) {
          const b = bokehBlobs[i];
          const px = ((b.x + Math.sin(elapsed * 0.12 + b.phase) * 0.035 + elapsed * b.vx) % 1.2 + 1.2) % 1.2 - 0.1;
          const py = ((b.y + Math.cos(elapsed * 0.1 + b.phase) * 0.03 + elapsed * b.vy) % 1.2 + 1.2) % 1.2 - 0.1;
          const pulse = 0.78 + 0.22 * Math.sin(elapsed * b.speed + b.phase);
          const rad = b.r * minDim * pulse;
          const cx = px * w;
          const cy = py * h;
          const color = b.tone === 0 ? bokehPalette.glowA : (b.tone === 1 ? bokehPalette.glowB : bokehPalette.glowC);

          const g = ctx.createRadialGradient(cx, cy, rad * 0.08, cx, cy, rad);
          g.addColorStop(0, color);
          g.addColorStop(0.62, color.replace(/[\d.]+\)$/, "0.06)"));
          g.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(cx, cy, rad, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      /* =========================================================================
         4. PROCEDURAL CANVAS TEXTURES (NO EXTERNAL ASSETS)
         ========================================================================= */

      function createSeededRandom(seed) {
        let s = seed >>> 0;
        return function () {
          s = (s * 1664525 + 1013904223) >>> 0;
          return s / 4294967296;
        };
      }

      // Warm matte clay-like architectural stone with mortar joints & subtle AO
      function createStoneTextures(baseColor, mortarColor, seed) {
        const size = 512;
        const colorCanvas = document.createElement("canvas");
        colorCanvas.width = size;
        colorCanvas.height = size;
        const ctx = colorCanvas.getContext("2d");

        const bumpCanvas = document.createElement("canvas");
        bumpCanvas.width = size;
        bumpCanvas.height = size;
        const bctx = bumpCanvas.getContext("2d");

        const rand = createSeededRandom(seed || 101);

        ctx.fillStyle = baseColor;
        ctx.fillRect(0, 0, size, size);
        bctx.fillStyle = "#c8c8c8";
        bctx.fillRect(0, 0, size, size);

        // Soft vertical AO gradient for clay architectural model warmth
        const aoGrad = ctx.createLinearGradient(0, 0, 0, size);
        aoGrad.addColorStop(0, "rgba(255, 252, 244, 0.08)");
        aoGrad.addColorStop(0.55, "rgba(195, 180, 155, 0.0)");
        aoGrad.addColorStop(1, "rgba(110, 96, 76, 0.14)");
        ctx.fillStyle = aoGrad;
        ctx.fillRect(0, 0, size, size);

        // Subtle ashlar stone block grid with thin dark joint shadows
        const rows = 8;
        const rowH = size / rows;
        for (let r = 0; r < rows; r++) {
          const y = r * rowH;
          const cols = 4;
          const colW = size / cols;
          const offset = (r % 2) * (colW * 0.5);
          for (let c = -1; c <= cols; c++) {
            const x = c * colW + offset;
            const toneShift = (rand() - 0.5) * 14;
            ctx.fillStyle = toneShift > 0
              ? "rgba(255, 250, 238, " + (toneShift * 0.006).toFixed(3) + ")"
              : "rgba(128, 112, 88, " + (-toneShift * 0.006).toFixed(3) + ")";
            ctx.fillRect(x + 1, y + 1, colW - 2, rowH - 2);

            ctx.strokeStyle = mortarColor;
            ctx.lineWidth = 1.6;
            ctx.strokeRect(x, y, colW, rowH);

            bctx.strokeStyle = "#626262";
            bctx.lineWidth = 2.2;
            bctx.strokeRect(x, y, colW, rowH);
          }
        }

        // Fine clay-like mineral grain for subtle roughness variation
        for (let i = 0; i < 4800; i++) {
          const x = rand() * size;
          const y = rand() * size;
          const v = rand();
          ctx.fillStyle = v > 0.5 ? "rgba(255,253,246,0.12)" : "rgba(120,106,86,0.09)";
          ctx.fillRect(x, y, 1.5, 1.5);
          const bv = Math.floor(175 + (v - 0.5) * 55);
          bctx.fillStyle = "rgb(" + bv + "," + bv + "," + bv + ")";
          bctx.fillRect(x, y, 2, 2);
        }

        const map = trackTex(new THREE.CanvasTexture(colorCanvas));
        map.wrapS = map.wrapT = THREE.RepeatWrapping;
        map.encoding = THREE.sRGBEncoding;

        const bump = trackTex(new THREE.CanvasTexture(bumpCanvas));
        bump.wrapS = bump.wrapT = THREE.RepeatWrapping;

        return { map: map, bump: bump };
      }

      // Plaza concentric rings + radiating lines + cream/beige/grey checkerboard
      function createPlazaTextures() {
        const size = 1024;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");

        const bumpCanvas = document.createElement("canvas");
        bumpCanvas.width = size;
        bumpCanvas.height = size;
        const bctx = bumpCanvas.getContext("2d");

        const rand = createSeededRandom(303);

        ctx.fillStyle = "#e8dfd0";
        ctx.fillRect(0, 0, size, size);
        bctx.fillStyle = "#d2d2d2";
        bctx.fillRect(0, 0, size, size);

        // Subtle checkerboard paving field
        const grid = 32;
        const cell = size / grid;
        const palette = ["#eee7d8", "#e1d6c1", "#d4cec2", "#e8decb"];
        for (let gx = 0; gx < grid; gx++) {
          for (let gy = 0; gy < grid; gy++) {
            const idx = (gx + gy) % 2 === 0 ? (rand() > 0.35 ? 0 : 3) : (rand() > 0.45 ? 1 : 2);
            ctx.fillStyle = palette[idx];
            ctx.fillRect(gx * cell, gy * cell, cell, cell);
            ctx.strokeStyle = "rgba(116, 106, 90, 0.28)";
            ctx.lineWidth = 1.2;
            ctx.strokeRect(gx * cell, gy * cell, cell, cell);

            bctx.strokeStyle = "#7a7a7a";
            bctx.lineWidth = 1.6;
            bctx.strokeRect(gx * cell, gy * cell, cell, cell);
          }
        }

        // Center of monument in plaza UV space (u=0.5, v=0.52 -> cy = 0.48)
        const cx = size * 0.5;
        const cy = size * 0.48;

        // Concentric rings around central memorial base
        const rings = [145, 195, 250, 315, 385, 455];
        rings.forEach(function (r, idx) {
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.strokeStyle = idx % 2 === 0 ? "#c8bfb0" : "#f3ede0";
          ctx.lineWidth = idx % 2 === 0 ? 12 : 7;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(cx, cy, r + 6, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(95, 86, 72, 0.34)";
          ctx.lineWidth = 1.4;
          ctx.stroke();

          bctx.beginPath();
          bctx.arc(cx, cy, r + 6, 0, Math.PI * 2);
          bctx.strokeStyle = "#686868";
          bctx.lineWidth = 2;
          bctx.stroke();
        });

        // Radiating sightlines around the octagonal base
        const rays = 16;
        for (let i = 0; i < rays; i++) {
          const ang = (i / rays) * Math.PI * 2;
          const x1 = cx + Math.cos(ang) * 140;
          const y1 = cy + Math.sin(ang) * 140;
          const x2 = cx + Math.cos(ang) * 465;
          const y2 = cy + Math.sin(ang) * 465;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = i % 2 === 0 ? "#c6bcae" : "rgba(130, 120, 104, 0.45)";
          ctx.lineWidth = i % 2 === 0 ? 7 : 2.5;
          ctx.stroke();

          bctx.beginPath();
          bctx.moveTo(x1, y1);
          bctx.lineTo(x2, y2);
          bctx.strokeStyle = "#767676";
          bctx.lineWidth = 2.4;
          bctx.stroke();
        }

        // Subtle baked ambient-occlusion around central pedestal base
        const aoCenter = ctx.createRadialGradient(cx, cy, 95, cx, cy, 240);
        aoCenter.addColorStop(0, "rgba(92, 82, 68, 0.24)");
        aoCenter.addColorStop(0.55, "rgba(92, 82, 68, 0.08)");
        aoCenter.addColorStop(1, "rgba(92, 82, 68, 0)");
        ctx.fillStyle = aoCenter;
        ctx.beginPath();
        ctx.arc(cx, cy, 240, 0, Math.PI * 2);
        ctx.fill();

        const map = trackTex(new THREE.CanvasTexture(canvas));
        map.encoding = THREE.sRGBEncoding;
        const bump = trackTex(new THREE.CanvasTexture(bumpCanvas));
        return { map: map, bump: bump };
      }

      // Patinated bronze with subtle green verdigris in recesses
      function createBronzeTextures(baseRgb, patinaRgb, seed) {
        const size = 256;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");

        const roughCanvas = document.createElement("canvas");
        roughCanvas.width = size;
        roughCanvas.height = size;
        const rctx = roughCanvas.getContext("2d");

        const rand = createSeededRandom(seed || 505);

        ctx.fillStyle = "rgb(" + baseRgb.join(",") + ")";
        ctx.fillRect(0, 0, size, size);
        rctx.fillStyle = "#888888";
        rctx.fillRect(0, 0, size, size);

        // Mottled verdigris patina clouds
        for (let i = 0; i < 160; i++) {
          const x = rand() * size;
          const y = rand() * size;
          const rad = 8 + rand() * 34;
          const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
          const alpha = 0.08 + rand() * 0.24;
          g.addColorStop(0, "rgba(" + patinaRgb.join(",") + "," + alpha.toFixed(2) + ")");
          g.addColorStop(1, "rgba(" + patinaRgb.join(",") + ",0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, rad, 0, Math.PI * 2);
          ctx.fill();

          const rg = rctx.createRadialGradient(x, y, 0, x, y, rad);
          rg.addColorStop(0, "rgba(210,210,210,0.45)");
          rg.addColorStop(1, "rgba(136,136,136,0)");
          rctx.fillStyle = rg;
          rctx.beginPath();
          rctx.arc(x, y, rad, 0, Math.PI * 2);
          rctx.fill();
        }

        // Subtle metallic directional sheen grain
        for (let i = 0; i < 800; i++) {
          const x = rand() * size;
          const y = rand() * size;
          ctx.fillStyle = rand() > 0.5 ? "rgba(220,235,235,0.06)" : "rgba(12,18,22,0.09)";
          ctx.fillRect(x, y, 2, 1 + rand() * 4);
        }

        const map = trackTex(new THREE.CanvasTexture(canvas));
        map.wrapS = map.wrapT = THREE.RepeatWrapping;
        map.encoding = THREE.sRGBEncoding;

        const rough = trackTex(new THREE.CanvasTexture(roughCanvas));
        rough.wrapS = rough.wrapT = THREE.RepeatWrapping;

        return { map: map, rough: rough };
      }

      // Blue-green oxidised copper dome roof with soft mottled patina
      function createOxidisedCopperTexture() {
        const size = 256;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        const rand = createSeededRandom(707);

        const grad = ctx.createLinearGradient(0, 0, 0, size);
        grad.addColorStop(0, "#6eb5a8");
        grad.addColorStop(0.5, "#509689");
        grad.addColorStop(1, "#3b746b");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);

        for (let i = 0; i < 140; i++) {
          const x = rand() * size;
          const y = rand() * size;
          const rad = 8 + rand() * 26;
          const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
          g.addColorStop(0, rand() > 0.45 ? "rgba(155, 220, 206, 0.14)" : "rgba(32, 66, 60, 0.14)");
          g.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, rad, 0, Math.PI * 2);
          ctx.fill();
        }

        const tex = trackTex(new THREE.CanvasTexture(canvas));
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // Dark bronze engraved inscription plaque for pedestal front & rear
      function createBronzePlaqueTextures() {
        const w = 512, h = 384;
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");

        const bump = document.createElement("canvas");
        bump.width = w;
        bump.height = h;
        const bctx = bump.getContext("2d");

        const bg = ctx.createLinearGradient(0, 0, w, h);
        bg.addColorStop(0, "#2f2c26");
        bg.addColorStop(0.5, "#23211d");
        bg.addColorStop(1, "#332e26");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);

        bctx.fillStyle = "#909090";
        bctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = "#8a7856";
        ctx.lineWidth = 6;
        ctx.strokeRect(18, 18, w - 36, h - 36);
        ctx.lineWidth = 2;
        ctx.strokeRect(30, 30, w - 60, h - 60);

        bctx.strokeStyle = "#eaeaea";
        bctx.lineWidth = 6;
        bctx.strokeRect(18, 18, w - 36, h - 36);

        [[46, 46], [w - 46, 46], [46, h - 46], [w - 46, h - 46]].forEach(function (pt) {
          ctx.fillStyle = "#9a855e";
          ctx.beginPath();
          ctx.arc(pt[0], pt[1], 7, 0, Math.PI * 2);
          ctx.fill();
          bctx.fillStyle = "#ffffff";
          bctx.beginPath();
          bctx.arc(pt[0], pt[1], 7, 0, Math.PI * 2);
          bctx.fill();
        });

        const lines = [
          "MEMORIAE AETERNAE",
          "PATRIAE · HONOR · VIRTUS",
          "ANNO DOMINI MDCCCXCVIII",
          "ARCHITECTURA ET SCULPTURA",
          "MONUMENTUM EQUESTRE",
          "POPULUS GRATUS POSUIT"
        ];
        ctx.textAlign = "center";
        bctx.textAlign = "center";
        lines.forEach(function (line, i) {
          const y = 96 + i * 42;
          const fontSize = i === 0 ? 25 : (i === 2 ? 19 : 16);
          ctx.font = "600 " + fontSize + "px Georgia, serif";
          ctx.fillStyle = i === 0 ? "#c8b182" : "#a5926b";
          ctx.fillText(line, w * 0.5, y);

          bctx.font = ctx.font;
          bctx.fillStyle = "#dcdcdc";
          bctx.fillText(line, w * 0.5, y);

          if (i === 0 || i === 4) {
            ctx.fillStyle = "rgba(180, 158, 114, 0.55)";
            ctx.fillRect(w * 0.28, y + 14, w * 0.44, 1.5);
          }
        });

        const mapTex = trackTex(new THREE.CanvasTexture(canvas));
        mapTex.encoding = THREE.sRGBEncoding;
        const bumpTex = trackTex(new THREE.CanvasTexture(bump));
        return { map: mapTex, bump: bumpTex };
      }

      // Carved stone bas-relief texture for pedestal sides
      function createCarvedReliefTextures() {
        const w = 512, h = 256;
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");

        const bump = document.createElement("canvas");
        bump.width = w;
        bump.height = h;
        const bctx = bump.getContext("2d");

        ctx.fillStyle = "#dfd4be";
        ctx.fillRect(0, 0, w, h);
        bctx.fillStyle = "#7a7a7a";
        bctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = "#b8aa90";
        ctx.lineWidth = 14;
        ctx.strokeRect(14, 14, w - 28, h - 28);
        bctx.strokeStyle = "#d8d8d8";
        bctx.lineWidth = 14;
        bctx.strokeRect(14, 14, w - 28, h - 28);

        ctx.strokeStyle = "#efe6d4";
        ctx.lineWidth = 10;
        bctx.strokeStyle = "#f2f2f2";
        bctx.lineWidth = 10;

        for (let s = 0; s < 3; s++) {
          const sx = 96 + s * 160;
          ctx.beginPath();
          ctx.arc(sx, 110, 56, 0.15 * Math.PI, 0.85 * Math.PI);
          ctx.stroke();
          bctx.beginPath();
          bctx.arc(sx, 110, 56, 0.15 * Math.PI, 0.85 * Math.PI);
          bctx.stroke();

          ctx.fillStyle = "#f2eadb";
          ctx.beginPath();
          ctx.arc(sx, 108, 22, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#bfb096";
          ctx.lineWidth = 3;
          ctx.stroke();

          bctx.fillStyle = "#ffffff";
          bctx.beginPath();
          bctx.arc(sx, 108, 22, 0, Math.PI * 2);
          bctx.fill();
        }

        const mapTex = trackTex(new THREE.CanvasTexture(canvas));
        mapTex.encoding = THREE.sRGBEncoding;
        const bumpTex = trackTex(new THREE.CanvasTexture(bump));
        return { map: mapTex, bump: bumpTex };
      }

      // Dark rectangular corner nameplate driven by PLAQUE_TEXT
      function createNameplateTexture(labelText) {
        const w = 1024, h = 256;
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");

        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, "#24282b");
        grad.addColorStop(0.5, "#1b1e21");
        grad.addColorStop(1, "#272b2f");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        for (let y = 0; y < h; y += 3) {
          ctx.fillStyle = y % 6 === 0 ? "rgba(255,255,255,0.025)" : "rgba(0,0,0,0.04)";
          ctx.fillRect(0, y, w, 1.5);
        }

        ctx.strokeStyle = "rgba(222, 206, 174, 0.55)";
        ctx.lineWidth = 4;
        ctx.strokeRect(20, 20, w - 40, h - 40);

        [[38, 38], [w - 38, 38], [38, h - 38], [w - 38, h - 38]].forEach(function (p) {
          ctx.fillStyle = "#c8b896";
          ctx.beginPath();
          ctx.arc(p[0], p[1], 5, 0, Math.PI * 2);
          ctx.fill();
        });

        let fontSize = 86;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        do {
          ctx.font = "500 " + fontSize + "px Georgia, 'Times New Roman', serif";
          fontSize -= 4;
        } while (ctx.measureText(labelText).width > w - 130 && fontSize > 28);

        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.fillText(labelText, w * 0.5 + 2, h * 0.52 + 3);
        ctx.fillStyle = "#f2e8d4";
        ctx.fillText(labelText, w * 0.5, h * 0.52);

        const tex = trackTex(new THREE.CanvasTexture(canvas));
        tex.encoding = THREE.sRGBEncoding;
        tex.anisotropy = 4;
        return tex;
      }

      // Soft pale-grey display slab texture
      function createSlabTexture() {
        const size = 512;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        const rand = createSeededRandom(909);

        ctx.fillStyle = "#d9dcdb";
        ctx.fillRect(0, 0, size, size);

        const g = ctx.createRadialGradient(size * 0.5, size * 0.5, size * 0.15, size * 0.5, size * 0.5, size * 0.72);
        g.addColorStop(0, "rgba(255, 255, 255, 0.08)");
        g.addColorStop(1, "rgba(120, 128, 126, 0.14)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);

        for (let i = 0; i < 3600; i++) {
          ctx.fillStyle = rand() > 0.5 ? "rgba(255,255,255,0.09)" : "rgba(110,115,115,0.07)";
          ctx.fillRect(rand() * size, rand() * size, 2, 2);
        }

        const tex = trackTex(new THREE.CanvasTexture(canvas));
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // Soft circular particle sprite for floating dust motes
      function createDustTexture() {
        const size = 64;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        const g = ctx.createRadialGradient(32, 32, 1, 32, 32, 30);
        g.addColorStop(0, "rgba(255, 250, 224, 0.95)");
        g.addColorStop(0.4, "rgba(255, 245, 200, 0.45)");
        g.addColorStop(1, "rgba(255, 245, 200, 0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
        const tex = trackTex(new THREE.CanvasTexture(canvas));
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      /* =========================================================================

      const container = document.getElementById("webgl-container");

      // Shared Season Shader Uniforms (Snow cover & Autumn warmth on upward-facing stone)
      const seasonUniforms = {
        uSnowAmount: { value: 0.0 },

      };

      function applySeasonShader(material) {
        material.customProgramCacheKey = function () {
          return "pocket-world-season-v1";
        };
        material.onBeforeCompile = function (shader) {
          shader.uniforms.uSnowAmount = seasonUniforms.uSnowAmount;
          shader.uniforms.uAutumnAmount = seasonUniforms.uAutumnAmount;

          shader.vertexShader = shader.vertexShader
            .replace(
              "#include <common>",
              "#include <common>\nvarying vec3 vWorldNormalPW;\nvarying vec3 vWorldPosPW;"
            )
            .replace(
              "#include <worldpos_vertex>",
              "#include <worldpos_vertex>\n" +
              "vec3 pwObjNorm = objectNormal;\n" +
              "#ifdef USE_INSTANCING\n" +
              "  pwObjNorm = mat3(instanceMatrix) * pwObjNorm;\n" +
              "#endif\n" +
              "vWorldNormalPW = normalize(mat3(modelMatrix) * pwObjNorm);\n" +
              "vec4 pwWorldP = vec4(transformed, 1.0);\n" +
              "#ifdef USE_INSTANCING\n" +
              "  pwWorldP = instanceMatrix * pwWorldP;\n" +
              "#endif\n" +
              "pwWorldP = modelMatrix * pwWorldP;\n" +
              "vWorldPosPW = pwWorldP.xyz;"
            );

          shader.fragmentShader = shader.fragmentShader
            .replace(
              "#include <common>",
              "#include <common>\n" +
              "uniform float uSnowAmount;\n" +
              "uniform float uAutumnAmount;\n" +
              "varying vec3 vWorldNormalPW;\n" +
              "varying vec3 vWorldPosPW;"
            )
            .replace(
              "#include <color_fragment>",
              "#include <color_fragment>\n" +
              "if (uAutumnAmount > 0.001) {\n" +
              "  diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(1.06, 0.98, 0.88), uAutumnAmount * 0.42);\n" +
              "}\n" +
              "if (uSnowAmount > 0.001) {\n" +
              "  float sn1 = sin(vWorldPosPW.x * 2.4 + vWorldPosPW.z * 1.8) * 0.5 + 0.5;\n" +
              "  float sn2 = cos(vWorldPosPW.x * 5.7 - vWorldPosPW.z * 4.9) * 0.5 + 0.5;\n" +
              "  float snNoise = sn1 * 0.65 + sn2 * 0.35;\n" +
              "  float upSlope = smoothstep(0.46 - uSnowAmount * 0.18 + (snNoise - 0.5) * 0.2, 0.78, vWorldNormalPW.y);\n" +
              "  float aboveSlab = smoothstep(-0.15, 0.12, vWorldPosPW.y);\n" +
              "  float snowMask = clamp(upSlope * aboveSlab * uSnowAmount * 0.94, 0.0, 0.94);\n" +
              "  diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.95, 0.97, 1.0), snowMask);\n" +
              "}"
            )
            .replace(
              "#include <roughnessmap_fragment>",
              "#include <roughnessmap_fragment>\n" +
              "if (uSnowAmount > 0.001) {\n" +
              "  float upR = smoothstep(0.45, 0.78, vWorldNormalPW.y) * smoothstep(-0.15, 0.12, vWorldPosPW.y);\n" +
              "  roughnessFactor = mix(roughnessFactor, 0.90, clamp(upR * uSnowAmount, 0.0, 1.0));\n" +
              "}"
            );
        };
        return material;
      }

      /* =========================================================================
         8. PROCEDURAL GEOMETRY HELPERS
         ========================================================================= */

      function createRoundedRectShape(width, height, radius) {
        const s = new THREE.Shape();
        const x = -width * 0.5;
        const y = -height * 0.5;
        const r = Math.min(radius, width * 0.5, height * 0.5);
        s.moveTo(x + r, y);
        s.lineTo(x + width - r, y);
        s.quadraticCurveTo(x + width, y, x + width, y + r);
        s.lineTo(x + width, y + height - r);
        s.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
        s.lineTo(x + r, y + height);
        s.quadraticCurveTo(x, y + height, x, y + height - r);
        s.lineTo(x, y + r);
        s.quadraticCurveTo(x, y, x + r, y);
        return s;
      }

      // Sweep a closed CCW 2D cross-section [(u, y), ...] along a 2D curve in XZ from tStart to tEnd.
      function createSweptProfileGeometry(curve2D, profile, segments, tStart, tEnd) {
        const u0 = tStart !== undefined ? tStart : 0;
        const u1 = tEnd !== undefined ? tEnd : 1;
        const pts = [];
        for (let i = 0; i <= segments; i++) {
          const t = u0 + (i / segments) * (u1 - u0);
          pts.push(curve2D.getPointAt(t));
        }

        const normals = [];
        for (let i = 0; i <= segments; i++) {
          const prev = pts[Math.max(0, i - 1)];
          const next = pts[Math.min(segments, i + 1)];
          const tx = next.x - prev.x;
          const tz = next.y - prev.y;
          const len = Math.hypot(tx, tz) || 1;
          // Outward normal N = (tz, -tx) points away from plaza center
          normals.push({ x: tz / len, z: -tx / len, tx: tx / len, tz: tz / len });
        }

        const positions = [];
        const uvs = [];
        const indices = [];
        let vertOffset = 0;

        const m = profile.length;
        // Separate vertex strip per profile segment preserves sharp architectural edges
        for (let e = 0; e < m; e++) {
          const p0 = profile[e];
          const p1 = profile[(e + 1) % m];
          const base = vertOffset;

          for (let i = 0; i <= segments; i++) {
            const c = pts[i];
            const n = normals[i];
            const uCoord = (i / segments) * 6;

            positions.push(c.x + n.x * p0[0], p0[1], c.y + n.z * p0[0]);
            uvs.push(uCoord, 0);

            positions.push(c.x + n.x * p1[0], p1[1], c.y + n.z * p1[0]);
            uvs.push(uCoord, 1);

            vertOffset += 2;
          }

          for (let i = 0; i < segments; i++) {
            const a = base + i * 2;
            const d = a + 1;
            const b = a + 2;
            const c = a + 3;
            indices.push(a, d, c, a, c, b);
          }
        }

        // Cap both ends cleanly using ShapeUtils triangulation
        const contour = profile.map(function (p) { return new THREE.Vector2(p[0], p[1]); });
        const capTris = THREE.ShapeUtils.triangulateShape(contour, []);

        const startBase = vertOffset;
        for (let j = 0; j < m; j++) {
          positions.push(
            pts[0].x + normals[0].x * profile[j][0],
            profile[j][1],
            pts[0].y + normals[0].z * profile[j][0]
          );
          uvs.push(profile[j][0] * 0.5, profile[j][1] * 0.5);
          vertOffset++;
        }
        for (let t = 0; t < capTris.length; t++) {
          indices.push(startBase + capTris[t][0], startBase + capTris[t][2], startBase + capTris[t][1]);
        }

        const endBase = vertOffset;
        for (let j = 0; j < m; j++) {
          positions.push(
            pts[segments].x + normals[segments].x * profile[j][0],
            profile[j][1],
            pts[segments].y + normals[segments].z * profile[j][0]
          );
          uvs.push(profile[j][0] * 0.5, profile[j][1] * 0.5);
          vertOffset++;
        }
        for (let t = 0; t < capTris.length; t++) {
          indices.push(endBase + capTris[t][0], endBase + capTris[t][1], endBase + capTris[t][2]);
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geom.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geom.setIndex(indices);
        geom.computeVertexNormals();
        return trackGeo(geom);
      }

      // Turned miniature classical baluster geometry (used for InstancedMesh)
      function createBalusterGeometry(height, radiusScale) {
        const h = height || 0.56;
        const r = radiusScale || 1.0;
        const pts = [
          new THREE.Vector2(0.048 * r, 0.00 * h),
          new THREE.Vector2(0.052 * r, 0.09 * h),
          new THREE.Vector2(0.030 * r, 0.17 * h),
          new THREE.Vector2(0.056 * r, 0.34 * h),
          new THREE.Vector2(0.052 * r, 0.48 * h),
          new THREE.Vector2(0.026 * r, 0.68 * h),

      // Terracotta pot holding lush layered greenery
      const sharedPotGeo = trackGeo(new THREE.LatheGeometry([

      function createTerracottaPlanter(scale) {
        const g = new THREE.Group();
        const pot = new THREE.Mesh(sharedPotGeo, matTerracotta);
        g.add(pot);

        const soil = new THREE.Mesh(sharedSoilGeo, matSoil);
        soil.position.y = 0.29;
        g.add(soil);

        const foliageMats = [matFoliageA, matFoliageB, matFoliageC];
        const offsets = [
          [0, 0.47, 0, 1.12],
          [0.11, 0.40, 0.06, 0.78],
          [-0.10, 0.42, 0.08, 0.82],
          [0.03, 0.41, -0.11, 0.76],
          [-0.08, 0.53, -0.04, 0.66],
          [0.06, 0.56, 0.04, 0.62]
        ];
        offsets.forEach(function (o, idx) {

          bush.rotation.set(idx * 0.8, idx * 1.3, 0);

      // Classical bronze lantern (hanging or standing post)
      const sharedLanternCageGeo = trackGeo(new THREE.CylinderGeometry(0.085, 0.06, 0.19, 6));

      const sharedLanternPostGeo = trackGeo(new THREE.CylinderGeometry(0.032, 0.055, 1.08, 8));

      function createLantern(isStanding) {
        const g = new THREE.Group();
        const bulbMat = makeStandardMat({
          color: 0xfff0cc,
          emissive: 0xffb347,
          emissiveIntensity: 0.12,
          roughness: 0.35,
          metalness: 0.05
        }, null, false, true);
        lampBulbMaterials.push(bulbMat);

        if (isStanding) {
          const post = new THREE.Mesh(sharedLanternPostGeo, matLanternMetal);
          post.position.y = 0.54;
          g.add(post);

          const base = new THREE.Mesh(trackGeo(new THREE.CylinderGeometry(0.09, 0.13, 0.12, 8)), matLanternMetal);
          base.position.y = 0.06;
          g.add(base);

          const glass = new THREE.Mesh(sharedLanternCageGeo, bulbMat);
          glass.position.y = 1.18;
          g.add(glass);

          const cap = new THREE.Mesh(sharedLanternCapGeo, matLanternMetal);
          cap.position.y = 1.32;
          g.add(cap);
        } else {
          const chain = new THREE.Mesh(trackGeo(new THREE.CylinderGeometry(0.012, 0.012, 0.24, 6)), matLanternMetal);
          chain.position.y = -0.12;
          g.add(chain);

          const cap = new THREE.Mesh(sharedLanternCapGeo, matLanternMetal);
          cap.position.y = -0.26;
          g.add(cap);

          const glass = new THREE.Mesh(sharedLanternCageGeo, bulbMat);
          glass.position.y = -0.39;
          g.add(glass);

          const tip = new THREE.Mesh(trackGeo(new THREE.ConeGeometry(0.05, 0.08, 6)), matLanternMetal);
          tip.rotation.x = Math.PI;
          tip.position.y = -0.52;

      }

      // Crouching snarling bronze lion / guardian beast

        const legGeo = trackGeo(new THREE.CylinderGeometry(0.055, 0.068, 0.36, 10));

      // Heroic sculpted Equestrian Statue (dynamic horse with raised foreleg + commanding rider)
      function buildEquestrianStatue(material) {
        const g = new THREE.Group();

        const plinth = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(1.18, 0.15, 2.08)), material);
        plinth.position.set(0, 0.075, 0.02);

        const horseGroup = new THREE.Group();
        horseGroup.position.set(0, 0.14, 0.0);

        // 1. Horse Torso (Lathe oriented horizontally along Z)
        const barrelPts = [
          new THREE.Vector2(0.01, -0.92),

          new THREE.Vector2(0.39, -0.58),

        [-0.19, 0.19].forEach(function (sx) {

          const croup = new THREE.Mesh(trackGeo(new THREE.SphereGeometry(0.25, 14, 12)), material);
          croup.scale.set(0.86, 1.14, 1.22);
          croup.position.set(sx, 1.39, -0.55);
          horseGroup.add(croup);
        });

        // 2. Arched Proud Neck & Sculpted Mane
        const neckPts = [

        neck.scale.set(0.76, 1.0, 1.14);
        neck.position.set(0, 1.46, 0.64);
        neck.rotation.x = 0.52;
        horseGroup.add(neck);

        const maneShape = new THREE.Shape();
        maneShape.moveTo(0, 0);
        maneShape.quadraticCurveTo(0.24, 0.38, 0.10, 0.92);
        maneShape.lineTo(-0.08, 0.88);
        maneShape.quadraticCurveTo(-0.02, 0.42, -0.10, 0.02);
        maneShape.closePath();
        const maneGeo = trackGeo(new THREE.ExtrudeGeometry(maneShape, {
          depth: 0.08,
          bevelEnabled: true,
          bevelThickness: 0.025,
          bevelSize: 0.02,
          bevelSegments: 2
        }));
        maneGeo.translate(0, 0, -0.04);
        maneGeo.rotateY(Math.PI * 0.5);
        const mane = new THREE.Mesh(maneGeo, material);
        mane.position.set(0, 1.62, 0.56);
        mane.rotation.x = 0.54;
        horseGroup.add(mane);

        // 3. Lifted Sculpted Horse Head
        const headGroup = new THREE.Group();
        headGroup.position.set(0, 2.34, 1.16);
        headGroup.rotation.x = 0.72;

        const cranium = new THREE.Mesh(trackGeo(new THREE.SphereGeometry(0.17, 14, 12)), material);
        cranium.scale.set(0.82, 1.0, 1.12);
        headGroup.add(cranium);

        const muzzlePts = [
          new THREE.Vector2(0.145, 0.0),
          new THREE.Vector2(0.115, 0.24),
          new THREE.Vector2(0.095, 0.46),
          new THREE.Vector2(0.075, 0.54),
          new THREE.Vector2(0.02, 0.57)
        ];
        const muzzle = new THREE.Mesh(trackGeo(new THREE.LatheGeometry(muzzlePts, 14)), material);
        muzzle.scale.set(0.84, 1.0, 1.05);
        muzzle.position.set(0, -0.04, 0.04);
        muzzle.rotation.x = Math.PI * 0.5;
        headGroup.add(muzzle);

        const hEarGeo = trackGeo(new THREE.ConeGeometry(0.036, 0.14, 8));
        [-0.075, 0.075].forEach(function (ex) {
          const ear = new THREE.Mesh(hEarGeo, material);
          ear.position.set(ex, 0.16, -0.04);
          ear.rotation.set(-0.35, 0, ex > 0 ? -0.18 : 0.18);
          headGroup.add(ear);
        });
        horseGroup.add(headGroup);

        // 4. Anatomical Articulated Horse Legs
        function addLimbSegment(parent, p1, p2, r1, r2) {
          const v1 = new THREE.Vector3(p1[0], p1[1], p1[2]);
          const v2 = new THREE.Vector3(p2[0], p2[1], p2[2]);
          const dir = new THREE.Vector3().subVectors(v2, v1);
          const len = dir.length();
          const cyl = new THREE.Mesh(trackGeo(new THREE.CylinderGeometry(r2, r1, len, 10)), material);
          cyl.position.copy(v1).addScaledVector(dir, 0.5);
          cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
          parent.add(cyl);

          const joint = new THREE.Mesh(trackGeo(new THREE.SphereGeometry(r2 * 1.06, 8, 8)), material);
          joint.position.copy(v2);
          parent.add(joint);
        }

        function addHoof(parent, pos, rotX) {
          const hoof = new THREE.Mesh(trackGeo(new THREE.CylinderGeometry(0.052, 0.072, 0.09, 10)), material);
          hoof.position.set(pos[0], pos[1], pos[2]);
          if (rotX) hoof.rotation.x = rotX;
          parent.add(hoof);
        }

        // Planted Front-Left leg

        addLimbSegment(horseGroup, [-0.21, 0.68, 0.58], [-0.21, 0.17, 0.61], 0.068, 0.050);

        addLimbSegment(horseGroup, [0.22, 1.02, 1.06], [0.22, 0.54, 0.90], 0.070, 0.050);
        addLimbSegment(horseGroup, [0.22, 0.54, 0.90], [0.22, 0.43, 0.80], 0.050, 0.052);
        addHoof(horseGroup, [0.22, 0.41, 0.78], 0.65);

        // Rear-Left leg
        addLimbSegment(horseGroup, [-0.21, 1.32, -0.56], [-0.22, 0.74, -0.78], 0.145, 0.078);
        addLimbSegment(horseGroup, [-0.22, 0.74, -0.78], [-0.22, 0.18, -0.74], 0.072, 0.050);
        addLimbSegment(horseGroup, [-0.22, 0.18, -0.74], [-0.22, 0.05, -0.68], 0.050, 0.052);
        addHoof(horseGroup, [-0.22, 0.045, -0.67], 0);

        // Rear-Right leg
        addLimbSegment(horseGroup, [0.21, 1.32, -0.52], [0.22, 0.75, -0.56], 0.145, 0.078);
        addLimbSegment(horseGroup, [0.22, 0.75, -0.56], [0.22, 0.18, -0.44], 0.072, 0.050);
        addLimbSegment(horseGroup, [0.22, 0.18, -0.44], [0.22, 0.05, -0.37], 0.050, 0.052);
        addHoof(horseGroup, [0.22, 0.045, -0.36], 0);

        // 5. Flowing Sculpted Tail
        const tailCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 1.48, -0.86),
          new THREE.Vector3(0.02, 1.42, -1.12),
          new THREE.Vector3(0.05, 1.04, -1.22),
          new THREE.Vector3(0.02, 0.62, -1.15),
          new THREE.Vector3(-0.02, 0.34, -1.24)
        ]);
        const tailMesh = new THREE.Mesh(trackGeo(new THREE.TubeGeometry(tailCurve, 20, 0.078, 10, false)), material);
        horseGroup.add(tailMesh);

        // 6. Saddle & Draped Saddlecloth
        const cloth = new THREE.Mesh(trackGeo(new THREE.CylinderGeometry(0.41, 0.43, 0.68, 16, 1, true, -1.35, 2.7)), material);
        cloth.rotation.z = Math.PI * 0.5;
        cloth.rotation.y = Math.PI * 0.5;
        cloth.position.set(0, 1.41, 0.02);
        horseGroup.add(cloth);

        const saddle = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.56, 0.14, 0.54)), material);
        saddle.position.set(0, 1.75, 0.02);
        horseGroup.add(saddle);

        // 7. Heroic Rider with Commanding Extended Arm & Billowing Cloak
        const riderGroup = new THREE.Group();
        riderGroup.position.set(0, 1.78, 0.04);
        horseGroup.add(riderGroup);

        const torsoPts = [
          new THREE.Vector2(0.18, 0.0),
          new THREE.Vector2(0.16, 0.20),
          new THREE.Vector2(0.15, 0.38),
          new THREE.Vector2(0.21, 0.64),

          addLimbSegment(riderGroup, [side * 0.18, 0.08, 0.06], [side * 0.34, -0.26, 0.16], 0.092, 0.072);
          addLimbSegment(riderGroup, [side * 0.34, -0.26, 0.16], [side * 0.35, -0.68, 0.05], 0.070, 0.055);
          const boot = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.09, 0.07, 0.19)), material);

        hatShape.quadraticCurveTo(0.0, 0.24, 0.24, 0.0);

        const hatGeo = trackGeo(new THREE.ExtrudeGeometry(hatShape, {
          depth: 0.14,

        }));
        hatGeo.translate(0, 0, -0.07);
        const hat = new THREE.Mesh(hatGeo, material);
        hat.position.set(0, 1.07, 0.02);
        hat.rotation.y = Math.PI * 0.5;

        // Left arm holding reins
        addLimbSegment(riderGroup, [-0.22, 0.72, 0.03], [-0.26, 0.44, 0.22], 0.072, 0.056);
        addLimbSegment(riderGroup, [-0.26, 0.44, 0.22], [-0.14, 0.34, 0.46], 0.055, 0.044);

        // Right arm extended forward in a commanding gesture
        addLimbSegment(riderGroup, [0.22, 0.72, 0.04], [0.28, 0.80, 0.44], 0.075, 0.058);
        addLimbSegment(riderGroup, [0.28, 0.80, 0.44], [0.24, 0.90, 0.82], 0.056, 0.042);

        const baton = new THREE.Mesh(trackGeo(new THREE.CylinderGeometry(0.018, 0.022, 0.36, 8)), material);
        baton.position.set(0.24, 0.95, 0.96);
        baton.rotation.x = 1.25;
        riderGroup.add(baton);

        [-0.08, 0.08].forEach(function (rx) {
          const reinCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(rx, 2.02, 1.50),
            new THREE.Vector3(rx * 1.4, 1.98, 0.95),
            new THREE.Vector3(-0.14, 2.10, 0.48)
          ]);
          const rein = new THREE.Mesh(trackGeo(new THREE.TubeGeometry(reinCurve, 12, 0.012, 5, false)), material);
          horseGroup.add(rein);
        });

        const capeShape = new THREE.Shape();
        capeShape.moveTo(0, 0.76);
        capeShape.quadraticCurveTo(-0.32, 0.54, -0.58, 0.16);
        capeShape.quadraticCurveTo(-0.74, -0.16, -0.46, -0.34);
        capeShape.quadraticCurveTo(-0.22, -0.10, -0.06, 0.24);
        capeShape.closePath();
        const capeGeo = trackGeo(new THREE.ExtrudeGeometry(capeShape, {

          bevelEnabled: true,
          bevelThickness: 0.03,
          bevelSize: 0.025,
          bevelSegments: 2
        }));
        capeGeo.translate(0, 0, -0.22);
        capeGeo.rotateY(Math.PI * 0.5);
        const cape = new THREE.Mesh(capeGeo, material);

        cape.rotation.y = 0.16;
        riderGroup.add(cape);

        enableShadows(g, true, true);
        return g;
      }
