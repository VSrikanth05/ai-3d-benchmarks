      /* =========================================================================
         11. CURVED COLONNADE DEFINITION & ASYMMETRIC PAVILIONS
         ========================================================================= */

      // 4 Pavilion positions at varying distances from monument center (0, -0.3).
      // Right arm curves further forward & inward in a tighter dramatic arc!
      const PAVILION_NODES = [
        { x: -8.35, z:  3.05 }, // P0: Front-Left End (r ≈ 9.00)
        { x: -7.15, z: -4.85 }, // P1: Back-Left Corner (r ≈ 8.48)
        { x:  6.75, z: -5.05 }, // P2: Back-Right Corner (r ≈ 8.24)
        { x:  6.05, z:  3.95 }  // P3: Front-Right End — tighter inward hook! (r ≈ 7.39)
      ];

      const COLONNADE_CURVES = [
        // Left arm (graceful sweeping arc)
        new THREE.CubicBezierCurve(
          new THREE.Vector2(PAVILION_NODES[0].x, PAVILION_NODES[0].z),
          new THREE.Vector2(-9.35,  0.45),
          new THREE.Vector2(-9.05, -2.55),
          new THREE.Vector2(PAVILION_NODES[1].x, PAVILION_NODES[1].z)
        ),
        // Grand semi-circular back arc
        new THREE.CubicBezierCurve(
          new THREE.Vector2(PAVILION_NODES[1].x, PAVILION_NODES[1].z),
          new THREE.Vector2(-3.35, -7.85),
          new THREE.Vector2( 3.15, -7.85),
          new THREE.Vector2(PAVILION_NODES[2].x, PAVILION_NODES[2].z)
        ),
        // Right arm (curving forward & hooking inward in a tighter asymmetric arc)
        new THREE.CubicBezierCurve(
          new THREE.Vector2(PAVILION_NODES[2].x, PAVILION_NODES[2].z),
          new THREE.Vector2( 8.95, -2.15),
          new THREE.Vector2( 8.50,  2.20),
          new THREE.Vector2(PAVILION_NODES[3].x, PAVILION_NODES[3].z)
        )
      ];

      const PLAZA_Y = 0.88;
      const colonnadeBalusterTransforms = [];
      const plazaFenceBalusterTransforms = [];

      function buildColonnadeAndPavilions() {
        const plinthProfile = [
          [-0.95, PLAZA_Y],
          [ 0.95, PLAZA_Y],
          [ 0.95, PLAZA_Y + 0.16],
          [ 0.84, PLAZA_Y + 0.16],
          [ 0.84, PLAZA_Y + 0.34],
          [ 0.76, PLAZA_Y + 0.42],
          [-0.76, PLAZA_Y + 0.42],
          [-0.84, PLAZA_Y + 0.34],
          [-0.84, PLAZA_Y + 0.16],
          [-0.95, PLAZA_Y + 0.16]
        ];

        const entabY = PLAZA_Y + 3.45;
        const entabProfile = [
          [-0.74, entabY],
          [ 0.74, entabY],
          [ 0.74, entabY + 0.24],
          [ 0.82, entabY + 0.30],
          [ 0.82, entabY + 0.56],
          [ 1.02, entabY + 0.66],
          [ 1.02, entabY + 0.80],
          [-1.02, entabY + 0.80],
          [-1.02, entabY + 0.66],
          [-0.82, entabY + 0.56],
          [-0.82, entabY + 0.30],
          [-0.74, entabY + 0.24]
        ];

        const railBaseY = entabY + 0.80;
        const curbOuter = [
          [0.54, railBaseY],
          [0.86, railBaseY],
          [0.86, railBaseY + 0.12],
          [0.54, railBaseY + 0.12]
        ];
        const railOuter = [
          [0.52, railBaseY + 0.62],
          [0.88, railBaseY + 0.62],
          [0.92, railBaseY + 0.74],
          [0.48, railBaseY + 0.74]
        ];
        const curbInner = [
          [-0.86, railBaseY],
          [-0.54, railBaseY],
          [-0.54, railBaseY + 0.12],
          [-0.86, railBaseY + 0.12]
        ];
        const railInner = [
          [-0.88, railBaseY + 0.62],
          [-0.52, railBaseY + 0.62],
          [-0.48, railBaseY + 0.74],
          [-0.92, railBaseY + 0.74]
        ];

        // Interior structural roof vault beam (revealed by Cross-Section mode)
        const vaultCoreProfile = [
          [-0.52, entabY + 0.12],
          [ 0.52, entabY + 0.12],
          [ 0.42, entabY + 0.44],
          [ 0.00, entabY + 0.56],
          [-0.42, entabY + 0.44]
        ];

        const columnPositions = [];
        const pierPositions = [];
        const lanternPositions = [];

        COLONNADE_CURVES.forEach(function (curve, segIdx) {
          const segSteps = segIdx === 1 ? 42 : 28;
          const curveLen = curve.getLength();
          // Embed cleanly into pavilion side walls while leaving pavilion front statue niches completely unobstructed
          const sweepTrim = 0.82 / curveLen;

          const plinthMesh = new THREE.Mesh(createSweptProfileGeometry(curve, plinthProfile, segSteps, sweepTrim, 1 - sweepTrim), matColonnadeSand);
          const entabMesh  = new THREE.Mesh(createSweptProfileGeometry(curve, entabProfile, segSteps, sweepTrim, 1 - sweepTrim), matColonnadeStone);
          const curbOMesh  = new THREE.Mesh(createSweptProfileGeometry(curve, curbOuter, segSteps, sweepTrim, 1 - sweepTrim), matColonnadeSand);
          const railOMesh  = new THREE.Mesh(createSweptProfileGeometry(curve, railOuter, segSteps, sweepTrim, 1 - sweepTrim), matColonnadeStone);
          const curbIMesh  = new THREE.Mesh(createSweptProfileGeometry(curve, curbInner, segSteps, sweepTrim, 1 - sweepTrim), matColonnadeSand);
          const railIMesh  = new THREE.Mesh(createSweptProfileGeometry(curve, railInner, segSteps, sweepTrim, 1 - sweepTrim), matColonnadeStone);
          const vaultMesh  = new THREE.Mesh(createSweptProfileGeometry(curve, vaultCoreProfile, segSteps, sweepTrim, 1 - sweepTrim), matInteriorStone);

          layerColonnade.add(plinthMesh, entabMesh, curbOMesh, railOMesh, curbIMesh, railIMesh, vaultMesh);

          const numBays = segIdx === 1 ? 11 : 7;
          const trim = 1.24 / curveLen;
          for (let b = 0; b <= numBays; b++) {
            const t = trim + (b / numBays) * (1 - 2 * trim);
            const pt = curve.getPointAt(t);
            const tan = curve.getTangentAt(t).normalize();
            const nx = tan.y;
            const nz = -tan.x;
            const angle = Math.atan2(tan.x, tan.y);

            columnPositions.push({ x: pt.x + nx * 0.52, z: pt.y + nz * 0.52, rotY: angle });
            columnPositions.push({ x: pt.x - nx * 0.52, z: pt.y - nz * 0.52, rotY: angle });

            if (b % 2 === 0) {
              pierPositions.push({ x: pt.x + nx * 0.70, z: pt.y + nz * 0.70, rotY: angle });
              pierPositions.push({ x: pt.x - nx * 0.70, z: pt.y - nz * 0.70, rotY: angle });
            }

            if (b < numBays && b % 2 === 1) {
              const midT = trim + ((b + 0.5) / numBays) * (1 - 2 * trim);
              const mpt = curve.getPointAt(midT);
              lanternPositions.push({ x: mpt.x, y: entabY, z: mpt.y });
            }
          }

          // Hundreds of tiny turned balusters along both outer & inner roofline balustrades
          const balCount = Math.floor((curveLen - 2.3) / 0.24);
          for (let k = 0; k <= balCount; k++) {
            const t = trim + (k / balCount) * (1 - 2 * trim);
            const pt = curve.getPointAt(t);
            const tan = curve.getTangentAt(t).normalize();
            const nx = tan.y;
            const nz = -tan.x;
            colonnadeBalusterTransforms.push({ x: pt.x + nx * 0.70, y: railBaseY + 0.11, z: pt.y + nz * 0.70 });
            colonnadeBalusterTransforms.push({ x: pt.x - nx * 0.70, y: railBaseY + 0.11, z: pt.y - nz * 0.70 });
          }
        });

        // InstancedMesh for Colonnade Columns (shafts, bases, simple capitals)
        const colCount = columnPositions.length;
        const colShaftGeo = trackGeo(new THREE.CylinderGeometry(0.125, 0.155, 2.74, 14));
        const colBaseGeo  = trackGeo(new THREE.CylinderGeometry(0.18, 0.21, 0.16, 12));
        const colCapGeo   = trackGeo(new THREE.CylinderGeometry(0.22, 0.13, 0.17, 12));
        const colAbacGeo  = trackGeo(new THREE.BoxGeometry(0.42, 0.08, 0.42));

        const instShafts = new THREE.InstancedMesh(colShaftGeo, matColonnadeStone, colCount);
        const instBases  = new THREE.InstancedMesh(colBaseGeo, matColonnadeSand, colCount);
        const instCaps   = new THREE.InstancedMesh(colCapGeo, matColonnadeStone, colCount);
        const instAbacs  = new THREE.InstancedMesh(colAbacGeo, matColonnadeSand, colCount);

        const dummy = new THREE.Object3D();
        columnPositions.forEach(function (cp, idx) {
          dummy.rotation.set(0, cp.rotY, 0);
          dummy.scale.set(1, 1, 1);

          dummy.position.set(cp.x, PLAZA_Y + 0.50, cp.z);
          dummy.updateMatrix();
          instBases.setMatrixAt(idx, dummy.matrix);

          dummy.position.set(cp.x, PLAZA_Y + 0.42 + 1.52, cp.z);
          dummy.updateMatrix();
          instShafts.setMatrixAt(idx, dummy.matrix);

          dummy.position.set(cp.x, PLAZA_Y + 3.29, cp.z);
          dummy.updateMatrix();
          instCaps.setMatrixAt(idx, dummy.matrix);

          dummy.position.set(cp.x, PLAZA_Y + 3.41, cp.z);
          dummy.updateMatrix();
          instAbacs.setMatrixAt(idx, dummy.matrix);
        });
        [instShafts, instBases, instCaps, instAbacs].forEach(function (im) {
          im.instanceMatrix.needsUpdate = true;
          im.castShadow = true;
          im.receiveShadow = true;
          layerColonnade.add(im);
        });

        // Rooftop balustrade piers & small stone urns (InstancedMesh)
        const pierGeo = trackGeo(new THREE.BoxGeometry(0.34, 0.72, 0.34));
        const instPiers = new THREE.InstancedMesh(pierGeo, matColonnadeSand, pierPositions.length);
        const instUrns  = new THREE.InstancedMesh(sharedUrnGeo, matColonnadeStone, pierPositions.length);
        pierPositions.forEach(function (pp, idx) {
          dummy.rotation.set(0, pp.rotY, 0);
          dummy.scale.set(1, 1, 1);
          dummy.position.set(pp.x, railBaseY + 0.36, pp.z);
          dummy.updateMatrix();
          instPiers.setMatrixAt(idx, dummy.matrix);

          dummy.position.set(pp.x, railBaseY + 0.74, pp.z);
          dummy.scale.set(0.62, 0.62, 0.62);
          dummy.updateMatrix();
          instUrns.setMatrixAt(idx, dummy.matrix);
        });
        instPiers.instanceMatrix.needsUpdate = true;
        instUrns.instanceMatrix.needsUpdate = true;
        instPiers.castShadow = instPiers.receiveShadow = true;
        instUrns.castShadow = instUrns.receiveShadow = true;
        layerColonnade.add(instPiers, instUrns);

        // InstancedMesh for Colonnade Turned Balusters
        const balGeo = createBalusterGeometry(0.52, 0.92);
        const instColBalusters = new THREE.InstancedMesh(balGeo, matColonnadeStone, colonnadeBalusterTransforms.length);
        colonnadeBalusterTransforms.forEach(function (bt, idx) {
          dummy.position.set(bt.x, bt.y, bt.z);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          instColBalusters.setMatrixAt(idx, dummy.matrix);
        });
        instColBalusters.instanceMatrix.needsUpdate = true;
        instColBalusters.castShadow = true;
        instColBalusters.receiveShadow = true;
        layerColonnade.add(instColBalusters);

        // Hanging warm bronze lanterns + night point lights along colonnade
        lanternPositions.forEach(function (lp, idx) {
          const lant = createLantern(false);
          lant.position.set(lp.x, lp.y, lp.z);
          layerColonnade.add(lant);

          if (idx % 2 === 0 && nightPointLights.length < 7) {
            const ptLight = new THREE.PointLight(0xffb454, 0.0, 9.5, 1.8);
            ptLight.position.set(lp.x, lp.y - 0.55, lp.z);
            layerColonnade.add(ptLight);
            nightPointLights.push(ptLight);
          }
        });

        enableShadows(layerColonnade, true, true);
        tagSelectable(layerColonnade, "colonnade");
        registerAnchor("colonnade", layerColonnade, 4.8, PLAZA_Y + 4.3, -5.8);

        // Build 4 Square Corner & End Pavilions
        PAVILION_NODES.forEach(function (node, idx) {
          const pav = buildSquarePavilion(idx);
          pav.position.set(node.x, PLAZA_Y, node.z);
          const angleToCenter = Math.atan2(-node.x, -0.3 - node.z);
          pav.rotation.y = angleToCenter;
          pav.userData.basePos = new THREE.Vector3(node.x, PLAZA_Y, node.z);
          layerPavilions.add(pav);
        });

        enableShadows(layerPavilions, true, true);
        tagSelectable(layerPavilions, "pavilions");
        registerAnchor("pavilions", layerPavilions, PAVILION_NODES[3].x, PLAZA_Y + 5.8, PAVILION_NODES[3].z);
      }

      // Square pavilion with paired pilasters, recessed statue niche, projecting cornice & pyramidal domed roof
      function buildSquarePavilion(variantIdx) {
        const g = new THREE.Group();

        const base1 = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(2.58, 0.24, 2.58)), matPavilionSand);
        base1.position.y = 0.12;
        const base2 = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(2.38, 0.28, 2.38)), matPavilionStone);
        base2.position.y = 0.38;
        g.add(base1, base2);

        const backWall = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(2.12, 3.22, 1.56)), matPavilionStone);
        backWall.position.set(0, 2.13, -0.28);
        g.add(backWall);

        [-0.78, 0.78].forEach(function (px) {
          const cheek = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.56, 3.22, 0.56)), matPavilionStone);
          cheek.position.set(px, 2.13, 0.78);

        });

        const lintel = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(1.04, 0.68, 0.56)), matPavilionStone);

        const archRing = new THREE.Mesh(trackGeo(new THREE.TorusGeometry(0.46, 0.065, 8, 16, Math.PI)), matPavilionSand);
        archRing.position.set(0, 2.66, 1.03);

        const statPlinth = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.68, 0.44, 0.44)), matPavilionSand);
        statPlinth.position.set(0, 0.74, 0.74);

        const nicheFig = createAllegoricalFigure(variantIdx, matPavilionPatina);
        nicheFig.position.set(0, 0.96, 0.74);

        g.add(nicheFig);

        const pilGeo = trackGeo(new THREE.BoxGeometry(0.19, 3.04, 0.16));
        const pilCapGeo = trackGeo(new THREE.BoxGeometry(0.26, 0.14, 0.22));
        const corners = [
          [-0.86, 1.06, 0], [-0.58, 1.06, 0], [0.58, 1.06, 0], [0.86, 1.06, 0],
          [-0.86, -1.06, 0], [0.86, -1.06, 0],
          [-1.06, 0.82, Math.PI * 0.5], [-1.06, -0.82, Math.PI * 0.5],
          [ 1.06, 0.82, Math.PI * 0.5], [ 1.06, -0.82, Math.PI * 0.5]
        ];
        corners.forEach(function (c) {
          const pil = new THREE.Mesh(pilGeo, matPavilionSand);
          pil.position.set(c[0], 2.08, c[1]);
          pil.rotation.y = c[2];
          g.add(pil);

          const cap = new THREE.Mesh(pilCapGeo, matPavilionStone);
          cap.position.set(c[0], 3.63, c[1]);
          cap.rotation.y = c[2];
          g.add(cap);
        });

        const frieze = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(2.38, 0.32, 2.38)), matPavilionStone);
        frieze.position.y = 3.90;
        const cornice = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(2.74, 0.22, 2.74)), matPavilionStone);
        cornice.position.y = 4.17;
        const attic = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(2.26, 0.42, 2.26)), matPavilionSand);
        attic.position.y = 4.49;
        const atticCap = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(2.44, 0.12, 2.44)), matPavilionStone);
        atticCap.position.y = 4.76;
        g.add(frieze, cornice, attic, atticCap);

        const domePts = [
          new THREE.Vector2(1.42, 0.0),
          new THREE.Vector2(1.30, 0.38),
          new THREE.Vector2(1.02, 0.82),
          new THREE.Vector2(0.62, 1.18),
          new THREE.Vector2(0.24, 1.38),
          new THREE.Vector2(0.06, 1.48)
        ];
        const roofGeo = trackGeo(new THREE.LatheGeometry(domePts, 4));
        roofGeo.rotateY(Math.PI * 0.25);
        const roof = new THREE.Mesh(roofGeo, matPavilionRoof);
        roof.position.y = 4.82;
        g.add(roof);

        const finialBase = new THREE.Mesh(trackGeo(new THREE.CylinderGeometry(0.11, 0.15, 0.18, 8)), matPavilionPatina);
        finialBase.position.y = 6.32;
        const finialOrb = new THREE.Mesh(trackGeo(new THREE.SphereGeometry(0.10, 10, 10)), matPavilionPatina);
        finialOrb.position.y = 6.49;
        const finialSpire = new THREE.Mesh(trackGeo(new THREE.ConeGeometry(0.055, 0.34, 8)), matPavilionPatina);
        finialSpire.position.y = 6.72;
        g.add(finialBase, finialOrb, finialSpire);

        return g;
      }

      /* =========================================================================
         12. ELEVATED PLAZA, INSTANCED TILES, FRONT STAIRS & BRONZE LIONS
         ========================================================================= */

      function buildPlazaAndStairs() {
        // Build contoured raised plaza using (x, -z) in Shape so rotateX(-PI/2) yields exact +Y upward normals!
        const plazaShape = new THREE.Shape();
        const frontZ = 5.20;
        const leftOuterX = -9.65;
        const rightOuterX = 7.48;

        plazaShape.moveTo(leftOuterX, -frontZ);
        plazaShape.lineTo(leftOuterX, -PAVILION_NODES[0].z);

        // Trace outer contour of the 3 colonnade curves with generous pavilion margin
        COLONNADE_CURVES.forEach(function (curve) {
          const pts = curve.getSpacedPoints(18);
          for (let i = 0; i < pts.length; i++) {
            const p = pts[i];
            const prev = pts[Math.max(0, i - 1)];
            const next = pts[Math.min(pts.length - 1, i + 1)];
            const tx = next.x - prev.x;
            const tz = next.y - prev.y;
            const len = Math.hypot(tx, tz) || 1;
            const nx = tz / len;
            const nz = -tx / len;
            plazaShape.lineTo(p.x + nx * 1.48, -(p.y + nz * 1.48));
          }
        });

        plazaShape.lineTo(rightOuterX, -PAVILION_NODES[3].z);
        plazaShape.lineTo(rightOuterX, -frontZ);
        plazaShape.closePath();

        const plazaGeo = trackGeo(new THREE.ExtrudeGeometry(plazaShape, {
          depth: PLAZA_Y,
          bevelEnabled: true,
          bevelThickness: 0.05,
          bevelSize: 0.06,
          bevelSegments: 2
        }));
        plazaGeo.rotateX(-Math.PI * 0.5);
        plazaGeo.computeBoundingBox();
        plazaGeo.translate(0, PLAZA_Y - plazaGeo.boundingBox.max.y, 0);

        const plazaBaseMesh = new THREE.Mesh(plazaGeo, matPlazaStone);
        plazaBaseMesh.castShadow = true;
        plazaBaseMesh.receiveShadow = true;
        layerPlaza.add(plazaBaseMesh);

        // Upward-facing patterned paving surface centered cleanly around monument (0, -0.3)
        const topGeo = trackGeo(new THREE.ShapeGeometry(plazaShape, 18));
        topGeo.rotateX(-Math.PI * 0.5);
        const posAttr = topGeo.attributes.position;
        const uvArr = new Float32Array(posAttr.count * 2);
        for (let i = 0; i < posAttr.count; i++) {
          const vx = posAttr.getX(i);
          const vz = posAttr.getZ(i);
          uvArr[i * 2]     = 0.5 + vx / 21.0;
          uvArr[i * 2 + 1] = 0.52 - (vz + 0.3) / 18.0;
        }
        topGeo.setAttribute("uv", new THREE.BufferAttribute(uvArr, 2));
        const plazaSurface = new THREE.Mesh(topGeo, matPlazaFloor);
        plazaSurface.position.y = PLAZA_Y + 0.008;
        plazaSurface.receiveShadow = true;
        layerPlaza.add(plazaSurface);

        // Instanced 3D beveled stone tiles in concentric rings & checkerboard front apron
        const tileSpecs = [];
        const ringRadii = [4.68, 5.42, 6.22];
        const tileColors = [
          new THREE.Color(0xefe8d9),
          new THREE.Color(0xdfd3be),
          new THREE.Color(0xcfc9bd)
        ];
        ringRadii.forEach(function (rad, rIdx) {
          const count = Math.floor((2 * Math.PI * rad) / 0.62);
          for (let i = 0; i < count; i++) {
            const ang = (i / count) * Math.PI * 2;
            const tx = Math.cos(ang) * rad;
            const tz = -0.3 + Math.sin(ang) * rad;
            if (tz < 4.75 && tz > -6.1 && tx > -7.3 && tx < 6.4) {
              tileSpecs.push({ x: tx, z: tz, rotY: -ang, cIdx: (i + rIdx) % 3, sx: 0.44, sz: 0.52 });
            }
          }
        });
        for (let gx = -5; gx <= 4; gx++) {
          for (let gz = 0; gz < 3; gz++) {
            const tx = gx * 0.68 + 0.34;
            const tz = 3.15 + gz * 0.64;
            if (Math.hypot(tx, tz + 0.3) > 4.4) {
              tileSpecs.push({ x: tx, z: tz, rotY: 0, cIdx: (Math.abs(gx) + gz) % 3, sx: 0.60, sz: 0.56 });
            }
          }
        }

        const tileGeo = trackGeo(new THREE.BoxGeometry(1, 0.024, 1));
        const instTiles = new THREE.InstancedMesh(tileGeo, matPlazaTileInstanced, tileSpecs.length);
        const dummy = new THREE.Object3D();
        tileSpecs.forEach(function (ts, idx) {
          dummy.position.set(ts.x, PLAZA_Y + 0.015, ts.z);
          dummy.rotation.set(0, ts.rotY, 0);
          dummy.scale.set(ts.sx, 1, ts.sz);
          dummy.updateMatrix();
          instTiles.setMatrixAt(idx, dummy.matrix);
          instTiles.setColorAt(idx, tileColors[ts.cIdx]);
        });
        instTiles.instanceMatrix.needsUpdate = true;
        if (instTiles.instanceColor) instTiles.instanceColor.needsUpdate = true;
        instTiles.receiveShadow = true;
        layerPlaza.add(instTiles);

        // Low front-edge balustrade fence with square posts, top rail & instanced balusters
        function addFenceRun(x1, z1, x2, z2) {
          const dx = x2 - x1;
          const dz = z2 - z1;
          const len = Math.hypot(dx, dz);
          const ang = Math.atan2(dx, dz);
          const mx = (x1 + x2) * 0.5;
          const mz = (z1 + z2) * 0.5;

          const curb = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.24, 0.14, len)), matPlazaStone);
          curb.position.set(mx, PLAZA_Y + 0.07, mz);
          curb.rotation.y = ang;
          layerPlaza.add(curb);

          const rail = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.28, 0.11, len)), matPlazaStone);
          rail.position.set(mx, PLAZA_Y + 0.66, mz);
          rail.rotation.y = ang;
          layerPlaza.add(rail);

          [[x1, z1], [x2, z2]].forEach(function (pt) {
            const post = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.36, 0.78, 0.36)), matPlazaStone);
            post.position.set(pt[0], PLAZA_Y + 0.39, pt[1]);
            layerPlaza.add(post);

            const cap = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.42, 0.08, 0.42)), matPlazaStone);
            cap.position.set(pt[0], PLAZA_Y + 0.81, pt[1]);
            layerPlaza.add(cap);
          });

          const bCount = Math.max(2, Math.floor((len - 0.55) / 0.24));
          for (let i = 1; i < bCount; i++) {
            const f = i / bCount;
            plazaFenceBalusterTransforms.push({
              x: x1 + dx * f,
              y: PLAZA_Y + 0.13,
              z: z1 + dz * f
            });
          }
        }

        addFenceRun(-9.35, 5.10, -3.25, 5.10);
        addFenceRun(-9.35, 5.10, -9.35, 3.65);
        addFenceRun( 3.25, 5.10,  7.18, 5.10);
        addFenceRun( 7.18, 5.10,  7.18, 4.15);

        [[-9.35, 5.10], [7.18, 5.10]].forEach(function (up) {
          const urn = new THREE.Mesh(sharedUrnGeo, matPlazaStone);
          urn.position.set(up[0], PLAZA_Y + 0.84, up[1]);
          urn.scale.setScalar(0.85);
          layerPlaza.add(urn);
        });

        [[-6.15, 5.10], [5.15, 5.10]].forEach(function (lp) {
          const postLamp = createLantern(true);
          postLamp.position.set(lp[0], PLAZA_Y + 0.74, lp[1]);
          postLamp.scale.setScalar(0.95);
          layerPlaza.add(postLamp);

          const pl = new THREE.PointLight(0xffba5a, 0.0, 8.0, 1.8);
          pl.position.set(lp[0], PLAZA_Y + 1.95, lp[1]);
          layerPlaza.add(pl);
          nightPointLights.push(pl);
        });

        // Instanced balusters for front balustrade fence
        const fenceBalGeo = createBalusterGeometry(0.50, 0.90);
        const instFenceBal = new THREE.InstancedMesh(fenceBalGeo, matPlazaStone, plazaFenceBalusterTransforms.length);
        plazaFenceBalusterTransforms.forEach(function (bt, idx) {
          dummy.position.set(bt.x, bt.y, bt.z);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          instFenceBal.setMatrixAt(idx, dummy.matrix);
        });
        instFenceBal.instanceMatrix.needsUpdate = true;
        instFenceBal.castShadow = true;
        instFenceBal.receiveShadow = true;
        layerPlaza.add(instFenceBal);

        enableShadows(layerPlaza, true, true);
        tagSelectable(layerPlaza, "plaza");
        registerAnchor("plaza", layerPlaza, -4.6, PLAZA_Y + 0.25, 3.2);

        // --- WIDE SHALLOW FRONT STAIRS, 4 BRONZE LIONS & TERRACOTTA PLANTERS ---
        const stairsGroup = new THREE.Group();
        layerPlaza.add(stairsGroup);

        const numSteps = 7;
        const stairWidth = 5.4;
        const stairStartZ = 5.20;
        const stepDepth = 0.34;
        const stepHeight = PLAZA_Y / numSteps;

        for (let s = 0; s < numSteps; s++) {
          const d = (numSteps - s) * stepDepth;
          const h = stepHeight;
          const stepMesh = new THREE.Mesh(
            trackGeo(new THREE.BoxGeometry(stairWidth, h, d)),
            s % 2 === 0 ? matStairsStone : matStairsSand
          );
          stepMesh.position.set(0, s * stepHeight + h * 0.5, stairStartZ + d * 0.5);
          stairsGroup.add(stepMesh);

          const nosing = new THREE.Mesh(
            trackGeo(new THREE.BoxGeometry(stairWidth + 0.04, 0.032, 0.06)),
            matStairsStone
          );
          nosing.position.set(0, (s + 1) * stepHeight - 0.016, stairStartZ + d + 0.015);
          stairsGroup.add(nosing);
        }

        const lowerLanding = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(9.6, 0.07, 2.45)), matStairsSand);
        lowerLanding.position.set(0, 0.035, stairStartZ + numSteps * stepDepth + 0.72);
        stairsGroup.add(lowerLanding);

        [-3.02, 3.02].forEach(function (cx) {
          const cheek = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.68, PLAZA_Y + 0.14, 2.38)), matStairsStone);
          cheek.position.set(cx, (PLAZA_Y + 0.14) * 0.5, stairStartZ + 1.15);
          stairsGroup.add(cheek);
        });

        const lionSpots = [
          { x: -3.02, y: 0.0,  z: 5.28, pedH: 1.56, mirror: false },
          { x:  3.02, y: 0.0,  z: 5.28, pedH: 1.56, mirror: true  },
          { x: -3.48, y: 0.04, z: 7.75, pedH: 0.88, mirror: false },
          { x:  3.48, y: 0.04, z: 7.75, pedH: 0.88, mirror: true  }
        ];

        lionSpots.forEach(function (ls) {
          const pGroup = new THREE.Group();
          pGroup.position.set(ls.x, ls.y, ls.z);

          const pBase = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(1.06, 0.18, 1.38)), matStairsSand);
          pBase.position.y = 0.09;
          const pShaft = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.88, ls.pedH - 0.34, 1.20)), matStairsStone);
          pShaft.position.y = 0.18 + (ls.pedH - 0.34) * 0.5;
          const pCap = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(1.02, 0.16, 1.34)), matStairsStone);
          pCap.position.y = ls.pedH - 0.08;
          pGroup.add(pBase, pShaft, pCap);

          const lion = createBronzeLion(matLionBronze, ls.mirror);
          lion.position.set(0, ls.pedH, 0.04);
          lion.scale.setScalar(0.96);
          pGroup.add(lion);

          stairsGroup.add(pGroup);
        });

        const planterSpots = [
          [-4.22, 0.04, 7.75, 1.15],
          [ 4.22, 0.04, 7.75, 1.15],
          [-2.38, PLAZA_Y, 5.02, 0.92],
          [ 2.38, PLAZA_Y, 5.02, 0.92],
          [-3.75, PLAZA_Y, 2.05, 1.05],
          [ 3.75, PLAZA_Y, 2.05, 1.05],
          [-4.25, PLAZA_Y, -1.85, 1.0],
          [ 4.25, PLAZA_Y, -1.85, 1.0]
        ];
        planterSpots.forEach(function (ps) {
          const pot = createTerracottaPlanter(ps[3]);
          pot.position.set(ps[0], ps[1], ps[2]);
          stairsGroup.add(pot);
        });

        enableShadows(stairsGroup, true, true);
        tagSelectable(stairsGroup, "stairs");
        registerAnchor("stairs", stairsGroup, 2.95, 1.85, 6.45);
      }

      /* =========================================================================
         13. CENTRAL MEMORIAL: OCTAGONAL BASE, PEDESTAL, DOME & EQUESTRIAN STATUE
         ========================================================================= */

      function buildCentralMemorial() {
        const cx = 0.0;
        const cz = -0.3;

        // --- LAYER A: WIDE STEPPED OCTAGONAL BASE + BROAD FRONT STAIRS ---
        layerBase.position.set(cx, PLAZA_Y, cz);

        const octTiers = [
          { r: 4.35, h: 0.24, y: 0.00, sand: true },
          { r: 3.96, h: 0.24, y: 0.24, sand: false },
          { r: 3.58, h: 0.24, y: 0.48, sand: true },
          { r: 3.22, h: 0.34, y: 0.72, sand: false }
        ];
        octTiers.forEach(function (t) {
          const oct = new THREE.Mesh(
            trackGeo(new THREE.CylinderGeometry(t.r, t.r + 0.06, t.h, 8)),
            t.sand ? matPedestalSand : matPedestalStone
          );
          oct.rotation.y = Math.PI / 8;
          oct.position.y = t.y + t.h * 0.5;
          layerBase.add(oct);
        });

        const mStepCount = 5;
        for (let i = 0; i < mStepCount; i++) {
          const w = 2.75 + (mStepCount - i) * 0.14;
          const d = 0.34 * (mStepCount - i);
          const h = 1.06 / mStepCount;
          const st = new THREE.Mesh(
            trackGeo(new THREE.BoxGeometry(w, h, d)),
            i % 2 === 0 ? matPedestalStone : matPedestalSand
          );
          st.position.set(0, i * h + h * 0.5, 3.05 + d * 0.5);
          layerBase.add(st);
        }

        [-1.85, 1.85].forEach(function (ux) {
          const cheek = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.54, 0.96, 1.65)), matPedestalStone);
          cheek.position.set(ux, 0.48, 3.62);
          layerBase.add(cheek);

          const urn = new THREE.Mesh(sharedUrnGeo, matPedestalStone);
          urn.position.set(ux, 0.96, 4.18);
          urn.scale.setScalar(0.95);
          layerBase.add(urn);
        });

        enableShadows(layerBase, true, true);
        tagSelectable(layerBase, "pedestal");

        // --- LAYER B: TALL MULTI-TIERED PEDESTAL WITH HOLLOW INTERIOR ---
        const pedBaseY = PLAZA_Y + 1.06;
        layerPedestal.position.set(cx, pedBaseY, cz);

        const plinth1 = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(3.88, 0.34, 3.48)), matPedestalSand);
        plinth1.position.y = 0.17;
        const plinth2 = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(3.46, 0.42, 3.06)), matPedestalStone);
        plinth2.position.y = 0.55;
        const plinthMould = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(3.62, 0.16, 3.22)), matPedestalSand);
        plinthMould.position.y = 0.84;
        layerPedestal.add(plinth1, plinth2, plinthMould);

        // Hollow rectangular shaft built from 4 thick masonry walls for Cross-Section interior
        const shaftBottom = 0.92;
        const shaftH = 3.16;
        const wallT = 0.44;
        const outerW = 2.74;
        const outerD = 2.38;

        [-1, 1].forEach(function (side) {
          const wMesh = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(outerW, shaftH, wallT)), matPedestalStone);
          wMesh.position.set(0, shaftBottom + shaftH * 0.5, side * (outerD * 0.5 - wallT * 0.5));
          layerPedestal.add(wMesh);
        });
        [-1, 1].forEach(function (side) {
          const wMesh = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(wallT, shaftH, outerD - wallT * 2)), matPedestalStone);
          wMesh.position.set(side * (outerW * 0.5 - wallT * 0.5), shaftBottom + shaftH * 0.5, 0);
          layerPedestal.add(wMesh);
        });

        // Vaulted chamber interior + miniature spiral staircase + glowing memorial lamp
        const chamberFloor = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(outerW - 0.8, 0.14, outerD - 0.8)), matInteriorStone);
        chamberFloor.position.y = shaftBottom + 0.07;
        layerPedestal.add(chamberFloor);

        const innerVault = new THREE.Mesh(
          trackGeo(new THREE.SphereGeometry(0.92, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.5)),
          matInteriorStone
        );
        innerVault.position.y = shaftBottom + shaftH - 0.72;
        layerPedestal.add(innerVault);

        const spiralSpine = new THREE.Mesh(trackGeo(new THREE.CylinderGeometry(0.11, 0.13, shaftH - 0.4, 10)), matInteriorStone);
        spiralSpine.position.set(-0.22, shaftBottom + shaftH * 0.46, -0.12);
        layerPedestal.add(spiralSpine);

        const spiralSteps = 18;
        for (let st = 0; st < spiralSteps; st++) {
          const ang = st * 0.48;
          const tread = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.56, 0.07, 0.22)), matSectionAccent);
          tread.position.set(
            -0.22 + Math.cos(ang) * 0.28,
            shaftBottom + 0.18 + st * ((shaftH - 0.65) / spiralSteps),
            -0.12 + Math.sin(ang) * 0.28
          );
          tread.rotation.y = -ang;
          layerPedestal.add(tread);
        }

        const innerLamp = new THREE.Mesh(
          trackGeo(new THREE.SphereGeometry(0.16, 12, 10)),
          makeStandardMat({ color: 0xffe4a8, emissive: 0xffa638, emissiveIntensity: 0.9, roughness: 0.3 }, "pedestal", false, true)
        );
        innerLamp.position.set(0.32, shaftBottom + 1.05, 0.18);
        layerPedestal.add(innerLamp);

        // Four paired corner columns with ornate dark-bronze capitals & bases
        const colCornerOffsets = [
          [-1.56,  1.24], [-1.22,  1.42],
          [ 1.56,  1.24], [ 1.22,  1.42],
          [-1.56, -1.24], [-1.22, -1.42],
          [ 1.56, -1.24], [ 1.22, -1.42]
        ];

        const pColShaftGeo = trackGeo(new THREE.CylinderGeometry(0.125, 0.145, 2.66, 14));
        const pColBaseGeo  = trackGeo(new THREE.LatheGeometry([
          new THREE.Vector2(0.20, 0.0),
          new THREE.Vector2(0.20, 0.08),
          new THREE.Vector2(0.16, 0.14),
          new THREE.Vector2(0.18, 0.19),
          new THREE.Vector2(0.145, 0.24)
        ], 12));
        const pColCapGeo = trackGeo(new THREE.LatheGeometry([
          new THREE.Vector2(0.13, 0.0),
          new THREE.Vector2(0.16, 0.07),
          new THREE.Vector2(0.19, 0.17),
          new THREE.Vector2(0.24, 0.24),
          new THREE.Vector2(0.22, 0.29)
        ], 12));

        [[-1.40, 1.32], [1.40, 1.32], [-1.40, -1.32], [1.40, -1.32]].forEach(function (cp) {
          const sub = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.84, 0.92, 0.78)), matPedestalSand);
          sub.position.set(cp[0], 0.46, cp[1]);
          layerPedestal.add(sub);
        });

        colCornerOffsets.forEach(function (co) {
          const cBase = new THREE.Mesh(pColBaseGeo, matPedestalBronzeDark);
          cBase.position.set(co[0], shaftBottom, co[1]);
          layerPedestal.add(cBase);

          const cShaft = new THREE.Mesh(pColShaftGeo, matPedestalStone);
          cShaft.position.set(co[0], shaftBottom + 0.24 + 1.33, co[1]);
          layerPedestal.add(cShaft);

          const cCap = new THREE.Mesh(pColCapGeo, matPedestalBronzeDark);
          cCap.position.set(co[0], shaftBottom + 2.86, co[1]);
          layerPedestal.add(cCap);

          const abac = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.42, 0.07, 0.42)), matPedestalBronzeDark);
          abac.position.set(co[0], shaftBottom + 3.16, co[1]);
          layerPedestal.add(abac);
        });

        // Dark bronze engraved inscription plaques on front & rear faces
        [1, -1].forEach(function (dirZ) {
          const frame = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(1.66, 1.24, 0.10)), matPedestalBronzeDark);
          frame.position.set(0, shaftBottom + 1.56, dirZ * (outerD * 0.5 + 0.03));
          layerPedestal.add(frame);

          const plaqueFace = new THREE.Mesh(trackGeo(new THREE.PlaneGeometry(1.52, 1.12)), matBronzePlaque);
          plaqueFace.position.set(0, shaftBottom + 1.56, dirZ * (outerD * 0.5 + 0.084));
          if (dirZ < 0) plaqueFace.rotation.y = Math.PI;
          layerPedestal.add(plaqueFace);
        });

        // Carved stone reliefs on side & upper pedestal faces
        [-1, 1].forEach(function (dirX) {
          const relPanel = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.08, 0.86, 1.52)), matCarvedRelief);
          relPanel.position.set(dirX * (outerW * 0.5 + 0.03), shaftBottom + 2.38, 0);
          layerPedestal.add(relPanel);
        });
        [1, -1].forEach(function (dirZ) {
          const friezeRel = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(1.88, 0.44, 0.08)), matCarvedRelief);
          friezeRel.position.set(0, shaftBottom + 2.62, dirZ * (outerD * 0.5 + 0.03));
          layerPedestal.add(friezeRel);
        });

        // Standing allegorical figures in green-grey patinated bronze on small side plinths
        const figureSpots = [
          { x: -1.86, z:  0.0,  rotY: -Math.PI * 0.5, variant: 0 },
          { x:  1.86, z:  0.0,  rotY:  Math.PI * 0.5, variant: 1 },
          { x:  0.0,  z:  1.66, rotY:  0.0,           variant: 2 },
          { x:  0.0,  z: -1.66, rotY:  Math.PI,       variant: 3 }
        ];
        figureSpots.forEach(function (fs) {
          const fPlinth = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.76, 1.02, 0.76)), matPedestalSand);
          fPlinth.position.set(fs.x, 0.51, fs.z);
          layerPedestal.add(fPlinth);

          const fCap = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(0.86, 0.12, 0.86)), matPedestalStone);
          fCap.position.set(fs.x, 1.06, fs.z);
          layerPedestal.add(fCap);

          const fig = createAllegoricalFigure(fs.variant, matAllegoricalPatina);
          fig.position.set(fs.x, 1.12, fs.z);
          fig.rotation.y = fs.rotY;
          fig.scale.setScalar(1.02);
          layerPedestal.add(fig);
        });

        // Heavy moulded cornice, dentils & upper attic
        const cornY = shaftBottom + shaftH;
        const architrave = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(3.48, 0.24, 3.12)), matPedestalStone);
        architrave.position.y = cornY + 0.12;
        const friezeBand = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(3.32, 0.34, 2.96)), matPedestalSand);
        friezeBand.position.y = cornY + 0.41;
        const corniceOverhang = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(3.96, 0.24, 3.58)), matPedestalStone);
        corniceOverhang.position.y = cornY + 0.70;
        const atticStep = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(3.04, 0.42, 2.74)), matPedestalStone);
        atticStep.position.y = cornY + 1.03;
        layerPedestal.add(architrave, friezeBand, corniceOverhang, atticStep);

        const dentilGeo = trackGeo(new THREE.BoxGeometry(0.11, 0.10, 0.11));
        for (let dx = -1.68; dx <= 1.69; dx += 0.24) {
          [-1.58, 1.58].forEach(function (dz) {
            const d = new THREE.Mesh(dentilGeo, matPedestalSand);
            d.position.set(dx, cornY + 0.56, dz);
            layerPedestal.add(d);
          });
        }
        for (let dz = -1.44; dz <= 1.45; dz += 0.24) {
          [-1.78, 1.78].forEach(function (dx) {
            const d = new THREE.Mesh(dentilGeo, matPedestalSand);
            d.position.set(dx, cornY + 0.56, dz);
            layerPedestal.add(d);
          });
        }

        enableShadows(layerPedestal, true, true);
        tagSelectable(layerPedestal, "pedestal");
        registerAnchor("pedestal", layerPedestal, 0.95, shaftBottom + 1.85, 1.45);

        // --- LAYER C: SHALLOW BLUE-GREEN OXIDISED-COPPER RIBBED DOMED CAP ---
        const domeBaseY = pedBaseY + cornY + 1.24;
        layerDomeCap.position.set(cx, domeBaseY, cz);

        const capPts = [
          new THREE.Vector2(1.56, 0.00),
          new THREE.Vector2(1.50, 0.14),
          new THREE.Vector2(1.32, 0.38),
          new THREE.Vector2(1.02, 0.62),
          new THREE.Vector2(0.76, 0.76),
          new THREE.Vector2(0.68, 0.80)
        ];
        const copperDomeGeo = trackGeo(new THREE.LatheGeometry(capPts, 8));
        copperDomeGeo.rotateY(Math.PI / 8);
        const copperDome = new THREE.Mesh(copperDomeGeo, matCopperDome);
        copperDome.scale.set(1.02, 1.0, 1.12);
        layerDomeCap.add(copperDome);

        for (let r = 0; r < 8; r++) {
          const ang = (r / 8) * Math.PI * 2 + Math.PI / 8;
          const ribCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(Math.cos(ang) * 1.54, 0.04, Math.sin(ang) * 1.68),
            new THREE.Vector3(Math.cos(ang) * 1.32, 0.38, Math.sin(ang) * 1.44),
            new THREE.Vector3(Math.cos(ang) * 0.72, 0.78, Math.sin(ang) * 0.78)
          ]);
          const rib = new THREE.Mesh(
            trackGeo(new THREE.TubeGeometry(ribCurve, 10, 0.036, 6, false)),
            matPedestalBronzeDark
          );
          layerDomeCap.add(rib);
        }

        const domeCrown = new THREE.Mesh(trackGeo(new THREE.BoxGeometry(1.36, 0.22, 2.24)), matPedestalSand);
        domeCrown.position.y = 0.86;
        layerDomeCap.add(domeCrown);

        enableShadows(layerDomeCap, true, true);
        tagSelectable(layerDomeCap, "pedestal");

        // --- LAYER D: LARGE DYNAMIC EQUESTRIAN STATUE ---
        const statueBaseY = domeBaseY + 0.97;
        layerStatue.position.set(cx, statueBaseY, cz);

        const equestrian = buildEquestrianStatue(matEquestrianBronze);
        equestrian.scale.setScalar(1.16);
        layerStatue.add(equestrian);

        enableShadows(layerStatue, true, true);
        tagSelectable(layerStatue, "equestrian");
        registerAnchor("equestrian", layerStatue, 0.2, 2.45, 0.35);

        // Save default layer Y positions for smooth Explode animations
        layerBase.userData.baseY      = layerBase.position.y;
        layerColonnade.userData.baseY = layerColonnade.position.y;
        layerPavilions.userData.baseY = layerPavilions.position.y;
        layerPedestal.userData.baseY  = layerPedestal.position.y;
        layerDomeCap.userData.baseY   = layerDomeCap.position.y;
        layerStatue.userData.baseY    = layerStatue.position.y;
      }

      /* =========================================================================
         14. LIVING DETAILS: WALKING MINIATURE FIGURES, CIRCLING BIRDS & DUST MOTES
         ========================================================================= */

      const walkers = [];
      const birds = [];
      let dustPoints = null;
      let dustBasePositions = null;

      function buildLivingDetails() {
        const coatPalette = [0x4c5d6e, 0x7d4c44, 0x5c684a, 0x8f7550, 0x3b414c, 0x997f6e, 0x625066];
        const headMat = makeStandardMat({ color: 0xe6c8a8, roughness: 0.78 }, null, false, true);
        const legMat  = makeStandardMat({ color: 0x2f3338, roughness: 0.85 }, null, false, true);
        const headGeo = trackGeo(new THREE.SphereGeometry(0.055, 8, 8));
        const bodyGeo = trackGeo(new THREE.ConeGeometry(0.075, 0.28, 8));
        const legGeo  = trackGeo(new THREE.CylinderGeometry(0.018, 0.016, 0.16, 6));

        for (let i = 0; i < 16; i++) {
          const wGroup = new THREE.Group();
          const coatMat = makeStandardMat({ color: coatPalette[i % coatPalette.length], roughness: 0.82 }, null, false, true);

          const body = new THREE.Mesh(bodyGeo, coatMat);
          body.position.y = 0.27;
          const head = new THREE.Mesh(headGeo, headMat);
          head.position.y = 0.45;
          const legL = new THREE.Mesh(legGeo, legMat);
          legL.position.set(-0.028, 0.08, 0);
          const legR = new THREE.Mesh(legGeo, legMat);
          legR.position.set( 0.028, 0.08, 0);

          wGroup.add(body, head, legL, legR);
          enableShadows(wGroup, true, false);
          layerLiving.add(wGroup);

          const isRing = i < 12;
          walkers.push({
            mesh: wGroup,
            legL: legL,
            legR: legR,
            mode: isRing ? "ring" : "forecourt",
            angle: (i / 12) * Math.PI * 2,
            radius: isRing ? (4.7 + (i % 3) * 0.65) : 0,
            speed: (0.12 + (i % 4) * 0.03) * (i % 2 === 0 ? 1 : -1),
            phase: i * 1.7,
            xRange: 3.6 + (i % 3) * 0.9,
            zLine: 7.45 + (i % 2) * 0.55
          });
        }

        const birdMat = makeStandardMat({ color: 0xfaf7ef, roughness: 0.72 }, null, false, false);
        const wingGeo = trackGeo(new THREE.BoxGeometry(0.24, 0.014, 0.075));
        wingGeo.translate(0.12, 0, 0);
        const birdBodyGeo = trackGeo(new THREE.ConeGeometry(0.032, 0.16, 6));
        birdBodyGeo.rotateX(Math.PI * 0.5);

        for (let b = 0; b < 6; b++) {
          const bGroup = new THREE.Group();
          const bBody = new THREE.Mesh(birdBodyGeo, birdMat);
          const wLeft = new THREE.Mesh(wingGeo, birdMat);
          const wRight = new THREE.Mesh(wingGeo, birdMat);
          wLeft.scale.x = -1;
          bGroup.add(bBody, wLeft, wRight);
          layerLiving.add(bGroup);

          birds.push({
            group: bGroup,
            wLeft: wLeft,
            wRight: wRight,
            radiusX: 5.5 + (b % 3) * 2.1,
            radiusZ: 4.8 + (b % 2) * 2.4,
            baseY: 9.4 + b * 0.82,
            angle: b * 1.15,
            speed: 0.28 + (b % 3) * 0.07,
            flapSpeed: 6.2 + b * 0.8
          });
        }

        const moteCount = 130;
        const posArr = new Float32Array(moteCount * 3);
        dustBasePositions = new Float32Array(moteCount * 3);
        const rand = createSeededRandom(1204);
        for (let m = 0; m < moteCount; m++) {
          const mx = (rand() - 0.5) * 24;
          const my = 0.6 + rand() * 12.8;
          const mz = (rand() - 0.5) * 19;
          posArr[m * 3] = dustBasePositions[m * 3] = mx;
          posArr[m * 3 + 1] = dustBasePositions[m * 3 + 1] = my;
          posArr[m * 3 + 2] = dustBasePositions[m * 3 + 2] = mz;
        }
        const dustGeo = trackGeo(new THREE.BufferGeometry());
        dustGeo.setAttribute("position", new THREE.BufferAttribute(posArr, 3));
        const dustMat = trackMat(new THREE.PointsMaterial({
          size: 0.22,
          map: createDustTexture(),
          transparent: true,
          opacity: 0.52,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          color: 0xfff4d4
        }));
        dustPoints = new THREE.Points(dustGeo, dustMat);
        scene.add(dustPoints);
      }

      /* =========================================================================
         15. ASSEMBLE THE DIORAMA
         ========================================================================= */

      buildDisplaySlab();
      buildColonnadeAndPavilions();
      buildPlazaAndStairs();
      buildCentralMemorial();
      buildLivingDetails();

      /* =========================================================================
         16. HAND-WRITTEN ORBIT CONTROLS (DRAG, WHEEL, PINCH, DAMPING, IDLE ROTATE)
         ========================================================================= */

      function getResponsiveRadiusScale() {
        const aspect = window.innerWidth / Math.max(1, window.innerHeight);
        return aspect < 1.35 ? Math.min(1.45, 1.35 / Math.max(0.75, aspect)) : 1.0;
      }

      const initialOverviewRadius = CAMERA_PRESETS.overview.radius * getResponsiveRadiusScale();

      const orbit = {
        theta: CAMERA_PRESETS.overview.theta,
        phi: CAMERA_PRESETS.overview.phi,
        radius: initialOverviewRadius,
        target: new THREE.Vector3().fromArray(CAMERA_PRESETS.overview.target),

        targetTheta: CAMERA_PRESETS.overview.theta,
        targetPhi: CAMERA_PRESETS.overview.phi,
        targetRadius: initialOverviewRadius,
        targetLook: new THREE.Vector3().fromArray(CAMERA_PRESETS.overview.target),

        minPhi: 0.12,
        maxPhi: Math.PI * 0.465, // keeps camera above the display slab
        minRadius: 5.5,
        maxRadius: 58.0,
        damping: 0.085,

        isDragging: false,
        isFlying: false,
        pointerMoved: false,
        lastInteractionTime: performance.now(),
        idleDelayMs: 4200,
        autoRotateSpeed: 0.075,

        prevX: 0,
        prevY: 0,
        pinchDist: 0,
        lastTapTime: 0
      };

      function syncCameraFromOrbit() {
        const sinPhi = Math.sin(orbit.phi);
        camera.position.set(
          orbit.target.x + orbit.radius * sinPhi * Math.sin(orbit.theta),
          orbit.target.y + orbit.radius * Math.cos(orbit.phi),
          orbit.target.z + orbit.radius * sinPhi * Math.cos(orbit.theta)
        );
        camera.lookAt(orbit.target);
      }
      syncCameraFromOrbit();

      function markUserInteraction() {
        orbit.lastInteractionTime = performance.now();
        if (orbit.isFlying) {
          gsap.killTweensOf(orbit);
          gsap.killTweensOf(orbit.targetLook);
          orbit.isFlying = false;
        }
      }

      const domElem = renderer.domElement;

      domElem.addEventListener("pointerdown", function (e) {
        if (e.pointerType === "touch") return;
        if (e.button !== 0) return;
        markUserInteraction();
        orbit.isDragging = true;
        orbit.pointerMoved = false;
        orbit.prevX = e.clientX;
        orbit.prevY = e.clientY;
      });

      window.addEventListener("pointermove", function (e) {
        if (e.pointerType === "touch") return;
        updatePointerCoords(e.clientX, e.clientY);
        if (!orbit.isDragging) return;
        const dx = e.clientX - orbit.prevX;
        const dy = e.clientY - orbit.prevY;
        if (Math.hypot(dx, dy) > 3) orbit.pointerMoved = true;
        orbit.prevX = e.clientX;
        orbit.prevY = e.clientY;

        orbit.targetTheta -= dx * 0.0068;
        orbit.targetPhi = Math.max(orbit.minPhi, Math.min(orbit.maxPhi, orbit.targetPhi - dy * 0.0058));
        orbit.lastInteractionTime = performance.now();
      });

      window.addEventListener("pointerup", function (e) {
        if (e.pointerType === "touch") return;
        if (orbit.isDragging && !orbit.pointerMoved) {
          handleSceneClick(e.clientX, e.clientY);
        }
        orbit.isDragging = false;
      });

      domElem.addEventListener("wheel", function (e) {
        e.preventDefault();
        markUserInteraction();
        const factor = 1 + Math.sign(e.deltaY) * Math.min(Math.abs(e.deltaY) * 0.0014, 0.14);
        orbit.targetRadius = Math.max(orbit.minRadius, Math.min(orbit.maxRadius, orbit.targetRadius * factor));
      }, { passive: false });

      domElem.addEventListener("dblclick", function () {
        flyToPreset("overview");
      });

      // Touch drag + two-finger pinch zoom + double-tap reset
      domElem.addEventListener("touchstart", function (e) {
        markUserInteraction();
        if (e.touches.length === 1) {
          orbit.isDragging = true;
          orbit.pointerMoved = false;
          orbit.prevX = e.touches[0].clientX;
          orbit.prevY = e.touches[0].clientY;

          const now = performance.now();
          if (now - orbit.lastTapTime < 300) {
            flyToPreset("overview");
          }
          orbit.lastTapTime = now;
        } else if (e.touches.length === 2) {
          orbit.isDragging = false;
          orbit.pinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: true });

      domElem.addEventListener("touchmove", function (e) {
        if (e.touches.length === 1 && orbit.isDragging) {
          const dx = e.touches[0].clientX - orbit.prevX;
          const dy = e.touches[0].clientY - orbit.prevY;
          if (Math.hypot(dx, dy) > 4) orbit.pointerMoved = true;
          orbit.prevX = e.touches[0].clientX;
          orbit.prevY = e.touches[0].clientY;
          orbit.targetTheta -= dx * 0.008;
          orbit.targetPhi = Math.max(orbit.minPhi, Math.min(orbit.maxPhi, orbit.targetPhi - dy * 0.0068));
          orbit.lastInteractionTime = performance.now();
        } else if (e.touches.length === 2) {
          e.preventDefault();
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          if (orbit.pinchDist > 0) {
            const ratio = orbit.pinchDist / dist;
            orbit.targetRadius = Math.max(orbit.minRadius, Math.min(orbit.maxRadius, orbit.targetRadius * ratio));
          }
          orbit.pinchDist = dist;
          orbit.lastInteractionTime = performance.now();
        }
      }, { passive: false });

      domElem.addEventListener("touchend", function (e) {
        if (e.touches.length === 0) {
          if (orbit.isDragging && !orbit.pointerMoved && e.changedTouches.length === 1) {
            handleSceneClick(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
          }
          orbit.isDragging = false;
          orbit.pinchDist = 0;
        }
      });

      /* =========================================================================
         17. GSAP CAMERA PRESETS
         ========================================================================= */

      const presetButtons = document.querySelectorAll(".preset-chip");

      function flyToPreset(presetName) {
        const p = CAMERA_PRESETS[presetName];
        if (!p) return;

        presetButtons.forEach(function (btn) {
          btn.classList.toggle("active", btn.dataset.preset === presetName);
        });

        gsap.killTweensOf(orbit);
        gsap.killTweensOf(orbit.targetLook);
        orbit.isFlying = true;
        orbit.lastInteractionTime = performance.now();

        let deltaTheta = ((p.theta - orbit.targetTheta + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
        const destTheta = orbit.targetTheta + deltaTheta;

        const radMult = (presetName === "overview" || presetName === "topdown") ? getResponsiveRadiusScale() : 1.0;

        gsap.to(orbit, {
          targetTheta: destTheta,
          targetPhi: p.phi,
          targetRadius: p.radius * radMult,
          duration: 1.35,
          ease: "power3.inOut",
          onComplete: function () {
            orbit.isFlying = false;
            orbit.lastInteractionTime = performance.now();
          }
        });

        gsap.to(orbit.targetLook, {
          x: p.target[0],
          y: p.target[1],
          z: p.target[2],
          duration: 1.35,
          ease: "power3.inOut"
        });
      }

      presetButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          flyToPreset(btn.dataset.preset);
        });
      });

      /* =========================================================================
         18. RAYCASTING, HOVER HIGHLIGHTS & FLOATING INFO CARDS + LEADER LINE
         ========================================================================= */

      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2(-10, -10);
      let pointerScreen = { x: 0, y: 0 };
      let hoveredPart = null;
      let selectedPart = null;

      const hoverPill  = document.getElementById("hover-pill");
      const infoCard   = document.getElementById("info-card");
      const infoTag    = document.getElementById("info-tag");
      const infoTitle  = document.getElementById("info-title");
      const infoBody   = document.getElementById("info-body");
      const infoMatEl  = document.getElementById("info-material");
      const infoScale  = document.getElementById("info-scale");
      const infoClose  = document.getElementById("info-close");
      const leaderLine = document.getElementById("leader-line");
      const leaderDot  = document.getElementById("leader-dot");

      function updatePointerCoords(clientX, clientY) {
        pointerScreen.x = clientX;
        pointerScreen.y = clientY;
        pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
        pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
      }

      function setPartHighlight(partKey, active) {
        if (!partKey || !partMaterialsMap[partKey]) return;
        const targetColor = active ? new THREE.Color(0x4a3d24) : new THREE.Color(0x000000);
        partMaterialsMap[partKey].forEach(function (mat) {
          if (mat.emissive) {
            gsap.to(mat.emissive, {
              r: targetColor.r,
              g: targetColor.g,
              b: targetColor.b,
              duration: 0.22,
              overwrite: "auto"
            });
          }
        });
      }

      function pickPartAtPointer() {
        raycaster.setFromCamera(pointerNDC, camera);
        const hits = raycaster.intersectObjects(selectableMeshes, false);
        for (let i = 0; i < hits.length; i++) {
          const hit = hits[i];
          if (sectionClipPlane.distanceToPoint(hit.point) < -0.02) continue;
          const key = hit.object.userData.partKey;
          if (key && MONUMENT_INFO[key]) {
            return { key: key, point: hit.point };
          }
        }
        return null;
      }

      function updateHoverState() {
        if (orbit.isDragging) {
          hoverPill.classList.remove("visible");
          return;
        }
        const hit = pickPartAtPointer();
        const nextKey = hit ? hit.key : null;

        if (nextKey !== hoveredPart) {
          if (hoveredPart && hoveredPart !== selectedPart) setPartHighlight(hoveredPart, false);
          hoveredPart = nextKey;
          if (hoveredPart) setPartHighlight(hoveredPart, true);
        }

        if (hoveredPart) {
          container.classList.add("pointer-hover");
          hoverPill.textContent = MONUMENT_INFO[hoveredPart].title;
          hoverPill.style.left = pointerScreen.x + "px";
          hoverPill.style.top = pointerScreen.y + "px";
          hoverPill.classList.add("visible");
        } else {
          container.classList.remove("pointer-hover");
          hoverPill.classList.remove("visible");
        }
      }

      function openInfoCard(partKey) {
        const data = MONUMENT_INFO[partKey];
        if (!data) return;
        if (selectedPart && selectedPart !== partKey) {
          setPartHighlight(selectedPart, false);
        }
        selectedPart = partKey;
        setPartHighlight(selectedPart, true);

        infoTag.textContent = data.tag;
        infoTitle.textContent = data.title;
        infoBody.textContent = data.body;
        infoMatEl.textContent = data.material;
        infoScale.textContent = data.scale;

        infoCard.classList.add("visible");
        updateLeaderLineAndCard();
      }

      function closeInfoCard() {
        if (selectedPart) {
          if (selectedPart !== hoveredPart) setPartHighlight(selectedPart, false);
          selectedPart = null;
        }
        infoCard.classList.remove("visible");
        leaderLine.setAttribute("visibility", "hidden");
        leaderDot.setAttribute("visibility", "hidden");
      }

      infoClose.addEventListener("click", closeInfoCard);

      function handleSceneClick(clientX, clientY) {
        updatePointerCoords(clientX, clientY);
        const hit = pickPartAtPointer();
        if (hit) {
          openInfoCard(hit.key);
        } else {
          closeInfoCard();
        }
      }

      const tempWorldVec = new THREE.Vector3();
      function updateLeaderLineAndCard() {
        if (!selectedPart || !partAnchors[selectedPart]) return;

        partAnchors[selectedPart].getWorldPosition(tempWorldVec);
        tempWorldVec.project(camera);

        if (tempWorldVec.z > 1) {
          leaderLine.setAttribute("visibility", "hidden");
          leaderDot.setAttribute("visibility", "hidden");
          return;
        }

        const ax = (tempWorldVec.x * 0.5 + 0.5) * window.innerWidth;
        const ay = (-tempWorldVec.y * 0.5 + 0.5) * window.innerHeight;

        const cardW = infoCard.offsetWidth || 268;
        const cardH = infoCard.offsetHeight || 168;
        const margin = 18;
        const rightReserve = uiHidden ? margin : (window.innerWidth > 680 ? 270 : margin);

        let cx = ax > window.innerWidth * 0.46 ? ax - cardW - 64 : ax + 64;
        let cy = ay - cardH * 0.52;

        cx = Math.max(margin, Math.min(window.innerWidth - cardW - rightReserve, cx));
        cy = Math.max(76, Math.min(window.innerHeight - cardH - 86, cy));

        infoCard.style.left = cx + "px";
        infoCard.style.top = cy + "px";

        const attachX = ax > cx + cardW * 0.5 ? cx + cardW : cx;
        const attachY = Math.max(cy + 18, Math.min(cy + cardH - 18, ay));

        leaderLine.setAttribute("x1", ax.toFixed(1));
        leaderLine.setAttribute("y1", ay.toFixed(1));
        leaderLine.setAttribute("x2", attachX.toFixed(1));
        leaderLine.setAttribute("y2", attachY.toFixed(1));
        leaderLine.setAttribute("visibility", "visible");

        leaderDot.setAttribute("cx", ax.toFixed(1));
        leaderDot.setAttribute("cy", ay.toFixed(1));
        leaderDot.setAttribute("visibility", "visible");
      }

      /* =========================================================================
         19. TIME OF DAY, SEASON, CROSS-SECTION, EXPLODE, WIREFRAME & SCREENSHOT
         ========================================================================= */

      let currentTimeVal = 28;
      let currentSeason = "spring";
      let isCrossSection = false;
      let isExploded = false;
      let isWireframe = false;
      let uiHidden = false;

      const timeSlider    = document.getElementById("time-slider");
      const timeReadout   = document.getElementById("time-readout");
      const seasonReadout = document.getElementById("season-readout");

      function lerpColorArray(a, b, t) {
        return [
          Math.round(a[0] + (b[0] - a[0]) * t),
          Math.round(a[1] + (b[1] - a[1]) * t),
          Math.round(a[2] + (b[2] - a[2]) * t)
        ];
      }

      function updateEnvironmentLighting() {
        const t = currentTimeVal / 100;

        const totalHours = 6 + t * 16;
        const hh24 = Math.floor(totalHours);
        const mm = Math.floor((totalHours - hh24) * 60);
        const suffix = hh24 >= 12 ? "PM" : "AM";
        const hh12 = ((hh24 + 11) % 12) + 1;
        timeReadout.textContent = hh12 + ":" + (mm < 10 ? "0" + mm : mm) + " " + suffix;

        const azimuth = -0.82 + t * 2.55;
        const elevation = Math.max(0.14, Math.sin(Math.min(1, t * 1.18) * Math.PI) * 1.18);
        const sunR = 30;
        keyLight.position.set(
          Math.sin(azimuth) * Math.cos(elevation) * sunR,
          Math.max(4.5, Math.sin(elevation) * sunR),
          Math.cos(azimuth) * Math.cos(elevation) * sunR
        );

        const nightFactor = Math.max(0, Math.min(1, (t - 0.66) / 0.30));
        const goldenFactor = Math.exp(-Math.pow((t - 0.68) / 0.14, 2)) + Math.exp(-Math.pow((t - 0.04) / 0.10, 2)) * 0.75;

        const dayKeyColor  = new THREE.Color(0xfff2d8);
        const goldKeyColor = new THREE.Color(0xffa95e);
        const moonKeyColor = new THREE.Color(0x88a8e6);
        const mixedKey = dayKeyColor.clone().lerp(goldKeyColor, Math.min(1, goldenFactor)).lerp(moonKeyColor, nightFactor);
        keyLight.color.copy(mixedKey);
        keyLight.intensity = 1.84 * (1 - nightFactor * 0.74) + goldenFactor * 0.22;

        fillLight.intensity = 0.58 * (1 - nightFactor * 0.55);
        hemiLight.intensity = 0.66 * (1 - nightFactor * 0.64);
        renderer.toneMappingExposure = 1.06 - nightFactor * 0.14;

        // Warm colonnade & plaza lamps illuminate smoothly at dusk and night
        const lampGlow = Math.pow(nightFactor, 0.85);
        lampBulbMaterials.forEach(function (bm) {
          bm.emissiveIntensity = 0.12 + lampGlow * 3.2;
        });
        nightPointLights.forEach(function (pl) {
          pl.intensity = lampGlow * 2.25;
        });

        let baseTop = [207, 228, 147];
        let baseMid = [126, 163, 83];
        let baseBot = [46, 67, 31];

        if (currentSeason === "autumn") {
          baseTop = [226, 212, 138];
          baseMid = [154, 142, 74];
          baseBot = [62, 56, 28];
        } else if (currentSeason === "winter") {
          baseTop = [206, 222, 198];
          baseMid = [132, 156, 126];
          baseBot = [46, 62, 50];
        }

        const goldTop = [242, 192, 124];
        const goldMid = [148, 118, 66];
        const goldBot = [48, 42, 26];

        const duskTop = [44, 62, 54];
        const duskMid = [24, 38, 30];
        const duskBot = [10, 18, 14];

        const gMix = Math.min(0.65, goldenFactor * 0.65);
        let cTop = lerpColorArray(baseTop, goldTop, gMix);
        let cMid = lerpColorArray(baseMid, goldMid, gMix);
        let cBot = lerpColorArray(baseBot, goldBot, gMix);

        cTop = lerpColorArray(cTop, duskTop, nightFactor * 0.88);
        cMid = lerpColorArray(cMid, duskMid, nightFactor * 0.88);
        cBot = lerpColorArray(cBot, duskBot, nightFactor * 0.88);

        bokehPalette.top = cTop;
        bokehPalette.mid = cMid;
        bokehPalette.bot = cBot;
        bokehPalette.glowA = nightFactor > 0.45 ? "rgba(255, 204, 124, 0.22)" : "rgba(246, 255, 206, 0.24)";
        bokehPalette.glowB = nightFactor > 0.45 ? "rgba(148, 188, 172, 0.14)" : "rgba(204, 232, 134, 0.18)";
        bokehPalette.glowC = nightFactor > 0.45 ? "rgba(255, 184, 102, 0.18)" : "rgba(255, 248, 210, 0.20)";

        const rootStyle = document.documentElement.style;
        rootStyle.setProperty("--bg-top", "rgb(" + cTop.join(",") + ")");
        rootStyle.setProperty("--bg-mid", "rgb(" + cMid.join(",") + ")");
        rootStyle.setProperty("--bg-bot", "rgb(" + cBot.join(",") + ")");
      }

      timeSlider.addEventListener("input", function () {
        currentTimeVal = parseFloat(timeSlider.value);
        updateEnvironmentLighting();
      });

      const seasonButtons = document.querySelectorAll(".seg-btn");
      function setSeason(season) {
        currentSeason = season;
        seasonReadout.textContent = season === "spring" ? "Spring" : (season === "autumn" ? "Autumn" : "Snow");
        seasonButtons.forEach(function (b) {
          b.classList.toggle("active", b.dataset.season === season);
        });

        gsap.to(seasonUniforms.uSnowAmount, {
          value: season === "winter" ? 1.0 : 0.0,
          duration: 1.15,
          ease: "power2.inOut"
        });
        gsap.to(seasonUniforms.uAutumnAmount, {
          value: season === "autumn" ? 1.0 : 0.0,
          duration: 1.0,
          ease: "power2.inOut"
        });

        foliageMaterials.forEach(function (fm) {
          const targetCol = season === "spring"
            ? fm.userData.springColor
            : (season === "autumn" ? fm.userData.autumnColor : fm.userData.winterColor);
          gsap.to(fm.color, {
            r: targetCol.r,
            g: targetCol.g,
            b: targetCol.b,
            duration: 0.95,
            ease: "power2.inOut"
          });
        });

        updateEnvironmentLighting();
      }

      seasonButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          setSeason(btn.dataset.season);
        });
      });

      const sectionBtn = document.getElementById("toggle-section");
      sectionBtn.addEventListener("click", function () {
        isCrossSection = !isCrossSection;
        sectionBtn.classList.toggle("active", isCrossSection);
        sectionBtn.setAttribute("aria-pressed", String(isCrossSection));

        gsap.to(sectionClipPlane, {
          constant: isCrossSection ? 0.08 : 22.0,
          duration: 1.15,
          ease: "power3.inOut"
        });
      });

      const explodeBtn = document.getElementById("toggle-explode");
      explodeBtn.addEventListener("click", function () {
        isExploded = !isExploded;
        explodeBtn.classList.toggle("active", isExploded);
        explodeBtn.setAttribute("aria-pressed", String(isExploded));

        const dur = 1.2;
        const ease = "power3.inOut";

        gsap.to(layerBase.position,      { y: layerBase.userData.baseY      + (isExploded ? 0.95 : 0), duration: dur, ease: ease });
        gsap.to(layerColonnade.position, { y: layerColonnade.userData.baseY + (isExploded ? 2.15 : 0), duration: dur, ease: ease });
        gsap.to(layerPavilions.position, { y: layerPavilions.userData.baseY + (isExploded ? 2.85 : 0), duration: dur, ease: ease });
        gsap.to(layerPedestal.position,  { y: layerPedestal.userData.baseY  + (isExploded ? 3.35 : 0), duration: dur, ease: ease });
        gsap.to(layerDomeCap.position,   { y: layerDomeCap.userData.baseY   + (isExploded ? 4.85 : 0), duration: dur, ease: ease });
        gsap.to(layerStatue.position,    { y: layerStatue.userData.baseY    + (isExploded ? 6.25 : 0), duration: dur, ease: ease });

        layerPavilions.children.forEach(function (pav) {
          if (!pav.userData.basePos) return;
          const mult = isExploded ? 1.13 : 1.0;
          gsap.to(pav.position, {
            x: pav.userData.basePos.x * mult,
            z: pav.userData.basePos.z * mult,
            duration: dur,
            ease: ease
          });
        });
      });

      const wireBtn = document.getElementById("toggle-wireframe");
      wireBtn.addEventListener("click", function () {
        isWireframe = !isWireframe;
        wireBtn.classList.toggle("active", isWireframe);
        wireBtn.setAttribute("aria-pressed", String(isWireframe));
        allWireframeMaterials.forEach(function (m) {
          m.wireframe = isWireframe;
        });
      });

      const uiLayer = document.getElementById("ui-layer");
      const hideUiBtn = document.getElementById("hide-ui-btn");
      const restoreUiBtn = document.getElementById("restore-ui-btn");

      function setUiHidden(hidden) {
        uiHidden = hidden;
        uiLayer.classList.toggle("hidden", uiHidden);
        restoreUiBtn.classList.toggle("visible", uiHidden);
        if (uiHidden) {
          closeInfoCard();
          hoverPill.classList.remove("visible");
        }
      }

      hideUiBtn.addEventListener("click", function () { setUiHidden(true); });
      restoreUiBtn.addEventListener("click", function () { setUiHidden(false); });

      const screenshotBtn = document.getElementById("screenshot-btn");
      screenshotBtn.addEventListener("click", function () {
        const w = renderer.domElement.width;
        const h = renderer.domElement.height;
        const outCanvas = document.createElement("canvas");
        outCanvas.width = w;
        outCanvas.height = h;
        const ctx = outCanvas.getContext("2d");

        drawBokehToContext(ctx, w, h, elapsedClock, true);
        renderer.render(scene, camera);
        ctx.drawImage(renderer.domElement, 0, 0, w, h);

        const vig = ctx.createRadialGradient(w * 0.5, h * 0.5, Math.min(w, h) * 0.34, w * 0.5, h * 0.5, Math.max(w, h) * 0.72);
        vig.addColorStop(0, "rgba(16, 26, 11, 0)");
        vig.addColorStop(1, "rgba(16, 26, 11, 0.32)");
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, w, h);

        const link = document.createElement("a");
        const safeName = PLAQUE_TEXT.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "pocket-world-3d";
        link.download = safeName + "-diorama.png";
        link.href = outCanvas.toDataURL("image/png");
        link.click();
      });

      updateEnvironmentLighting();

      /* =========================================================================
         20. ANIMATION LOOP, VISIBILITY PAUSE, RESIZE & CLEANUP
         ========================================================================= */

      let animFrameId = null;
      let isPageVisible = !document.hidden;
      let lastTime = performance.now();
      let elapsedClock = 0;

      function animate(now) {
        if (!isPageVisible) return;
        animFrameId = requestAnimationFrame(animate);

        const dt = Math.min((now - lastTime) * 0.001, 0.05);
        lastTime = now;
        elapsedClock += dt;

        // Gentle idle auto-rotate when user hasn't interacted recently
        if (!orbit.isDragging && !orbit.isFlying && (now - orbit.lastInteractionTime > orbit.idleDelayMs)) {
          orbit.targetTheta += orbit.autoRotateSpeed * dt;
        }

        // Smooth damped orbit camera
        const damp = 1 - Math.pow(1 - orbit.damping, dt * 60);
        orbit.theta  += (orbit.targetTheta - orbit.theta) * damp;
        orbit.phi    += (orbit.targetPhi - orbit.phi) * damp;
        orbit.radius += (orbit.targetRadius - orbit.radius) * damp;
        orbit.target.lerp(orbit.targetLook, damp);
        syncCameraFromOrbit();

        // Subtle floating collectible miniature motion
        dioramaRoot.position.y = Math.sin(elapsedClock * 0.85) * 0.09;
        dioramaRoot.rotation.z = -0.02 + Math.sin(elapsedClock * 0.55) * 0.004;
        dioramaRoot.rotation.x =  0.018 + Math.cos(elapsedClock * 0.45) * 0.004;

        // Animate tiny walking crowd for scale
        for (let i = 0; i < walkers.length; i++) {
          const w = walkers[i];
          if (w.mode === "ring") {
            w.angle += w.speed * dt;
            const wx = Math.cos(w.angle) * w.radius;
            const wz = -0.3 + Math.sin(w.angle) * w.radius * 0.82;
            w.mesh.position.set(wx, PLAZA_Y + 0.02 + Math.abs(Math.sin(elapsedClock * 7 + w.phase)) * 0.018, wz);
            w.mesh.rotation.y = Math.atan2(-Math.sin(w.angle) * w.speed, Math.cos(w.angle) * w.speed);
          } else {
            const p = Math.sin(elapsedClock * 0.22 + w.phase);
            const wx = p * w.xRange;
            const dir = Math.cos(elapsedClock * 0.22 + w.phase) >= 0 ? Math.PI * 0.5 : -Math.PI * 0.5;
            w.mesh.position.set(wx, 0.07 + Math.abs(Math.sin(elapsedClock * 7 + w.phase)) * 0.015, w.zLine);
            w.mesh.rotation.y = dir;
          }
          const stride = Math.sin(elapsedClock * 7.2 + w.phase) * 0.38;
          w.legL.rotation.x = stride;
          w.legR.rotation.x = -stride;
        }

        // Animate circling miniature birds
        const explodeBirdOffset = isExploded ? 4.8 : 0;
        for (let b = 0; b < birds.length; b++) {
          const bd = birds[b];
          bd.angle += bd.speed * dt;
          const bx = Math.cos(bd.angle) * bd.radiusX;
          const bz = -0.5 + Math.sin(bd.angle) * bd.radiusZ;
          const by = bd.baseY + explodeBirdOffset + Math.sin(elapsedClock * 1.1 + b) * 0.45;
          bd.group.position.set(bx, by, bz);

          const dx = -Math.sin(bd.angle) * bd.radiusX;
          const dz =  Math.cos(bd.angle) * bd.radiusZ;
          bd.group.rotation.y = Math.atan2(dx, dz);
          bd.group.rotation.z = -0.22;

          const flap = Math.sin(elapsedClock * bd.flapSpeed + b * 2.0) * 0.58;
          bd.wLeft.rotation.z = -flap;
          bd.wRight.rotation.z = flap;
        }

        // Drift floating dust motes softly through the light
        if (dustPoints) {
          const pArr = dustPoints.geometry.attributes.position.array;
          for (let m = 0; m < pArr.length; m += 3) {
            const idx = m * 0.333;
            pArr[m]     = dustBasePositions[m]     + Math.sin(elapsedClock * 0.35 + idx) * 0.45;
            pArr[m + 1] = dustBasePositions[m + 1] + Math.sin(elapsedClock * 0.28 + idx * 1.3) * 0.35;
            pArr[m + 2] = dustBasePositions[m + 2] + Math.cos(elapsedClock * 0.31 + idx * 0.9) * 0.45;
          }
          dustPoints.geometry.attributes.position.needsUpdate = true;
        }

        // Render soft animated bokeh background
        drawBokehToContext(bokehCtx, bokehCanvas.width, bokehCanvas.height, elapsedClock, false);

        if (!uiHidden) {
          updateHoverState();
          updateLeaderLineAndCard();
        }

        renderer.render(scene, camera);
      }

      // Pause rendering when tab is hidden
      document.addEventListener("visibilitychange", function () {
        isPageVisible = !document.hidden;
        if (isPageVisible) {
          lastTime = performance.now();
          if (animFrameId !== null) cancelAnimationFrame(animFrameId);
          animFrameId = requestAnimationFrame(animate);
        } else if (animFrameId !== null) {
          cancelAnimationFrame(animFrameId);
          animFrameId = null;
        }
      });

      // Responsive window resize handler
      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        resizeBokeh();
        updateLeaderLineAndCard();
      }
      window.addEventListener("resize", onResize);

      // Clean resource disposal on page unload
      window.addEventListener("beforeunload", function () {
        if (animFrameId !== null) cancelAnimationFrame(animFrameId);
        disposeAllResources();
      });

      // First render & smooth loading ring fade-out
      renderer.render(scene, camera);
      requestAnimationFrame(function () {
        const loader = document.getElementById("loader");
        if (loader) loader.classList.add("done");
        lastTime = performance.now();
        animFrameId = requestAnimationFrame(animate);
      });
    })();
  </script>
</body>
</html>
