  // --------------------------------------------------------------------------
  // H. FORECOURT COPING WALLS, GARDEN SILHOUETTES & DISTANT COMPOUND WALLS
  // --------------------------------------------------------------------------
  // Low carved granite coping borders framing the wide reflecting pool (X = ±58, Z = 12.6..126)
  addBox(buckets.graniteTrim, 118.0, 0.42, 0.95, 0, 0.21, 12.6);
  for (const side of [-1, 1]) {
    addBox(buckets.graniteTrim, 1.05, 0.44, 116.0, side * 58.6, 0.22, 70.0);
    // Warm subtle corner lantern bollards along the reflecting pool rim
    for (let zPos = 13.0; zPos <= 105.0; zPos += 14.0) {
      addBox(buckets.graniteTrim, 0.72, 0.95, 0.72, side * 58.6, 0.475, zPos);
      bulbs.addPoint(side * 58.6, 1.08, zPos, 0.95, 0.25);
    }
    // Distant palace garden perimeter wall + subtle Dasara perimeter bulbs
    addBox(buckets.graniteDark, 1.2, 3.2, 130.0, side * 76.0, 1.6, 56.0);
    bulbs.addLine(side * 75.3, 3.32, 4.0, side * 75.3, 3.32, 110.0, 1.85, 0.78);

    // Distant compound corner chhatri gate posts framing far edges
    buildMiniChhatri(buckets, bulbs, side * 66.0, 0.0, 28.0, 0.82);
  }

  // Stylized dark Mysore Palace garden cypress & royal palm silhouettes far on outer edges
  const rand = mulberry32(4242);
  for (const side of [-1, 1]) {
    // Neat row of ornamental cypress / ashoka trees flanking outer palace lawn
    for (let i = 0; i < 9; i++) {
      const tx = side * (62.5 + (i % 2) * 3.8 + (rand() - 0.5) * 1.4);
      const tz = 10.0 + i * 11.2 + (rand() - 0.5) * 2.0;
      const th = 7.5 + rand() * 4.5;
      const trunk = new THREE.CylinderGeometry(0.18, 0.26, th * 0.28, 6);
      pushGeo(buckets.graniteDark, trunk, makeMatrix(tx, th * 0.14, tz));
      trunk.dispose();

      // Layered narrow ashoka / cypress crown
      for (let k = 0; k < 4; k++) {
        const kr = (1.65 - k * 0.28) * (0.85 + rand() * 0.25);
        const kh = th * 0.32;
        const cone = new THREE.ConeGeometry(kr, kh, 7);
        pushGeo(buckets.foliage, cone, makeMatrix(tx, th * 0.26 + k * th * 0.18, tz, 0, rand() * Math.PI, 0));
        cone.dispose();
      }
    }

    // Lush dark backdrop tree canopy far behind palace flanks
    for (let i = 0; i < 8; i++) {
      const tx = side * (56.0 + i * 7.2 + (rand() - 0.5) * 3.0);
      const tz = -14.0 - rand() * 18.0;
      const rad = 4.5 + rand() * 4.2;
      const sp = new THREE.IcosahedronGeometry(rad, 1);
      pushGeo(buckets.foliage, sp, makeMatrix(tx, rad * 0.75, tz, 0, rand() * 3, 0, 1.15, 0.85, 1.05));
      sp.dispose();
    }
  }

  // --------------------------------------------------------------------------
  // I. MERGE ALL BUCKETS INTO OPTIMIZED DRAW CALLS
  // --------------------------------------------------------------------------
  const palaceGroup = new THREE.Group();
  const addMerged = (arr, mat, castShadow = false, receiveShadow = false) => {
    if (arr.length === 0) return null;
    const merged = mergeGeometries(arr, false);
    for (const g of arr) g.dispose();
    const mesh = new THREE.Mesh(merged, mat);
    mesh.castShadow = castShadow;
    mesh.receiveShadow = receiveShadow;
    palaceGroup.add(mesh);
    return mesh;
  };

  addMerged(buckets.graniteWall, materials.graniteWall, true, true);
  addMerged(buckets.graniteTrim, materials.graniteTrim, true, true);
  addMerged(buckets.graniteDark, materials.graniteDark, false, true);
  addMerged(buckets.gildedGold, materials.gildedGold, true, true);
  addMerged(buckets.antiqueGold, materials.antiqueGold, true, true);
  addMerged(buckets.interiorGlow, materials.interiorGlow, false, false);
  addMerged(buckets.windowGlow, materials.windowGlow, false, false);
  addMerged(buckets.foliage, materials.foliage, false, false);

  // Build Instanced Glowing Bulbs Mesh
  const bulbSystem = bulbs.buildInstancedMesh(2026);
  palaceGroup.add(bulbSystem.mesh);

  return { palaceGroup, bulbSystem };
}

// ============================================================================
// 6. FORECOURT GROUND & TRUE REAL-TIME HDR PLANAR REFLECTING SURFACE
// ============================================================================
function createForecourtAndReflection(pavingTex, envMap) {
  const group = new THREE.Group();

  // Ceremonial Granite Forecourt Apron & Flanking Promenades (Y = 0.02, surrounding the reflecting pool)
  const pavingMat = new THREE.MeshStandardMaterial({
    map: pavingTex.map,
    roughnessMap: pavingTex.roughnessMap,
    color: new THREE.Color('#757982'),
    roughness: 0.42,
    metalness: 0.14,
    envMap,
    envMapIntensity: 0.75,
  });

  // Front ceremonial granite apron between stairs and reflecting pool (Z = 3.5 -> 12.6)
  const apronGeo = new THREE.PlaneGeometry(164, 14);
  apronGeo.rotateX(-Math.PI * 0.5);
  const apronMesh = new THREE.Mesh(apronGeo, pavingMat);
  apronMesh.position.set(0, 0.03, 6.2);
  apronMesh.receiveShadow = true;
  group.add(apronMesh);

  // Wide outer left/right promenades flanking the reflecting pool
  for (const side of [-1, 1]) {
    const promGeo = new THREE.PlaneGeometry(46, 130);
    promGeo.rotateX(-Math.PI * 0.5);
    const prom = new THREE.Mesh(promGeo, pavingMat);
    prom.position.set(side * 81.6, 0.04, 70);
    group.add(prom);
  }

  // Far dark earth/horizon plane beyond the forecourt so nothing ever reveals void
  const horizonGroundGeo = new THREE.PlaneGeometry(600, 600);
  horizonGroundGeo.rotateX(-Math.PI * 0.5);
  const horizonGroundMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color('#090b10'),
    roughness: 0.92,
    metalness: 0.04,
  });
  const horizonGround = new THREE.Mesh(horizonGroundGeo, horizonGroundMat);
  horizonGround.position.set(0, -0.06, 40);
  group.add(horizonGround);

  // Monumental Still Reflecting Surface (HDR Planar Reflection Shader)
  const reflectGeo = new THREE.PlaneGeometry(116.4, 118.0, 1, 1);
  reflectGeo.rotateX(-Math.PI * 0.5);

  const reflectUniforms = {
    tReflect: { value: null },
    uRefViewProj: { value: new THREE.Matrix4() },
    uTime: { value: 0 },
    uFogColor: { value: new THREE.Color('#050712') },
    uFogDensity: { value: 0.0036 },
  };

  const reflectMat = new THREE.ShaderMaterial({
    uniforms: reflectUniforms,
    vertexShader: /* glsl */ `
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */ `
      uniform sampler2D tReflect;
      uniform mat4 uRefViewProj;
      uniform float uTime;
      uniform vec3 uFogColor;
      uniform float uFogDensity;

      varying vec3 vWorldPos;

      // Smooth 2D value noise for whisper-soft still-water capillary shimmer
      float hash21(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }

      float vnoise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        float a = hash21(i);
        float b = hash21(i + vec2(1.0, 0.0));
        float c = hash21(i + vec2(0.0, 1.0));
        float d = hash21(i + vec2(1.0, 1.0));
        return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
      }

      vec2 waterMicroNormal(vec2 xz, float t) {
        // Ultra-still ceremonial water: very gentle long-wavelength drift + tiny capillary ripple
        vec2 p1 = xz * 0.16 + vec2(t * 0.055, -t * 0.032);
        vec2 p2 = xz * 0.42 + vec2(-t * 0.048, t * 0.062);
        vec2 p3 = xz * 1.05 + vec2(t * 0.09, t * 0.04);

        float e = 0.08;
        float h0 = vnoise(p1) * 0.55 + vnoise(p2) * 0.30 + vnoise(p3) * 0.15;
        float hx = vnoise(p1 + vec2(e, 0.0)) * 0.55 + vnoise(p2 + vec2(e, 0.0)) * 0.30 + vnoise(p3 + vec2(e, 0.0)) * 0.15;
        float hz = vnoise(p1 + vec2(0.0, e)) * 0.55 + vnoise(p2 + vec2(0.0, e)) * 0.30 + vnoise(p3 + vec2(0.0, e)) * 0.15;

        return vec2(hx - h0, hz - h0) / e;
      }

      void main() {
        vec3 toCam = cameraPosition - vWorldPos;
        float dist = length(toCam);
        vec3 viewDir = toCam / max(dist, 0.001);

        // Exact planar reflection UV from mirrored virtual camera
        vec4 refClip = uRefViewProj * vec4(vWorldPos, 1.0);
        vec2 baseUV = (refClip.xy / refClip.w) * 0.5 + 0.5;

        // Whisper-gentle ripple perturbation (keeps dome & arches mirror-clear while giving bulbs liquid shimmer)
        vec2 grad = waterMicroNormal(vWorldPos.xz, uTime);
        float rippleScale = 0.0022 * smoothstep(4.0, 38.0, dist);
        // Slightly stronger vertical elongation like real calm water reflections of bright lights
        vec2 uvOffset = vec2(grad.x * 0.55, grad.y * 1.45) * rippleScale;
        vec2 uv = clamp(baseUV + uvOffset, vec2(0.002), vec2(0.998));

        // 3-tap soft vertical sheen sample for velvety reflected bulb glow
        vec3 refCenter = texture2D(tReflect, uv).rgb;
        vec3 refUp = texture2D(tReflect, clamp(uv + vec2(0.0, 0.0024), vec2(0.002), vec2(0.998))).rgb;
        vec3 refDn = texture2D(tReflect, clamp(uv - vec2(0.0, 0.0024), vec2(0.002), vec2(0.998))).rgb;
        vec3 reflCol = refCenter * 0.62 + (refUp + refDn) * 0.19;

        // Schlick Fresnel calibrated for a dark mirror-still ceremonial pool
        vec3 N = normalize(vec3(grad.x * 0.015, 1.0, grad.y * 0.015));
        float ndotv = clamp(dot(N, viewDir), 0.0, 1.0);
        float fresnel = 0.26 + 0.58 * pow(1.0 - ndotv, 2.5);

        // Subtle dark reflective basin water tint underneath
        vec3 deepWater = vec3(0.007, 0.011, 0.022);

        // Subtle warm golden subsurface scatter right in front of the glowing palace
        float palaceProx = exp(-pow(vWorldPos.x / 52.0, 2.0)) * exp(-max(0.0, vWorldPos.z - 12.0) / 36.0);
        deepWater += vec3(0.026, 0.013, 0.004) * palaceProx;

        // Subtle dark ambient occlusion along the stone pool coping walls
        float edgeFront = smoothstep(12.6, 14.4, vWorldPos.z);
        float edgeSides = smoothstep(58.2, 56.0, abs(vWorldPos.x));
        float edgeAO = 0.65 + 0.35 * edgeFront * edgeSides;

        vec3 col = mix(deepWater, reflCol * vec3(0.76, 0.74, 0.72), fresnel) * edgeAO;

        // Match exponential scene fog seamlessly
        float fogFactor = 1.0 - exp(-pow(dist * uFogDensity, 2.0));
        col = mix(col, uFogColor, clamp(fogFactor, 0.0, 0.85));

        gl_FragColor = vec4(col, 1.0);
      }
    `,
    toneMapped: true,
  });

  const waterMesh = new THREE.Mesh(reflectGeo, reflectMat);
  waterMesh.position.set(0, 0.0, 71.6);
  group.add(waterMesh);

  return { forecourtGroup: group, waterMesh, reflectUniforms };
}

// ============================================================================
// 7. PROCEDURAL NIGHT SKY DOME, DRIFTING HAZE & NIGHT AIR MOTES
// ============================================================================
function createNightSky() {
  const skyGeo = new THREE.SphereGeometry(420, 48, 32);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      uTime: { value: 0 },
    },
    vertexShader: /* glsl */ `
      varying vec3 vWorldDir;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldDir = normalize(position);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */ `
      uniform float uTime;
      varying vec3 vWorldDir;

      float hash31(vec3 p) {
        p = fract(p * vec3(443.897, 441.423, 437.195));
        p += dot(p, p.yzx + 19.19);
        return fract((p.x + p.y) * p.z);
      }

      float hash21(vec2 p) {
        p = fract(p * vec2(234.34, 435.345));
        p += dot(p, p + 34.23);
        return fract(p.x * p.y);
      }

      float noise2(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
          mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }

      float fbm(vec2 p) {
        float v = 0.0, a = 0.5;
        for (int i = 0; i < 4; i++) {
          v += a * noise2(p);
          p = p * 2.05 + vec2(13.7, 7.3);
          a *= 0.5;
        }
        return v;
      }

      void main() {
        vec3 d = normalize(vWorldDir);
        float y = clamp(d.y, -0.1, 1.0);

        // Deep velvety Mysuru Dasara night sky gradient
        vec3 zenithCol = vec3(0.004, 0.008, 0.026);
        vec3 midSkyCol = vec3(0.011, 0.019, 0.052);
        vec3 horizonCool = vec3(0.026, 0.030, 0.064);
        vec3 horizonWarm = vec3(0.14, 0.072, 0.028);

        vec3 sky = mix(horizonCool, midSkyCol, smoothstep(0.0, 0.28, max(y, 0.0)));
        sky = mix(sky, zenithCol, smoothstep(0.22, 0.78, max(y, 0.0)));

        // Warm Dasara city & palace atmospheric light glow rising softly behind the palace (-Z)
        float palaceDir = pow(max(0.0, dot(normalize(vec2(d.x, d.z)), vec2(0.0, -1.0))), 1.8);
        float horizonGlow = exp(-max(y, 0.0) * 7.2) * (0.35 + 0.65 * palaceDir);
        float palaceHalo = exp(-max(y, 0.0) * 4.2) * pow(max(0.0, dot(d, normalize(vec3(0.0, 0.09, -1.0)))), 5.5);
        sky += horizonWarm * horizonGlow * 0.72;
        sky += vec3(0.20, 0.10, 0.032) * palaceHalo * 0.55;

        // Subtle high drifting nocturnal cloud wisps
        if (y > 0.02) {
          vec2 cloudUV = d.xz / (y + 0.24) * 0.75 + vec2(uTime * 0.0045, uTime * 0.0018);
          float c1 = fbm(cloudUV);
          float c2 = fbm(cloudUV * 2.1 - vec2(uTime * 0.003, 0.0));
          float wisps = smoothstep(0.52, 0.84, c1 * 0.7 + c2 * 0.3) * smoothstep(0.02, 0.18, y) * (1.0 - smoothstep(0.45, 0.88, y));
          vec3 cloudTint = mix(vec3(0.06, 0.08, 0.15), vec3(0.18, 0.10, 0.045), horizonGlow * 0.9);
          sky += cloudTint * wisps * 0.36;
        }

        // Crisp subtle upper-sky stars
        if (y > 0.08) {
          vec3 starCell = floor(d * 290.0);
          float rnd = hash31(starCell);
          if (rnd > 0.992) {
            vec3 cellCenter = normalize(starCell + 0.5);
            float angDist = length(d - cellCenter) * 290.0;
            float starSpot = smoothstep(0.32, 0.0, angDist);
            float tw = 0.65 + 0.35 * sin(uTime * (1.2 + fract(rnd * 71.3) * 2.5) + rnd * 120.0);
            float starFade = smoothstep(0.08, 0.34, y);
            vec3 starCol = mix(vec3(0.75, 0.85, 1.0), vec3(1.0, 0.92, 0.78), fract(rnd * 33.7));
            sky += starCol * starSpot * tw * starFade * 0.68;
          }
        }

        gl_FragColor = vec4(sky, 1.0);
      }
    `,
  });

  const skyMesh = new THREE.Mesh(skyGeo, skyMat);
  return { skyMesh, skyMat };
}

function createDriftingHaze() {
  const hazeGroup = new THREE.Group();
  const hazeUniforms = {
    uTime: { value: 0 },
  };

  const hazeMat = new THREE.ShaderMaterial({
    uniforms: hazeUniforms,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    vertexShader: /* glsl */ `
      varying vec2 vUv;
      varying vec3 vWorldPos;
      void main() {
        vUv = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */ `
      uniform float uTime;
      varying vec2 vUv;
      varying vec3 vWorldPos;

      float hash21(vec2 p) {
        p = fract(p * vec2(127.1, 311.7));
        p += dot(p, p + 34.5);
        return fract(p.x * p.y);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
          mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }

      float fbm(vec2 p) {
        float v = 0.0, a = 0.5;
        for (int i = 0; i < 4; i++) {
          v += a * noise(p);
          p = p * 2.02 + vec2(9.2, 5.4);
          a *= 0.5;
        }
        return v;
      }

      void main() {
        if (vWorldPos.y < 0.05) discard;

        // Smooth elliptical feathering so plane edges are 100% invisible
        vec2 c = vUv * 2.0 - 1.0;
        float radMask = 1.0 - smoothstep(0.12, 1.0, length(c * vec2(1.0, 1.18)));
        float lowFade = smoothstep(0.0, 0.25, vUv.y);

        // Delicate wispy drifting night mist
        float layerSeed = fract(vWorldPos.z * 0.037);
        vec2 uv1 = vUv * vec2(3.6, 2.0) + vec2(uTime * (0.018 + layerSeed * 0.011), -uTime * 0.004 + layerSeed * 10.0);
        vec2 uv2 = vUv * vec2(6.0, 3.0) + vec2(-uTime * 0.012 + layerSeed * 6.0, uTime * 0.006);
        float mist = fbm(uv1) * 0.65 + fbm(uv2) * 0.35;
        mist = smoothstep(0.42, 0.88, mist);

        // Fade gently when camera passes close to a haze sheet
        float camDist = length(cameraPosition - vWorldPos);
        float nearFade = smoothstep(10.0, 28.0, camDist);

        // Warm golden Dasara scattering near the palace, cooler smoky indigo farther out
        float palaceWarmth = exp(-pow(vWorldPos.x / 52.0, 2.0)) * exp(-pow((vWorldPos.z + 2.0) / 40.0, 2.0));
        vec3 coolMist = vec3(0.08, 0.11, 0.20);
        vec3 warmMist = vec3(0.65, 0.34, 0.10);
        vec3 col = mix(coolMist, warmMist, clamp(palaceWarmth * 1.1, 0.0, 1.0));

        float alpha = mist * radMask * lowFade * nearFade * (0.018 + 0.022 * palaceWarmth);
        gl_FragColor = vec4(col * alpha, alpha);
      }
    `,
  });

  // Layered faint drifting haze curtains across the forecourt & behind the domes
  const layers = [
    { x: 0, y: 8, z: 54, w: 125, h: 16 },
    { x: -16, y: 7, z: 32, w: 112, h: 15 },
    { x: 18, y: 9, z: 18, w: 118, h: 18 },
    { x: 0, y: 26, z: -18, w: 155, h: 40 },
    { x: -24, y: 12, z: 42, w: 96, h: 16 },
    { x: 26, y: 11, z: 24, w: 96, h: 16 },
  ];

  for (const l of layers) {
    const geo = new THREE.PlaneGeometry(l.w, l.h);
    const m = new THREE.Mesh(geo, hazeMat);
    m.position.set(l.x, l.y, l.z);
    hazeGroup.add(m);
  }

  // Subtle drifting warm night air motes (incense / festival dust catching golden glow)
  const moteCount = 340;
  const rand = mulberry32(8888);
  const posArr = new Float32Array(moteCount * 3);
  const rndArr = new Float32Array(moteCount * 3);

  for (let i = 0; i < moteCount; i++) {
    posArr[i * 3 + 0] = (rand() - 0.5) * 110;
    posArr[i * 3 + 1] = 1.5 + rand() * 34;
    posArr[i * 3 + 2] = -6 + rand() * 88;
    rndArr[i * 3 + 0] = rand() * Math.PI * 2;
    rndArr[i * 3 + 1] = 0.4 + rand() * 1.1;
    rndArr[i * 3 + 2] = 0.5 + rand() * 1.0;
  }

  const moteGeo = new THREE.BufferGeometry();
  moteGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  moteGeo.setAttribute('aRnd', new THREE.BufferAttribute(rndArr, 3));

  const moteMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */ `
      attribute vec3 aRnd;
      uniform float uTime;
      varying float vAlpha;

      void main() {
        vec3 p = position;
        p.x += sin(uTime * 0.14 * aRnd.y + aRnd.x) * 2.2 + mod(uTime * 0.28 * aRnd.y + aRnd.x * 10.0, 110.0) - 55.0;
        p.x = mod(p.x + 55.0, 110.0) - 55.0;
        p.y += sin(uTime * 0.22 * aRnd.y + aRnd.x * 2.0) * 0.9;

        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        float dist = length(mv.xyz);
        gl_PointSize = clamp((16.0 * aRnd.z) / max(dist, 4.0), 1.0, 3.6);
        vAlpha = (0.10 + 0.10 * sin(uTime * 0.9 * aRnd.y + aRnd.x)) * smoothstep(4.0, 18.0, dist) * (1.0 - smoothstep(70.0, 115.0, dist));
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */ `
      varying float vAlpha;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        float r = length(c) * 2.0;
        float soft = pow(max(0.0, 1.0 - r), 2.2);
        vec3 col = vec3(1.0, 0.68, 0.28);
        gl_FragColor = vec4(col * soft * vAlpha, soft * vAlpha);
      }
    `,
  });

  const motes = new THREE.Points(moteGeo, moteMat);
  hazeGroup.add(motes);

  return { hazeGroup, hazeUniforms, moteMat };
}

// 8. CALIBRATED LIGHTING RIG (DASARA GOLDEN BOUNCE + COOL MOONLIGHT)

function createLightingRig(scene) {
  // Deep midnight-indigo sky ambient vs warm golden ground bounce
  const hemi = new THREE.HemisphereLight('#243866', '#3d2008', 0.40);
  scene.add(hemi);

  // Subtle cool silvery moonlight grazing from high rear-left to sculpt granite cornices
  const moonLight = new THREE.DirectionalLight('#648ce0', 0.72);
  moonLight.position.set(-48, 72, -32);
  scene.add(moonLight);

  // Soft warm frontal Dasara fill representing the collective bounce of ~18,000 bulbs on the grey granite
  const facadeFill = new THREE.DirectionalLight('#ffa642', 0.46);
  facadeFill.position.set(12, 18, 64);
  scene.add(facadeFill);

  const warmLights = [];
  const addPoint = (x, y, z, color, intensity, distance, decay = 1.65) => {
    const l = new THREE.PointLight(color, intensity, distance, decay);
    l.position.set(x, y, z);
    scene.add(l);
    warmLights.push({ light: l, base: intensity, phase: (x * 0.37 + y * 0.53 + z * 0.21) });
    return l;
  };

  // Central Gilded Dome & Mini-Chhatris Golden Uplights
  addPoint(0, 35.5, 4.8, '#ffb240', 110, 42, 1.55);
  addPoint(-8.5, 31.0, 2.5, '#ff9228', 62, 32, 1.65);
  addPoint(8.5, 31.0, 2.5, '#ff9228', 62, 32, 1.65);
  addPoint(0, 42.5, 1.8, '#ffc864', 52, 26, 1.6);

  // Central Portico & Royal Durbar Hall Warm Interior Spill
  addPoint(0, 6.2, 3.8, '#ff8d20', 64, 28, 1.65);
  addPoint(0, 13.5, 3.6, '#ff982b', 72, 30, 1.65);
  addPoint(0, 21.0, 6.0, '#ff942c', 56, 26, 1.65);

  // Symmetrical Colonnade Wing Warm Grazing & Interior Lights
  for (const side of [-1, 1]) {
    // Inner colonnade facade & gallery warm glow
    addPoint(side * 18.5, 12.2, 3.8, '#ff8f26', 54, 32, 1.65);
    addPoint(side * 18.5, 5.2, 1.8, '#ff841a', 36, 24, 1.7);
    // Mid-wing domed tower uplight
    addPoint(side * 31.8, 26.5, 4.5, '#ffa638', 68, 32, 1.55);
    addPoint(side * 31.8, 12.5, 6.0, '#ff9026', 44, 28, 1.65);
    // Outer colonnade & corner grand pavilion tower
    addPoint(side * 41.0, 12.0, 3.6, '#ff8e24', 42, 26, 1.65);
    addPoint(side * 49.8, 28.5, 5.2, '#ffa83c', 82, 36, 1.55);
    addPoint(side * 49.8, 12.8, 7.2, '#ff9026', 48, 30, 1.65);
  }

  return warmLights;
}

function evaluateCinemaSchedule(elapsed) {
  // Total seamless cycle = 112 seconds:
  //   0..52s   : Slow majestic push-in from wide establishing shot -> central gilded dome
  //   52..68s  : Gentle hovering admiration & subtle arc around the central dome
  //   68..106s : Graceful slow pull-back to wide establishing view
  //   106..112s: Calm wide establishing breath
  const cycle = 112.0;
  const ct = elapsed % cycle;

  let progress = 0;
  let arcX = 0;
  let arcY = 0;

  if (ct < 52.0) {
    const u = ct / 52.0;
    // Quintic smooth ease-in-out for cinema dolly feel
    progress = u * u * u * (u * (u * 6.0 - 15.0) + 10.0);
  } else if (ct < 68.0) {
    progress = 1.0;
    const h = (ct - 52.0) / 16.0;
    arcX = Math.sin(h * Math.PI) * 5.2;
    arcY = Math.sin(h * Math.PI * 2.0) * 0.85;
  } else if (ct < 106.0) {
    const u = 1.0 - (ct - 68.0) / 38.0;
    progress = u * u * u * (u * (u * 6.0 - 15.0) + 10.0);
  } else {
    progress = 0.0;
  }

  posCurve.getPointAt(clamp(progress, 0, 1), desiredPos);
  targetCurve.getPointAt(clamp(progress, 0, 1), desiredTarget);

  // Subtle organic crane drift + damped climax arc
  desiredPos.x += arcX + Math.sin(elapsed * 0.11) * 0.9;
  desiredPos.y += arcY + Math.sin(elapsed * 0.17) * 0.25;
  desiredTarget.x += Math.sin(elapsed * 0.09) * 0.35;
}

// Responsive resize handling
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  reflectCam.aspect = w / h;
  reflectCam.updateProjectionMatrix();

  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloomPass.setSize(w, h);

  reflectRT.setSize(
    Math.max(256, Math.floor(w * REFLECT_SCALE)),
    Math.max(256, Math.floor(h * REFLECT_SCALE))
  );
});

// Animation Loop
let lastTime = performance.now();
let elapsed = 0;

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastTime) * 0.001, 0.05);
  lastTime = now;
  elapsed += dt;

  // 1. Update slow damped cinematic camera
  evaluateCinemaSchedule(elapsed);

  // Damped passive pointer parallax
  const pDamp = 1.0 - Math.exp(-2.2 * dt);
  pointer.sx += (pointer.x - pointer.sx) * pDamp;
  pointer.sy += (pointer.y - pointer.sy) * pDamp;

  desiredPos.x += pointer.sx * 1.65;
  desiredPos.y += -pointer.sy * 0.75;

  // Critically damped camera tracking
  const camDamp = 1.0 - Math.exp(-1.55 * dt);
  const tgtDamp = 1.0 - Math.exp(-1.85 * dt);
  currentPos.lerp(desiredPos, camDamp);
  currentTarget.lerp(desiredTarget, tgtDamp);

  camera.position.copy(currentPos);
  camera.lookAt(currentTarget);
  camera.updateMatrixWorld();

  // Keep sky dome centered on camera XZ
  skyMesh.position.set(camera.position.x, 0, camera.position.z);

  // 2. Update shaders (gentle bulb twinkle, drifting haze, water micro-ripples, night sky)
  bulbSystem.material.uniforms.uTime.value = elapsed;
  reflectUniforms.uTime.value = elapsed;
  hazeUniforms.uTime.value = elapsed;
  moteMat.uniforms.uTime.value = elapsed;
  skyMat.uniforms.uTime.value = elapsed;

  // Very subtle warm ambient light shimmer matching the collective twinkling bulbs
  for (let i = 0; i < warmLights.length; i++) {
    const wl = warmLights[i];
    wl.light.intensity = wl.base * (1.0 + 0.035 * Math.sin(elapsed * 2.1 + wl.phase));
  }

  // 3. Pass 1: Render HDR Planar Reflection into reflectRT
  reflectCam.position.set(currentPos.x, -currentPos.y, currentPos.z);
  reflectCam.up.set(0, 1, 0);
  reflectCam.lookAt(currentTarget.x, -currentTarget.y, currentTarget.z);
  reflectCam.updateMatrixWorld();
  reflectCam.updateProjectionMatrix();

  refViewProj.multiplyMatrices(reflectCam.projectionMatrix, reflectCam.matrixWorldInverse);
  reflectUniforms.uRefViewProj.value.copy(refViewProj);

  waterMesh.visible = false;
  hazeGroup.visible = false; // Keep reflections crisp and free of double-blended haze
  renderer.clippingPlanes = [reflectClipPlane];
  renderer.setRenderTarget(reflectRT);
  renderer.clear();
  renderer.render(scene, reflectCam);
  renderer.setRenderTarget(null);
  renderer.clippingPlanes = [];
  waterMesh.visible = true;
  hazeGroup.visible = true;

  // 4. Pass 2: Main HDR Scene + Soft Bloom Post-Processing
  composer.render();
}

requestAnimationFrame(animate);
</script>
