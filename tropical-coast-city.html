      const wallMesh = new THREE.Mesh(wallGeo, seawallMat);
      wallMesh.castShadow = true;
      wallMesh.receiveShadow = true;
      roadGroup.add(wallMesh);

      // Barrier Island West Bayfront Seawall & Promenade (s = -165 to -157)
      const islBayWalk = makeCurvedStrip(zMinIsl, zMaxIsl, segsIsl, z => coastX(z) - 165.0, z => coastX(z) - 157.0, Y_SIDEWALK, -2.5);
      const islBayMesh = new THREE.Mesh(islBayWalk, sidewalkMaterial);
      islBayMesh.receiveShadow = true;
      roadGroup.add(islBayMesh);

      const islBayWall = makeCurvedStrip(zMinIsl, zMaxIsl, segsIsl, z => coastX(z) - 165.2, z => coastX(z) - 164.4, Y_SEAWALL_TOP, -2.5);
      const islBayWallM = new THREE.Mesh(islBayWall, seawallMat);
      islBayWallM.receiveShadow = true;
      roadGroup.add(islBayWallM);

      // Mainland Bayfront Park & Seawall Promenade (bayWestX - 16 to bayWestX)
      const mainBayWalk = makeCurvedStrip(zMinMain, zMaxMain, segsMain, z => bayWestX(z) - 16.5, z => bayWestX(z) + 0.5, Y_SIDEWALK, -2.5);
      const mainBayMesh = new THREE.Mesh(mainBayWalk, sidewalkMaterial);
      mainBayMesh.receiveShadow = true;
      roadGroup.add(mainBayMesh);

      const mainBayWall = makeCurvedStrip(zMinMain, zMaxMain, segsMain, z => bayWestX(z) - 0.3, z => bayWestX(z) + 0.7, Y_SEAWALL_TOP, -2.5);
      const mainBayWallM = new THREE.Mesh(mainBayWall, seawallMat);
      mainBayWallM.receiveShadow = true;
      roadGroup.add(mainBayWallM);

      // Bayfront Park emerald turf & royal palm promenade along Mainland seawall
      const mainParkTurf = makeCurvedStrip(zMinMain + 10, zMaxMain - 10, segsMain, z => bayWestX(z) - 15.5, z => bayWestX(z) - 4.5, Y_SIDEWALK + 0.04);
      const mainParkTurfM = new THREE.Mesh(mainParkTurf, medianTurfMat);
      mainParkTurfM.receiveShadow = true;
      roadGroup.add(mainParkTurfM);

      for (let z = -475; z <= 475; z += 18) {
        const nearBridge = CAUSEWAY_ZS.some(cz => Math.abs(cz - z) < STREET_HALF_WIDTH + 5);
        if (nearBridge) continue;
        palmSites.push({
          x: bayWestX(z) - 10.0, z, y: Y_SIDEWALK + 0.04,
          type: 'royal', scale: rng.range(0.95, 1.25), leanAngle: rng.range(0.01, 0.05), leanDir: rng.range(0, Math.PI * 2)
        });
        if (Math.abs(Math.round(z / 18)) % 2 === 0) {
          lampPositions.push({ x: bayWestX(z) - 2.2, z, y: Y_SIDEWALK, rotY: 0, twin: false });
        }
      }

      // 2) Ocean Blvd West Sidewalk (s = -78 to -72)
      const westWalkGeo = makeCurvedStrip(zMinIsl, zMaxIsl, segsIsl, z => coastX(z) - 78.0, z => coastX(z) - 72.0, Y_SIDEWALK, 1.8);
      const westWalkMesh = new THREE.Mesh(westWalkGeo, sidewalkMaterial);
      westWalkMesh.receiveShadow = true;
      roadGroup.add(westWalkMesh);

      // 3) Ocean Blvd Asphalt (s = -72 to -50)
      const blvdGeo = makeCurvedStrip(zMinIsl, zMaxIsl, segsIsl, z => coastX(z) - 72.0, z => coastX(z) - 50.0, Y_ROAD);
      const blvdMesh = new THREE.Mesh(blvdGeo, asphaltMaterial);
      blvdMesh.receiveShadow = true;
      roadGroup.add(blvdMesh);

      // 4) Ocean Blvd Landscaped Palm Median segments (broken cleanly at cross-streets!)
      const medianBreaks = [zMinIsl, ...STREET_ZS, zMaxIsl];
      for (let i = 0; i < medianBreaks.length - 1; i++) {
        const mz0 = medianBreaks[i] + (i === 0 ? 0 : STREET_HALF_WIDTH + 6.5);
        const mz1 = medianBreaks[i + 1] - (i === medianBreaks.length - 2 ? 0 : STREET_HALF_WIDTH + 6.5);
        if (mz1 - mz0 < 14) continue;
        const mSegs = Math.max(8, Math.floor((mz1 - mz0) / 8));
        const curbG = makeCurvedStrip(mz0, mz1, mSegs, z => coastX(z) - 63.1, z => coastX(z) - 58.9, Y_MEDIAN, Y_ROAD);
        const curbM = new THREE.Mesh(curbG, seawallMat);
        curbM.receiveShadow = true;
        roadGroup.add(curbM);

        const turfG = makeCurvedStrip(mz0 + 0.6, mz1 - 0.6, mSegs, z => coastX(z) - 62.6, z => coastX(z) - 59.4, Y_MEDIAN + 0.03);
        const turfM = new THREE.Mesh(turfG, medianTurfMat);
        turfM.receiveShadow = true;
        roadGroup.add(turfM);

        const len = mz1 - mz0;
        const nPalms = Math.max(2, Math.floor(len / 13.5));
        for (let p = 0; p < nPalms; p++) {
          const pz = lerp(mz0 + 5.0, mz1 - 5.0, (p + 0.5) / nPalms);
          const px = coastX(pz) - 61.0;
          palmSites.push({
            x: px, z: pz, y: Y_MEDIAN,
            type: 'royal',
            scale: rng.range(0.92, 1.15),
            leanAngle: rng.range(0.01, 0.05),
            leanDir: rng.range(0, Math.PI * 2)
          });
          if (p % 2 === 0 && Math.abs(pz) < 405) {
            lampPositions.push({ x: px, z: pz, y: Y_MEDIAN, rotY: -Math.atan(coastDXDZ(pz)), twin: true });
          }
        }
      }

      // Promenade palms & single-arm street lamps
      for (let z = -405; z <= 405; z += 14.5) {
        const px = coastX(z) - 44.8;
        palmSites.push({
          x: px, z: z + rng.range(-1.5, 1.5), y: Y_SIDEWALK,
          type: 'coconut',
          scale: rng.range(0.88, 1.22),
          leanAngle: rng.range(0.08, 0.22),
          leanDir: rng.range(-0.6, 0.6)
        });
        const nearStreet = STREET_ZS.some(sz => Math.abs(sz - z) < STREET_HALF_WIDTH + 3.5);
        if (!nearStreet && Math.abs(Math.round(z / 14.5)) % 2 === 0) {
          lampPositions.push({
            x: coastX(z) - 49.0,
            z, y: Y_SIDEWALK,
            rotY: Math.PI - Math.atan(coastDXDZ(z)),
            twin: false
          });
        }
      }

      // 5) Barrier Island Ave 1 + Mainland Avenues 2..6 (asphalt + sidewalks)
      for (let a = 1; a <= 6; a++) {
        const hw = AVE_HALF_WIDTH[a];
        const z0A = a === 1 ? zMinIsl : zMinMain;
        const z1A = a === 1 ? zMaxIsl : zMaxMain;
        const swG = makeCurvedStrip(z0A, z1A, 96, z => aveCenterX(a, z) - hw - 3.4, z => aveCenterX(a, z) + hw + 3.4, Y_SIDEWALK - 0.02, 1.8);
        const swM = new THREE.Mesh(swG, sidewalkMaterial);
        swM.receiveShadow = true;
        roadGroup.add(swM);

        const rdG = makeCurvedStrip(z0A, z1A, 96, z => aveCenterX(a, z) - hw, z => aveCenterX(a, z) + hw, Y_ROAD);
        const rdM = new THREE.Mesh(rdG, asphaltMaterial);
        rdM.receiveShadow = true;
        roadGroup.add(rdM);

        if (a <= 4) {
          for (let z = z0A + 15; z <= z1A - 15; z += 28) {
            const nearSt = STREET_ZS.some(sz => Math.abs(sz - z) < STREET_HALF_WIDTH + 4.5);
            if (nearSt) continue;
            lampPositions.push({ x: aveCenterX(a, z) + hw + 1.1, z, y: Y_SIDEWALK, rotY: Math.PI, twin: false });
            palmSites.push({
              x: aveCenterX(a, z) - hw - 1.6, z, y: Y_SIDEWALK,
              type: a === 1 ? 'coconut' : 'royal',
              scale: rng.range(0.82, 1.08),
              leanAngle: rng.range(0.02, 0.08),
              leanDir: rng.range(0, Math.PI * 2)
            });
          }
        }
      }

      // 6) Cross-Streets along X (Barrier Island segments + Mainland segments + 3 Arched Causeway Bridges!)
      const whiteStrips = []; // { x, y, z, w, l, rotY, rotZ }
      const yellowStrips = [];

      const addFlatCrossStreet = (xStart, xEnd, sz) => {
        const len = xEnd - xStart;
        if (len < 4) return;
        const cx = (xStart + xEnd) * 0.5;

        const swGeo = new THREE.PlaneGeometry(len, (STREET_HALF_WIDTH + 3.0) * 2);
        swGeo.rotateX(-Math.PI * 0.5);
        const swMesh = new THREE.Mesh(swGeo, sidewalkMaterial);
        swMesh.position.set(cx, Y_SIDEWALK - 0.03, sz);
        swMesh.receiveShadow = true;
        roadGroup.add(swMesh);

        const stGeo = new THREE.PlaneGeometry(len + 1.5, STREET_HALF_WIDTH * 2);
        stGeo.rotateX(-Math.PI * 0.5);
        const stMesh = new THREE.Mesh(stGeo, asphaltMaterial);
        stMesh.position.set(cx, Y_ROAD + 0.004, sz);
        stMesh.receiveShadow = true;
        roadGroup.add(stMesh);
      };

      const bridgeTrim = new TrimBuilder();

      for (const sz of STREET_ZS) {
        // Barrier island cross-street segment (Ave 1 west edge to Ocean Blvd east edge)
        addFlatCrossStreet(coastX(sz) - 160.0, coastX(sz) - 68.0, sz);
        // Mainland cross-street segment (-710 to Bayfront Blvd / Seawall)
        addFlatCrossStreet(-710.0, bayWestX(sz) - 2.0, sz);

        // Arched Causeway Bridge spanning the Turquoise Bay!
        if (CAUSEWAY_ZS.includes(sz)) {
          const xL = bayWestX(sz) - 3.0;
          const xR = islandWestX(sz) + 3.0;
          const bSegs = 28;
          const bPos = [], bNorm = [], bUv = [], bIdx = [];
          const swPos = [], swNorm = [], swUv = [], swIdx = [];

          for (let i = 0; i <= bSegs; i++) {
            const u = i / bSegs;
            const bx = lerp(xL, xR, u);
            const by = bridgeY(bx, sz);
            const byPrev = bridgeY(bx - 0.4, sz);
            const byNext = bridgeY(bx + 0.4, sz);
            const slope = (byNext - byPrev) / 0.8;
            const nLen = Math.hypot(slope, 1.0);
            const nx = -slope / nLen, ny = 1.0 / nLen;

            // Asphalt road surface
            bPos.push(bx, by + 0.02, sz - STREET_HALF_WIDTH, bx, by + 0.02, sz + STREET_HALF_WIDTH);
            bNorm.push(nx, ny, 0, nx, ny, 0);
            bUv.push(u * 12, 0, u * 12, 1);

            // Sidewalk deck flanking road
            swPos.push(bx, by + 0.14, sz - (STREET_HALF_WIDTH + 2.8), bx, by + 0.14, sz + (STREET_HALF_WIDTH + 2.8));
            swNorm.push(nx, ny, 0, nx, ny, 0);
            swUv.push(u * 12, 0, u * 12, 1);

            if (i < bSegs) {
              const bx1 = lerp(xL, xR, (i + 1) / bSegs);
              const by1 = bridgeY(bx1, sz);
              const mx = (bx + bx1) * 0.5;
              const my = (by + by1) * 0.5;
              const segW = (xR - xL) / bSegs + 0.15;
              const rotZ = Math.atan2(by1 - by, bx1 - bx);
              // Under-deck concrete girder + low edge parapets
              bridgeTrim.addBox(mx, my - 0.55, sz, segW, 1.1, (STREET_HALF_WIDTH + 2.8) * 2, WHITE_SLAB_COL, 0);
              bridgeTrim.addBox(mx, my + 0.62, sz - (STREET_HALF_WIDTH + 2.55), segW, 0.95, 0.45, WHITE_SLAB_COL, 0);
              bridgeTrim.addBox(mx, my + 0.62, sz + (STREET_HALF_WIDTH + 2.55), segW, 0.95, 0.45, WHITE_SLAB_COL, 0);

              // Double yellow centerlines & dashed white markings following arch!
              if (i > 1 && i < bSegs - 1) {
                yellowStrips.push({ x: mx, y: my + 0.05, z: sz - 0.18, w: segW * 0.96, l: 0.18, rotY: 0, rotZ });
                yellowStrips.push({ x: mx, y: my + 0.05, z: sz + 0.18, w: segW * 0.96, l: 0.18, rotY: 0, rotZ });
                if (i % 2 === 0) {
                  whiteStrips.push({ x: mx, y: my + 0.05, z: sz - 3.6, w: segW * 0.65, l: 0.16, rotY: 0, rotZ });
                  whiteStrips.push({ x: mx, y: my + 0.05, z: sz + 3.6, w: segW * 0.65, l: 0.16, rotY: 0, rotZ });
                }
              }
            }

            // Support concrete piers every 6 segments + bridge street lamps
            if (i > 2 && i < bSegs - 2 && i % 5 === 0) {
              bridgeTrim.addBox(bx, (by - 8.0) * 0.5, sz - 5.2, 1.8, by + 8.0, 2.2, [0.78, 0.76, 0.72]);
              bridgeTrim.addBox(bx, (by - 8.0) * 0.5, sz + 5.2, 1.8, by + 8.0, 2.2, [0.78, 0.76, 0.72]);
              lampPositions.push({ x: bx, z: sz - (STREET_HALF_WIDTH + 1.6), y: by + 0.14, rotY: Math.PI * 0.5, twin: false });
              lampPositions.push({ x: bx, z: sz + (STREET_HALF_WIDTH + 1.6), y: by + 0.14, rotY: -Math.PI * 0.5, twin: false });
            }
          }

          for (let i = 0; i < bSegs; i++) {
            const a = i * 2, b = a + 1, c = a + 2, d = c + 1;
            bIdx.push(a, b, c, b, d, c);
            swIdx.push(a, b, c, b, d, c);
          }

          const bGeo = new THREE.BufferGeometry();
          bGeo.setAttribute('position', new THREE.Float32BufferAttribute(bPos, 3));
          bGeo.setAttribute('normal', new THREE.Float32BufferAttribute(bNorm, 3));
          bGeo.setAttribute('uv', new THREE.Float32BufferAttribute(bUv, 2));
          bGeo.setIndex(bIdx);
          const bMesh = new THREE.Mesh(bGeo, asphaltMaterial);
          bMesh.receiveShadow = true;
          roadGroup.add(bMesh);

          const swGeo = new THREE.BufferGeometry();
          swGeo.setAttribute('position', new THREE.Float32BufferAttribute(swPos, 3));
          swGeo.setAttribute('normal', new THREE.Float32BufferAttribute(swNorm, 3));
          swGeo.setAttribute('uv', new THREE.Float32BufferAttribute(swUv, 2));
          swGeo.setIndex(swIdx);
          const swMesh = new THREE.Mesh(swGeo, sidewalkMaterial);
          swMesh.receiveShadow = true;
          roadGroup.add(swMesh);
        }
      }

      // 7) Bay Yacht Marina Pier & Moored Luxury Motor Yachts (Mainland Bayfront at z = -105)
      const marinaZ = -102;
      const mx0 = bayWestX(marinaZ) - 1.0;
      const woodCol = linRGB(0.68, 0.52, 0.36);
      bridgeTrim.addBox(mx0 + 20, 0.85, marinaZ, 40, 0.25, 4.2, woodCol);
      for (let p = 0; p < 5; p++) {
        bridgeTrim.addCylinder([mx0 + 4 + p * 8.5, marinaZ - 1.7], -6.5, 1.1, 0.18, 0.18, 6, woodCol);
        bridgeTrim.addCylinder([mx0 + 4 + p * 8.5, marinaZ + 1.7], -6.5, 1.1, 0.18, 0.18, 6, woodCol);
      }
      for (const fOff of [12, 24, 36]) {
        bridgeTrim.addBox(mx0 + fOff, 0.82, marinaZ, 1.6, 0.2, 26, woodCol);
        // Moored sleek white motor yachts beside finger slips
        for (const side of [-8.5, 8.5]) {
          const yx = mx0 + fOff + 4.2;
          const yz = marinaZ + side;
          bridgeTrim.addBox(yx, 0.45, yz, 8.2, 0.85, 2.8, WHITE_SLAB_COL);
          bridgeTrim.addBox(yx - 0.6, 1.15, yz, 4.4, 0.65, 2.2, WHITE_SLAB_COL);
          bridgeTrim.addBox(yx - 0.3, 1.25, yz, 2.8, 0.36, 2.24, DARK_METAL_COL);
        }
      }

      const bridgeMesh = new THREE.Mesh(bridgeTrim.toGeometry(), trimMaterial);
      bridgeMesh.castShadow = true;
      bridgeMesh.receiveShadow = true;
      roadGroup.add(bridgeMesh);

      // 8) Instanced Road Markings (Dashed lanes, solid edge lines, yellow centerlines, zebra crosswalks, stop bars)
      // Ocean Blvd NB & SB dashed dividers & edge lines
      for (let z = -405; z <= 405; z += 7.5) {
        const nearInt = STREET_ZS.some(sz => Math.abs(sz - z) < STREET_HALF_WIDTH + 5.5);
        const rot = Math.atan(coastDXDZ(z));
        if (!nearInt) {
          whiteStrips.push({ x: coastX(z) - 54.5, y: Y_ROAD + 0.02, z, w: 0.22, l: 3.4, rotY: rot });
          whiteStrips.push({ x: coastX(z) - 67.5, y: Y_ROAD + 0.02, z, w: 0.22, l: 3.4, rotY: rot });
          whiteStrips.push({ x: coastX(z) - 50.4, y: Y_ROAD + 0.02, z, w: 0.2, l: 7.6, rotY: rot });
          whiteStrips.push({ x: coastX(z) - 71.6, y: Y_ROAD + 0.02, z, w: 0.2, l: 7.6, rotY: rot });
          yellowStrips.push({ x: coastX(z) - 58.6, y: Y_ROAD + 0.02, z, w: 0.2, l: 7.6, rotY: rot });
          yellowStrips.push({ x: coastX(z) - 63.4, y: Y_ROAD + 0.02, z, w: 0.2, l: 7.6, rotY: rot });
        }
      }

      // Barrier Island Ave 1 & Mainland Avenues 2..5 centerlines & lane dashes
      for (let a = 1; a <= 5; a++) {
        const zLim = a === 1 ? 405 : 495;
        for (let z = -zLim; z <= zLim; z += 7.5) {
          const nearInt = STREET_ZS.some(sz => Math.abs(sz - z) < STREET_HALF_WIDTH + 4.5);
          if (nearInt) continue;
          const rot = Math.atan(aveDXDZ(a, z));
          const cx = aveCenterX(a, z);
          yellowStrips.push({ x: cx - 0.22, y: Y_ROAD + 0.02, z, w: 0.16, l: 7.6, rotY: rot });
          yellowStrips.push({ x: cx + 0.22, y: Y_ROAD + 0.02, z, w: 0.16, l: 7.6, rotY: rot });
          whiteStrips.push({ x: cx - AVE_HALF_WIDTH[a] * 0.5, y: Y_ROAD + 0.02, z, w: 0.16, l: 3.0, rotY: rot });
          whiteStrips.push({ x: cx + AVE_HALF_WIDTH[a] * 0.5, y: Y_ROAD + 0.02, z, w: 0.16, l: 3.0, rotY: rot });
        }
      }

      // Cross-street yellow centerlines & zebra crosswalks at every intersection
      for (const sz of STREET_ZS) {
        // Barrier island cross-street centerlines (Ave 0 -> Ave 1)
        const bR = coastX(sz) - 72.0 - 5.0;
        const bL = aveCenterX(1, sz) + AVE_HALF_WIDTH[1] + 5.0;
        for (let x = bL; x <= bR; x += 7.5) {
          yellowStrips.push({ x, y: Y_ROAD + 0.022, z: sz - 0.18, w: 4.5, l: 0.16, rotY: 0 });
          yellowStrips.push({ x, y: Y_ROAD + 0.022, z: sz + 0.18, w: 4.5, l: 0.16, rotY: 0 });
        }

        // Mainland cross-street centerlines between avenues 2..6
        for (let a = 2; a < 6; a++) {
          const xR = aveCenterX(a, sz) - AVE_HALF_WIDTH[a] - 5.5;
          const xL = aveCenterX(a + 1, sz) + AVE_HALF_WIDTH[a + 1] + 5.5;
          for (let x = xL; x <= xR; x += 8.0) {
            yellowStrips.push({ x, y: Y_ROAD + 0.022, z: sz - 0.18, w: 4.5, l: 0.16, rotY: 0 });
            yellowStrips.push({ x, y: Y_ROAD + 0.022, z: sz + 0.18, w: 4.5, l: 0.16, rotY: 0 });
          }
        }

        // Intersections at Ave 0, 1 (Barrier Island) and Ave 2, 3, 4, 5 (Mainland)
        for (let a = 0; a <= 5; a++) {
          const ax = aveCenterX(a, sz);
          const hw = AVE_HALF_WIDTH[a];
          const rot = Math.atan(aveDXDZ(a, sz));

          for (const side of [-1, 1]) {
            const cz = sz + side * (STREET_HALF_WIDTH + 2.0);
            const cx = aveCenterX(a, cz);
            const cRot = Math.atan(aveDXDZ(a, cz));
            const bars = a === 0 ? 11 : 8;
            for (let b = 0; b < bars; b++) {
              const off = lerp(-hw + 1.2, hw - 1.2, b / (bars - 1));
              whiteStrips.push({ x: cx + off, y: Y_ROAD + 0.024, z: cz, w: 0.62, l: 2.8, rotY: cRot });
            }
            const sbZ = sz + side * (STREET_HALF_WIDTH + 4.4);
            const sbX = aveCenterX(a, sbZ);
            if (a === 0) {
              const laneOff = side === 1 ? 6.5 : -6.5;
              whiteStrips.push({ x: sbX + laneOff, y: Y_ROAD + 0.024, z: sbZ, w: 8.6, l: 0.45, rotY: cRot });
            } else {
              whiteStrips.push({ x: sbX + side * (hw * 0.5), y: Y_ROAD + 0.024, z: sbZ, w: hw * 0.88, l: 0.42, rotY: cRot });
            }
          }

          const arms = a === 0 ? [-1] : (a === 1 && !CAUSEWAY_ZS.includes(sz) ? [1] : (a === 2 && !CAUSEWAY_ZS.includes(sz) ? [-1] : [-1, 1]));
          for (const arm of arms) {
            const cx = ax + arm * (hw + 2.0);
            const bars = 7;
            for (let b = 0; b < bars; b++) {
              const bz = sz + lerp(-STREET_HALF_WIDTH + 1.1, STREET_HALF_WIDTH - 1.1, b / (bars - 1));
              whiteStrips.push({ x: cx, y: Y_ROAD + 0.024, z: bz, w: 2.8, l: 0.60, rotY: rot * 0.4 });
            }
            whiteStrips.push({
              x: ax + arm * (hw + 4.3),
              y: Y_ROAD + 0.024,
              z: sz + arm * (STREET_HALF_WIDTH * 0.5),
              w: 0.42,
              l: STREET_HALF_WIDTH * 0.86,
              rotY: 0
            });
          }
        }
      }

      // Batch white & yellow markings into 2 InstancedMeshes
      const unitPlane = new THREE.PlaneGeometry(1, 1);
      unitPlane.rotateX(-Math.PI * 0.5);
      const dummy = new THREE.Object3D();

      const whiteInst = new THREE.InstancedMesh(unitPlane, whitePaintMat, whiteStrips.length);
      whiteStrips.forEach((s, i) => {
        dummy.position.set(s.x, s.y, s.z);
        dummy.rotation.set(0, -s.rotY, s.rotZ || 0);
        dummy.scale.set(s.w, 1, s.l);
        dummy.updateMatrix();
        whiteInst.setMatrixAt(i, dummy.matrix);
      });
      whiteInst.instanceMatrix.needsUpdate = true;
      whiteInst.receiveShadow = true;
      roadGroup.add(whiteInst);

      const yellowInst = new THREE.InstancedMesh(unitPlane, yellowPaintMat, yellowStrips.length);
      yellowStrips.forEach((s, i) => {
        dummy.position.set(s.x, s.y, s.z);
        dummy.rotation.set(0, -s.rotY, s.rotZ || 0);
        dummy.scale.set(s.w, 1, s.l);
        dummy.updateMatrix();
        yellowInst.setMatrixAt(i, dummy.matrix);
      });
      yellowInst.instanceMatrix.needsUpdate = true;
      yellowInst.receiveShadow = true;
      roadGroup.add(yellowInst);
    }
    buildStreetNetwork();

    // =========================================================================
    // 11. PARAMETRIC CITY BUILDING MASSING WITH LOD & SETBACKS
    // =========================================================================
    const BEACH_PASTELS = [
      linRGB(0.96, 0.56, 0.50), // Coral flamingo pink
      linRGB(0.95, 0.67, 0.45), // Warm tangerine peach
      linRGB(0.45, 0.85, 0.76), // Tropical seafoam mint
      linRGB(0.50, 0.78, 0.94), // Coastal pastel sky blue
      linRGB(0.95, 0.89, 0.76), // Warm travertine cream
      linRGB(0.95, 0.81, 0.42), // Sunlit buttercream ochre
      linRGB(0.84, 0.66, 0.80), // Pastel bougainvillea mauve
      linRGB(0.95, 0.93, 0.89)  // Crisp sunlit resort white
    ];

    const SKYLINE_GLASS_TINTS = [
      linRGB(0.28, 0.58, 0.76), // Oceanic cerulean glass
      linRGB(0.22, 0.54, 0.62), // Emerald-teal curtain wall
      linRGB(0.52, 0.70, 0.82), // Platinum ice glass
      linRGB(0.26, 0.40, 0.60), // Deep sapphire tower
      linRGB(0.68, 0.64, 0.56), // Warm bronze limestone
      linRGB(0.84, 0.80, 0.74)  // Sunlit architectural precast
    ];

    function buildBeachfrontBuilding(cx, cz, maxW, maxD, rotY, seed, lodHi, lodLo) {
      const bRng = new PRNG(seed);
      const tint = bRng.pick(BEACH_PASTELS);
      const archetype = bRng.int(0, 5);
      const flrH = bRng.range(3.2, 3.6);
      const floors = bRng.int(5, 14);
      const totalH = floors * flrH;
      const yBase = Y_SIDEWALK;
      const bayW = bRng.range(3.6, 4.8);
      const style = archetype === 1 ? 1.0 : 0.0;

      const w = maxW * bRng.range(0.80, 0.94);
      const d = maxD * bRng.range(0.76, 0.92);

      // Helper emits to both hi & lo facade builders, and details only to hi
      const emitMass = (pts, y0, y1, col = tint, bw = bayW, fh = flrH, st = style, slopeFn = null) => {
        lodHi.facade.extrudePolygon(pts, y0, y1, col, bw, fh, st, seed, slopeFn);
        lodLo.facade.extrudePolygon(pts, y0, y1, col, bw, fh, st, seed, slopeFn);
      };

      // 1) Colonnaded Resort Podium (1-2 stories)
      const podiumH = bRng.int(1, 2) * flrH;
      const podiumPts = transformPoly(polyChamfer(w, d, 2.8), cx, cz, rotY);
      emitMass(podiumPts, yBase, yBase + podiumH, tint);
      lodHi.trim.addPolygonSlab(edgeOffsetPoly(podiumPts, 0.45), yBase + podiumH - 0.3, yBase + podiumH + 0.15, WHITE_SLAB_COL);

      // Ground arcade pillars on street/ocean front (Hi LOD)
      for (let i = -2; i <= 2; i++) {
        const lx = w * 0.5 + 0.35;
        const lz = (i / 2.2) * (d * 0.42);
        const cCos = Math.cos(rotY), cSin = Math.sin(rotY);
        const wx = cx + lx * cCos + lz * cSin;
        const wz = cz - lx * cSin + lz * cCos;
        lodHi.trim.addCylinder([wx, wz], yBase, yBase + flrH - 0.1, 0.32, 0.28, 7, WHITE_SLAB_COL);
      }

      // 2) Main Shaft + Setbacks + Rooftop Pools based on archetype
      let roofY = yBase + totalH;
      let roofCX = cx, roofCZ = cz, poolW = w * 0.42, poolD = d * 0.38;

      if (archetype === 0) {
        // U-Shape Resort Courtyard overlooking ocean + rooftop terrace pool
        const shaftPts = transformPoly(polyUShape(w * 0.92, d * 0.94, d * 0.28, w * 0.36), cx, cz, rotY);
        const midY = yBase + podiumH + (totalH - podiumH) * 0.72;
        emitMass(shaftPts, yBase + podiumH, midY);
        const topPts = transformPoly(polyRect(w * 0.44, d * 0.72), cx - Math.cos(rotY) * w * 0.16, cz + Math.sin(rotY) * w * 0.16, rotY);
        emitMass(topPts, midY, roofY);
        // Balconies every floor on main shaft (Hi LOD)
        for (let y = yBase + podiumH + flrH; y < midY - 0.5; y += flrH) {
          const balc = edgeOffsetPoly(shaftPts, 0.85);
          lodHi.trim.addPolygonSlab(balc, y - 0.16, y + 0.04, WHITE_SLAB_COL);
          lodHi.glass.addRibbon(balc, y + 0.04, y + 1.05);
        }
        // Pool on podium courtyard terrace!
        const cCos = Math.cos(rotY), cSin = Math.sin(rotY);
        roofCX = cx + (w * 0.18) * cCos;
        roofCZ = cz - (w * 0.18) * cSin;
        const poolY = yBase + podiumH + 0.2;
        addRooftopPoolDetail(lodHi, roofCX, roofCZ, poolY, w * 0.36, d * 0.34, rotY);
      } else if (archetype === 1) {
        // Streamline Moderne / Art Deco Rounded Boutique Hotel + vertical fin crown
        const tier1Y = yBase + podiumH + (totalH - podiumH) * 0.78;
        const bodyPts = transformPoly(polyRounded(w * 0.86, d * 0.86, 4.2, 3), cx, cz, rotY);
        emitMass(bodyPts, yBase + podiumH, tier1Y);
        const crownPts = transformPoly(polyChamfer(w * 0.52, d * 0.48, 1.8), cx, cz, rotY);
        emitMass(crownPts, tier1Y, roofY);
        // Horizontal eyebrow sunshade ledges
        for (let y = yBase + podiumH + flrH; y < tier1Y; y += flrH) {
          const ledge = edgeOffsetPoly(bodyPts, 0.72);
          lodHi.trim.addPolygonSlab(ledge, y - 0.15, y + 0.05, WHITE_SLAB_COL);
          lodHi.glass.addRibbon(ledge, y + 0.05, y + 0.95);
        }
        // Art Deco central spire fin (no text)
        lodHi.trim.addBox(cx, roofY + 2.8, cz, 1.4, 5.6, d * 0.32, WHITE_SLAB_COL, rotY);
        lodLo.trim.addBox(cx, roofY + 2.6, cz, 1.5, 5.2, d * 0.32, WHITE_SLAB_COL, rotY);
        addRooftopPoolDetail(lodHi, cx, cz, tier1Y + 0.18, w * 0.35, d * 0.28, rotY);
      } else if (archetype === 2) {
        // Stepped Ziggurat Condominium with 3 setback tiers & rooftop infinity pool
        const t1Y = yBase + totalH * 0.45;
        const t2Y = yBase + totalH * 0.78;
        const p1 = transformPoly(polyChamfer(w * 0.90, d * 0.90, 2.2), cx, cz, rotY);
        const p2 = transformPoly(polyChamfer(w * 0.72, d * 0.74, 2.0), cx, cz, rotY);
        const p3 = transformPoly(polyRect(w * 0.50, d * 0.54), cx, cz, rotY);
        emitMass(p1, yBase + podiumH, t1Y);
        emitMass(p2, t1Y, t2Y);
        emitMass(p3, t2Y, roofY);
        for (let y = yBase + podiumH + flrH; y < t1Y; y += flrH) {
          const b = edgeOffsetPoly(p1, 0.8);
          lodHi.trim.addPolygonSlab(b, y - 0.14, y + 0.04, WHITE_SLAB_COL);
          lodHi.glass.addRibbon(b, y + 0.04, y + 1.0);
        }
        for (let y = t1Y + flrH; y < t2Y; y += flrH) {
          const b = edgeOffsetPoly(p2, 0.75);
          lodHi.trim.addPolygonSlab(b, y - 0.14, y + 0.04, WHITE_SLAB_COL);
          lodHi.glass.addRibbon(b, y + 0.04, y + 1.0);
        }
        addRooftopPoolDetail(lodHi, cx, cz, roofY + 0.1, w * 0.34, d * 0.38, rotY);
      } else if (archetype === 3) {
        // Twin-Wing Offset Hotel with Curved Gull-Wing Roof Canopy
        const wingD = d * 0.38;
        const off = d * 0.24;
        const cCos = Math.cos(rotY), cSin = Math.sin(rotY);
        const w1Pts = transformPoly(polyRect(w * 0.84, wingD), cx + off * cSin, cz + off * cCos, rotY);
        const w2Pts = transformPoly(polyRect(w * 0.76, wingD), cx - off * cSin, cz - off * cCos, rotY);
        emitMass(w1Pts, yBase + podiumH, roofY);
        emitMass(w2Pts, yBase + podiumH, roofY - flrH);
        // Sloped modern roof overhang on wing 1
        const capPts = edgeOffsetPoly(w1Pts, 0.85);
        lodHi.facade.extrudePolygon(capPts, roofY, roofY + 1.5, WHITE_SLAB_COL, bayW, flrH, 0, seed, (px, pz, ry) => {
          const lx = (px - cx) * cCos - (pz - cz) * cSin;
          return ry + 0.08 * lx;
        });
        // Balcony strips
        for (let y = yBase + podiumH + flrH; y < roofY - 0.4; y += flrH) {
          const b1 = edgeOffsetPoly(w1Pts, 0.75);
          lodHi.trim.addPolygonSlab(b1, y - 0.14, y + 0.04, WHITE_SLAB_COL);
          lodHi.glass.addRibbon(b1, y + 0.04, y + 1.0);
        }
        addRooftopPoolDetail(lodHi, cx, cz, yBase + podiumH + 0.18, w * 0.42, d * 0.24, rotY);
      } else if (archetype === 4) {
        // L-Shaped Modernist Apartment + Rooftop Pergola & Pool
        const lPts = transformPoly(polyLShape(w * 0.88, d * 0.88, w * 0.44, d * 0.42), cx, cz, rotY);
        emitMass(lPts, yBase + podiumH, roofY);
        for (let y = yBase + podiumH + flrH; y < roofY - 0.4; y += flrH) {
          const b = edgeOffsetPoly(lPts, 0.78);
          lodHi.trim.addPolygonSlab(b, y - 0.14, y + 0.04, WHITE_SLAB_COL);
          lodHi.glass.addRibbon(b, y + 0.04, y + 1.0);
        }
        // Pergola beams on roof
        for (let k = -2; k <= 2; k++) {
          const cCos = Math.cos(rotY), cSin = Math.sin(rotY);
          const lx = -w * 0.16, lz = k * 2.2;
          lodHi.trim.addBox(cx + lx * cCos + lz * cSin, roofY + 2.3, cz - lx * cSin + lz * cCos, w * 0.34, 0.22, 0.32, WHITE_SLAB_COL, rotY);
        }
        addRooftopPoolDetail(lodHi, cx - Math.cos(rotY) * w * 0.16, cz + Math.sin(rotY) * w * 0.16, roofY + 0.1, w * 0.34, d * 0.30, rotY);
      } else {
        // Octagonal / Chamfered Beachfront Tower with Crown Louvers & Rooftop Infinity Pool
        const shPts = transformPoly(polyChamfer(w * 0.84, d * 0.84, 4.5), cx, cz, rotY);
        const topY = roofY - flrH * 1.3;
        emitMass(shPts, yBase + podiumH, topY);
        const crPts = transformPoly(polyChamfer(w * 0.62, d * 0.62, 3.0), cx, cz, rotY);
        emitMass(crPts, topY, roofY);
        for (let y = yBase + podiumH + flrH; y < topY - 0.3; y += flrH) {
          const b = edgeOffsetPoly(shPts, 0.85);
          lodHi.trim.addPolygonSlab(b, y - 0.15, y + 0.05, WHITE_SLAB_COL);
          lodHi.glass.addRibbon(b, y + 0.05, y + 1.02);
        }
        addRooftopPoolDetail(lodHi, cx, cz, roofY + 0.1, w * 0.38, d * 0.36, rotY);
      }

      // Subtle parapet cap & mechanical penthouse on every roof
      lodHi.trim.addBox(cx, roofY + 0.85, cz, w * 0.20, 1.7, d * 0.18, WHITE_SLAB_COL, rotY);
    }

    function addRooftopPoolDetail(lodHi, cx, cz, yDeck, w, d, rotY) {
      const pw = Math.max(5.5, Math.min(w * 1.25, 16.0));
      const pd = Math.max(6.5, Math.min(d * 1.25, 19.0));
      // Raised warm teak/travertine pool deck
      lodHi.trim.addBox(cx, yDeck + 0.14, cz, pw + 3.6, 0.28, pd + 3.6, POOL_DECK_COL, rotY);
      // Pool coping rim
      lodHi.trim.addBox(cx, yDeck + 0.30, cz, pw + 0.9, 0.24, pd + 0.9, WHITE_SLAB_COL, rotY);
      // Shimmering turquoise pool water surface
      lodHi.pool.addBox(cx, yDeck + 0.44, cz, pw - 0.2, 0.08, pd - 0.2, [0.08, 0.88, 0.88], rotY);
      // Poolside sun loungers & resort umbrellas
      const cCos = Math.cos(rotY), cSin = Math.sin(rotY);
      for (let i = -1; i <= 1; i++) {
        const lx = pw * 0.5 + 1.15;
        const lz = i * (pd * 0.28);
        lodHi.trim.addBox(cx + lx * cCos + lz * cSin, yDeck + 0.38, cz - lx * cSin + lz * cCos, 1.5, 0.24, 0.70, WHITE_SLAB_COL, rotY);
      }
      // Small bright poolside shade umbrella on deck corner
      const ux = -(pw * 0.5 + 1.1) * cCos + (pd * 0.32) * cSin;
      const uz = (pw * 0.5 + 1.1) * cSin + (pd * 0.32) * cCos;
      lodHi.trim.addCylinder([cx + ux, cz + uz], yDeck + 0.28, yDeck + 2.3, 0.05, 0.05, 5, WHITE_SLAB_COL);
      lodHi.trim.addCylinder([cx + ux, cz + uz], yDeck + 2.1, yDeck + 2.55, 1.35, 0.08, 7, linRGB(0.96, 0.45, 0.38));
    }

    function buildSkylineTower(cx, cz, maxW, maxD, rotY, heightTarget, seed, lodHi, lodLo) {
      const tRng = new PRNG(seed);
      const tint = tRng.pick(SKYLINE_GLASS_TINTS);
      const isCurtain = tint[0] < 0.70;
      const style = isCurtain ? 2.0 : 3.0;
      const flrH = tRng.range(3.5, 4.1);
      const totalH = heightTarget;
      const yBase = Y_SIDEWALK;
      const bayW = isCurtain ? tRng.range(2.6, 3.6) : tRng.range(3.6, 4.6);
      const type = tRng.int(0, 5);

      const w = maxW * tRng.range(0.74, 0.90);
      const d = maxD * tRng.range(0.74, 0.90);

      const emit = (pts, y0, y1, col = tint, slopeFn = null) => {
        lodHi.facade.extrudePolygon(pts, y0, y1, col, bayW, flrH, style, seed, slopeFn);
        lodLo.facade.extrudePolygon(pts, y0, y1, col, bayW, flrH, style, seed, slopeFn);
      };

      // Sleek 3-story podium base
      const podH = flrH * tRng.int(2, 3);
      const podPts = transformPoly(polyChamfer(w, d, 3.5), cx, cz, rotY);
      emit(podPts, yBase, yBase + podH, linRGB(0.74, 0.75, 0.77));
      lodHi.trim.addPolygonSlab(edgeOffsetPoly(podPts, 0.4), yBase + podH - 0.35, yBase + podH + 0.15, DARK_METAL_COL);

      const cCos = Math.cos(rotY), cSin = Math.sin(rotY);

      if (type === 0) {
        // Multi-tier setback octagonal skyscraper + spire
        const y1 = yBase + totalH * 0.56;
        const y2 = yBase + totalH * 0.84;
        const y3 = yBase + totalH;
        const p1 = transformPoly(polyChamfer(w * 0.84, d * 0.84, 5.2), cx, cz, rotY);
        const p2 = transformPoly(polyChamfer(w * 0.68, d * 0.68, 4.2), cx, cz, rotY);
        const p3 = transformPoly(polyChamfer(w * 0.48, d * 0.48, 2.8), cx, cz, rotY);
        emit(p1, yBase + podH, y1);
        emit(p2, y1, y2);
        emit(p3, y2, y3);
        // Mechanical louver crown + architectural spire
        lodHi.trim.addBox(cx, y3 + 2.4, cz, w * 0.28, 4.8, d * 0.28, DARK_METAL_COL, rotY);
        lodHi.trim.addCylinder([cx, cz], y3 + 4.8, y3 + 18.0, 0.55, 0.12, 8, WHITE_SLAB_COL);
        lodLo.trim.addCylinder([cx, cz], y3, y3 + 15.0, 0.65, 0.15, 6, WHITE_SLAB_COL);
      } else if (type === 1) {
        // Twisting / Offset Stacked Glass Volumes with Sky-Gardens
        const y1 = yBase + totalH * 0.42;
        const y2 = yBase + totalH * 0.76;
        const y3 = yBase + totalH;
        const p1 = transformPoly(polyChamfer(w * 0.86, d * 0.76, 2.6), cx, cz, rotY);
        const p2 = transformPoly(polyChamfer(w * 0.74, d * 0.74, 3.0), cx + 2.5 * cCos, cz - 2.5 * cSin, rotY + 0.22);
        const p3 = transformPoly(polyChamfer(w * 0.56, d * 0.62, 2.4), cx - 1.5 * cCos, cz + 1.5 * cSin, rotY + 0.42);
        emit(p1, yBase + podH, y1);
        emit(p2, y1, y2);
        emit(p3, y2, y3);
        lodHi.trim.addPolygonSlab(edgeOffsetPoly(p2, 0.4), y1 - 0.3, y1 + 0.2, WHITE_SLAB_COL);
        lodHi.trim.addPolygonSlab(edgeOffsetPoly(p3, 0.4), y2 - 0.3, y2 + 0.2, WHITE_SLAB_COL);
      } else if (type === 2) {
        // Dramatic Diagonal-Crown Crystal Skyscraper
        const shPts = transformPoly(polyChamfer(w * 0.80, d * 0.80, 4.0), cx, cz, rotY);
        const yTop = yBase + totalH;
        const slopeDir = tRng.chance(0.5) ? 1 : -1;
        emit(shPts, yBase + podH, yTop, tint, (px, pz, ry) => {
          const lx = (px - cx) * cCos - (pz - cz) * cSin;
          return ry + slopeDir * 0.45 * lx;
        });
        // Crown parapet rim
        lodHi.trim.addBox(cx, yTop + 1.5, cz, w * 0.32, 3.0, d * 0.16, DARK_METAL_COL, rotY);
      } else if (type === 3) {
        // Twin-Tower Connected by Glass Skybridge
        const gap = d * 0.24;
        const td = d * 0.34;
        const tw = w * 0.74;
        const y1 = yBase + totalH * 0.92;
        const y2 = yBase + totalH;
        const pA = transformPoly(polyChamfer(tw, td, 2.4), cx + gap * cSin, cz + gap * cCos, rotY);
        const pB = transformPoly(polyChamfer(tw, td, 2.4), cx - gap * cSin, cz - gap * cCos, rotY);
        emit(pA, yBase + podH, y2);
        emit(pB, yBase + podH, y1);
        // Skybridge at 60% height
        const sbY0 = yBase + totalH * 0.56;
        const sbPts = transformPoly(polyRect(tw * 0.55, gap * 1.4), cx, cz, rotY);
        emit(sbPts, sbY0, sbY0 + flrH * 1.8);
        lodHi.trim.addCylinder([cx + gap * cSin, cz + gap * cCos], y2, y2 + 12.0, 0.45, 0.1, 6, WHITE_SLAB_COL);
      } else if (type === 4) {
        // Elliptical / Sail-Shaped Waterfront Megatower
        const y1 = yBase + totalH * 0.65;
        const y2 = yBase + totalH;
        const p1 = transformPoly(polyEllipse(w * 0.46, d * 0.38, 16), cx, cz, rotY);
        const p2 = transformPoly(polyEllipse(w * 0.36, d * 0.30, 14), cx, cz, rotY);
        emit(p1, yBase + podH, y1);
        emit(p2, y1, y2, tint, (px, pz, ry) => {
          const lx = (px - cx) * cCos - (pz - cz) * cSin;
          return ry - 0.22 * lx;
        });
        // Recessed mechanical mid-band
        lodHi.trim.addPolygonSlab(edgeOffsetPoly(p1, 0.2), yBase + totalH * 0.34, yBase + totalH * 0.36, DARK_METAL_COL);
      } else {
        // Cross / Cruciform Stepped High-Rise with Architectural Ribs
        const y1 = yBase + totalH * 0.60;
        const y2 = yBase + totalH;
        const p1 = transformPoly(polyCross(w * 0.86, d * 0.86, w * 0.46, d * 0.46), cx, cz, rotY);
        const p2 = transformPoly(polyChamfer(w * 0.52, d * 0.52, 2.5), cx, cz, rotY);
        emit(p1, yBase + podH, y1);
        emit(p2, y1, y2);
        lodHi.trim.addBox(cx, y2 + 2.2, cz, w * 0.30, 4.4, d * 0.30, DARK_METAL_COL, rotY);
      }
    }

    function createCitySector() {
      return {
        facade: new FacadeBuilder(),
        trim: new TrimBuilder(),
        glass: new GlassRailBuilder(),
        pool: new TrimBuilder()
      };
    }

    function finalizeSectorLOD(hi, lo) {
      const lod = new THREE.LOD();
      const hiGrp = new THREE.Group();
      const loGrp = new THREE.Group();

      if (hi.facade.vCount > 0) {
        const m = new THREE.Mesh(hi.facade.toGeometry(), facadeMaterial);
        m.castShadow = true; m.receiveShadow = true;
        hiGrp.add(m);
      }
      if (hi.trim.vCount > 0) {
        const m = new THREE.Mesh(hi.trim.toGeometry(), trimMaterial);
        m.castShadow = true; m.receiveShadow = true;
        hiGrp.add(m);
      }
      if (hi.glass.vCount > 0) {
        const m = new THREE.Mesh(hi.glass.toGeometry(), balconyGlassMaterial);
        hiGrp.add(m);
      }
      if (hi.pool.vCount > 0) {
        const m = new THREE.Mesh(hi.pool.toGeometry(), poolWaterMaterial);
        m.receiveShadow = true;
        hiGrp.add(m);
      }

      if (lo.facade.vCount > 0) {
        const m = new THREE.Mesh(lo.facade.toGeometry(), facadeMaterial);
        m.castShadow = true; m.receiveShadow = true;
        loGrp.add(m);
      }
      if (lo.trim.vCount > 0) {
        const m = new THREE.Mesh(lo.trim.toGeometry(), trimMaterial);
        loGrp.add(m);
      }

      lod.addLevel(hiGrp, 0);
      lod.addLevel(loGrp, 680);
      return lod;
    }

    function buildMetropolis() {
      const cityGroup = new THREE.Group();
      scene.add(cityGroup);

      // 3 coastal sectors (South, Central, North) for LOD culling & precision
      const sectors = Array.from({ length: 3 }, () => ({
        hi: createCitySector(),
        lo: createCitySector(),
        centerSum: new THREE.Vector3(),
        count: 0
      }));

      const pickSector = (z) => (z > 130 ? 0 : z > -140 ? 1 : 2);

      // Populate blocks on Barrier Island (a=0) and Mainland (a=2..5)
      for (let sIdx = 0; sIdx < STREET_ZS.length - 1; sIdx++) {
        const z0 = STREET_ZS[sIdx] + STREET_HALF_WIDTH + 4.5;
        const z1 = STREET_ZS[sIdx + 1] - STREET_HALF_WIDTH - 4.5;
        const blkL = z1 - z0;
        const zMid = (z0 + z1) * 0.5;
        const sec = sectors[pickSector(zMid)];

        for (let a = 0; a <= 5; a++) {
          if (a === 1) continue; // Gap between Ave 1 and Ave 2 is the Turquoise Biscayne Bay!
          const xRight = (a === 0 ? coastX(zMid) - 78.5 : aveCenterX(a, zMid) - AVE_HALF_WIDTH[a] - 4.5);
          const xLeft = aveCenterX(a + 1, zMid) + AVE_HALF_WIDTH[a + 1] + 4.5;
          const blkW = xRight - xLeft;
          if (blkW < 24 || blkL < 24) continue;

          const blkRot = -Math.atan((aveDXDZ(a, zMid) + aveDXDZ(a + 1, zMid)) * 0.5);

          if (a === 0) {
            // Barrier Island Ocean Drive Pastel Art Deco & Modernist Hotels/Condos
            const subZ = 2;
            const subX = blkW > 52 ? 2 : 1;
            for (let iz = 0; iz < subZ; iz++) {
              for (let ix = 0; ix < subX; ix++) {
                const pz = lerp(z0 + blkL * 0.24, z1 - blkL * 0.24, iz / (subZ - 1));
                const rx = coastX(pz) - 79.0;
                const lx = aveCenterX(1, pz) + AVE_HALF_WIDTH[1] + 4.5;
                const px = subX === 1 ? (rx + lx) * 0.5 : lerp(lx + 14, rx - 14, ix);
                const plotW = (rx - lx) / subX - 5.0;
                const plotD = blkL / subZ - 5.0;
                const seed = 1000 + sIdx * 97 + ix * 17 + iz * 31;

                sec.hi.trim.addBox(px, Y_SIDEWALK + 0.04, pz, plotW * 0.98, 0.08, plotD * 0.98, linRGB(0.32, 0.58, 0.28), blkRot);
                buildBeachfrontBuilding(px, pz, plotW, plotD, blkRot, seed, sec.hi, sec.lo);

                palmSites.push({
                  x: px + plotW * 0.44, z: pz + plotD * 0.40, y: Y_SIDEWALK,
                  type: 'coconut', scale: rng.range(0.75, 1.05), leanAngle: rng.range(0.05, 0.14), leanDir: rng.range(-1, 1)
                });
              }
            }
          } else {
            // Mainland Downtown Bayfront High-Rise Skyline (a=2,3,4) & Low-Rise Palm Suburbs (a=5)
            const distCenter = Math.abs(zMid + 30) / 380.0;
            const zoneFactor = Math.max(0.42, 1.12 - 0.65 * distCenter * distCenter);
            const tierBase = a === 2 ? 105 : (a === 3 ? 155 : (a === 4 ? 118 : 34));
            const subZ = blkL > 56 ? 2 : 1;
            const subX = blkW > 66 ? 2 : 1;
            for (let iz = 0; iz < subZ; iz++) {
              for (let ix = 0; ix < subX; ix++) {
                // Lush Bayfront Tropical Plaza Park on Mainland Ave 2
                if (a === 2 && sIdx === 4 && ix === 1 && iz === 0) {
                  const pz = z0 + blkL * 0.26;
                  const px = aveCenterX(2, pz) - 24;
                  sec.hi.trim.addBox(px, Y_SIDEWALK + 0.06, pz, 28, 0.12, 26, linRGB(0.24, 0.56, 0.24), blkRot);
                  for (let k = 0; k < 6; k++) {
                    palmSites.push({
                      x: px + rng.range(-10, 10), z: pz + rng.range(-9, 9), y: Y_SIDEWALK + 0.1,
                      type: 'royal', scale: rng.range(0.85, 1.15), leanAngle: rng.range(0.02, 0.07), leanDir: rng.range(0, 6.28)
                    });
                  }
                  continue;
                }
                const pz = subZ === 1 ? zMid : lerp(z0 + blkL * 0.25, z1 - blkL * 0.25, iz);
                const rx = aveCenterX(a, pz) - AVE_HALF_WIDTH[a] - 5.0;
                const lx = aveCenterX(a + 1, pz) + AVE_HALF_WIDTH[a + 1] + 5.0;
                const px = subX === 1 ? (rx + lx) * 0.5 : lerp(lx + 18, rx - 18, ix);
                const plotW = (rx - lx) / subX - 6.0;
                const plotD = blkL / subZ - 6.0;
                const seed = 5000 + sIdx * 131 + a * 41 + ix * 19 + iz * 7;
                const isSignature = (a === 3 && sIdx === 4 && iz === 0 && ix === 0);
                const h = isSignature ? 245 : tierBase * zoneFactor * rng.range(0.62, 1.38);

                if (a >= 5 || h < 48) {
                  buildBeachfrontBuilding(px, pz, plotW, plotD, blkRot, seed, sec.hi, sec.lo);
                } else {
                  buildSkylineTower(px, pz, plotW, plotD, blkRot, h, seed, sec.hi, sec.lo);
                }
              }
            }
          }
        }
      }

      // Outer Mainland Skyline & Suburban Coastal Sprawl for seamless zoomed-out vistas!
      const backdropCoords = [];
      for (let i = 0; i < 72; i++) {
        const z = rng.range(-640, 620);
        const x = rng.range(-880, -688);
        backdropCoords.push([x, z, rng.range(16, 40)]);
      }
      for (let i = 0; i < 42; i++) {
        const z = rng.chance(0.55) ? rng.range(-680, -485) : rng.range(485, 680);
        const x = rng.range(-780, bayWestX(z) - 24);
        backdropCoords.push([x, z, rng.range(18, 82)]);
      }
      // Palm park groves on both sandy tips of the Barrier Island
      for (const tipSign of [-1, 1]) {
        for (let k = 0; k < 24; k++) {
          const tz = tipSign * rng.range(412, 455);
          const tx = lerp(islandWestX(tz) + 10, coastX(tz) - 18, rng.next());
          const ty = seabedHeight(tx, tz);
          if (ty > 0.6) {
            palmSites.push({
              x: tx, z: tz, y: ty,
              type: 'coconut', scale: rng.range(0.85, 1.25), leanAngle: rng.range(0.06, 0.2), leanDir: rng.range(0, 6.28)
            });
          }
        }
      }
      backdropCoords.forEach(([bx, bz, bh], idx) => {
        const sec = sectors[pickSector(bz)];
        if (bh < 44) {
          buildBeachfrontBuilding(bx, bz, rng.range(24, 34), rng.range(24, 34), rng.range(-0.08, 0.08), 9000 + idx * 17, sec.hi, sec.lo);
        } else {
          buildSkylineTower(bx, bz, rng.range(28, 38), rng.range(28, 38), rng.range(-0.1, 0.1), bh, 9000 + idx * 17, sec.hi, sec.lo);
        }
      });

      // Attach LODs centered nicely
      const sectorCenters = [new THREE.Vector3(-280, 30, 240), new THREE.Vector3(-280, 30, -10), new THREE.Vector3(-280, 30, -260)];
      sectors.forEach((s, idx) => {
        const lod = finalizeSectorLOD(s.hi, s.lo);
        // Position LOD anchor at sector center by offsetting children? No, children are in world coords,
        // so keep LOD at origin OR compute distance manually? Wait: THREE.LOD computes distance to lod.getWorldPosition!
        // Let's keep world coords intact AND wrap in a helper or shift geometries relative to sectorCenter!
        // Shifting vertices by -center and setting lod.position.copy(center) gives EXACT THREE.LOD distance checks!
        const c = sectorCenters[idx];
        lod.levels.forEach(lvl => {
          lvl.object.position.set(-c.x, -c.y, -c.z);
        });
        lod.position.copy(c);
        cityGroup.add(lod);
      });

      return cityGroup;
    }
    const cityGroup = buildMetropolis();

    // =========================================================================
    // 12. INSTANCED SWAYING TROPICAL PALMS (COCONUT & ROYAL PALMS)
    // =========================================================================
    function buildPalmTrees() {
      // Coconut Palm Trunk: graceful curved tapering trunk
      const makeTrunkGeo = (curved) => {
        const segsY = 7, segsR = 6;
        const pos = [], norm = [], idx = [];
        const h = curved ? 12.5 : 13.5;
        for (let iy = 0; iy <= segsY; iy++) {
          const t = iy / segsY;
          const y = t * h;
          const bend = curved ? Math.pow(t, 1.7) * 1.45 : 0;
          const r = curved ? lerp(0.30, 0.13, t) : lerp(0.36, 0.20, Math.pow(t, 0.7)) * (1.0 + 0.08 * Math.sin(t * Math.PI));
          for (let ir = 0; ir <= segsR; ir++) {
            const a = (ir / segsR) * Math.PI * 2;
            const ca = Math.cos(a), sa = Math.sin(a);
            pos.push(bend + r * ca, y, r * sa);
            norm.push(ca, 0.08, sa);
          }
        }
        for (let iy = 0; iy < segsY; iy++) {
          for (let ir = 0; ir < segsR; ir++) {
            const a = iy * (segsR + 1) + ir;
            const b = a + 1;
            const c = a + segsR + 1;
            const d = c + 1;
            idx.push(a, b, c, b, d, c);
          }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
        g.setIndex(idx);
        return g;
      };

      // Crown of 9 arching feathered pinnate palm fronds per tree!
      const makeCrownGeo = (curved) => {
        const pos = [], norm = [], idx = [];
        const topY = curved ? 12.4 : 13.4;
        const topX = curved ? 1.45 : 0.0;
        const nFronds = curved ? 9 : 11;
        let vc = 0;

        for (let f = 0; f < nFronds; f++) {
          const az = (f / nFronds) * Math.PI * 2 + (f % 2) * 0.25;
          const ca = Math.cos(az), sa = Math.sin(az);
          const pitchLift = (f % 3 === 0) ? 0.65 : (f % 3 === 1 ? 0.25 : -0.15);
          const fLen = curved ? 3.8 : 3.4;
          const segs = 5;
          // Build arching tapered frond blade with V-fold cross section
          for (let s = 0; s <= segs; s++) {
            const u = s / segs;
            const r = u * fLen;
            const archY = topY + u * (1.2 + pitchLift) - u * u * 2.15;
            const w = Math.sin(Math.pow(u, 0.72) * Math.PI) * (curved ? 0.68 : 0.58) + 0.04;

            const cx = topX + ca * r;
            const cz = sa * r;
            // Side vector perpendicular to frond direction
            const sx = -sa * w;
            const sz = ca * w;

            // Left tip, spine, right tip (creates crisp 3D V-trough frond silhouette!)
            pos.push(cx + sx, archY - 0.14 * w, cz + sz);
            pos.push(cx, archY + 0.05, cz);
            pos.push(cx - sx, archY - 0.14 * w, cz - sz);
            norm.push(-0.2 * sa, 0.94, 0.2 * ca, 0, 1, 0, 0.2 * sa, 0.94, -0.2 * ca);
          }
          for (let s = 0; s < segs; s++) {
            const b = vc + s * 3;
            idx.push(b, b + 1, b + 3, b + 1, b + 4, b + 3);
            idx.push(b + 1, b + 2, b + 4, b + 2, b + 5, b + 4);
          }
          vc += (segs + 1) * 3;
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
        g.setIndex(idx);
        return g;
      };

      const trunkMat = applyPalmWindHook(new THREE.MeshStandardMaterial({
        color: 0x8e7459,
        roughness: 0.92,
        metalness: 0.0
      }), false);

      const frondMat = applyPalmWindHook(new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.62,
        metalness: 0.0,
        side: THREE.DoubleSide
      }), true);

      // Depth material for swaying frond shadows!
      const frondDepthMat = applyPalmWindHook(new THREE.MeshDepthMaterial({
        depthPacking: THREE.RGBADepthPacking
      }), true);
      frondDepthMat.side = THREE.DoubleSide;

      // Plant lush coastal palm groves on mainland north/south greenhills & western coastal hills
      for (let i = 0; i < 220; i++) {
        const hz = (i < 150)
          ? (rng.chance(0.55) ? -1 : 1) * rng.range(505, 860)
          : rng.range(-500, 500);
        const hx = (i < 150)
          ? rng.range(-820, bayWestX(hz) - 14)
          : rng.range(-840, -695);
        const hy = seabedHeight(hx, hz);
        if (hy < 1.5) continue;
        palmSites.push({
          x: hx, z: hz, y: hy - 0.1,
          type: 'coconut', scale: rng.range(0.88, 1.35), leanAngle: rng.range(0.04, 0.18), leanDir: rng.range(0, Math.PI * 2)
        });
      }

      const coconutList = palmSites.filter(p => p.type === 'coconut');
      const royalList = palmSites.filter(p => p.type === 'royal');
      const dummy = new THREE.Object3D();
      const col = new THREE.Color();

      const buildPalmBatch = (list, curved) => {
        if (list.length === 0) return;
        const trunkInst = new THREE.InstancedMesh(makeTrunkGeo(curved), trunkMat, list.length);
        const crownInst = new THREE.InstancedMesh(makeCrownGeo(curved), frondMat, list.length);
        trunkInst.castShadow = true;
        trunkInst.receiveShadow = true;
        crownInst.castShadow = true;
        crownInst.customDepthMaterial = frondDepthMat;

        list.forEach((p, i) => {
          dummy.position.set(p.x, p.y, p.z);
          dummy.rotation.set(0, p.leanDir, -p.leanAngle);
          dummy.scale.set(p.scale, p.scale, p.scale);
          dummy.updateMatrix();
          trunkInst.setMatrixAt(i, dummy.matrix);
          crownInst.setMatrixAt(i, dummy.matrix);

          if (!curved) {
            col.setHSL(0.08, 0.14, rng.range(0.68, 0.78)); // Royal palm pale grey-tan trunk
          } else {
            col.setHSL(0.08, 0.25, rng.range(0.45, 0.58)); // Coconut warm brown trunk
          }
          trunkInst.setColorAt(i, col);

          col.setHSL(rng.range(0.26, 0.33), rng.range(0.55, 0.72), rng.range(0.32, 0.45));
          crownInst.setColorAt(i, col);
        });
        trunkInst.instanceMatrix.needsUpdate = true;
        crownInst.instanceMatrix.needsUpdate = true;
        trunkInst.instanceColor.needsUpdate = true;
        crownInst.instanceColor.needsUpdate = true;
        scene.add(trunkInst);
        scene.add(crownInst);
      };

      buildPalmBatch(coconutList, true);
      buildPalmBatch(royalList, false);
    }
    buildPalmTrees();

    // =========================================================================
    // 13. INSTANCED STREET LAMPS (GRADUALLY GLOWING IN GOLDEN HOUR)
    // =========================================================================
    function buildStreetLamps() {
      const poleMat = new THREE.MeshStandardMaterial({
        color: 0x2c333b,
        roughness: 0.42,
        metalness: 0.72
      });
      const bulbMat = new THREE.MeshStandardMaterial({
        color: 0xfff3d4,
        emissive: 0xffb85c,
        emissiveIntensity: 0.0,
        roughness: 0.2
      });

      // Pole geometry (single vs twin merged)
      const makePoleGeo = (twin) => {
        const tb = new TrimBuilder();
        const col = [0.22, 0.25, 0.28];
        tb.addCylinder([0, 0], 0, 7.6, 0.14, 0.09, 6, col);
        if (twin) {
          tb.addBox(-1.0, 7.65, 0, 2.0, 0.11, 0.11, col);
          tb.addBox(1.0, 7.65, 0, 2.0, 0.11, 0.11, col);
        } else {
          tb.addBox(0.95, 7.65, 0, 1.9, 0.11, 0.11, col);
        }
        return tb.toGeometry();
      };

      const makeBulbGeo = (twin) => {
        const tb = new TrimBuilder();
        const col = [1, 1, 1];
        if (twin) {
          tb.addBox(-1.85, 7.42, 0, 0.56, 0.28, 0.34, col);
          tb.addBox(1.85, 7.42, 0, 0.56, 0.28, 0.34, col);
        } else {
          tb.addBox(1.78, 7.42, 0, 0.56, 0.28, 0.34, col);
        }
        return tb.toGeometry();
      };

      // Soft warm ground light pool + luminaire halo driven by uDuskGlow
      const makePoolGeo = (twin) => {
        const g1 = new THREE.PlaneGeometry(11.0, 11.0);
        g1.rotateX(-Math.PI * 0.5);
        if (!twin) {
          g1.translate(1.8, 0.06, 0);
          return g1;
        }
        const gL = g1.clone(); gL.translate(-2.4, 0.06, 0);
        const gR = g1.clone(); gR.translate(2.4, 0.06, 0);
        const pL = gL.attributes.position.array;
        const pR = gR.attributes.position.array;
        const uL = gL.attributes.uv.array;
        const uR = gR.attributes.uv.array;
        const merged = new THREE.BufferGeometry();
        const pos = new Float32Array(pL.length + pR.length);
        pos.set(pL, 0); pos.set(pR, pL.length);
        const uv = new Float32Array(uL.length + uR.length);
        uv.set(uL, 0); uv.set(uR, uL.length);
        const idxL = gL.index.array;
        const idxR = gR.index.array;
        const idx = new Uint16Array(idxL.length + idxR.length);
        idx.set(idxL, 0);
        for (let i = 0; i < idxR.length; i++) idx[idxL.length + i] = idxR[i] + 4;
        merged.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        merged.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
        merged.setIndex(new THREE.BufferAttribute(idx, 1));
        return merged;
      };

      const poolMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: { uDuskGlow: uShared.uDuskGlow },
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            vec4 wp = vec4(position, 1.0);
            #ifdef USE_INSTANCING
              wp = instanceMatrix * wp;
            #endif
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uDuskGlow;
          varying vec2 vUv;
          void main() {
            float d = length(vUv - 0.5) * 2.0;
            float falloff = pow(max(0.0, 1.0 - d), 2.4);
            gl_FragColor = vec4(vec3(1.0, 0.68, 0.28) * falloff * uDuskGlow * 0.48, 1.0);
          }
        `
      });

      const singles = lampPositions.filter(l => !l.twin);
      const twins = lampPositions.filter(l => l.twin);
      const dummy = new THREE.Object3D();

      const addBatch = (arr, twin) => {
        if (!arr.length) return;
        const pInst = new THREE.InstancedMesh(makePoleGeo(twin), poleMat, arr.length);
        const bInst = new THREE.InstancedMesh(makeBulbGeo(twin), bulbMat, arr.length);
        const lInst = new THREE.InstancedMesh(makePoolGeo(twin), poolMat, arr.length);
        pInst.castShadow = true;
        arr.forEach((l, i) => {
          dummy.position.set(l.x, l.y, l.z);
          dummy.rotation.set(0, l.rotY, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          pInst.setMatrixAt(i, dummy.matrix);
          bInst.setMatrixAt(i, dummy.matrix);
          lInst.setMatrixAt(i, dummy.matrix);
        });
        pInst.instanceMatrix.needsUpdate = true;
        bInst.instanceMatrix.needsUpdate = true;
        lInst.instanceMatrix.needsUpdate = true;
        scene.add(pInst);
        scene.add(bInst);
        scene.add(lInst);
      };

      addBatch(singles, false);
      addBatch(twins, true);
      return bulbMat;
    }
    const streetLampBulbMat = buildStreetLamps();

    // =========================================================================
    // 14. BEACH UMBRELLAS, LOUNGERS, LIFEGUARD TOWERS & TINY PEOPLE
    // =========================================================================
    const walkers = []; // { x, z, y, dir, speed, phase, minZ, maxZ }

    function buildBeachLife() {
      const dummy = new THREE.Object3D();
      const col = new THREE.Color();

      // 1) Colorful Beach Umbrellas (cone canopy + wooden pole)
      const umbrellaPalette = [
        0xef473a, // Coral crimson

      const umbCanopyInst = new THREE.InstancedMesh(canopyGeo, canopyMat, umbrellaList.length);
      const umbPoleInst = new THREE.InstancedMesh(poleGeo, poleMat, umbrellaList.length);
      umbCanopyInst.castShadow = true;
      umbCanopyInst.receiveShadow = true;

      umbrellaList.forEach((u, i) => {

        dummy.rotation.set(u.tiltX, u.rotY, u.tiltZ);
        dummy.scale.set(u.scale, u.scale, u.scale);
        dummy.updateMatrix();
        umbCanopyInst.setMatrixAt(i, dummy.matrix);
        umbPoleInst.setMatrixAt(i, dummy.matrix);
        col.setHex(u.color);
        umbCanopyInst.setColorAt(i, col);

      umbCanopyInst.instanceMatrix.needsUpdate = true;
      umbPoleInst.instanceMatrix.needsUpdate = true;
      umbCanopyInst.instanceColor.needsUpdate = true;

      scene.add(umbPoleInst);

      const loungerInst = new THREE.InstancedMesh(loungerGeo, loungerMat, loungerList.length);

      loungerList.forEach((l, i) => {
        dummy.position.set(l.x, l.y, l.z);
        dummy.rotation.set(0, l.rotY, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        loungerInst.setMatrixAt(i, dummy.matrix);
      });
      loungerInst.instanceMatrix.needsUpdate = true;
      scene.add(loungerInst);

      // 2) Coastal Lifeguard Towers (5 clean pastel wooden huts on stilts, zero text)
      const lgTb = new TrimBuilder();
      const lgColors = [
        linRGB(0.32, 0.80, 0.85),
        linRGB(0.95, 0.56, 0.48),
        linRGB(0.95, 0.82, 0.40),
        linRGB(0.45, 0.84, 0.72),
        linRGB(0.48, 0.74, 0.94)
      ];
      [-310, -155, 0, 155, 310].forEach((tz, idx) => {
        const tx = coastX(tz) - 24.0;
        const ty = seabedHeight(tx, tz);
        const hCol = lgColors[idx];
        // 4 stilts
        for (const sx of [-1.2, 1.2]) {
          for (const sz of [-1.2, 1.2]) {
            lgTb.addBox(tx + sx, ty + 1.1, tz + sz, 0.18, 2.2, 0.18, [0.85, 0.82, 0.76]);
          }
        }
        // Deck + cabin + sloped roof
        lgTb.addBox(tx, ty + 2.2, tz, 3.2, 0.18, 3.2, [0.88, 0.84, 0.78]);
        lgTb.addBox(tx - 0.15, ty + 3.2, tz, 2.2, 1.9, 2.3, hCol);
        lgTb.addBox(tx, ty + 4.35, tz, 3.0, 0.25, 3.0, WHITE_SLAB_COL);
      });
      const lgMesh = new THREE.Mesh(lgTb.toGeometry(), trimMaterial);
      lgMesh.castShadow = true;
      lgMesh.receiveShadow = true;
      scene.add(lgMesh);

      // 3) Tiny People (Stylized geometric humans: beachgoers, waders & promenade walkers)
      const makePersonGeo = () => {
        const tb = new TrimBuilder();
        // Legs/lower body
        tb.addBox(-0.11, 0.42, 0, 0.16, 0.84, 0.18, [0.35, 0.45, 0.65]);
        tb.addBox(0.11, 0.42, 0, 0.16, 0.84, 0.18, [0.35, 0.45, 0.65]);
        // Torso
        tb.addBox(0, 1.12, 0, 0.44, 0.62, 0.24, [1.0, 1.0, 1.0]);
        // Head
        tb.addBox(0, 1.62, 0, 0.26, 0.28, 0.26, [0.88, 0.72, 0.60]);

      };

      const personMat = new THREE.MeshStandardMaterial({ roughness: 0.78, metalness: 0.0 });
      const outfitColors = [0xf26457, 0x26b5c4, 0xf7cf4a, 0xffffff, 0x3b76d4, 0xf08c46, 0x8ad68a, 0x2b3648];

      // Static beachgoers & shoreline splashers
      const staticPeople = [];
      for (let i = 0; i < 290; i++) {

      // Animated walkers on promenade, west sidewalk, and wet beach shoreline!

      walkerInst.castShadow = true;

        walkerInst.setColorAt(i, col);
      }
      walkerInst.instanceColor.needsUpdate = true;
      scene.add(walkerInst);
      return walkerInst;
    }
    const walkerInst = buildBeachLife();

    // =========================================================================
    // 15. MOVING TRAFFIC (INSTANCED SEDANS, CONVERTIBLES, SUVS & BUSES)
    // =========================================================================
    const trafficCars = [];

    function buildTrafficSystem() {
      // Composite parametric car parts (all cars share clean silhouettes)
      const makeBodyGeo = () => {

      };
      const makeWheelGeo = () => {

      const makeHeadlightGeo = () => {

        const c = [1, 1, 1];
        tb.addBox(-0.62, 0.62, 2.14, 0.34, 0.16, 0.08, c);
