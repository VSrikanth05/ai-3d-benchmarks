      };
      const makeTaillightGeo = () => {
        const tb = new TrimBuilder();
        const c = [1, 1, 1];
        tb.addBox(-0.62, 0.64, -2.14, 0.38, 0.15, 0.08, c);
        tb.addBox(0.62, 0.64, -2.14, 0.38, 0.15, 0.08, c);
        return tb.toGeometry();
      };

      const bodyMat = new THREE.MeshStandardMaterial({ roughness: 0.26, metalness: 0.48 });
      const cabinMat = new THREE.MeshStandardMaterial({ color: 0x162430, roughness: 0.08, metalness: 0.35 });
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x181a1e, roughness: 0.82 });
      const headMat = new THREE.MeshStandardMaterial({ color: 0xfff8e2, emissive: 0xfff3cc, emissiveIntensity: 0.2, roughness: 0.2 });
      const tailMat = new THREE.MeshStandardMaterial({ color: 0xaa1a1a, emissive: 0xff2222, emissiveIntensity: 0.2, roughness: 0.2 });

      const carColors = [
        0xe94f47, // Tropical coral red
        0xf5c438, // Canary convertible yellow
        0x22a7c8, // Ocean cyan
        0xf6f5f0, // Pearl white
        0x28364a, // Midnight navy
        0x8a95a5, // Metallic silver
        0xf28238, // Sunset tangerine
        0x48b892, // Seafoam coupe
        0x363a42  // Graphite
      ];

      // Spawn cars across Ocean Blvd NB/SB, Ave 1 (Barrier Island), Ave 2..4 (Mainland), and Cross-Streets / Causeway Bridges
      const lanes = [
        // Ocean Blvd Northbound (2 lanes)
        { kind: 'ave', ave: 0, sOff: -52.5, dir: -1, speed: 15.5, count: 20, zLim: 405 },
        { kind: 'ave', ave: 0, sOff: -56.5, dir: -1, speed: 18.0, count: 20, zLim: 405 },
        // Ocean Blvd Southbound (2 lanes)
        { kind: 'ave', ave: 0, sOff: -65.5, dir: 1, speed: 17.5, count: 20, zLim: 405 },
        { kind: 'ave', ave: 0, sOff: -69.5, dir: 1, speed: 15.0, count: 20, zLim: 405 },
        // Ave 1 (Barrier Island West)
        { kind: 'ave', ave: 1, xOff: 3.5, dir: -1, speed: 13.5, count: 12, zLim: 405 },
        { kind: 'ave', ave: 1, xOff: -3.5, dir: 1, speed: 13.5, count: 12, zLim: 405 },
        // Ave 2, 3, 4 (Mainland Bayfront & Downtown)
        { kind: 'ave', ave: 2, xOff: 4.5, dir: -1, speed: 15.5, count: 16, zLim: 505 },
        { kind: 'ave', ave: 2, xOff: -4.5, dir: 1, speed: 15.5, count: 16, zLim: 505 },
        { kind: 'ave', ave: 3, xOff: 4.5, dir: -1, speed: 15.0, count: 14, zLim: 505 },
        { kind: 'ave', ave: 3, xOff: -4.5, dir: 1, speed: 15.0, count: 14, zLim: 505 }
      ];

      lanes.forEach((ln) => {
        for (let i = 0; i < ln.count; i++) {
          const z = lerp(-ln.zLim, ln.zLim, (i + rng.range(0.12, 0.78)) / ln.count);
          const isBus = ln.ave === 0 && rng.chance(0.08);
          trafficCars.push({
            kind: 'ave',
            ave: ln.ave,
            sOff: ln.sOff,
            xOff: ln.xOff || 0,
            dir: ln.dir,
            zLim: ln.zLim,
            baseSpeed: ln.speed * rng.range(0.90, 1.12),
            posParam: z,
            sx: isBus ? 1.12 : rng.range(0.94, 1.05),
            sy: isBus ? 1.48 : rng.range(0.92, 1.16),
            sz: isBus ? 1.65 : rng.range(0.94, 1.08),
            color: isBus ? 0x2ec2b8 : rng.pick(carColors)
          });
        }
      });

      // Cross-street & Causeway Bridge vehicles
      STREET_ZS.forEach((sz) => {
        const isCauseway = CAUSEWAY_ZS.includes(sz);
        const maxX = isCauseway ? (coastX(sz) - 76.0) : (bayWestX(sz) - 10.0);
        const minX = -685.0;
        const perDir = isCauseway ? 5 : 3;
        for (const dir of [-1, 1]) {
          for (let i = 0; i < perDir; i++) {
            trafficCars.push({
              kind: 'street',
              streetZ: sz,
              isCauseway,
              minX,
              maxX,
              zOff: dir * 3.4,
              dir,
              baseSpeed: rng.range(12.0, 15.5),
              posParam: lerp(minX, maxX, (i + rng.range(0.1, 0.85)) / perDir),
              sx: rng.range(0.94, 1.04),
              sy: rng.range(0.92, 1.12),
              sz: rng.range(0.94, 1.06),
              color: rng.pick(carColors)
            });
          }
        }
      });

      const total = trafficCars.length;
      const bodyInst = new THREE.InstancedMesh(makeBodyGeo(), bodyMat, total);
      const cabinInst = new THREE.InstancedMesh(makeCabinGeo(), cabinMat, total);
      const wheelInst = new THREE.InstancedMesh(makeWheelGeo(), wheelMat, total);
      const headInst = new THREE.InstancedMesh(makeHeadlightGeo(), headMat, total);
      const tailInst = new THREE.InstancedMesh(makeTaillightGeo(), tailMat, total);

      bodyInst.castShadow = true;
      cabinInst.castShadow = true;

      const col = new THREE.Color();
      trafficCars.forEach((c, i) => {
        col.setHex(c.color);
        bodyInst.setColorAt(i, col);
      });
      bodyInst.instanceColor.needsUpdate = true;

      scene.add(bodyInst);
      scene.add(cabinInst);
      scene.add(wheelInst);
      scene.add(headInst);
      scene.add(tailInst);

      return { bodyInst, cabinInst, wheelInst, headInst, tailInst, headMat, tailMat };
    }
    const trafficSystem = buildTrafficSystem();

    // =========================================================================
    // 16. SPEEDBOATS & SAILBOATS WITH LIVE OCEAN WAKES
    // =========================================================================
    const boatEntities = [];

    function buildBoats() {
      const boatGroup = new THREE.Group();
      scene.add(boatGroup);

      const hullWhiteMat = new THREE.MeshStandardMaterial({ color: 0xf7f7f4, roughness: 0.25, metalness: 0.12 });
      const hullAccentMat = new THREE.MeshStandardMaterial({ color: 0x165e8c, roughness: 0.28, metalness: 0.2 });
      const deckTeakMat = new THREE.MeshStandardMaterial({ color: 0xc49562, roughness: 0.72 });
      const sailMat = new THREE.MeshStandardMaterial({ color: 0xfefcf6, roughness: 0.55, side: THREE.DoubleSide });

      const createSpeedboatMesh = (accentHex) => {
        const g = new THREE.Group();
        // Tapered V-hull
        const hullPts = [
          [-1.35, -3.6], [1.35, -3.6], [1.65, -0.4], [1.25, 2.2], [0.0, 4.4], [-1.25, 2.2], [-1.65, -0.4]
        ];
        const tb = new TrimBuilder();
        tb.addPolygonSlab(hullPts, -0.35, 0.72, [0.96, 0.96, 0.94]);
        const hullMesh = new THREE.Mesh(tb.toGeometry(), hullWhiteMat);
        hullMesh.castShadow = true;
        g.add(hullMesh);

        // Colored hull stripe & cabin windshield
        const stripePts = [
          [-1.38, -3.55], [1.38, -3.55], [1.68, -0.4], [1.28, 2.2], [0.0, 4.44], [-1.28, 2.2], [-1.68, -0.4]
        ];
        const stb = new TrimBuilder();
        stb.addPolygonSlab(stripePts, 0.35, 0.58, [1, 1, 1]);
        const acMat = hullAccentMat.clone();
        acMat.color.setHex(accentHex);
        g.add(new THREE.Mesh(stb.toGeometry(), acMat));

        const deck = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.12, 5.2), deckTeakMat);
        deck.position.set(0, 0.74, -0.6);
        g.add(deck);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.78, 2.4), hullWhiteMat);
        cabin.position.set(0, 1.15, 0.1);
        cabin.castShadow = true;
        g.add(cabin);

        const glass = new THREE.Mesh(new THREE.BoxGeometry(1.78, 0.42, 1.8), balconyGlassMaterial);
        glass.position.set(0, 1.25, 0.35);
        g.add(glass);

        return g;
      };

      const createSailboatMesh = () => {
        const g = new THREE.Group();
        const hullPts = [[-1.3, -4.5], [1.3, -4.5], [1.85, 0.0], [1.2, 3.2], [0.0, 5.2], [-1.2, 3.2], [-1.85, 0.0]];
        const tb = new TrimBuilder();
        tb.addPolygonSlab(hullPts, -0.4, 0.85, [0.97, 0.97, 0.95]);
        const hm = new THREE.Mesh(tb.toGeometry(), hullWhiteMat);
        hm.castShadow = true;
        g.add(hm);

        // Mast
        const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.11, 13.5, 6), hullWhiteMat);
        mast.position.set(0, 7.2, 0.4);
        mast.castShadow = true;
        g.add(mast);

        // Main triangular sail + jib sail
        const mainGeo = new THREE.BufferGeometry();
        mainGeo.setAttribute('position', new THREE.Float32BufferAttribute([
          0, 2.2, 0.4,
          0.35, 2.4, -3.9,
          0, 13.6, 0.35
        ], 3));
        mainGeo.computeVertexNormals();
        const mainSail = new THREE.Mesh(mainGeo, sailMat);
        mainSail.castShadow = true;
        g.add(mainSail);

        const jibGeo = new THREE.BufferGeometry();
        jibGeo.setAttribute('position', new THREE.Float32BufferAttribute([
          0, 1.5, 4.9,
          0.25, 2.0, 0.6,
          0, 12.2, 0.4
        ], 3));
        jibGeo.computeVertexNormals();
        const jibSail = new THREE.Mesh(jibGeo, sailMat);
        jibSail.castShadow = true;
        g.add(jibSail);

        return g;
      };

      const boatConfigs = [
        // Atlantic Ocean speedboats & yachts
        { mode: 'ocean', type: 'speed', sBase: 55, zCenter: 10, zAmp: 340, sAmp: 22, speed: 0.048, phase: 0.2, accent: 0x1a72b8, scale: 1.15 },
        { mode: 'ocean', type: 'speed', sBase: 92, zCenter: -20, zAmp: 380, sAmp: 32, speed: -0.042, phase: 1.7, accent: 0xe64d43, scale: 1.05 },
        { mode: 'ocean', type: 'speed', sBase: 140, zCenter: 35, zAmp: 420, sAmp: 45, speed: 0.036, phase: 3.1, accent: 0x168d8c, scale: 1.25 },
        { mode: 'ocean', type: 'speed', sBase: 175, zCenter: 60, zAmp: 450, sAmp: 52, speed: 0.031, phase: 5.2, accent: 0xeba134, scale: 1.45 },
        { mode: 'ocean', type: 'sail',  sBase: 195, zCenter: -60, zAmp: 320, sAmp: 36, speed: 0.015, phase: 0.8, accent: 0xffffff, scale: 1.35 },
        { mode: 'ocean', type: 'sail',  sBase: 245, zCenter: 90, zAmp: 340, sAmp: 40, speed: -0.013, phase: 3.9, accent: 0xffffff, scale: 1.25 },
        // Intracoastal Turquoise Bay cruisers passing cleanly beneath Causeway Bridges!
        { mode: 'bay',   type: 'speed', bayFrac: 0.42, zCenter: 10, zAmp: 410, sAmp: 10, speed: 0.038, phase: 1.1, accent: 0x168d8c, scale: 1.05 },
        { mode: 'bay',   type: 'speed', bayFrac: 0.62, zCenter: -20, zAmp: 410, sAmp: 12, speed: -0.034, phase: 4.1, accent: 0xe64d43, scale: 0.98 }
      ];

      boatConfigs.forEach((cfg, idx) => {
        const mesh = cfg.type === 'speed' ? createSpeedboatMesh(cfg.accent) : createSailboatMesh();
        mesh.scale.setScalar(cfg.scale);
        boatGroup.add(mesh);
        boatEntities.push({ ...cfg, idx, mesh, wakeSpeed: cfg.type === 'speed' ? 2.5 : 0.8 });
      });
    }
    buildBoats();

    // =========================================================================
    // 17. ANIMATION LOOP: SUN CYCLE, FLYOVER BLEND, TRAFFIC, BOATS & WALKERS
    // =========================================================================
    const flyPosCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(195, 92, 345),
      new THREE.Vector3(112, 58, 175),
      new THREE.Vector3(82, 68, 10),
      new THREE.Vector3(120, 96, -135),
      new THREE.Vector3(245, 162, 265)
    ]);

    const flyTargetCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-125, 28, -25),
      new THREE.Vector3(-85, 22, -45),
      new THREE.Vector3(-140, 26, -95),
      new THREE.Vector3(-210, 34, -145),
      new THREE.Vector3(-155, 28, -10)
    ]);

    const FLY_DURATION = 16.5;
    let flyTime = 0;
    let flyActive = true;
    let userTookControl = false;

    const interruptFlyover = () => {
      if (flyActive && !userTookControl) {
        userTookControl = true;
        flyActive = false;
        controls.enabled = true;
      }
    };
    renderer.domElement.addEventListener('pointerdown', interruptFlyover, { passive: true });
    renderer.domElement.addEventListener('wheel', interruptFlyover, { passive: true });
    renderer.domElement.addEventListener('touchstart', interruptFlyover, { passive: true });

    // Initialize camera at flyover start
    camera.position.copy(flyPosCurve.getPointAt(0));
    controls.target.copy(flyTargetCurve.getPointAt(0));
    camera.lookAt(controls.target);

    const dummyObj = new THREE.Object3D();
    const tmpV3 = new THREE.Vector3();
    const tmpT3 = new THREE.Vector3();
    const dayZenith = new THREE.Color(0x083ea6);
    const goldZenith = new THREE.Color(0x1a3875);
    const dayHorizon = new THREE.Color(0x7ac3ed);
    const goldHorizon = new THREE.Color(0xf2a46a);
    const daySunCol = new THREE.Color(0xfff5e0);
    const goldSunCol = new THREE.Color(0xff9244);
    const dayHemiSky = new THREE.Color(0x8ad0ff);
    const goldHemiSky = new THREE.Color(0xf0a06a);
    const dayHemiGnd = new THREE.Color(0xcab08c);
    const goldHemiGnd = new THREE.Color(0x5a4842);

    const clock = new THREE.Clock();

    function updateSunAndCycle(elapsed) {
      // Dwell in bright high-noon for the first ~28s (flyover + initial orbit), then glide smoothly to golden hour and back
      const rawWave = 0.5 - 0.5 * Math.cos(Math.max(0, elapsed - 16.0) * (Math.PI * 2.0 / 110.0));
      const goldenFactor = Math.pow(rawWave, 1.5);

      // Sun elevation: 62 deg high noon -> 9.0 deg golden hour
      const elevDeg = lerp(62.0, 9.0, goldenFactor);
      const elevRad = THREE.MathUtils.degToRad(elevDeg);
      const azimRad = lerp(0.48, 3.75, goldenFactor);

      const sx = Math.cos(elevRad) * Math.sin(azimRad);
      const sy = Math.sin(elevRad);
      const sz = Math.cos(elevRad) * Math.cos(azimRad);
      uShared.uSunDir.value.set(sx, sy, sz).normalize();

      // Dusk glow ramps gently as sun drops below ~25 deg
      const duskGlow = smoothstep(25.0, 9.0, elevDeg);
      uShared.uDuskGlow.value = duskGlow;

      uShared.uSunColor.value.copy(daySunCol).lerp(goldSunCol, goldenFactor);
      uShared.uSkyZenith.value.copy(dayZenith).lerp(goldZenith, goldenFactor);
      uShared.uSkyHorizon.value.copy(dayHorizon).lerp(goldHorizon, goldenFactor);
      fogColor.copy(uShared.uSkyHorizon.value);
      scene.fog.color.copy(fogColor);

      sunLight.color.copy(uShared.uSunColor.value);
      sunLight.intensity = lerp(2.38, 1.85, goldenFactor);

      hemiLight.color.copy(dayHemiSky).lerp(goldHemiSky, goldenFactor);
      hemiLight.groundColor.copy(dayHemiGnd).lerp(goldHemiGnd, goldenFactor);
      hemiLight.intensity = lerp(0.62, 0.42, goldenFactor);

      // Texel-snapped shadow camera centered near controls target for crisp shadows everywhere
      const snap = 4.0;
      const stx = clamp(Math.round(controls.target.x / snap) * snap, -480, 40);
      const stz = clamp(Math.round(controls.target.z / snap) * snap, -360, 360);
      sunLight.target.position.set(stx, 0, stz);
      sunLight.position.set(
        stx + uShared.uSunDir.value.x * 580,
        uShared.uSunDir.value.y * 580,
        stz + uShared.uSunDir.value.z * 580
      );

      // Street lamps & vehicle headlights gradually glow in golden hour
      streetLampBulbMat.emissiveIntensity = duskGlow * 2.8;
      trafficSystem.headMat.emissiveIntensity = 0.25 + duskGlow * 2.4;
      trafficSystem.tailMat.emissiveIntensity = 0.25 + duskGlow * 2.2;
    }

    function updateTraffic(dt, elapsed) {
      // Traffic signal green/red wave (14s cycle: 0..0.48 NS green, 0.52..0.96 EW green)
      const sigPhase = (elapsed % 14.0) / 14.0;
      const nsGreen = sigPhase < 0.48;
      const ewGreen = sigPhase >= 0.52 && sigPhase < 0.96;

      for (let i = 0; i < trafficCars.length; i++) {
        const c = trafficCars[i];
        let speedMult = 1.0;

        if (c.kind === 'ave') {
          if (!nsGreen) {
            for (let s = 0; s < STREET_ZS.length; s++) {
              const distAhead = (STREET_ZS[s] - c.posParam) * c.dir;
              if (distAhead > 10.5 && distAhead < 19.5) {
                speedMult = 0.08;
                break;
              }
            }
          }
          c.posParam += c.dir * c.baseSpeed * speedMult * dt;
          if (c.posParam > c.zLim) c.posParam = -c.zLim;
          if (c.posParam < -c.zLim) c.posParam = c.zLim;

          const z = c.posParam;
          const x = c.ave === 0 ? (coastX(z) + c.sOff) : (aveCenterX(c.ave, z) + c.xOff);
          const dxdz = aveDXDZ(c.ave, z);
          const heading = Math.atan(dxdz) + (c.dir < 0 ? Math.PI : 0);

          dummyObj.position.set(x, Y_ROAD + 0.01, z);
          dummyObj.rotation.set(0, heading, 0);
        } else {
          if (!ewGreen) {
            for (let a = 0; a <= 5; a++) {
              const ax = aveCenterX(a, c.streetZ);
              const stopDist = (ax - c.posParam) * c.dir - AVE_HALF_WIDTH[a];
              if (stopDist > 3.5 && stopDist < 11.5) {
                speedMult = 0.06;
                break;
              }
            }
          }
          c.posParam += c.dir * c.baseSpeed * speedMult * dt;
          if (c.posParam > c.maxX) c.posParam = c.minX;
          if (c.posParam < c.minX) c.posParam = c.maxX;

          const y = c.isCauseway ? bridgeY(c.posParam, c.streetZ) : Y_ROAD;
          const pitch = c.isCauseway
            ? Math.atan2(bridgeY(c.posParam + c.dir * 0.5, c.streetZ) - bridgeY(c.posParam - c.dir * 0.5, c.streetZ), 1.0)
            : 0.0;

          dummyObj.position.set(c.posParam, y + 0.02, c.streetZ + c.zOff);
          dummyObj.rotation.set(-pitch, c.dir > 0 ? Math.PI * 0.5 : -Math.PI * 0.5, 0, 'YXZ');
        }

        dummyObj.scale.set(c.sx, c.sy, c.sz);
        dummyObj.updateMatrix();
        trafficSystem.bodyInst.setMatrixAt(i, dummyObj.matrix);
        trafficSystem.cabinInst.setMatrixAt(i, dummyObj.matrix);
        trafficSystem.wheelInst.setMatrixAt(i, dummyObj.matrix);
        trafficSystem.headInst.setMatrixAt(i, dummyObj.matrix);
        trafficSystem.tailInst.setMatrixAt(i, dummyObj.matrix);
      }

      trafficSystem.bodyInst.instanceMatrix.needsUpdate = true;
      trafficSystem.cabinInst.instanceMatrix.needsUpdate = true;
      trafficSystem.wheelInst.instanceMatrix.needsUpdate = true;
      trafficSystem.headInst.instanceMatrix.needsUpdate = true;
      trafficSystem.tailInst.instanceMatrix.needsUpdate = true;
    }

    function updateBoats(elapsed) {
      for (let i = 0; i < boatEntities.length; i++) {
        const b = boatEntities[i];
        const t = elapsed * b.speed + b.phase;
        const tNext = t + 0.02 * Math.sign(b.speed);

        const evalBoatXZ = (ang) => {
          const z = b.zCenter + b.zAmp * Math.sin(ang);
          if (b.mode === 'bay') {
            const xL = bayWestX(z) + 18.0;
            const xR = islandWestX(z) - 18.0;
            const x = lerp(xL, xR, b.bayFrac) + b.sAmp * Math.sin(ang * 2.0);
            return [x, z];
          }
          const s = b.sBase + b.sAmp * Math.sin(ang * 2.0 + 0.6);
          return [coastX(z) + s, z];
        };

        const [bx, bz] = evalBoatXZ(t);
        const [nx, nz] = evalBoatXZ(tNext);
        const heading = Math.atan2(nx - bx, nz - bz);

        const ampScale = b.mode === 'bay' ? 0.15 : 1.0;
        const bob = ampScale * (0.22 * Math.sin(bx * 0.085 + bz * 0.042 + elapsed * 1.25) +
                    0.12 * Math.sin(bx * -0.06 + bz * 0.11 + elapsed * 1.55));
        const pitch = ampScale * 0.035 * Math.cos(bx * 0.085 + bz * 0.042 + elapsed * 1.25);
        const roll = ampScale * 0.05 * Math.sin(t * 2.0 + 0.6);

        b.mesh.position.set(bx, 0.08 + bob, bz);
        b.mesh.rotation.set(pitch, heading, roll);

        uShared.uBoats.value[i].set(bx, bz, heading, b.wakeSpeed);
      }
    }

    function updateWalkers(dt, elapsed) {
      for (let i = 0; i < walkers.length; i++) {
        const w = walkers[i];
        w.z += w.dir * w.speed * dt;
        if (w.z > 430) w.z = -430;
        if (w.z < -430) w.z = 430;

        const wx = coastX(w.z) + w.sOff;
        const wy = w.lane === 2 ? Math.max(seabedHeight(wx, w.z), 0.02) : Y_SIDEWALK;
        const dxdz = coastDXDZ(w.z);
        const rotY = Math.atan(dxdz) + (w.dir < 0 ? Math.PI : 0);
        const strideBob = Math.abs(Math.sin(elapsed * 7.5 + w.phase)) * 0.07;

        dummyObj.position.set(wx, wy + strideBob, w.z);
        dummyObj.rotation.set(0, rotY, 0);
        dummyObj.scale.setScalar(w.scale);
        dummyObj.updateMatrix();
        walkerInst.setMatrixAt(i, dummyObj.matrix);
      }
      walkerInst.instanceMatrix.needsUpdate = true;
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;
      uShared.uTime.value = elapsed;

      updateSunAndCycle(elapsed);
      updateTraffic(dt, elapsed);
      updateBoats(elapsed);
      updateWalkers(dt, elapsed);

      // Sweeping aerial flyover blending smoothly into damped OrbitControls
      if (flyActive) {
        flyTime += dt;
        const rawT = clamp(flyTime / FLY_DURATION, 0, 1);
        // Smooth ease-in-out
        const u = rawT * rawT * (3 - 2 * rawT);

        flyPosCurve.getPointAt(u, tmpV3);
        flyTargetCurve.getPointAt(u, tmpT3);

        camera.position.copy(tmpV3);
        controls.target.copy(tmpT3);
        camera.lookAt(controls.target);

        if (rawT >= 1.0) {
          flyActive = false;
          controls.enabled = true;
          controls.update();
        }
      } else {
        controls.update();
      }

      skyDome.position.copy(camera.position);
      composer.render();
    }

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      bloomPass.setSize(w, h);
    });

    animate();
  </script>
</body>
</html>
