<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tropical Coast City</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #67b6e8;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // =========================================================================
    // 1. DETERMINISTIC PRNG & NOISE UTILITIES
    // =========================================================================
    class PRNG {
      constructor(seed = 409621) {
        // Scramble integer seed (Knuth multiplicative hash) so sequential seeds are decorrelated on call 1
        let h = Math.imul(seed ^ 0x9e3779b9, 0x85ebca6b) >>> 0;
        h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35) >>> 0;
        this.s = (h % 2147483646) + 1;
        this.next();
        this.next();
      }
      next() {
        this.s = (this.s * 16807) % 2147483647;
        return (this.s - 1) / 2147483646;
      }
      range(a, b) {
        return a + (b - a) * this.next();
      }
      int(a, b) {
        return Math.floor(this.range(a, b + 0.9999));
      }
      pick(arr) {
        return arr[Math.floor(this.next() * arr.length)];
      }
      chance(p) {
        return this.next() < p;
      }
    }

    const rng = new PRNG(20261118);

    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const lerp = (a, b, t) => a + (b - a) * t;
    const smoothstep = (e0, e1, x) => {
      const t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    };

    function hash2(x, y) {
      const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return h - Math.floor(h);
    }

    function noise2(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      const a = hash2(ix, iy);
      const b = hash2(ix + 1, iy);
      const c = hash2(ix, iy + 1);
      const d = hash2(ix + 1, iy + 1);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }

    function fbm2(x, y, oct = 4) {
      let v = 0, amp = 0.5, freq = 1.0;
      for (let i = 0; i < oct; i++) {
        v += amp * noise2(x * freq, y * freq);
        freq *= 2.03;
        amp *= 0.5;
      }
      return v;
    }

    // =========================================================================
    // 2. ANALYTICAL COASTLINE, SEABED & STREET GRID TOPOLOGY
    // =========================================================================
    // Bounded crescent curve so distant headlands never shoot off into open ocean
    function coastX(z) {
      const ze = 450.0 * Math.tanh(z / 450.0);
      return 24.0 * Math.sin(ze * 0.0072) - 10.0 * Math.cos(ze * 0.0045) + 0.00015 * ze * ze;
    }

    function coastDXDZ(z) {
      const th = Math.tanh(z / 450.0);
      const ze = 450.0 * th;
      const dze = 1.0 - th * th;
      return (24.0 * 0.0072 * Math.cos(ze * 0.0072) + 10.0 * 0.0045 * Math.sin(ze * 0.0045) + 0.00030 * ze) * dze;
    }

    function islandWestX(z) {
      const az = Math.abs(z);
      const taper = smoothstep(415.0, 485.0, az);
      return coastX(z) - lerp(165.0, 4.0, taper);
    }

    function bayWestX(z) {
      const ze = 550.0 * Math.tanh(z / 550.0);
      return 10.0 * Math.sin(ze * 0.005) - 275.0;
    }

    const CAUSEWAY_ZS = [-220, 26, 272];

    function bridgeY(x, z) {
      const xL = bayWestX(z) - 3.0;
      const xR = islandWestX(z) + 3.0;
      if (x <= xL || x >= xR) return Y_ROAD;
      const u = (x - xL) / (xR - xL);
      return Y_ROAD + 6.2 * Math.pow(Math.sin(u * Math.PI), 1.35);
    }

    function seabedHeight(x, z) {
      const cx = coastX(z);
      const s = x - cx; // + seaward, - landward
      const bw = bayWestX(z);
      const iw = islandWestX(z);
      const az = Math.abs(z);
      const tipDrop = smoothstep(420.0, 488.0, az);

      // 1) Mainland West of Bay
      if (x <= bw) {
        // Gentle lush emerald tropical hills rolling inland and along distant coastline
        const farInland = smoothstep(-740.0, -1350.0, x);
        const farZ = smoothstep(560.0, 980.0, az);
        const hillMask = Math.max(farInland, farZ * smoothstep(bw, bw - 140.0, x));
        if (hillMask > 0.001) {
          const ridge = 14.0 + 28.0 * fbm2(x * 0.0045 + 3.1, z * 0.0045 + 1.7, 3);
          return 2.28 + hillMask * ridge;
        }
        return 2.28;
      }

      // 2) Mainland Bayfront Seawall Drop into Bay
      if (x < bw + 10.0) {
        const t = (x - bw) / 10.0;
        return lerp(2.28, -7.2, smoothstep(0.0, 1.0, t));
      }

      // 3) Turquoise Bay Channel & Barrier Island West Seawall (smooth tip taper, zero jump)
      if (x < iw - 8.0) {
        return -7.2 + 0.35 * Math.sin(x * 0.06 + z * 0.03);
      }
      if (x < iw) {
        const t = (x - (iw - 8.0)) / 8.0;
        const islandTop = lerp(2.28, -4.2, tipDrop);
        return lerp(-7.2, islandTop, smoothstep(0.0, 1.0, t));
      }

      // 4) Barrier Island Interior (tapers smoothly into sandy shoals at tips)
      if (s <= -42.0) {
        return lerp(2.28, -4.2, tipDrop);
      }

      // 5) Curved East White-Sand Beach & Foreshore
      if (s <= -8.0) {
        const t = (s + 42.0) / 34.0;
        const dune = 0.14 * Math.sin(z * 0.045 + s * 0.18) * Math.sin(t * Math.PI);
        const baseY = lerp(2.14, 1.32, t) + dune;
        return lerp(baseY, -4.0, tipDrop);
      }
      if (s <= 0.0) {
        const t = (s + 8.0) / 8.0;
        const baseY = lerp(1.32, 0.0, t * t * (0.45 + 0.55 * t));
        return lerp(baseY, -3.5, tipDrop);
      }

      // 6) Atlantic Ocean Seabed
      if (s <= 16.0) {
        const t = s / 16.0;
        return lerp(lerp(0.0, -3.5, tipDrop), -2.55, Math.pow(t, 0.85));
      }
      if (s <= 135.0) {
        const t = (s - 16.0) / 119.0;
        const sandbar = 0.42 * Math.sin(s * 0.155 + z * 0.028) * Math.exp(-s * 0.014);
        return lerp(-2.55, -17.8, Math.pow(t, 1.12)) + sandbar;
      }
      const t = clamp((s - 135.0) / 220.0, 0.0, 1.0);
      return lerp(-17.8, -38.0, smoothstep(0.0, 1.0, t));
    }

    // Roadway elevations
    const Y_ROAD = 2.24;
    const Y_SIDEWALK = 2.38;
    const Y_MEDIAN = 2.44;
    const Y_SEAWALL_TOP = 2.66;

    // Avenue centerline definitions:
    // Ave 0..1 on Barrier Island; Ave 2..6 on Mainland Downtown & Suburbs
    function aveCenterX(aveIdx, z) {
      const c = coastX(z);
      const bw = bayWestX(z);
      switch (aveIdx) {
        case 0: return c - 61.0;                   // Ocean Blvd (Barrier Island)
        case 1: return c - 147.0;                  // Bayfront Island Ave (Barrier Island)
        case 2: return bw - 26.0;                  // Bayfront Brickell Blvd (Mainland)
        case 3: return bw * 0.5 - 235.0;           // Metropolis Ave (~-372)
        case 4: return -472.0;                     // Financial Pkwy
        case 5: return -572.0;                     // Downtown West Ave
        case 6: return -672.0;                     // Midtown Pkwy
        default: return -770.0;
      }
    }

    function aveDXDZ(aveIdx, z) {
      const dc = coastDXDZ(z);
      const ze = 550.0 * Math.tanh(z / 550.0);
      const dbw = 10.0 * 0.005 * Math.cos(ze * 0.005) * (1.0 - Math.pow(Math.tanh(z / 550.0), 2));
      switch (aveIdx) {
        case 0: return dc;
        case 1: return dc;
        case 2: return dbw;
        case 3: return dbw * 0.5;
        default: return 0.0;
      }
    }

    const AVE_HALF_WIDTH = [11.0, 7.0, 9.0, 9.0, 8.5, 8.0, 7.5];
    const STREET_ZS = [-384, -302, -220, -138, -56, 26, 108, 190, 272, 354];
    const STREET_HALF_WIDTH = 7.2;

    // =========================================================================
    // 3. RENDERER, SCENE, CAMERA & POST-PROCESSING
    // =========================================================================
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const fogColor = new THREE.Color(0x7ac3ed);
    scene.background = fogColor;
    scene.fog = new THREE.FogExp2(fogColor.getHex(), 0.00032);

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      1.0,
      12000
    );

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.maxPolarAngle = Math.PI * 0.482;
    controls.minPolarAngle = 0.08;
    controls.minDistance = 24;
    controls.maxDistance = 1280;
    controls.panSpeed = 0.9;
    controls.rotateSpeed = 0.72;
    controls.zoomSpeed = 1.05;
    controls.enabled = false;

    // Lighting
    const hemiLight = new THREE.HemisphereLight(0x8ad0ff, 0xcab08c, 0.62);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e0, 2.38);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 40;
    sunLight.shadow.camera.far = 1400;
    const shadowHalf = 400;
    sunLight.shadow.camera.left = -shadowHalf;
    sunLight.shadow.camera.right = shadowHalf;
    sunLight.shadow.camera.top = shadowHalf;
    sunLight.shadow.camera.bottom = -shadowHalf;
    sunLight.shadow.bias = -0.00045;
    sunLight.shadow.normalBias = 0.06;
    scene.add(sunLight);
    scene.add(sunLight.target);

    // Subtle cool ocean bounce fill light from East
    const seaFillLight = new THREE.DirectionalLight(0x52c8dc, 0.28);
    seaFillLight.position.set(260, 90, 40);
    scene.add(seaFillLight);

    // Post-processing
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.22,
      0.52,
      1.12
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    // =========================================================================
    // 4. SHARED UNIFORMS & PROCEDURAL ENVIRONMENT MAP
    // =========================================================================
    const MAX_BOATS = 8;
    const boatUniformArray = Array.from({ length: MAX_BOATS }, () => new THREE.Vector4(9999, 9999, 0, 0));

    const uShared = {
      uTime: { value: 0 },
      uSunDir: { value: new THREE.Vector3(0.45, 0.86, 0.22).normalize() },
      uSunColor: { value: new THREE.Color(0xfff5e0) },
      uSkyZenith: { value: new THREE.Color(0x083ea6) },
      uSkyHorizon: { value: new THREE.Color(0x7ac3ed) },
      uFogColor: { value: fogColor },
      uFogDensity: { value: 0.00032 },
      uDuskGlow: { value: 0.0 },
      uBoats: { value: boatUniformArray }
    };

    // Bake crisp procedural sky+ocean PMREM for metallic/glass reflections
    function buildEnvMap() {
      const envCanvas = document.createElement('canvas');
      envCanvas.width = 512;
      envCanvas.height = 256;
      const ctx = envCanvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0.00, '#1868c8');
      grad.addColorStop(0.32, '#4ba5e4');
      grad.addColorStop(0.49, '#a7def4');
      grad.addColorStop(0.51, '#32a8b8');
      grad.addColorStop(0.68, '#16668f');
      grad.addColorStop(1.00, '#0a2d54');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 256);

      // Soft bright sun highlight spot
      const sunGrad = ctx.createRadialGradient(340, 64, 4, 340, 64, 90);
      sunGrad.addColorStop(0.0, 'rgba(255,250,235,0.95)');
      sunGrad.addColorStop(0.25, 'rgba(255,245,215,0.45)');
      sunGrad.addColorStop(1.0, 'rgba(255,240,210,0.0)');
      ctx.fillStyle = sunGrad;
      ctx.fillRect(0, 0, 512, 256);

      // Soft puffy cloud hints in sky hemisphere
      for (let i = 0; i < 42; i++) {
        const cx = rng.range(20, 492);
        const cy = rng.range(38, 114);
        const rx = rng.range(18, 52);
        const ry = rng.range(6, 16);
        const cg = ctx.createRadialGradient(cx, cy, 1, cx, cy, rx);
        cg.addColorStop(0, 'rgba(255,255,255,0.34)');
        cg.addColorStop(1, 'rgba(255,255,255,0.0)');
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1, ry / rx);
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.arc(0, 0, rx, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      const tex = new THREE.CanvasTexture(envCanvas);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      const pmrem = new THREE.PMREMGenerator(renderer);
      const rt = pmrem.fromEquirectangular(tex);
      scene.environment = rt.texture;
      tex.dispose();
      pmrem.dispose();
    }
    buildEnvMap();

    // =========================================================================
    // 5. SKY DOME WITH RAYMARCHED VOLUMETRIC CUMULUS CLOUDS
    // =========================================================================
    function createSkyDome() {
      const geo = new THREE.SphereGeometry(4800, 64, 36);
      const mat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        depthTest: false,
        fog: false,
        uniforms: {
          uTime: uShared.uTime,
          uSunDir: uShared.uSunDir,
          uSunColor: uShared.uSunColor,
          uSkyZenith: uShared.uSkyZenith,
          uSkyHorizon: uShared.uSkyHorizon,
          uDuskGlow: uShared.uDuskGlow
        },
        vertexShader: /* glsl */ `
          varying vec3 vWorldDir;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldDir = position;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uTime;
          uniform vec3 uSunDir;
          uniform vec3 uSunColor;
          uniform vec3 uSkyZenith;
          uniform vec3 uSkyHorizon;
          uniform float uDuskGlow;
          varying vec3 vWorldDir;

          float hash3(vec3 p) {
            p = fract(p * vec3(0.1031, 0.1030, 0.0973));
            p += dot(p, p.yxz + 33.33);
            return fract((p.x + p.y) * p.z);
          }

          float noise3(vec3 x) {
            vec3 i = floor(x);
            vec3 f = fract(x);
            f = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(mix(hash3(i + vec3(0,0,0)), hash3(i + vec3(1,0,0)), f.x),
                  mix(hash3(i + vec3(0,1,0)), hash3(i + vec3(1,1,0)), f.x), f.y),
              mix(mix(hash3(i + vec3(0,0,1)), hash3(i + vec3(1,0,1)), f.x),
                  mix(hash3(i + vec3(0,1,1)), hash3(i + vec3(1,1,1)), f.x), f.y),
              f.z
            );
          }

          float fbmCloud(vec3 p) {
            float v = 0.0;
            float a = 0.52;
            for (int i = 0; i < 4; i++) {
              v += a * noise3(p);
              p = p * 2.04 + vec3(17.1, 31.7, 11.3);
              a *= 0.48;
            }
            return v;
          }

          float cloudDensity(vec3 p, float hNorm) {
            vec3 wind = vec3(uTime * 9.0, 0.0, uTime * 4.5);
            vec3 pw = p + wind;
            // Multi-octave 3D FBM cumulus field -> soft scattered trade-wind puffs
            float macro = fbmCloud(pw * vec3(0.0011, 0.0016, 0.0011));
            float detail = fbmCloud(pw * vec3(0.0030, 0.0046, 0.0030) + vec3(4.1, 1.7, 9.3));
            float profile = smoothstep(0.0, 0.22, hNorm) * (1.0 - smoothstep(0.45, 1.0, hNorm));
            float densityField = macro * 0.72 + detail * 0.28 + profile * 0.14;
            float puff = smoothstep(0.60, 0.82, densityField);
            return puff * profile * 1.85;
          }

          void main() {
            vec3 rd = normalize(vWorldDir);
            float elev = clamp(rd.y, 0.0, 1.0);
            float sunDot = max(dot(rd, normalize(uSunDir)), 0.0);

            // Crisp tropical cobalt-to-azure sky gradient
            vec3 skyMid = mix(uSkyHorizon, uSkyZenith, 0.66);
            vec3 skyCol = mix(uSkyHorizon, skyMid, smoothstep(0.0, 0.09, elev));
            skyCol = mix(skyCol, uSkyZenith, smoothstep(0.06, 0.48, elev));

            // Warm golden-hour scattering tight near horizon & sun azimuth
            float horizonBand = exp(-elev * 13.5);
            vec3 warmGlow = mix(vec3(0.95, 0.94, 0.88), vec3(1.0, 0.52, 0.24), uDuskGlow);
            skyCol = mix(skyCol, warmGlow, horizonBand * (0.06 + 0.82 * uDuskGlow) * (0.35 + 0.65 * pow(sunDot, 2.0)));

            // Solar corona & crisp solar disc
            float mie = pow(sunDot, 10.0) * 0.24 + pow(sunDot, 64.0) * 0.52;
            float disc = smoothstep(0.99935, 0.99975, sunDot);
            skyCol += uSunColor * (mie + disc * 3.6) * smoothstep(-0.04, 0.08, rd.y);

            // Jittered 16-step volumetric cumulus cloud layer (band-free soft clouds)
            if (rd.y > 0.025) {
              float slabBottom = 260.0;
              float slabTop = 540.0;
              float t0 = slabBottom / max(rd.y, 0.06);
              float t1 = slabTop / max(rd.y, 0.06);
              t0 = min(t0, 4200.0);
              t1 = min(t1, 6400.0);
              float dt = (t1 - t0) / 16.0;

              float jitter = hash3(rd * 317.0);
              float transmittance = 1.0;
              vec3 cloudLight = vec3(0.0);
              float hgPhase = 0.35 + 0.65 * pow(sunDot, 4.0);

              vec3 litCloudCol = mix(vec3(1.22, 1.21, 1.18), vec3(1.10, 0.78, 0.48), uDuskGlow);
              vec3 shadowCloudCol = mix(vec3(0.55, 0.69, 0.86), vec3(0.42, 0.38, 0.54), uDuskGlow);

              for (int i = 0; i < 16; i++) {
                float fi = (float(i) + jitter) / 16.0;
                float t = mix(t0, t1, fi);
                vec3 pos = rd * t;
                float dens = cloudDensity(pos, fi);
                if (dens > 0.008) {
                  vec3 sunStep = pos + uSunDir * 64.0;
                  float densSun = cloudDensity(sunStep, clamp(fi + 0.22, 0.0, 1.0));
                  float shadowTerm = exp(-densSun * 1.4);
                  vec3 stepCol = mix(shadowCloudCol, litCloudCol, 0.30 + 0.70 * shadowTerm);
                  stepCol += uSunColor * hgPhase * shadowTerm * 0.32;

                  float alpha = 1.0 - exp(-dens * dt * 0.011);
                  cloudLight += transmittance * stepCol * alpha;
                  transmittance *= (1.0 - alpha);
                  if (transmittance < 0.04) break;
                }
              }

              float cloudFade = smoothstep(0.025, 0.11, rd.y);
              vec3 finalCloud = mix(skyCol, cloudLight + skyCol * transmittance, cloudFade);
              skyCol = mix(finalCloud, skyCol, (1.0 - cloudFade) * 0.45);
            }

            // Below horizon mirrors atmospheric haze seamlessly into distant ocean
            if (rd.y < 0.0) {
              skyCol = mix(uSkyHorizon, uSkyHorizon * 0.72, clamp(-rd.y * 4.0, 0.0, 1.0));
            }

            gl_FragColor = vec4(skyCol, 1.0);
          }
        `
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.frustumCulled = false;
      scene.add(mesh);
      return mesh;
    }
    const skyDome = createSkyDome();

    // =========================================================================
    // 6. SHADER-DRIVEN TURQUOISE OCEAN & BAY WITH WAVES, FOAM & BOAT WAKES
    // =========================================================================
    function createOcean() {
      // Adaptive grid covering both the sheltered Intracoastal Bay and the Atlantic Ocean
      const nxBay = 38;
      const nxOcean = 144;
      const nx = nxBay + nxOcean;
      const nz = 216;
      const positions = [];
      const uvs = [];
      const indices = [];

      // Non-linear distribution along Z (-3000 to +3000, dense in -520..+520)
      const zVals = [];
      for (let j = 0; j <= nz; j++) {
        const v = (j / nz) * 2.0 - 1.0;
        const sign = v < 0 ? -1 : 1;
        const av = Math.abs(v);
        const z = sign * 3000.0 * (0.22 * av + 0.78 * Math.pow(av, 2.9));
        zVals.push(z);
      }

      for (let j = 0; j <= nz; j++) {
        const z = zVals[j];
        const cx = coastX(z);
        const bw = bayWestX(z);
        const bayStart = bw - 6.0;
        const bayEnd = cx - 4.0;
        for (let i = 0; i <= nx; i++) {
          let x;
          if (i <= nxBay) {
            const u = i / nxBay;
            x = lerp(bayStart, bayEnd, u);
          } else {
            const u = (i - nxBay) / nxOcean;
            const s = -4.0 + 2950.0 * (0.06 * u + 0.94 * Math.pow(u, 3.1));
            x = cx + s;
          }
          positions.push(x, 0.0, z);
          uvs.push(i / nx, j / nz);
        }
      }

      for (let j = 0; j < nz; j++) {
        for (let i = 0; i < nx; i++) {
          const a = j * (nx + 1) + i;
          const b = a + 1;
          const c = a + (nx + 1);
          const d = c + 1;
          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: true,
        uniforms: {
          uTime: uShared.uTime,
          uSunDir: uShared.uSunDir,
          uSunColor: uShared.uSunColor,
          uSkyZenith: uShared.uSkyZenith,
          uSkyHorizon: uShared.uSkyHorizon,
          uFogColor: uShared.uFogColor,
          uFogDensity: uShared.uFogDensity,
          uDuskGlow: uShared.uDuskGlow,
          uBoats: uShared.uBoats
        },
        vertexShader: /* glsl */ `
          uniform float uTime;
          varying vec3 vWorldPos;
          varying vec3 vWaveNormal;
          varying float vShoreDist;
          varying float vWaveCrest;

          float coastX(float z) {
            float ze = 450.0 * tanh(z / 450.0);
            return 24.0 * sin(ze * 0.0072) - 10.0 * cos(ze * 0.0045) + 0.00015 * ze * ze;
          }

          vec3 evalWave(vec2 xz, float s) {
            // Sheltered Intracoastal Bay has gentle calm ripples; Atlantic East has full swells & breakers
            float isOpenSea = smoothstep(-16.0, 22.0, s) + smoothstep(430.0, 500.0, abs(xz.y)) * 0.55;
            isOpenSea = clamp(isOpenSea, 0.0, 1.0);
            float bayCalm = 0.06 + 0.94 * isOpenSea;

            float shoreAmp = smoothstep(-2.0, 12.0, s) * isOpenSea;
            float deepAmp = smoothstep(8.0, 50.0, s) * isOpenSea;

            // Shore-parallel shoaling wave crests rolling inward (-x)
            float shorePhase1 = s * 0.34 + uTime * 1.65 + 0.45 * sin(xz.y * 0.032);
            float shorePhase2 = s * 0.56 + uTime * 2.15 - 0.35 * cos(xz.y * 0.055);
            float shoalBand = smoothstep(95.0, 6.0, s) * smoothstep(-2.2, 2.5, s) * (1.0 - smoothstep(425.0, 488.0, abs(xz.y)));

            float h = 0.0;
            // Gentle bay chop everywhere
            h += 0.045 * sin(dot(xz, vec2(0.24, 0.19)) + uTime * 1.8) * bayCalm;
            // Offshore ocean swells
            h += 0.24 * deepAmp * sin(dot(xz, vec2(0.085, 0.042)) + uTime * 1.25);
            h += 0.16 * deepAmp * sin(dot(xz, vec2(-0.06, 0.11)) + uTime * 1.55);
            h += 0.10 * shoreAmp * sin(dot(xz, vec2(0.19, -0.13)) + uTime * 2.05);
            // Breaking shore rollers
            float roller1 = sin(shorePhase1);
            float roller2 = sin(shorePhase2);
            h += 0.22 * shoalBand * (roller1 + 0.32 * pow(max(0.0, roller1), 2.0));
            h += 0.09 * shoalBand * roller2;

            // Gentle swash surge right onto the beach slope
            float swashSurge = 0.14 * (0.5 + 0.5 * sin(uTime * 1.15 - xz.y * 0.032)) * smoothstep(8.0, -3.5, s) * (1.0 - smoothstep(425.0, 488.0, abs(xz.y)));
            h += swashSurge;

            float crest = max(0.0, roller1) * shoalBand + max(0.0, sin(dot(xz, vec2(0.085, 0.042)) + uTime * 1.25)) * 0.4 * isOpenSea;
            return vec3(h, crest, shoalBand);
          }

          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            float s = wp.x - coastX(wp.z);
            vec3 w = evalWave(wp.xz, s);
            wp.y += w.x;

            // Finite-difference normal
            float eps = 0.65;
            float sx = (wp.x + eps) - coastX(wp.z);
            float sz = wp.x - coastX(wp.z + eps);
            float hx = evalWave(wp.xz + vec2(eps, 0.0), sx).x;
            float hz = evalWave(wp.xz + vec2(0.0, eps), sz).x;
            vec3 n = normalize(vec3(w.x - hx, eps, w.x - hz));

            vWorldPos = wp.xyz;
            vWaveNormal = n;
            vShoreDist = s;
            vWaveCrest = w.y;

            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uTime;
          uniform vec3 uSunDir;
          uniform vec3 uSunColor;
          uniform vec3 uSkyZenith;
          uniform vec3 uSkyHorizon;
          uniform vec3 uFogColor;
          uniform float uFogDensity;
          uniform float uDuskGlow;
          uniform vec4 uBoats[8];

          varying vec3 vWorldPos;
          varying vec3 vWaveNormal;
          varying float vShoreDist;
          varying float vWaveCrest;

          float hash2(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
          }

          float noise2(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            float a = hash2(i);
            float b = hash2(i + vec2(1.0, 0.0));
            float c = hash2(i + vec2(0.0, 1.0));
            float d = hash2(i + vec2(1.0, 1.0));
            return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
          }

          float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            for (int i = 0; i < 4; i++) {
              v += a * noise2(p);
              p = p * 2.07 + vec2(13.4, 7.9);
              a *= 0.5;
            }
            return v;
          }

          float coastX(float z) {
            float ze = 450.0 * tanh(z / 450.0);
            return 24.0 * sin(ze * 0.0072) - 10.0 * cos(ze * 0.0045) + 0.00015 * ze * ze;
          }

          float islandWestX(float z) {
            float az = abs(z);
            float taper = smoothstep(415.0, 485.0, az);
            return coastX(z) - mix(165.0, 4.0, taper);
          }

          float bayWestX(float z) {
            float ze = 550.0 * tanh(z / 550.0);
            return 10.0 * sin(ze * 0.005) - 275.0;
          }

          float seabedY(vec2 xz) {
            float cx = coastX(xz.y);
            float s = xz.x - cx;
            float bw = bayWestX(xz.y);
            float iw = islandWestX(xz.y);
            float az = abs(xz.y);
            float tipDrop = smoothstep(420.0, 488.0, az);

            if (xz.x <= bw) return 2.28;
            if (xz.x < bw + 10.0) {
              float t = (xz.x - bw) / 10.0;
              return mix(2.28, -7.2, smoothstep(0.0, 1.0, t));
            }
            if (xz.x < iw - 8.0) {
              return -7.2 + 0.35 * sin(xz.x * 0.06 + xz.y * 0.03);
            }
            if (xz.x < iw) {
              float t = (xz.x - (iw - 8.0)) / 8.0;
              float islandTop = mix(2.28, -4.2, tipDrop);
              return mix(-7.2, islandTop, smoothstep(0.0, 1.0, t));
            }
            if (s <= -42.0) {
              return mix(2.28, -4.2, tipDrop);
            }
            if (s <= -8.0) {
              float t = (s + 42.0) / 34.0;
              float dune = 0.14 * sin(xz.y * 0.045 + s * 0.18) * sin(t * 3.14159265);
              return mix(mix(2.14, 1.32, t) + dune, -4.0, tipDrop);
            }
            if (s <= 0.0) {
              float t = (s + 8.0) / 8.0;
              return mix(mix(1.32, 0.0, t * t * (0.45 + 0.55 * t)), -3.5, tipDrop);
            }
            if (s <= 16.0) {
              float t = s / 16.0;
              return mix(mix(0.0, -3.5, tipDrop), -2.55, pow(t, 0.85));
            }
            if (s <= 135.0) {
              float t = (s - 16.0) / 119.0;
              float sandbar = 0.42 * sin(s * 0.155 + xz.y * 0.028) * exp(-s * 0.014);
              return mix(-2.55, -17.8, pow(t, 1.12)) + sandbar;
            }
            float t = clamp((s - 135.0) / 220.0, 0.0, 1.0);
            return mix(-17.8, -38.0, smoothstep(0.0, 1.0, t));
          }

          void main() {
            float bedY = seabedY(vWorldPos.xz);
            float waterDepth = vWorldPos.y - bedY;
            if (waterDepth <= 0.005) discard;

            vec3 V = normalize(cameraPosition - vWorldPos);
            vec3 L = normalize(uSunDir);
            float distCam = length(cameraPosition - vWorldPos);

            // Micro capillary ripple normal perturbation for sun glitter
            float rippleFade = 1.0 / (1.0 + distCam * 0.0018);
            vec2 ruv1 = vWorldPos.xz * 0.65 + vec2(uTime * 0.72, uTime * 0.34);
            vec2 ruv2 = vWorldPos.xz * 1.45 - vec2(uTime * 0.52, -uTime * 0.61);
            float n1 = noise2(ruv1) - 0.5;
            float n2 = noise2(ruv2) - 0.5;
            vec3 N = normalize(vWaveNormal + vec3(n1 * 0.16 + n2 * 0.09, 0.0, n2 * 0.16 - n1 * 0.09) * rippleFade);

            // Depth-based tropical turquoise-to-deep-cobalt water palette
            vec3 shallowSand = vec3(0.55, 0.87, 0.80);
            vec3 turquoise   = vec3(0.03, 0.76, 0.74);
            vec3 cerulean    = vec3(0.02, 0.48, 0.69);
            vec3 deepOcean   = vec3(0.02, 0.19, 0.42);

            vec3 waterCol = mix(shallowSand, turquoise, smoothstep(0.10, 1.4, waterDepth));
            waterCol = mix(waterCol, cerulean, smoothstep(1.8, 9.5, waterDepth));
            waterCol = mix(waterCol, deepOcean, smoothstep(10.0, 28.0, waterDepth));

            // Subsurface turquoise glow inside sunlit wave crests
            float sss = pow(max(dot(V, -L), 0.0), 3.0) * 0.55 + 0.45 * max(L.y, 0.0);
            waterCol += vec3(0.04, 0.52, 0.48) * vWaveCrest * sss * smoothstep(26.0, 2.0, waterDepth);

            // Fresnel sky reflection
            float cosTheta = max(dot(N, V), 0.0);
            float fresnel = 0.025 + 0.975 * pow(1.0 - cosTheta, 4.8);
            vec3 R = reflect(-V, N);
            float reflElev = clamp(R.y, 0.0, 1.0);
            vec3 skyRefl = mix(uSkyHorizon, uSkyZenith, pow(reflElev, 0.55));
            float reflSunDot = max(dot(R, L), 0.0);
            skyRefl += uSunColor * pow(reflSunDot, 16.0) * (0.28 + 0.55 * uDuskGlow);

            vec3 col = mix(waterCol, skyRefl, fresnel * 0.82);

            // Sun glitter diamond sparkles
            vec3 H = normalize(L + V);
            float specTight = pow(max(dot(N, H), 0.0), 360.0);
            float specBroad = pow(max(dot(N, H), 0.0), 72.0);
            col += uSunColor * (specTight * 4.4 + specBroad * 0.28);

            // Animated breaking shore foam lines + cellular lacy froth
            float foamNoise = fbm(vWorldPos.xz * 0.26 + vec2(uTime * 0.28, -uTime * 0.14));
            float fineNoise = noise2(vWorldPos.xz * 1.15 - vec2(uTime * 0.45, 0.0));

            // Primary swash lip at beach & bay seawall edges
            float swashLip = smoothstep(0.45, 0.03, waterDepth) * smoothstep(0.24, 0.62, foamNoise + 0.26);

            // Rolling ocean breakers only on East Atlantic shore
            float eastMask = smoothstep(-2.0, 3.0, vShoreDist) * (1.0 - smoothstep(425.0, 488.0, abs(vWorldPos.z)));
            float surfWave1 = sin(vShoreDist * 0.36 + uTime * 1.65 + 0.45 * sin(vWorldPos.z * 0.032) + foamNoise * 1.6);
            float surfWave2 = sin(vShoreDist * 0.58 + uTime * 2.15 - 0.35 * cos(vWorldPos.z * 0.055) + fineNoise * 1.3);
            float surfBand = smoothstep(26.0, 2.5, vShoreDist) * smoothstep(0.05, 1.3, waterDepth) * eastMask;
            float breaker1 = smoothstep(0.58, 0.90, surfWave1) * surfBand * smoothstep(0.28, 0.65, foamNoise);
            float breaker2 = smoothstep(0.68, 0.94, surfWave2) * surfBand * 0.72 * smoothstep(0.32, 0.68, fineNoise);

            float whitecap = smoothstep(0.84, 1.15, vWaveCrest) * smoothstep(0.45, 0.78, foamNoise) * 0.45;

            // Speedboat white Kelvin V-wakes & stern trails (both Ocean & Bay!)
            float boatWake = 0.0;
            for (int i = 0; i < 8; i++) {
              vec4 b = uBoats[i];
              if (b.w <= 0.01) continue;
              vec2 d = vWorldPos.xz - b.xy;
              if (dot(d, d) > 7500.0) continue;
              float ch = cos(b.z), sh = sin(b.z);
              float fwd = d.x * sh + d.y * ch;
              float side = abs(d.x * ch - d.y * sh);
              if (fwd < 3.0 && fwd > -78.0) {
                float back = max(0.0, -fwd);
                float wakeFade = (1.0 - smoothstep(10.0, 78.0, back)) * smoothstep(0.0, 1.5, b.w);
                float bow = exp(-pow(fwd / 2.2, 2.0)) * exp(-pow((side - 1.1) / 0.9, 2.0)) * 0.8;
                float sternW = 1.0 + back * 0.06;
                float stern = exp(-pow(side / sternW, 2.0)) * (1.0 - smoothstep(6.0, 38.0, back));
                float armPos = 1.1 + pow(back, 0.94) * 0.31;
                float armWidth = 0.75 + back * 0.055;
                float vArm = exp(-pow((side - armPos) / armWidth, 2.0)) * smoothstep(0.4, 3.5, back);
                float wakeTex = smoothstep(0.24, 0.70, foamNoise * 0.68 + fineNoise * 0.45);
                boatWake = max(boatWake, (bow + stern * 0.95 + vArm * 0.85) * wakeFade * wakeTex);
              }
            }

            float totalFoam = clamp(swashLip * 0.95 + breaker1 * 0.90 + breaker2 * 0.75 + whitecap + boatWake, 0.0, 1.0);
            vec3 foamCol = mix(vec3(0.95, 0.98, 1.0), uSunColor * 1.02, 0.25 + 0.35 * uDuskGlow);
            col = mix(col, foamCol, totalFoam);

            // Atmospheric horizon fog
            float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * distCam * distCam);
            col = mix(col, uFogColor, clamp(fogFactor, 0.0, 1.0));

            float alpha = smoothstep(0.01, 0.26, waterDepth);
            alpha = max(alpha, totalFoam * smoothstep(0.005, 0.08, waterDepth));

            gl_FragColor = vec4(col, clamp(alpha, 0.0, 1.0));
          }
        `
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.renderOrder = 2;
      scene.add(mesh);
      return mesh;
    }
    const oceanMesh = createOcean();

    // =========================================================================
    // 7. COASTAL TERRAIN, CURVED WHITE-SAND BEACH & WET-SAND GRADIENT SHADER
    // =========================================================================
    function createTerrain() {
      const nx = 186;
      const nz = 190;
      const positions = [];
      const colors = [];
      const indices = [];

      const drySandCol = new THREE.Color(0xe5d7be);
      const parkGrassCol = new THREE.Color(0x4c8a3f);
      const cityGroundCol = new THREE.Color(0xbcb5a6);
      const bayBedCol = new THREE.Color(0xc8c0a8);

      for (let j = 0; j <= nz; j++) {
        const v = (j / nz) * 2.0 - 1.0;
        const sign = v < 0 ? -1 : 1;
        const av = Math.abs(v);
        const z = sign * 3000.0 * (0.24 * av + 0.76 * Math.pow(av, 2.8));
        const cx = coastX(z);
        const bw = bayWestX(z);
        const iw = islandWestX(z);

        // Adaptive X samples per row:
        // 0..32: mainland (-2900 .. bw, concentrated near city & bayfront)
        // 32..68: bay channel (bw .. iw)
        // 68..94: barrier island west & interior (iw .. cx - 42)
        // 94..156: detailed curved beach & foreshore (cx - 42 .. cx + 10)
        // 156..186: submerged ocean shelf (cx + 10 .. cx + 180)
        const xRow = [];
        for (let i = 0; i <= nx; i++) {
          let x;
          if (i <= 32) {
            const u = 1.0 - i / 32; // 1 inland -> 0 at bw
            const distFromBay = 2620.0 * (0.18 * u + 0.82 * Math.pow(u, 2.5));
            x = bw - distFromBay;
          } else if (i <= 68) {
            x = lerp(bw, iw, (i - 32) / 36);
          } else if (i <= 94) {
            x = lerp(iw, cx - 42.0, (i - 68) / 26);
          } else if (i <= 156) {
            x = lerp(cx - 42.0, cx + 10.0, (i - 94) / 62);
          } else {
            const t = (i - 156) / 30;
            x = cx + lerp(10.0, 180.0, Math.pow(t, 1.4));
          }
          xRow.push(x);
        }

        for (let i = 0; i <= nx; i++) {
          const x = xRow[i];
          const y = seabedHeight(x, z);
          positions.push(x, y, z);
          const s = x - cx;

          if (x > bw + 2.0 && x < iw - 2.0 && Math.abs(z) < 480.0) {
            colors.push(bayBedCol.r, bayBedCol.g, bayBedCol.b);
          } else if (s > -42.5) {
            colors.push(drySandCol.r, drySandCol.g, drySandCol.b);
          } else if (x <= bw) {
            // Mainland downtown & outer tropical palm parkland/hills
            const farZ = smoothstep(420.0, 580.0, Math.abs(z));
            const farX = smoothstep(-660.0, -780.0, x);
            const patch = noise2(x * 0.02, z * 0.02);
            const bayPark = smoothstep(bw - 24.0, bw, x) * 0.65;
            const c = cityGroundCol.clone().lerp(parkGrassCol, Math.min(1.0, patch * 0.45 + farZ * 0.92 + farX * 0.92 + bayPark));
            colors.push(c.r, c.g, c.b);
          } else {
            // Barrier island ground pad
            const patch = noise2(x * 0.025, z * 0.025);
            const c = cityGroundCol.clone().lerp(parkGrassCol, patch * 0.35);
            colors.push(c.r, c.g, c.b);
          }
        }
      }

      for (let j = 0; j < nz; j++) {
        for (let i = 0; i < nx; i++) {
          const a = j * (nx + 1) + i;
          const b = a + 1;
          const c = a + (nx + 1);
          const d = c + 1;
          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.90,
        metalness: 0.0
      });

      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = uShared.uTime;
        shader.uniforms.uSunDir = uShared.uSunDir;
        shader.uniforms.uSkyHorizon = uShared.uSkyHorizon;

        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', `#include <common>\nvarying vec3 vTerrWPos;`)
          .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>\nvTerrWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;`);

        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', /* glsl */ `
            #include <common>
            uniform float uTime;
            uniform vec3 uSkyHorizon;
            varying vec3 vTerrWPos;
            float tCoastX(float z) {
              float ze = 450.0 * tanh(z / 450.0);
              return 24.0 * sin(ze * 0.0072) - 10.0 * cos(ze * 0.0045) + 0.00015 * ze * ze;
            }
            float tHash2(vec2 p) {
              return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
            }
            float tNoise2(vec2 p) {
              vec2 i = floor(p); vec2 f = fract(p);
              f = f * f * (3.0 - 2.0 * f);
              return mix(mix(tHash2(i), tHash2(i + vec2(1,0)), f.x),
                         mix(tHash2(i + vec2(0,1)), tHash2(i + vec2(1,1)), f.x), f.y);
            }
          `)
          .replace('#include <color_fragment>', /* glsl */ `
            #include <color_fragment>
            float tShore = vTerrWPos.x - tCoastX(vTerrWPos.z);
            float swashLine = -2.4 + 1.9 * sin(uTime * 1.15 - vTerrWPos.z * 0.032)
                                   + 0.65 * sin(uTime * 0.72 + vTerrWPos.z * 0.055);
            float tWet = smoothstep(swashLine - 5.6, swashLine + 0.7, tShore);
            float beachMask = smoothstep(-43.5, -40.5, tShore);
            float grain = tNoise2(vTerrWPos.xz * 2.4) * 0.08 - 0.04;
            float ripple = sin(vTerrWPos.x * 1.3 + vTerrWPos.z * 0.35 + tNoise2(vTerrWPos.xz * 0.25) * 3.0) * 0.022;
            diffuseColor.rgb += (grain + ripple) * beachMask;
            // Distinct golden-tan darkening in glistening wet sand zone
            vec3 wetTint = diffuseColor.rgb * vec3(0.46, 0.42, 0.36);
            diffuseColor.rgb = mix(diffuseColor.rgb, wetTint, tWet * beachMask);
          `)
          .replace('#include <roughnessmap_fragment>', /* glsl */ `
            #include <roughnessmap_fragment>
            float tShoreR = vTerrWPos.x - tCoastX(vTerrWPos.z);
            float swashR = -2.4 + 1.9 * sin(uTime * 1.15 - vTerrWPos.z * 0.032)
                                + 0.65 * sin(uTime * 0.72 + vTerrWPos.z * 0.055);
            float wetR = smoothstep(swashR - 5.2, swashR + 0.6, tShoreR) * smoothstep(-43.5, -40.5, tShoreR);
            roughnessFactor = mix(0.92, 0.06, wetR);
          `);
      };

      const mesh = new THREE.Mesh(geo, mat);
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }
    const terrainMesh = createTerrain();

    // =========================================================================
    // 8. CALIBRATED PBR MATERIALS FOR ARCHITECTURE, ROADS, POOLS & FOLIAGE
    // =========================================================================
    function createAsphaltMaterial() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#242830';
      ctx.fillRect(0, 0, 512, 512);
      const img = ctx.getImageData(0, 0, 512, 512);
      const data = img.data;
      for (let i = 0; i < data.length; i += 4) {
        const px = (i / 4) % 512;
        const py = Math.floor(i / 4 / 512);
        const speck = (hash2(px * 0.7, py * 0.7) - 0.5) * 18 + (hash2(px * 0.15, py * 0.15) - 0.5) * 10;
        data[i] = clamp(36 + speck, 20, 60);
        data[i + 1] = clamp(39 + speck, 22, 64);
        data[i + 2] = clamp(46 + speck, 26, 72);
        data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(32, 32);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;

      return new THREE.MeshStandardMaterial({
        map: tex,
        roughness: 0.86,
        metalness: 0.04
      });
    }

    function createSidewalkMaterial() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#d0c4b1';
      ctx.fillRect(0, 0, 256, 256);
      ctx.strokeStyle = 'rgba(130, 118, 100, 0.28)';
      ctx.lineWidth = 2;
      for (let i = 0; i <= 256; i += 32) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(42, 42);
      tex.colorSpace = THREE.SRGBColorSpace;
      return new THREE.MeshStandardMaterial({
        map: tex,
        roughness: 0.82,
        metalness: 0.02
      });
    }

    function createFacadeMaterial() {
      const mat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.72,
        metalness: 0.05
      });

      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = uShared.uTime;
        shader.uniforms.uSunDir = uShared.uSunDir;
        shader.uniforms.uSunColor = uShared.uSunColor;
        shader.uniforms.uSkyZenith = uShared.uSkyZenith;
        shader.uniforms.uSkyHorizon = uShared.uSkyHorizon;
        shader.uniforms.uDuskGlow = uShared.uDuskGlow;

        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', /* glsl */ `
            #include <common>
            attribute vec3 aTint;
            attribute vec2 aWallCoord;
            attribute vec4 aBuildMeta;
            varying vec3 vTint;
            varying vec2 vWallCoord;
            varying vec2 vWallUV;
            varying vec4 vBuildMeta;
            varying vec3 vFacadeWPos;
            varying vec3 vFacadeWNorm;
          `)
          .replace('#include <worldpos_vertex>', /* glsl */ `
            #include <worldpos_vertex>
            vTint = aTint;
            vWallCoord = aWallCoord;
            vWallUV = uv;
            vBuildMeta = aBuildMeta;
            vFacadeWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
            vFacadeWNorm = normalize(mat3(modelMatrix) * objectNormal);
          `);

        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', /* glsl */ `
            #include <common>
            uniform float uTime;
            uniform vec3 uSunDir;
            uniform vec3 uSunColor;
            uniform vec3 uSkyZenith;
            uniform vec3 uSkyHorizon;
            uniform float uDuskGlow;
            varying vec3 vTint;
            varying vec2 vWallCoord;
            varying vec2 vWallUV;
            varying vec4 vBuildMeta;
            varying vec3 vFacadeWPos;
            varying vec3 vFacadeWNorm;

            float fHash(vec3 p) {
              p = fract(p * vec3(0.1031, 0.1030, 0.0973));
              p += dot(p, p.yxz + 33.33);
              return fract((p.x + p.y) * p.z);
            }
          `)
          .replace('#include <color_fragment>', /* glsl */ `
            #include <color_fragment>
            float bayW = max(vBuildMeta.x, 1.2);
            float floorH = max(vBuildMeta.y, 2.5);
            float styleF = vBuildMeta.z;
            float seedF = vBuildMeta.w;

            bool isRoof = abs(vFacadeWNorm.y) > 0.62;
            float glassMask = 0.0;
            float mullionMask = 0.0;
            vec3 cellId = vec3(0.0);
            vec2 winUV = vec2(0.5);

            if (!isRoof) {
              float colIdx = floor(vWallCoord.x / bayW);
              float flrIdx = floor(vWallCoord.y / floorH);
              float fu = fract(vWallCoord.x / bayW);
              float fv = fract(vWallCoord.y / floorH);
              cellId = vec3(colIdx, flrIdx, seedF);

              // Style 0: pastel stucco mid-rise with generous sliding glass windows
              // Style 1: Art Deco ribbed facade with recessed window bays
              // Style 2: Sleek glass curtain wall skyscraper (thin vertical mullions + horizontal spandrel band)
              // Style 3: Precast concrete & recessed glass skyscraper
              float hPad = (styleF > 1.5 && styleF < 2.5) ? 0.055 : (styleF > 2.5 ? 0.14 : 0.17);
              float vPadBot = (styleF > 1.5 && styleF < 2.5) ? 0.17 : 0.22;
              float vPadTop = (styleF > 1.5 && styleF < 2.5) ? 0.05 : 0.11;

              float inU = smoothstep(hPad - 0.02, hPad + 0.02, fu) * (1.0 - smoothstep(1.0 - hPad - 0.02, 1.0 - hPad + 0.02, fu));
              float inV = smoothstep(vPadBot - 0.02, vPadBot + 0.02, fv) * (1.0 - smoothstep(1.0 - vPadTop - 0.02, 1.0 - vPadTop + 0.02, fv));
              glassMask = inU * inV;

              // Ground lobby floor taller open glass
              if (flrIdx < 0.5) {
                glassMask = smoothstep(0.08, 0.12, fu) * (1.0 - smoothstep(0.88, 0.92, fu)) * smoothstep(0.06, 0.10, fv) * (1.0 - smoothstep(0.86, 0.90, fv));
              }

              // Subtle metallic frame edge right around glass
              float frameU = smoothstep(hPad - 0.045, hPad - 0.015, fu) * (1.0 - smoothstep(1.0 - hPad + 0.015, 1.0 - hPad + 0.045, fu));
              float frameV = smoothstep(vPadBot - 0.045, vPadBot - 0.015, fv) * (1.0 - smoothstep(1.0 - vPadTop + 0.015, 1.0 - vPadTop + 0.045, fv));
              mullionMask = clamp(frameU * frameV - glassMask, 0.0, 1.0);

              winUV = clamp((vec2(fu, fv) - vec2(hPad, vPadBot)) / vec2(1.0 - 2.0 * hPad, 1.0 - vPadBot - vPadTop), 0.0, 1.0);
            }

            // Facade stucco / concrete grain + vertical overhang shadow
            float grain = (fHash(floor(vFacadeWPos * 3.5)) - 0.5) * 0.032;
            float slabAO = isRoof ? 1.0 : mix(0.82, 1.0, smoothstep(0.0, 0.35, fract(vWallCoord.y / floorH)));
            vec3 wallCol = vTint * slabAO + grain;
            if (isRoof) {
              // Roof gravel / travertine membrane slightly lighter/neutral
              wallCol = mix(vTint, vec3(0.68, 0.65, 0.59), 0.78);
            }

            // Glass interior depth + curtain/blind parallax
            float rCell = fHash(cellId);
            float rCell2 = fHash(cellId + vec3(19.3, 7.1, 3.7));
            vec3 V = normalize(cameraPosition - vFacadeWPos);
            vec2 parallax = vec2(V.x + V.z, V.y) * 0.16;
            float blinds = smoothstep(0.32, 0.78, fract((winUV.y + parallax.y * 0.25) * 6.0));
            vec3 curtainCol = vTint * (0.36 + 0.22 * rCell);
            vec3 glassTint = (styleF > 1.5 && styleF < 2.5)
              ? mix(curtainCol * 0.65, curtainCol * 1.15, rCell)
              : mix(vec3(0.04, 0.09, 0.13), vec3(0.11, 0.17, 0.21), rCell2);
            glassTint *= mix(0.66, 1.06, blinds * (0.45 + 0.55 * rCell));

            vec3 mullionCol = (styleF > 1.5 && styleF < 2.5) ? vTint * 0.28 : vTint * 0.72;

            vec3 finalAlbedo = mix(wallCol, mullionCol, mullionMask);
            finalAlbedo = mix(finalAlbedo, glassTint, glassMask);
            diffuseColor.rgb = finalAlbedo;
          `)
          .replace('#include <roughnessmap_fragment>', /* glsl */ `
            #include <roughnessmap_fragment>
            float rBayW = max(vBuildMeta.x, 1.2);
            float rFlrH = max(vBuildMeta.y, 2.5);
            float rStyle = vBuildMeta.z;
            bool rIsRoof = abs(vFacadeWNorm.y) > 0.62;
            float rGlass = 0.0;
            if (!rIsRoof) {
              float rfu = fract(vWallCoord.x / rBayW);
              float rfv = fract(vWallCoord.y / rFlrH);
              float rFlr = floor(vWallCoord.y / rFlrH);
              float rhPad = (rStyle > 1.5 && rStyle < 2.5) ? 0.055 : (rStyle > 2.5 ? 0.14 : 0.17);
              float rvBot = (rStyle > 1.5 && rStyle < 2.5) ? 0.17 : 0.22;
              float rvTop = (rStyle > 1.5 && rStyle < 2.5) ? 0.05 : 0.11;
              rGlass = smoothstep(rhPad - 0.02, rhPad + 0.02, rfu) * (1.0 - smoothstep(1.0 - rhPad - 0.02, 1.0 - rhPad + 0.02, rfu))
                     * smoothstep(rvBot - 0.02, rvBot + 0.02, rfv) * (1.0 - smoothstep(1.0 - rvTop - 0.02, 1.0 - rvTop + 0.02, rfv));
              if (rFlr < 0.5) {
                rGlass = smoothstep(0.08, 0.12, rfu) * (1.0 - smoothstep(0.88, 0.92, rfu)) * smoothstep(0.06, 0.10, rfv) * (1.0 - smoothstep(0.86, 0.90, rfv));
              }
            }
            float wallRough = (rStyle > 1.5 && rStyle < 2.5) ? 0.30 : 0.84;
            roughnessFactor = mix(wallRough, 0.05, rGlass);
          `)
          .replace('#include <metalnessmap_fragment>', /* glsl */ `
            #include <metalnessmap_fragment>
            float mBayW = max(vBuildMeta.x, 1.2);
            float mFlrH = max(vBuildMeta.y, 2.5);
            float mStyle = vBuildMeta.z;
            bool mIsRoof = abs(vFacadeWNorm.y) > 0.62;
            float mGlass = 0.0;
            if (!mIsRoof) {
              float mfu = fract(vWallCoord.x / mBayW);
              float mfv = fract(vWallCoord.y / mFlrH);
              float mFlr = floor(vWallCoord.y / mFlrH);
              float mhPad = (mStyle > 1.5 && mStyle < 2.5) ? 0.055 : (mStyle > 2.5 ? 0.14 : 0.17);
              float mvBot = (mStyle > 1.5 && mStyle < 2.5) ? 0.17 : 0.22;
              float mvTop = (mStyle > 1.5 && mStyle < 2.5) ? 0.05 : 0.11;
              mGlass = smoothstep(mhPad - 0.02, mhPad + 0.02, mfu) * (1.0 - smoothstep(1.0 - mhPad - 0.02, 1.0 - mhPad + 0.02, mfu))
                     * smoothstep(mvBot - 0.02, mvBot + 0.02, mfv) * (1.0 - smoothstep(1.0 - mvTop - 0.02, 1.0 - mvTop + 0.02, mfv));
              if (mFlr < 0.5) {
                mGlass = smoothstep(0.08, 0.12, mfu) * (1.0 - smoothstep(0.88, 0.92, mfu)) * smoothstep(0.06, 0.10, mfv) * (1.0 - smoothstep(0.86, 0.90, mfv));
              }
            }
            float wallMetal = (mStyle > 1.5 && mStyle < 2.5) ? 0.58 : 0.02;
            metalnessFactor = mix(wallMetal, 0.30, mGlass);
          `)
          .replace('#include <emissivemap_fragment>', /* glsl */ `
            #include <emissivemap_fragment>
            float eBayW = max(vBuildMeta.x, 1.2);
            float eFlrH = max(vBuildMeta.y, 2.5);
            float eStyle = vBuildMeta.z;
            float eSeed = vBuildMeta.w;
            bool eIsRoof = abs(vFacadeWNorm.y) > 0.62;
            if (!eIsRoof) {
              float ecolIdx = floor(vWallCoord.x / eBayW);
              float eflrIdx = floor(vWallCoord.y / eFlrH);
              float efu = fract(vWallCoord.x / eBayW);
              float efv = fract(vWallCoord.y / eFlrH);
              float ehPad = (eStyle > 1.5 && eStyle < 2.5) ? 0.055 : (eStyle > 2.5 ? 0.14 : 0.17);
              float evBot = (eStyle > 1.5 && eStyle < 2.5) ? 0.17 : 0.22;
              float evTop = (eStyle > 1.5 && eStyle < 2.5) ? 0.05 : 0.11;

              float eGlass = smoothstep(ehPad - 0.02, ehPad + 0.02, efu) * (1.0 - smoothstep(1.0 - ehPad - 0.02, 1.0 - ehPad + 0.02, efu))
                           * smoothstep(evBot - 0.02, evBot + 0.02, efv) * (1.0 - smoothstep(1.0 - evTop - 0.02, 1.0 - evTop + 0.02, efv));
              if (eflrIdx < 0.5) {
                eGlass = smoothstep(0.08, 0.12, efu) * (1.0 - smoothstep(0.88, 0.92, efu)) * smoothstep(0.06, 0.10, efv) * (1.0 - smoothstep(0.86, 0.90, efv));
              }

              // Crisp Fresnel sky + horizon + sun glint on glass curtain walls
              vec3 eN = normalize(vFacadeWNorm);
              vec3 eV = normalize(cameraPosition - vFacadeWPos);
              vec3 eR = reflect(-eV, eN);
              float eFresnel = 0.08 + 0.92 * pow(1.0 - max(dot(eN, eV), 0.0), 3.4);
              vec3 skyMirror = mix(uSkyHorizon, uSkyZenith, clamp(eR.y * 1.35, 0.0, 1.0));
              float sunGlint = pow(max(dot(eR, normalize(uSunDir)), 0.0), 42.0);
              skyMirror += uSunColor * sunGlint * 1.75;
              float reflWeight = (eStyle > 1.5 && eStyle < 2.5) ? 0.54 : 0.34;
              totalEmissiveRadiance += skyMirror * eGlass * eFresnel * reflWeight;

              // Gradual golden-hour warm interior room illumination (natural ~32% clustered occupancy)
              float flrOcc = fHash(vec3(0.0, eflrIdx, eSeed));
              float litRand = fHash(vec3(ecolIdx, eflrIdx, eSeed));
              float litTemp = fHash(vec3(ecolIdx + 5.0, eflrIdx * 2.0, eSeed));
              float occRoll = mix(litRand, flrOcc, 0.25);
              float isLit = (eflrIdx < 0.5)
                ? smoothstep(0.18, 0.55, 1.0 - litRand)
                : smoothstep(0.66, 0.90, 1.0 - occRoll);
              float roomGrad = mix(0.55, 1.15, efv);
              vec3 warmLamp = mix(vec3(1.0, 0.54, 0.18), vec3(1.0, 0.80, 0.44), litTemp);
              if (eStyle > 1.5 && litTemp > 0.84) {
                warmLamp = vec3(0.68, 0.86, 1.0);
              }
              float intensityRand = 0.55 + 0.65 * fHash(vec3(ecolIdx * 3.0, eflrIdx + 7.0, eSeed));
              float glowStrength = uDuskGlow * (eflrIdx < 0.5 ? 1.65 : 1.05) * intensityRand;
              totalEmissiveRadiance += warmLamp * eGlass * isLit * roomGrad * glowStrength;

              // Subtle Art Deco architectural cove accent line along beachfront rooflines at golden hour
              if (eStyle < 1.5) {
                float corniceLine = smoothstep(0.962, 0.990, vWallUV.y) * (1.0 - smoothstep(0.992, 0.999, vWallUV.y));
                float neonHue = fHash(vec3(eSeed, 1.0, 2.0));
                vec3 decoGlow = (neonHue < 0.34)
                  ? vec3(1.0, 0.28, 0.56)   // Ocean Drive flamingo coral-pink
                  : (neonHue < 0.68 ? vec3(0.18, 0.95, 0.90) : vec3(1.0, 0.72, 0.26)); // Electric cyan / sunset gold
                totalEmissiveRadiance += decoGlow * corniceLine * uDuskGlow * 1.45;
              }
            }
          `);
      };
      return mat;
    }

    function createPoolWaterMaterial() {
      const mat = new THREE.MeshStandardMaterial({
        color: 0x1fd8d6,
        roughness: 0.07,
        metalness: 0.12
      });
      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = uShared.uTime;
        shader.uniforms.uDuskGlow = uShared.uDuskGlow;
        shader.uniforms.uSkyHorizon = uShared.uSkyHorizon;
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', `#include <common>\nvarying vec3 vPoolWPos;`)
          .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>\nvPoolWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;`);
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', `#include <common>\nuniform float uTime;\nuniform float uDuskGlow;\nuniform vec3 uSkyHorizon;\nvarying vec3 vPoolWPos;`)
          .replace('#include <color_fragment>', /* glsl */ `
            #include <color_fragment>
            float caustic = sin(vPoolWPos.x * 2.8 + uTime * 2.2) * cos(vPoolWPos.z * 2.8 - uTime * 1.9);
            diffuseColor.rgb += vec3(0.08, 0.22, 0.22) * (0.5 + 0.5 * caustic);
          `)
          .replace('#include <emissivemap_fragment>', /* glsl */ `
            #include <emissivemap_fragment>
            float pCaust = 0.5 + 0.5 * sin(vPoolWPos.x * 2.4 + uTime * 1.9) * cos(vPoolWPos.z * 2.4 - uTime * 2.1);
            totalEmissiveRadiance += vec3(0.06, 0.65, 0.72) * (0.12 + uDuskGlow * 1.25) * (0.7 + 0.3 * pCaust);
          `);
      };
      return mat;
    }

    function applyPalmWindHook(mat, isFrond) {
      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = uShared.uTime;
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', `#include <common>\nuniform float uTime;`)
          .replace('#include <begin_vertex>', /* glsl */ `
            #include <begin_vertex>
            vec4 instPos = vec4(transformed, 1.0);
            #ifdef USE_INSTANCING
              instPos = instanceMatrix * instPos;
            #endif
            float gustPhase = instPos.x * 0.045 + instPos.z * 0.032;
            float breeze = sin(uTime * 1.45 + gustPhase) * 0.65 + sin(uTime * 2.6 + gustPhase * 1.9) * 0.35;
            float hNorm = clamp(transformed.y / 14.0, 0.0, 1.0);
            ${isFrond
              ? `
                float tipDist = length(transformed.xz);
                float flutter = sin(uTime * 3.4 + gustPhase * 2.5 + tipDist * 0.9) * 0.14 * smoothstep(0.3, 3.5, tipDist);
                transformed.x += breeze * 0.52 * (0.4 + 0.6 * hNorm) + flutter;
                transformed.y += flutter * 0.35;
                transformed.z += breeze * 0.22 * hNorm;
              `
              : `
                transformed.x += breeze * 0.48 * hNorm * hNorm;
                transformed.z += breeze * 0.18 * hNorm * hNorm;
              `}
          `);
      };
      return mat;
    }

    const facadeMaterial = createFacadeMaterial();
    const trimMaterial = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.72,
      metalness: 0.04
    });
    const balconyGlassMaterial = new THREE.MeshStandardMaterial({
      color: 0x7fd8eb,
      transparent: true,
      opacity: 0.44,
      roughness: 0.08,
      metalness: 0.24,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const poolWaterMaterial = createPoolWaterMaterial();
    const asphaltMaterial = createAsphaltMaterial();
    const sidewalkMaterial = createSidewalkMaterial();

    // =========================================================================
    // 9. GEOMETRY ACCUMULATORS FOR PARAMETRIC BUILDING MASSING
    // =========================================================================
    class FacadeBuilder {
      constructor() {
        this.pos = [];
        this.norm = [];
        this.uv = [];
        this.tint = [];
        this.wallCoord = [];
        this.meta = [];
        this.idx = [];
        this.vCount = 0;
      }

      addVert(px, py, pz, nx, ny, nz, u, v, tint, wu, wy, bayW, floorH, style, seed) {
        const len = Math.hypot(nx, ny, nz) || 1;
        this.pos.push(px, py, pz);
        this.norm.push(nx / len, ny / len, nz / len);
        this.uv.push(u, v);
        this.tint.push(tint[0], tint[1], tint[2]);
        this.wallCoord.push(wu, wy);
        this.meta.push(bayW, floorH, style, seed);
        return this.vCount++;
      }

      addQuad(a, b, c, d) {
        this.idx.push(a, b, c, a, c, d);
      }

      // Extrude an arbitrary CCW 2D polygon [ [x,z], ... ] from y0 to y1 (optional sloped roof fn)
      extrudePolygon(pts, y0, y1, tint, bayW, floorH, style, seed, roofSlopeFn = null) {
        const n = pts.length;
        if (n < 3) return;
        let perim = 0;

        // Side faces (CCW winding looking from above => outward normal = (dz, 0, -dx))
        for (let i = 0; i < n; i++) {
          const [x0, z0] = pts[i];
          const [x1, z1] = pts[(i + 1) % n];
          const dx = x1 - x0;
          const dz = z1 - z0;
          const segLen = Math.hypot(dx, dz);
          if (segLen < 0.05) continue;

          // Outward normal for CCW polygon in XZ plane (where +X is right, +Z is down/south):
          // Wait: let's check winding! If polygon vertices are CCW in (x, -z) (standard math CCW on XZ viewed from +Y):
          // Tangent (dx, 0, dz), Up (0, 1, 0) => Outward = Tangent x Up = (-dz, 0, dx)
          const nx = -dz / segLen;
          const nz = dx / segLen;

          const ty0 = roofSlopeFn ? roofSlopeFn(x0, z0, y1) : y1;
          const ty1 = roofSlopeFn ? roofSlopeFn(x1, z1, y1) : y1;

          const v0 = this.addVert(x0, y0, z0, nx, 0, nz, 0, 0, tint, perim, 0, bayW, floorH, style, seed);
          const v1 = this.addVert(x1, y0, z1, nx, 0, nz, 1, 0, tint, perim + segLen, 0, bayW, floorH, style, seed);
          const v2 = this.addVert(x1, ty1, z1, nx, 0, nz, 1, 1, tint, perim + segLen, ty1 - y0, bayW, floorH, style, seed);
          const v3 = this.addVert(x0, ty0, z0, nx, 0, nz, 0, 1, tint, perim, ty0 - y0, bayW, floorH, style, seed);
          // Front face CCW from outside: v0 -> v1 -> v2 -> v3
          this.idx.push(v0, v1, v2, v0, v2, v3);
          perim += segLen;
        }

        // Roof cap via earcut / ShapeUtils triangulation (supports concave L, U, E shapes!)
        const shapePts = pts.map(([x, z]) => new THREE.Vector2(x, -z));
        const tris = THREE.ShapeUtils.triangulateShape(shapePts, []);
        // Compute average normal if sloped roof
        let rnx = 0, rny = 1, rnz = 0;
        if (roofSlopeFn) {
          const [cx, cz] = pts[0];
          const h0 = roofSlopeFn(cx, cz, y1);
          const hx = roofSlopeFn(cx + 1, cz, y1);
          const hz = roofSlopeFn(cx, cz + 1, y1);
          rnx = h0 - hx; rny = 1.0; rnz = h0 - hz;
        }
        const roofVerts = [];
        for (let i = 0; i < n; i++) {
          const [x, z] = pts[i];
          const yTop = roofSlopeFn ? roofSlopeFn(x, z, y1) : y1;
          roofVerts.push(this.addVert(x, yTop, z, rnx, rny, rnz, 0.5, 0.5, tint, 0, yTop - y0, bayW, floorH, style, seed));
        }
        for (const [ia, ib, ic] of tris) {
          this.idx.push(roofVerts[ia], roofVerts[ib], roofVerts[ic]);
        }
      }

      toGeometry() {
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
        g.setAttribute('normal', new THREE.Float32BufferAttribute(this.norm, 3));
        g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
        g.setAttribute('aTint', new THREE.Float32BufferAttribute(this.tint, 3));
        g.setAttribute('aWallCoord', new THREE.Float32BufferAttribute(this.wallCoord, 2));
        g.setAttribute('aBuildMeta', new THREE.Float32BufferAttribute(this.meta, 4));
        g.setIndex(this.idx);
        return g;
      }
    }

    class TrimBuilder {
      constructor() {
        this.pos = [];
        this.norm = [];
        this.col = [];
        this.idx = [];
        this.vCount = 0;
      }

      addVert(px, py, pz, nx, ny, nz, rgb) {
        const len = Math.hypot(nx, ny, nz) || 1;
        this.pos.push(px, py, pz);
        this.norm.push(nx / len, ny / len, nz / len);
        this.col.push(rgb[0], rgb[1], rgb[2]);
        return this.vCount++;
      }

      addBox(cx, cy, cz, sx, sy, sz, rgb, rotY = 0) {
        const hx = sx * 0.5, hy = sy * 0.5, hz = sz * 0.5;
        const c = Math.cos(rotY), s = Math.sin(rotY);
        const xf = (lx, ly, lz) => [cx + lx * c + lz * s, cy + ly, cz - lx * s + lz * c];
        const nf = (nx, ny, nz) => [nx * c + nz * s, ny, -nx * s + nz * c];

        const faces = [
          { n: [0, 1, 0], pts: [[-hx, hy, hz], [hx, hy, hz], [hx, hy, -hz], [-hx, hy, -hz]] },
          { n: [0, -1, 0], pts: [[-hx, -hy, -hz], [hx, -hy, -hz], [hx, -hy, hz], [-hx, -hy, hz]] },
          { n: [1, 0, 0], pts: [[hx, -hy, hz], [hx, -hy, -hz], [hx, hy, -hz], [hx, hy, hz]] },
          { n: [-1, 0, 0], pts: [[-hx, -hy, -hz], [-hx, -hy, hz], [-hx, hy, hz], [-hx, hy, -hz]] },
          { n: [0, 0, 1], pts: [[-hx, -hy, hz], [hx, -hy, hz], [hx, hy, hz], [-hx, hy, hz]] },
          { n: [0, 0, -1], pts: [[hx, -hy, -hz], [-hx, -hy, -hz], [-hx, hy, -hz], [hx, hy, -hz]] }
        ];
        for (const f of faces) {
          const nn = nf(f.n[0], f.n[1], f.n[2]);
          const ids = f.pts.map(p => {
            const wp = xf(p[0], p[1], p[2]);
            return this.addVert(wp[0], wp[1], wp[2], nn[0], nn[1], nn[2], rgb);
          });
          this.idx.push(ids[0], ids[1], ids[2], ids[0], ids[2], ids[3]);
        }
      }

      addCylinder(cx, y0, y1, rBot, rTop, segs, rgb) {
        const base = this.vCount;
        for (let i = 0; i <= segs; i++) {
          const a = (i / segs) * Math.PI * 2;
          const ca = Math.cos(a), sa = Math.sin(a);
          this.addVert(cx[0] + rBot * ca, y0, cx[1] + rBot * sa, ca, 0, sa, rgb);
          this.addVert(cx[0] + rTop * ca, y1, cx[1] + rTop * sa, ca, 0, sa, rgb);
        }
        for (let i = 0; i < segs; i++) {
          const a = base + i * 2;
          const b = a + 1;
          const c = a + 2;
          const d = a + 3;
          this.idx.push(a, c, b, b, c, d);
        }
        // Top cap
        const tc = this.addVert(cx[0], y1, cx[1], 0, 1, 0, rgb);
        for (let i = 0; i < segs; i++) {
          const a0 = (i / segs) * Math.PI * 2;
          const a1 = ((i + 1) / segs) * Math.PI * 2;
          const v1 = this.addVert(cx[0] + rTop * Math.cos(a0), y1, cx[1] + rTop * Math.sin(a0), 0, 1, 0, rgb);
          const v2 = this.addVert(cx[0] + rTop * Math.cos(a1), y1, cx[1] + rTop * Math.sin(a1), 0, 1, 0, rgb);
          this.idx.push(tc, v2, v1);
        }
      }

      // Extruded thin concrete slab / parapet rim along a CCW polygon
      addPolygonSlab(pts, y0, y1, rgb) {
        const n = pts.length;
        if (n < 3) return;
        for (let i = 0; i < n; i++) {
          const [x0, z0] = pts[i];
          const [x1, z1] = pts[(i + 1) % n];
          const dx = x1 - x0, dz = z1 - z0;
          const L = Math.hypot(dx, dz);
          if (L < 0.05) continue;
          const nx = -dz / L, nz = dx / L;
          const v0 = this.addVert(x0, y0, z0, nx, 0, nz, rgb);
          const v1 = this.addVert(x1, y0, z1, nx, 0, nz, rgb);
          const v2 = this.addVert(x1, y1, z1, nx, 0, nz, rgb);
          const v3 = this.addVert(x0, y1, z0, nx, 0, nz, rgb);
          this.idx.push(v0, v1, v2, v0, v2, v3);
        }
        const shapePts = pts.map(([x, z]) => new THREE.Vector2(x, -z));
        const tris = THREE.ShapeUtils.triangulateShape(shapePts, []);
        const topIds = pts.map(([x, z]) => this.addVert(x, y1, z, 0, 1, 0, rgb));
        const botIds = pts.map(([x, z]) => this.addVert(x, y0, z, 0, -1, 0, rgb));
        for (const [a, b, c] of tris) {
          this.idx.push(topIds[a], topIds[b], topIds[c]);
          this.idx.push(botIds[a], botIds[c], botIds[b]);
        }
      }

      toGeometry() {
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
        g.setAttribute('normal', new THREE.Float32BufferAttribute(this.norm, 3));
        g.setAttribute('color', new THREE.Float32BufferAttribute(this.col, 3));
        g.setIndex(this.idx);
        return g;
      }
    }

    class GlassRailBuilder {
      constructor() {
        this.pos = [];
        this.norm = [];
        this.idx = [];
        this.vCount = 0;
      }
      addRibbon(pts, y0, y1) {
        const n = pts.length;
        for (let i = 0; i < n; i++) {
          const [x0, z0] = pts[i];
          const [x1, z1] = pts[(i + 1) % n];
          const dx = x1 - x0, dz = z1 - z0;
          const L = Math.hypot(dx, dz) || 1;
          const nx = -dz / L, nz = dx / L;
          const base = this.vCount;
          this.pos.push(x0, y0, z0, x1, y0, z1, x1, y1, z1, x0, y1, z0);
          this.norm.push(nx, 0, nz, nx, 0, nz, nx, 0, nz, nx, 0, nz);
          this.idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
          this.vCount += 4;
        }
      }
      toGeometry() {
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
        g.setAttribute('normal', new THREE.Float32BufferAttribute(this.norm, 3));
        g.setIndex(this.idx);
        return g;
      }
    }

    // Polygon generators (guaranteed CCW in (x, -z) when viewed from +Y!)
    function transformPoly(localPts, cx, cz, rotY) {
      const c = Math.cos(rotY), s = Math.sin(rotY);
      return localPts.map(([lx, lz]) => [cx + lx * c + lz * s, cz - lx * s + lz * c]);
    }

    function polyRect(w, d) {
      const hw = w * 0.5, hd = d * 0.5;
      // In (x, z) where +X right, -Z forward: CCW from +Y is (-hw, +hd) -> (+hw, +hd) -> (+hw, -hd) -> (-hw, -hd)
      return [[-hw, hd], [hw, hd], [hw, -hd], [-hw, -hd]];
    }

    function polyChamfer(w, d, ch) {
      const hw = w * 0.5, hd = d * 0.5;
      const c = Math.min(ch, hw * 0.45, hd * 0.45);
      return [
        [-hw + c, hd], [hw - c, hd], [hw, hd - c], [hw, -hd + c],
        [hw - c, -hd], [-hw + c, -hd], [-hw, -hd + c], [-hw, hd - c]
      ];
    }

    function polyRounded(w, d, r, segs = 4) {
      const hw = w * 0.5, hd = d * 0.5;
      const rr = Math.min(r, hw * 0.45, hd * 0.45);
      const pts = [];
      const corners = [
        [-hw + rr, hd - rr, Math.PI, Math.PI * 0.5],
        [hw - rr, hd - rr, Math.PI * 0.5, 0],
        [hw - rr, -hd + rr, 0, -Math.PI * 0.5],
        [-hw + rr, -hd + rr, -Math.PI * 0.5, -Math.PI]
      ];
      // Wait: in (x, z) with z down: bottom-left is (-, +), bottom-right is (+, +), top-right is (+, -), top-left is (-, -)
      // Angle around corner in (x, -z) CCW:
      const cxA = [
        [-hw + rr, hd - rr, -Math.PI, -Math.PI * 0.5],
        [hw - rr, hd - rr, -Math.PI * 0.5, 0],
        [hw - rr, -hd + rr, 0, Math.PI * 0.5],
        [-hw + rr, -hd + rr, Math.PI * 0.5, Math.PI]
      ];
      for (const [cx, cz, a0, a1] of cxA) {
        for (let i = 0; i <= segs; i++) {
          const a = lerp(a0, a1, i / segs);
          pts.push([cx + rr * Math.cos(a), cz - rr * Math.sin(a)]);
        }
      }
      return pts;
    }

    function polyEllipse(rx, rz, segs = 18) {
      const pts = [];
      for (let i = 0; i < segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        pts.push([rx * Math.cos(a), -rz * Math.sin(a)]);
      }
      return pts;
    }

    function polyLShape(w, d, wingW, wingD) {
      const hw = w * 0.5, hd = d * 0.5;
      return [
        [-hw, hd], [hw, hd], [hw, hd - wingD], [-hw + wingW, hd - wingD],
        [-hw + wingW, -hd], [-hw, -hd]
      ];
    }

    function polyUShape(w, d, armD, spineW) {
      const hw = w * 0.5, hd = d * 0.5;
      // U opens toward +X (the ocean!)
      return [
        [-hw, hd], [hw, hd], [hw, hd - armD], [-hw + spineW, hd - armD],
        [-hw + spineW, -hd + armD], [hw, -hd + armD], [hw, -hd], [-hw, -hd]
      ];
    }

    function polyCross(w, d, armW, armD) {
      const hw = w * 0.5, hd = d * 0.5;
      const aw = armW * 0.5, ad = armD * 0.5;
      return [
        [-aw, hd], [aw, hd], [aw, ad], [hw, ad], [hw, -ad],
        [aw, -ad], [aw, -hd], [-aw, -hd], [-aw, -ad], [-hw, -ad],
        [-hw, ad], [-aw, ad]
      ];
    }

    function offsetPoly(pts, delta) {
      // Simple centroid-based radial inset/outset or edge normal offset
      let cx = 0, cz = 0;
      for (const p of pts) { cx += p[0]; cz += p[1]; }
      cx /= pts.length; cz /= pts.length;
      return pts.map(([x, z]) => {
        const dx = x - cx, dz = z - cz;
        const len = Math.hypot(dx, dz) || 1;
        return [x + (dx / len) * delta, z + (dz / len) * delta];
      });
    }

    function edgeOffsetPoly(pts, dist) {
      const n = pts.length;
      const res = [];
      for (let i = 0; i < n; i++) {
        const pPrev = pts[(i - 1 + n) % n];
        const pCurr = pts[i];
        const pNext = pts[(i + 1) % n];
        const d1x = pCurr[0] - pPrev[0], d1z = pCurr[1] - pPrev[1];
        const L1 = Math.hypot(d1x, d1z) || 1;
        const n1x = -d1z / L1, n1z = d1x / L1;

        const d2x = pNext[0] - pCurr[0], d2z = pNext[1] - pCurr[1];
        const L2 = Math.hypot(d2x, d2z) || 1;
        const n2x = -d2z / L2, n2z = d2x / L2;

        let bx = n1x + n2x, bz = n1z + n2z;
        const bLen = Math.hypot(bx, bz) || 1;
        bx /= bLen; bz /= bLen;
        const cosHalf = clamp(bx * n1x + bz * n1z, 0.38, 1.0);
        res.push([pCurr[0] + (bx * dist) / cosHalf, pCurr[1] + (bz * dist) / cosHalf]);
      }
      return res;
    }

    // =========================================================================
    // 10. PROCEDURAL STREET GRID, PROMENADE, INTERSECTIONS & LANE MARKINGS
    // =========================================================================
    const whitePaintMat = new THREE.MeshStandardMaterial({
      color: 0xf6f6f2,
      roughness: 0.72,
      metalness: 0.02,
      polygonOffset: true,
      polygonOffsetFactor: -2,
      polygonOffsetUnits: -2
    });

    const yellowPaintMat = new THREE.MeshStandardMaterial({
      color: 0xf2bf38,
      roughness: 0.72,
      metalness: 0.02,
      polygonOffset: true,
      polygonOffsetFactor: -2,
      polygonOffsetUnits: -2
    });

    const medianTurfMat = new THREE.MeshStandardMaterial({
      color: 0x4b9445,
      roughness: 0.88,
      metalness: 0.0
    });

    const seawallMat = new THREE.MeshStandardMaterial({
      color: 0xe6dccb,
      roughness: 0.78,
      metalness: 0.02
    });

    const linRGB = (r, g, b) => [Math.pow(r, 2.2), Math.pow(g, 2.2), Math.pow(b, 2.2)];
    const POOL_DECK_COL = linRGB(0.80, 0.70, 0.58);
    const WHITE_SLAB_COL = linRGB(0.93, 0.91, 0.87);
    const DARK_METAL_COL = linRGB(0.18, 0.21, 0.25);

    const lampPositions = [];
    const palmSites = []; // { x, z, y, type: 'coconut' | 'royal', scale, leanAngle, leanDir }

    function buildStreetNetwork() {
      const roadGroup = new THREE.Group();
      scene.add(roadGroup);

      // Helper to extrude a horizontal curved ribbon along Z
      function makeCurvedStrip(zMin, zMax, steps, offsetLeftFn, offsetRightFn, yTop, yBot = null) {
        const pos = [], norm = [], uv = [], idx = [];
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const z = lerp(zMin, zMax, t);
          const xl = offsetLeftFn(z);
          const xr = offsetRightFn(z);
          pos.push(xl, yTop, z, xr, yTop, z);
          norm.push(0, 1, 0, 0, 1, 0);
          uv.push(0, t * 24, 1, t * 24);
        }
        for (let i = 0; i < steps; i++) {
          const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
          idx.push(a, c, b, b, c, d);
        }
        if (yBot !== null) {
          // Side walls down to yBot for raised curbs/medians/promenade
          const baseL = pos.length / 3;
          for (let i = 0; i <= steps; i++) {
            const z = lerp(zMin, zMax, i / steps);
            const xl = offsetLeftFn(z);
            const dxdz = (offsetLeftFn(z + 0.5) - offsetLeftFn(z - 0.5));
            const L = Math.hypot(dxdz, 1);
            pos.push(xl, yTop, z, xl, yBot, z);
            norm.push(-1 / L, 0, dxdz / L, -1 / L, 0, dxdz / L);
            uv.push(0, 0, 0, 1);
          }
          for (let i = 0; i < steps; i++) {
            const a = baseL + i * 2;
            idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
          }
          const baseR = pos.length / 3;
          for (let i = 0; i <= steps; i++) {
            const z = lerp(zMin, zMax, i / steps);
            const xr = offsetRightFn(z);
            const dxdz = (offsetRightFn(z + 0.5) - offsetRightFn(z - 0.5));
            const L = Math.hypot(dxdz, 1);
            pos.push(xr, yTop, z, xr, yBot, z);
            norm.push(1 / L, 0, -dxdz / L, 1 / L, 0, -dxdz / L);
            uv.push(0, 0, 0, 1);
          }
          for (let i = 0; i < steps; i++) {
            const a = baseR + i * 2;
            idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
          }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
        g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
        g.setIndex(idx);
        return g;
      }

      const zMinIsl = -415, zMaxIsl = 415, segsIsl = 110;
      const zMinMain = -520, zMaxMain = 520, segsMain = 125;

      // 1) East Beachfront Promenade & Seawall (s = -50 to -42 on Barrier Island)
      const promGeo = makeCurvedStrip(zMinIsl, zMaxIsl, segsIsl, z => coastX(z) - 50.0, z => coastX(z) - 42.0, Y_SIDEWALK, 1.5);
      const promMesh = new THREE.Mesh(promGeo, sidewalkMaterial);
      promMesh.receiveShadow = true;
      roadGroup.add(promMesh);

      const wallGeo = makeCurvedStrip(zMinIsl, zMaxIsl, segsIsl, z => coastX(z) - 42.55, z => coastX(z) - 41.8, Y_SEAWALL_TOP, 1.7);
