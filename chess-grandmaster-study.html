  m.renderOrder = 2;
  highlightGroup.add(m);
});

for (let i = 0; i < 32; i++) {
  const m = new THREE.Mesh(ringPlaneGeo, ringMaterials.legal);
  m.visible = false;
  m.renderOrder = 2;
  highlightGroup.add(m);
  activeRings.legalPool.push(m);
}

function placeRing(mesh, r, f, yOff = 0.011) {
  const p = squareToWorld(r, f);
  mesh.position.set(p.x, BOARD_TOP_Y + yOff, p.z);
  mesh.visible = true;
}

// ============================================================================
// 9. AMBIENT DUST MOTES & GOLDEN EMBER CAPTURE PARTICLE SYSTEM
// ============================================================================
const glowSprite = createSoftGlowSprite();

// --- Drifting Ambient Dust Motes in the Warm Spotlight Beam ---
const DUST_COUNT = 240;
const dustRand = mulberry32(4242);
const dustGeo = new THREE.BufferGeometry();
const dustPositions = new Float32Array(DUST_COUNT * 3);
const dustSizes = new Float32Array(DUST_COUNT);
const dustSeeds = new Float32Array(DUST_COUNT * 3);

for (let i = 0; i < DUST_COUNT; i++) {
  const angle = dustRand() * Math.PI * 2;
  const radius = Math.pow(dustRand(), 0.55) * 6.8;
  dustPositions[i * 3] = Math.cos(angle) * radius;
  dustPositions[i * 3 + 1] = 0.55 + dustRand() * 7.8;
  dustPositions[i * 3 + 2] = Math.sin(angle) * radius;
  dustSizes[i] = 0.65 + dustRand() * 1.45;
  dustSeeds[i * 3] = dustRand() * 6.283;
  dustSeeds[i * 3 + 1] = 0.18 + dustRand() * 0.42;
  dustSeeds[i * 3 + 2] = dustRand() * 6.283;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
dustGeo.setAttribute('aSize', new THREE.BufferAttribute(dustSizes, 1));
dustGeo.setAttribute('aSeed', new THREE.BufferAttribute(dustSeeds, 3));

const dustMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uTime: { value: 0 },
    uSprite: { value: glowSprite },
    uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
  },
  vertexShader: `
    attribute float aSize;
    attribute vec3 aSeed;
    uniform float uTime;
    uniform float uPixelRatio;
    varying float vAlpha;
    void main() {
      vec3 p = position;
      p.x += sin(uTime * aSeed.y + aSeed.x) * 0.42;
      p.y += mod(uTime * 0.09 * aSeed.y + aSeed.z, 7.6) * 0.22 - 0.8;
      p.z += cos(uTime * aSeed.y * 0.8 + aSeed.z) * 0.42;

      // Spotlight cone illumination intensity
      float distAxis = length(p.xz - vec2(0.4, 0.4));
      float inBeam = smoothstep(7.2, 1.4, distAxis);
      float twinkle = 0.55 + 0.45 * sin(uTime * (1.2 + aSeed.y * 2.0) + aSeed.x * 3.0);
      vAlpha = inBeam * twinkle * 0.38;

      vec4 mvPos = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = aSize * uPixelRatio * (105.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    uniform sampler2D uSprite;
    varying float vAlpha;
    void main() {
      vec4 tex = texture2D(uSprite, gl_PointCoord);
      float a = tex.a * vAlpha;
      if (a < 0.005) discard;
      gl_FragColor = vec4(1.0, 0.88, 0.66, a);
    }
  `
});
const dustMotes = new THREE.Points(dustGeo, dustMat);
scene.add(dustMotes);

// --- Shimmering Golden Ember Burst Pool (for Captured Pieces) ---
const MAX_EMBERS = 900;
const emberGeo = new THREE.BufferGeometry();
const emberPos = new Float32Array(MAX_EMBERS * 3);
const emberCol = new Float32Array(MAX_EMBERS * 3);
const emberSize = new Float32Array(MAX_EMBERS);
const emberAlpha = new Float32Array(MAX_EMBERS);

emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPos, 3));
emberGeo.setAttribute('aColor', new THREE.BufferAttribute(emberCol, 3));
emberGeo.setAttribute('aSize', new THREE.BufferAttribute(emberSize, 1));
emberGeo.setAttribute('aAlpha', new THREE.BufferAttribute(emberAlpha, 1));

const emberMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uSprite: { value: glowSprite },
    uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
  },
  vertexShader: `
    attribute vec3 aColor;
    attribute float aSize;
    attribute float aAlpha;
    uniform float uPixelRatio;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vColor = aColor;
      vAlpha = aAlpha;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * uPixelRatio * (130.0 / max(1.0, -mvPos.z));
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    uniform sampler2D uSprite;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      if (vAlpha <= 0.005) discard;
      vec4 tex = texture2D(uSprite, gl_PointCoord);
      float a = tex.a * vAlpha;
      if (a < 0.005) discard;
      gl_FragColor = vec4(vColor, a);
    }
  `
});

const emberPoints = new THREE.Points(emberGeo, emberMat);
emberPoints.frustumCulled = false;
scene.add(emberPoints);

const activeEmbers = [];
function spawnGoldenEmbers(origin, count = 175) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const rad = Math.random() * 0.34;
    const h = Math.random() * 1.15;
    const speedOut = 0.25 + Math.random() * 0.95;
    const life = 1.05 + Math.random() * 1.25;
    const warmShift = Math.random();
    activeEmbers.push({
      x: origin.x + Math.cos(a) * rad,
      y: origin.y + 0.1 + h,
      z: origin.z + Math.sin(a) * rad,
      vx: Math.cos(a) * speedOut,
      vy: 0.75 + Math.random() * 1.85,
      vz: Math.sin(a) * speedOut,
      swirl: (Math.random() - 0.5) * 3.8,
      age: 0,
      life,
      size: 0.75 + Math.random() * 1.9,
      // HDR golden-amber values > 1.0 so Unreal Bloom gives real incandescent sparkle
      r: lerp(2.6, 3.2, warmShift),
      g: lerp(1.25, 2.2, warmShift),
      b: lerp(0.22, 0.75, warmShift)
    });
  }
  while (activeEmbers.length > MAX_EMBERS) activeEmbers.shift();
}

function updateEmbers(dt) {
  for (let i = activeEmbers.length - 1; i >= 0; i--) {
    const e = activeEmbers[i];
    e.age += dt;
    if (e.age >= e.life) {
      activeEmbers.splice(i, 1);
      continue;
    }
    const swirlA = e.swirl * dt;
    const nvx = e.vx * Math.cos(swirlA) - e.vz * Math.sin(swirlA);
    const nvz = e.vx * Math.sin(swirlA) + e.vz * Math.cos(swirlA);
    e.vx = nvx * (1 - dt * 0.65);
    e.vz = nvz * (1 - dt * 0.65);
    e.vy *= (1 - dt * 0.32);
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    e.z += e.vz * dt;
  }

  for (let i = 0; i < MAX_EMBERS; i++) {
    if (i < activeEmbers.length) {
      const e = activeEmbers[i];
      const t = e.age / e.life;
      const flicker = 0.72 + 0.28 * Math.sin(e.age * 24.0 + i * 1.7);
      emberPos[i * 3] = e.x;
      emberPos[i * 3 + 1] = e.y;
      emberPos[i * 3 + 2] = e.z;
      emberCol[i * 3] = e.r;
      emberCol[i * 3 + 1] = e.g * (1 - t * 0.35);
      emberCol[i * 3 + 2] = e.b;
      emberSize[i] = e.size * (1.0 - t * 0.65);
      emberAlpha[i] = Math.sin(Math.min(1, t * 5.0) * Math.PI * 0.5) * Math.pow(1.0 - t, 1.4) * flicker;
    } else {
      emberAlpha[i] = 0;
    }
  }
  emberGeo.attributes.position.needsUpdate = true;
  emberGeo.attributes.aColor.needsUpdate = true;
  emberGeo.attributes.aSize.needsUpdate = true;
  emberGeo.attributes.aAlpha.needsUpdate = true;
}

// ============================================================================
// 10. SCENE PIECE MANAGEMENT & PHYSICS-INSPIRED ANIMATIONS
// ============================================================================
const engine = new ChessEngine();
const piecesGroup = new THREE.Group();
scene.add(piecesGroup);

const pieceMeshes = new Map(); // pieceId -> THREE.Group
const capturedTrayCounts = { w: 0, b: 0 };
const capturedMeshes = { w: [], b: [] }; // pieces resting in trays
const activeAnimations = [];

let captureMode = 'embers'; // 'embers' | 'tray'
let playbackSpeed = 1.0;

function clearAllPiecesAndAnimations() {
  activeAnimations.length = 0;
  for (const mesh of pieceMeshes.values()) {
    piecesGroup.remove(mesh);
  }
  pieceMeshes.clear();
  capturedTrayCounts.w = 0;
  capturedTrayCounts.b = 0;
  capturedMeshes.w.length = 0;
  capturedMeshes.b.length = 0;
}

function syncMeshesToEngine() {
  clearAllPiecesAndAnimations();
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const p = engine.board[r][f];
      if (!p) continue;
      const mesh = createPieceMesh(p);
      const pos = squareToWorld(r, f);
      mesh.position.copy(pos);
      piecesGroup.add(mesh);
      pieceMeshes.set(p.id, mesh);
    }
  }
  updateBoardHighlights();
}

function swapMeshForPromotion(mesh, newType) {
  mesh.userData.type = newType;
  mesh.userData.bodyMesh.geometry = PIECE_GEOMETRIES[newType];
}

function animateMoveRecord(record, isInstant = false) {
  const movingMesh = pieceMeshes.get(record.piece.id);
  const toWorld = squareToWorld(record.to.r, record.to.f);

  // Finish any prior animations cleanly before starting new move
  flushAnimations();

  if (isInstant) {
    if (movingMesh) {
      movingMesh.position.copy(toWorld);
      if (record.promotion) swapMeshForPromotion(movingMesh, record.promotion);
    }
    if (record.castle && record.rookPiece) {
      const rMesh = pieceMeshes.get(record.rookPiece.id);
      if (rMesh) rMesh.position.copy(squareToWorld(record.rookTo.r, record.rookTo.f));
    }
    if (record.captured) {
      const capMesh = pieceMeshes.get(record.captured.id);
      if (capMesh) {
        if (captureMode === 'tray') {
          const slot = capturedTrayCounts[record.captured.color]++;
          capMesh.position.copy(getTraySlotPosition(record.captured.color, slot));
          capMesh.visible = true;
          capturedMeshes[record.captured.color].push(capMesh);
        } else {
          capMesh.visible = false;
        }
      }
    }
    updateClockPlungers();
    updateBoardHighlights();
    return;
  }

  // Main moving piece animation
  if (movingMesh) {
    const startPos = movingMesh.position.clone();
    const isKnight = record.piece.type === 'n';
    const dist = startPos.distanceTo(toWorld);
    const duration = (isKnight ? 0.72 : clamp(0.42 + dist * 0.068, 0.44, 0.82)) / playbackSpeed;

    activeAnimations.push({
      type: isKnight ? 'knight' : 'slide',
      mesh: movingMesh,
      startPos,
      endPos: toWorld.clone(),
      baseRotY: movingMesh.rotation.y,
      elapsed: 0,
      duration,
      onComplete: () => {
        movingMesh.position.copy(toWorld);
        movingMesh.rotation.x = 0;
        movingMesh.rotation.z = 0;
        movingMesh.rotation.y = record.piece.color === 'b' ? Math.PI : 0;
        if (record.promotion) {
          swapMeshForPromotion(movingMesh, record.promotion);
          spawnGoldenEmbers(toWorld, 65);
        }
      }
    });
  }

  // Castling rook simultaneous smooth glide
  if (record.castle && record.rookPiece) {
    const rMesh = pieceMeshes.get(record.rookPiece.id);
    if (rMesh) {
      const rStart = rMesh.position.clone();
      const rEnd = squareToWorld(record.rookTo.r, record.rookTo.f);
      activeAnimations.push({
        type: 'slide',
        mesh: rMesh,
        startPos: rStart,
        endPos: rEnd,
        baseRotY: rMesh.rotation.y,
        elapsed: -0.06,
        duration: 0.56 / playbackSpeed,
        onComplete: () => {
          rMesh.position.copy(rEnd);
          rMesh.rotation.x = 0;
          rMesh.rotation.z = 0;
        }
      });
    }
  }

  // Captured piece animation (either tip & dissolve into golden embers OR glide neatly to side tray)
  if (record.captured) {
    const capMesh = pieceMeshes.get(record.captured.id);
    if (capMesh) {
      const capStart = capMesh.position.clone();
      const impactDir = new THREE.Vector3().subVectors(toWorld, squareToWorld(record.from.r, record.from.f)).normalize();
      if (captureMode === 'embers') {
        // Clone material for molten-gold glow & fade dissolution
        const dissolveMat = capMesh.userData.baseMat.clone();
        dissolveMat.transparent = true;
        dissolveMat.opacity = 1.0;
        dissolveMat.emissive = new THREE.Color(0xffaa2b);
        dissolveMat.emissiveIntensity = 0.0;
        capMesh.userData.bodyMesh.material = dissolveMat;

        const tiltAxis = new THREE.Vector3(-impactDir.z, 0, impactDir.x).normalize();
        activeAnimations.push({
          type: 'emberCapture',
          mesh: capMesh,
          dissolveMat,
          startPos: capStart,
          tiltAxis,
          spawnedEmbers: false,
          elapsed: -0.18 / playbackSpeed,
          duration: 0.88 / playbackSpeed,
          onComplete: () => {
            capMesh.visible = false;
            capMesh.scale.setScalar(1);
            capMesh.rotation.set(0, capMesh.userData.color === 'b' ? Math.PI : 0, 0);
            capMesh.userData.bodyMesh.material = capMesh.userData.baseMat;
            dissolveMat.dispose();
          }
        });
      } else {
        // Slide/arc neatly into velvet-lined side tray
        const slot = capturedTrayCounts[record.captured.color]++;
        const slotPos = getTraySlotPosition(record.captured.color, slot);
        capturedMeshes[record.captured.color].push(capMesh);
        activeAnimations.push({
          type: 'trayCapture',
          mesh: capMesh,
          startPos: capStart,
          endPos: slotPos,
          elapsed: -0.14 / playbackSpeed,
          duration: 0.85 / playbackSpeed,
          onComplete: () => {
            capMesh.position.copy(slotPos);
            capMesh.rotation.set(0, capMesh.userData.color === 'b' ? Math.PI : 0, 0);
          }
        });
      }
    }
  }

  updateClockPlungers();
  updateBoardHighlights();
}

function flushAnimations() {
  while (activeAnimations.length > 0) {
    const a = activeAnimations.shift();
    if (a.onComplete) a.onComplete();
  }
}

function updateAnimations(dt) {
  for (let i = activeAnimations.length - 1; i >= 0; i--) {
    const a = activeAnimations[i];
    a.elapsed += dt;
    if (a.elapsed < 0) continue;
    const rawT = clamp(a.elapsed / a.duration, 0, 1);

    if (a.type === 'slide') {
      const e = easeInOutCubic(rawT);
      a.mesh.position.lerpVectors(a.startPos, a.endPos, e);
      // Subtle physics micro-lift during glide and cushioned landing
      const lift = Math.sin(rawT * Math.PI) * 0.085;
      a.mesh.position.y = lerp(a.startPos.y, a.endPos.y, e) + lift;
      // Gentle inertial pitch along motion direction
      const vel = Math.sin(rawT * Math.PI);
      const dx = a.endPos.x - a.startPos.x;
      const dz = a.endPos.z - a.startPos.z;
      const len = Math.max(0.001, Math.hypot(dx, dz));
      a.mesh.rotation.z = -(dx / len) * vel * 0.045;
      a.mesh.rotation.x = (dz / len) * vel * 0.045;
    } else if (a.type === 'knight') {
      // Graceful parabolic arc lifting well over adjacent pieces
      const e = easeInOutQuint(rawT);
      a.mesh.position.x = lerp(a.startPos.x, a.endPos.x, e);
      a.mesh.position.z = lerp(a.startPos.z, a.endPos.z, e);
      const parabola = 4.0 * rawT * (1.0 - rawT); // peaks at 1.0 when t=0.5
      const arcHeight = 2.05;
      // Tiny soft landing cushion at end
      const settle = rawT > 0.88 ? Math.sin(((rawT - 0.88) / 0.12) * Math.PI) * 0.035 : 0;
      a.mesh.position.y = BOARD_TOP_Y + parabola * arcHeight + settle;
      // Expressive leap tilt
      const tilt = Math.cos(rawT * Math.PI) * 0.16;
      const dx = a.endPos.x - a.startPos.x;
      const dz = a.endPos.z - a.startPos.z;
      const len = Math.max(0.001, Math.hypot(dx, dz));
      a.mesh.rotation.x = (dz / len) * tilt;
      a.mesh.rotation.z = -(dx / len) * tilt;
    } else if (a.type === 'emberCapture') {
      if (!a.spawnedEmbers && rawT > 0.12) {
        a.spawnedEmbers = true;
        spawnGoldenEmbers(a.startPos, 185);
      }
      // Tip smoothly while flaring golden emissive and fading away
      const tip = easeOutCubic(Math.min(1, rawT * 1.4));
      a.mesh.quaternion.setFromAxisAngle(a.tiltAxis, tip * 1.15);
      const fade = clamp((rawT - 0.18) / 0.82, 0, 1);
      a.dissolveMat.emissiveIntensity = Math.sin(Math.min(1, rawT * 1.6) * Math.PI * 0.5) * 3.8 * (1.0 - fade * 0.5);
      a.dissolveMat.opacity = 1.0 - easeInOutCubic(fade);
      a.mesh.position.y = a.startPos.y + fade * 0.28;
      a.mesh.scale.setScalar(1.0 - fade * 0.25);
    } else if (a.type === 'trayCapture') {
      const e = easeInOutCubic(rawT);
      a.mesh.position.x = lerp(a.startPos.x, a.endPos.x, e);
      a.mesh.position.z = lerp(a.startPos.z, a.endPos.z, e);
      const lift = Math.sin(rawT * Math.PI) * 1.35;
      a.mesh.position.y = lerp(a.startPos.y, a.endPos.y, e) + lift;
    } else if (a.type === 'snapBack') {
      const e = easeOutCubic(rawT);
      a.mesh.position.lerpVectors(a.startPos, a.endPos, e);
    }

    if (rawT >= 1) {
      if (a.onComplete) a.onComplete();
      activeAnimations.splice(i, 1);
    }
  }
}

function updateClockPlungers() {
  const isWhite = engine.turn === 'w';
  chessClock.pL.position.y = isWhite ? 1.17 : 1.24;
  chessClock.pR.position.y = isWhite ? 1.24 : 1.17;
}

// ============================================================================
// 11. INTERACTIVE RAYCASTING (CLICK-TO-MOVE & DRAG-AND-DROP)
// ============================================================================
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -BOARD_TOP_Y);

let selectedSquare = null; // { r, f }
let legalTargets = [];     // array of legal moves from selectedSquare
let dragState = null;      // { pieceId, from: {r,f}, mesh, startClientX, startClientY, isDragging, hoverSq }

function updateBoardHighlights() {
  // Last move glow
  if (engine.history.length > 0) {
    const last = engine.history[engine.history.length - 1];
    placeRing(activeRings.lastFrom, last.from.r, last.from.f, 0.008);
    placeRing(activeRings.lastTo, last.to.r, last.to.f, 0.008);
  } else {
    activeRings.lastFrom.visible = false;
    activeRings.lastTo.visible = false;
  }

  // Check warning pulsing crimson ring under threatened King
  if (engine.isInCheck(engine.turn)) {
    const k = engine.findKing(engine.turn);
    if (k) placeRing(activeRings.check, k.r, k.f, 0.012);
  } else {
    activeRings.check.visible = false;
  }

  // Selected piece ring
  if (selectedSquare) {
    placeRing(activeRings.selected, selectedSquare.r, selectedSquare.f, 0.014);
  } else {
    activeRings.selected.visible = false;
  }

  // Legal destination rings
  for (let i = 0; i < activeRings.legalPool.length; i++) {
    const ring = activeRings.legalPool[i];
    if (i < legalTargets.length) {
      const m = legalTargets[i];
      ring.material = m.captured ? ringMaterials.capture : ringMaterials.legal;
      placeRing(ring, m.to.r, m.to.f, 0.013);
    } else {
      ring.visible = false;
    }
  }

  // Hover square during drag
  if (dragState && dragState.isDragging && dragState.hoverSq) {
    const isLegal = legalTargets.some(m => m.to.r === dragState.hoverSq.r && m.to.f === dragState.hoverSq.f);
    if (isLegal) {
      placeRing(activeRings.hover, dragState.hoverSq.r, dragState.hoverSq.f, 0.017);
    } else {
      activeRings.hover.visible = false;
    }
  } else {
    activeRings.hover.visible = false;
  }
}

function clearSelection() {
  if (selectedSquare) {
    const p = engine.board[selectedSquare.r][selectedSquare.f];
    if (p) {
      const m = pieceMeshes.get(p.id);
      if (m && activeAnimations.every(a => a.mesh !== m)) {
        m.position.y = BOARD_TOP_Y;
      }
    }
  }
  selectedSquare = null;
  legalTargets = [];
  updateBoardHighlights();
}

function selectSquare(r, f) {
  const p = engine.board[r][f];
  if (!p || p.color !== engine.turn) return false;
  if (currentMode === 'ai' && engine.turn === 'b') return false;
  clearSelection();
  selectedSquare = { r, f };
  legalTargets = engine.getLegalMovesFrom(r, f);
  updateBoardHighlights();
  return true;
}

function getPointerIntersection(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);

  // Check pieces first
  const pieceHits = raycaster.intersectObjects(piecesGroup.children, true);
  for (const hit of pieceHits) {
    const pid = hit.object.userData.pieceId;
    if (pid != null) {
      // Find board square of this live piece
      for (let r = 0; r < 8; r++) {
        for (let f = 0; f < 8; f++) {
          const p = engine.board[r][f];
          if (p && p.id === pid) return { type: 'piece', r, f, piece: p };
        }
      }
    }
  }

  // Check board squares
  const sqHits = raycaster.intersectObjects(squareMeshes, false);
  if (sqHits.length > 0) {
    const { r, f } = sqHits[0].object.userData;
    return { type: 'square', r, f };
  }
  return null;
}

function executeInteractiveMove(move, fromDrag = false) {
  // If a famous game replay is running, pause it seamlessly so the user can explore
  if (isAutoPlaying) setPlaying(false);
  if (currentMode !== 'ai' && currentMode !== 'free') {
    currentMode = 'free';
    gameSelect.value = 'free';
    document.getElementById('gameSubtitle').textContent = 'Interactive Variation · Free Play';
    document.getElementById('gameMeta').textContent = 'Diverged into interactive study play — click Reset or choose a match to replay.';
  }

  clearSelection();
  const record = engine.makeMove(move);
  if (fromDrag) {
    // Piece is already near destination — do a crisp short settle glide
    const m = pieceMeshes.get(record.piece.id);
    if (m) {
      const targetPos = squareToWorld(record.to.r, record.to.f);
      activeAnimations.push({
        type: 'snapBack',
        mesh: m,
        startPos: m.position.clone(),
        endPos: targetPos,
        elapsed: 0,
        duration: 0.16,
        onComplete: () => {
          m.position.copy(targetPos);
          if (record.promotion) {
            swapMeshForPromotion(m, record.promotion);
            spawnGoldenEmbers(targetPos, 65);
          }
        }
      });
    }
    // Still animate castling rook & capture effects!
    if (record.castle && record.rookPiece) {
      const rMesh = pieceMeshes.get(record.rookPiece.id);
      if (rMesh) {
        const rStart = rMesh.position.clone();
        const rEnd = squareToWorld(record.rookTo.r, record.rookTo.f);
        activeAnimations.push({
          type: 'slide',
          mesh: rMesh,
          startPos: rStart,
          endPos: rEnd,
          baseRotY: rMesh.rotation.y,
          elapsed: 0,
          duration: 0.45,
          onComplete: () => { rMesh.position.copy(rEnd); rMesh.rotation.x = 0; rMesh.rotation.z = 0; }
        });
      }
    }
    if (record.captured) {
      // Trigger capture effect
      const capRec = { ...record, piece: { id: -999 }, castle: null };
      animateMoveRecord(capRec, false);
    } else {
      updateClockPlungers();
      updateBoardHighlights();
    }
  } else {
    animateMoveRecord(record, false);
  }

  renderMoveHistory();
  updateStatusUI();

  // Trigger Study AI reply if in AI mode
  if (currentMode === 'ai' && engine.turn === 'b' && engine.getGameStatus().state === 'playing') {
    scheduleAIReply();
  }
}

let aiTimer = null;
function scheduleAIReply() {
  if (aiTimer) clearTimeout(aiTimer);
  aiTimer = setTimeout(() => {
    aiTimer = null;
    if (currentMode !== 'ai' || engine.turn !== 'b') return;
    const aiMove = engine.chooseAIMove();
    if (!aiMove) return;
    const rec = engine.makeMove(aiMove);
    animateMoveRecord(rec, false);
    renderMoveHistory();
    updateStatusUI();
  }, 620);
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  if (cinematicOrbit) setCameraPreset(null); // yield cinematic orbit on user interaction

  const hit = getPointerIntersection(e.clientX, e.clientY);
  if (!hit) {
    clearSelection();
    return;
  }

  // If clicking a legal target square while a piece is already selected -> move immediately!
  if (selectedSquare) {
    const matchMove = legalTargets.find(m => m.to.r === hit.r && m.to.f === hit.f);
    if (matchMove) {
      executeInteractiveMove(matchMove, false);
      return;
    }
  }

  // Otherwise check if pressing on an active-turn piece (supports both click-select and drag)
  const p = engine.board[hit.r][hit.f];
  if (p && p.color === engine.turn && !(currentMode === 'ai' && engine.turn === 'b')) {
    flushAnimations();
    selectSquare(hit.r, hit.f);
    const mesh = pieceMeshes.get(p.id);
    if (mesh) {
      controls.enabled = false;
      dragState = {
        pieceId: p.id,
        from: { r: hit.r, f: hit.f },
        mesh,
        startClientX: e.clientX,
        startClientY: e.clientY,
        isDragging: false,
        hoverSq: { r: hit.r, f: hit.f }
      };
    }
  } else {
    clearSelection();
  }
});

window.addEventListener('pointermove', (e) => {
  if (!dragState) {
    // Update subtle cursor feedback when hovering movable pieces
    const hit = getPointerIntersection(e.clientX, e.clientY);
    if (hit) {
      const p = engine.board[hit.r][hit.f];
      const isLegalDest = selectedSquare && legalTargets.some(m => m.to.r === hit.r && m.to.f === hit.f);
      if (isLegalDest) {
        renderer.domElement.style.cursor = 'pointer';
      } else if (p && p.color === engine.turn && !(currentMode === 'ai' && engine.turn === 'b')) {
        renderer.domElement.style.cursor = 'grab';
      } else {
        renderer.domElement.style.cursor = 'default';
      }
    } else {
      renderer.domElement.style.cursor = 'default';
    }
    return;
  }

  const distPx = Math.hypot(e.clientX - dragState.startClientX, e.clientY - dragState.startClientY);
  if (!dragState.isDragging && distPx > 6) {
    dragState.isDragging = true;
    renderer.domElement.style.cursor = 'grabbing';
  }

  if (dragState.isDragging) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerNDC, camera);
    const pt = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(dragPlane, pt)) {
      dragState.mesh.position.set(
        clamp(pt.x, -4.3, 4.3),
        BOARD_TOP_Y + 0.56,
        clamp(pt.z, -4.3, 4.3)
      );
      dragState.hoverSq = worldToSquare(pt.x, pt.z);
      updateBoardHighlights();
    }
  }
});

window.addEventListener('pointerup', () => {
  if (!dragState) return;
  const ds = dragState;
  dragState = null;
  controls.enabled = true;
  renderer.domElement.style.cursor = 'default';

  if (ds.isDragging) {
    const targetSq = ds.hoverSq;
    const matchMove = targetSq
      ? legalTargets.find(m => m.to.r === targetSq.r && m.to.f === targetSq.f)
      : null;
    if (matchMove) {
      executeInteractiveMove(matchMove, true);
    } else {
      // Spring smoothly back to origin square
      const home = squareToWorld(ds.from.r, ds.from.f);
      activeAnimations.push({
        type: 'snapBack',
        mesh: ds.mesh,
        startPos: ds.mesh.position.clone(),
        endPos: home,
        elapsed: 0,
        duration: 0.22,
        onComplete: () => ds.mesh.position.copy(home)
      });
      updateBoardHighlights();
    }
  }
});

// ============================================================================
// 12. CAMERA PRESETS & CINEMATIC ORBIT
// ============================================================================
const CAMERA_PRESETS = {
  white: { pos: new THREE.Vector3(0, 7.6, 10.6), target: new THREE.Vector3(0, 0.45, 0.1) },
  black: { pos: new THREE.Vector3(0, 7.6, -10.6), target: new THREE.Vector3(0, 0.45, -0.1) },
  top:   { pos: new THREE.Vector3(0, 14.4, 0.02), target: new THREE.Vector3(0, 0.36, 0) }
};

let cameraTransition = null;
let cinematicOrbit = false;
let orbitAngle = 0.22;

function setCameraPreset(presetName) {
  document.querySelectorAll('.cam-btn[data-cam]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cam === presetName);
  });

  if (!presetName) {
    cinematicOrbit = false;
    cameraTransition = null;
    return;
  }

  if (presetName === 'orbit') {
    cinematicOrbit = true;
    cameraTransition = null;
    orbitAngle = Math.atan2(camera.position.x, camera.position.z);
    return;
  }

  cinematicOrbit = false;
  const preset = CAMERA_PRESETS[presetName];
  if (!preset) return;
  cameraTransition = {
    startPos: camera.position.clone(),
    endPos: preset.pos.clone(),
    startTarget: controls.target.clone(),
    endTarget: preset.target.clone(),
    elapsed: 0,
    duration: 1.05
  };
}

controls.addEventListener('start', () => {
  if (cinematicOrbit || cameraTransition) {
    setCameraPreset(null);
  }
});

// ============================================================================
// 13. AUTOMATED FAMOUS-GAME PLAYBACK & HUD CONTROLLER
// ============================================================================
const gameSelect = document.getElementById('gameSelect');
const movesListEl = document.getElementById('movesList');
const btnPlayPause = document.getElementById('btnPlayPause');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnReset = document.getElementById('btnReset');
const btnSpeed = document.getElementById('btnSpeed');
const btnCaptureMode = document.getElementById('btnCaptureMode');
const turnDotEl = document.getElementById('turnDot');
const statusTextEl = document.getElementById('statusText');
const statusBadgeEl = document.getElementById('statusBadge');
const moveCounterEl = document.getElementById('moveCounter');
const hudEl = document.getElementById('hud');

let currentMode = 'opera';
let scriptedMoves = [];
let scriptIndex = 0;
let isAutoPlaying = true;
let autoPlayCooldown = 1.1;

function loadMode(modeKey, autoStart = true) {
  if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
  currentMode = modeKey;
  const info = FAMOUS_GAMES[modeKey];
  document.getElementById('gameSubtitle').textContent = info.subtitle;
  document.getElementById('gameMeta').textContent = info.meta;

  clearSelection();
  engine.reset();
  syncMeshesToEngine();

  scriptedMoves = info.moves ? [...info.moves] : [];
  scriptIndex = 0;
  setPlaying(Boolean(info.moves && autoStart));
  autoPlayCooldown = 0.95;

  renderMoveHistory();
  updateStatusUI();
  updateClockPlungers();
}

function setPlaying(playing) {
  const hasScript = scriptedMoves.length > 0 && scriptIndex < scriptedMoves.length;
  isAutoPlaying = playing && hasScript;
  btnPlayPause.textContent = isAutoPlaying ? '❚❚ Pause' : '▶ Play';
  btnPlayPause.disabled = scriptedMoves.length === 0;
}

function stepForward(instant = false) {
  if (scriptedMoves.length === 0 || scriptIndex >= scriptedMoves.length) {
    setPlaying(false);
    return false;
  }
  clearSelection();
  const san = scriptedMoves[scriptIndex];
  const move = engine.parseSAN(san);
  if (!move) {
    console.warn('Could not parse SAN:', san);
    setPlaying(false);
    return false;
  }
  const rec = engine.makeMove(move);
  scriptIndex++;
  animateMoveRecord(rec, instant);
  renderMoveHistory();
  updateStatusUI();

  if (scriptIndex >= scriptedMoves.length) {
    setPlaying(false);
  }
  return true;
}

function jumpToPly(targetPly) {
  const wasPlaying = isAutoPlaying;
  setPlaying(false);
  clearSelection();

  if (scriptedMoves.length > 0) {
    const clamped = clamp(targetPly, 0, scriptedMoves.length);
    engine.reset();
    syncMeshesToEngine();
    scriptIndex = 0;
    for (let i = 0; i < clamped; i++) {
      const m = engine.parseSAN(scriptedMoves[i]);
      if (!m) break;
      const rec = engine.makeMove(m);
      scriptIndex++;
      animateMoveRecord(rec, true);
    }
    renderMoveHistory();
    updateStatusUI();
    if (wasPlaying && scriptIndex < scriptedMoves.length) setPlaying(true);
  } else {
    // Undo in interactive mode
    if (targetPly < engine.history.length) {
      const movesToKeep = engine.history.slice(0, targetPly).map(h => ({
        from: h.from, to: h.to, promotion: h.promotion
      }));
      engine.reset();
      syncMeshesToEngine();
      for (const mk of movesToKeep) {
        const legal = engine.getLegalMoves(engine.turn);
        const found = legal.find(m =>
          m.from.r === mk.from.r && m.from.f === mk.from.f &&
          m.to.r === mk.to.r && m.to.f === mk.to.f &&
          (m.promotion || null) === (mk.promotion || null)
        );
        if (found) {
          const rec = engine.makeMove(found);
          animateMoveRecord(rec, true);
        }
      }
      renderMoveHistory();
      updateStatusUI();
    }
  }
}

function updateStatusUI() {
  const status = engine.getGameStatus();
  const turnName = engine.turn === 'w' ? 'White' : 'Black';
  turnDotEl.className = 'turn-dot ' + (engine.turn === 'w' ? 'white' : 'black');

  statusBadgeEl.className = 'status-badge';
  statusBadgeEl.textContent = '';

  if (status.state === 'checkmate') {
    const winner = status.winner === 'w' ? 'White' : 'Black';
    statusTextEl.textContent = `${winner} wins by checkmate`;
    statusBadgeEl.className = 'status-badge mate';
    statusBadgeEl.textContent = 'Checkmate';
  } else if (status.state === 'stalemate') {
    statusTextEl.textContent = 'Draw by stalemate';
    statusBadgeEl.className = 'status-badge mate';
    statusBadgeEl.textContent = 'Draw';
  } else {
    statusTextEl.textContent = `${turnName} to move`;
    if (status.inCheck) {
      statusBadgeEl.className = 'status-badge check';
      statusBadgeEl.textContent = 'Check';
    }
  }

  if (scriptedMoves.length > 0) {
    moveCounterEl.textContent = `${scriptIndex} / ${scriptedMoves.length}`;
    btnNext.disabled = scriptIndex >= scriptedMoves.length;
    btnPrev.disabled = scriptIndex <= 0;
  } else {
    moveCounterEl.textContent = `${engine.history.length} ply`;
    btnNext.disabled = true;
    btnPrev.disabled = engine.history.length === 0;
  }
}

function renderMoveHistory() {
  const hist = engine.history;
  if (hist.length === 0) {
    movesListEl.innerHTML = '<div class="move-empty">Awaiting opening move…</div>';
    return;
  }
  let html = '';
  for (let i = 0; i < hist.length; i += 2) {
    const moveNum = Math.floor(i / 2) + 1;
    const wRec = hist[i];
    const bRec = hist[i + 1];
    const wCur = i === hist.length - 1 ? ' current' : '';
    const bCur = (i + 1) === hist.length - 1 ? ' current' : '';
    html += `<div class="move-row">
      <span class="move-num">${moveNum}.</span>
      <span class="move-cell${wCur}" data-ply="${i + 1}">${wRec.san}</span>
      ${bRec ? `<span class="move-cell${bCur}" data-ply="${i + 2}">${bRec.san}</span>` : '<span></span>'}
    </div>`;
  }
  movesListEl.innerHTML = html;
  movesListEl.scrollTop = movesListEl.scrollHeight;
}

movesListEl.addEventListener('click', (e) => {
  const cell = e.target.closest('.move-cell');
  if (!cell) return;
  const ply = parseInt(cell.dataset.ply, 10);
  if (!isNaN(ply)) jumpToPly(ply);
});

// Wire HUD buttons
document.querySelectorAll('.cam-btn[data-cam]').forEach(btn => {
  btn.addEventListener('click', () => setCameraPreset(btn.dataset.cam));
});

gameSelect.addEventListener('change', (e) => {
  loadMode(e.target.value, true);
});

btnPlayPause.addEventListener('click', () => {
  if (scriptedMoves.length === 0) return;
  if (scriptIndex >= scriptedMoves.length) {
    loadMode(currentMode, true);
    return;
  }
  setPlaying(!isAutoPlaying);
  if (isAutoPlaying) autoPlayCooldown = 0.25;
});

btnNext.addEventListener('click', () => {
  setPlaying(false);
  stepForward(false);
});

btnPrev.addEventListener('click', () => {
  setPlaying(false);
  const target = Math.max(0, engine.history.length - 1);
  jumpToPly(target);
});

btnReset.addEventListener('click', () => {
  loadMode(currentMode, scriptedMoves.length > 0);
});

const SPEEDS = [0.75, 1.0, 1.5, 2.0];
let speedIdx = 1;
btnSpeed.addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  playbackSpeed = SPEEDS[speedIdx];
  btnSpeed.textContent = playbackSpeed.toFixed(playbackSpeed % 1 === 0 ? 1 : 2) + '×';
});

btnCaptureMode.addEventListener('click', () => {
  captureMode = captureMode === 'embers' ? 'tray' : 'embers';
  btnCaptureMode.textContent = captureMode === 'embers' ? '✦ Embers' : '▤ Side Tray';
  // Re-sync existing captured pieces to reflect chosen mode cleanly
  jumpToPly(engine.history.length);
});

document.getElementById('btnHideHud').addEventListener('click', () => hudEl.classList.add('hud-hidden'));
document.getElementById('btnShowHud').addEventListener('click', () => hudEl.classList.remove('hud-hidden'));

window.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') hudEl.classList.toggle('hud-hidden');
  else if (e.key === ' ' && document.activeElement.tagName !== 'SELECT') {
    e.preventDefault();
    btnPlayPause.click();
  } else if (e.key === 'ArrowRight') {
    btnNext.click();
  } else if (e.key === 'ArrowLeft') {
    btnPrev.click();
  }
});

// ============================================================================
// 14. RESIZE & MAIN ANIMATION LOOP
// ============================================================================
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloomPass.setSize(w, h);
});

const clock = new THREE.Clock();

// Initialize the match (The Opera Game)
loadMode('opera', true);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  // Update shader uniforms (dust motes & glowing board rings)
  dustMat.uniforms.uTime.value = elapsed;
  for (const key in ringMaterials) {
    ringMaterials[key].uniforms.uTime.value = elapsed;
  }

  // Subtle idle float for currently selected piece (when not dragging or animating)
  if (selectedSquare && (!dragState || !dragState.isDragging)) {
    const p = engine.board[selectedSquare.r][selectedSquare.f];
    if (p) {
      const mesh = pieceMeshes.get(p.id);
      if (mesh && activeAnimations.every(a => a.mesh !== mesh)) {
        mesh.position.y = BOARD_TOP_Y + 0.11 + Math.sin(elapsed * 3.8) * 0.03;
      }
    }
  }

  // Advance physics-inspired piece animations & golden embers
  updateAnimations(dt);
  updateEmbers(dt);

  // Automated famous-game playback scheduler
  if (isAutoPlaying && activeAnimations.length === 0) {
    autoPlayCooldown -= dt * playbackSpeed;
    if (autoPlayCooldown <= 0) {
      const ok = stepForward(false);
      if (ok) autoPlayCooldown = 1.05;
    }
  }

  // Smooth camera preset transitions
  if (cameraTransition) {
    cameraTransition.elapsed += dt;
    const t = clamp(cameraTransition.elapsed / cameraTransition.duration, 0, 1);
    const e = easeInOutCubic(t);
    camera.position.lerpVectors(cameraTransition.startPos, cameraTransition.endPos, e);
    controls.target.lerpVectors(cameraTransition.startTarget, cameraTransition.endTarget, e);
    if (t >= 1) cameraTransition = null;
  } else if (cinematicOrbit) {
    orbitAngle += dt * 0.17;
    const radius = 10.9 + Math.sin(elapsed * 0.28) * 0.7;
    const height = 6.4 + Math.sin(elapsed * 0.35) * 1.1;
    camera.position.set(Math.sin(orbitAngle) * radius, height, Math.cos(orbitAngle) * radius);
    controls.target.lerp(new THREE.Vector3(0, 0.45, 0), dt * 2.5);
  }

  controls.update();
  composer.render();
}

animate();
</script>
