<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grandmaster's Study — Photorealistic 3D Chess</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07060a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #efe7d8;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    /* Minimal Luxury HUD */
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.35s ease;
    }
    .hud.hud-hidden .hud-panel:not(.hud-unhide-wrap) {
      opacity: 0;
      pointer-events: none !important;
      transform: translateY(6px);
    }
    .hud-panel {
      pointer-events: auto;
      background: rgba(13, 11, 15, 0.74);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(214, 178, 108, 0.22);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 240, 205, 0.06);
      border-radius: 12px;
      transition: opacity 0.3s ease, transform 0.3s ease, border-color 0.2s ease;
    }

    /* Top-left Header & Status */
    .hud-top-left {
      position: absolute;
      top: 18px;
      left: 18px;
      padding: 12px 16px;
      min-width: 248px;
      max-width: 310px;
    }
    .brand-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #f3e4c3;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-sub {
      font-size: 11px;
      color: rgba(235, 223, 200, 0.58);
      margin-top: 2px;
      letter-spacing: 0.02em;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid rgba(214, 178, 108, 0.14);
      font-size: 12px;
      font-weight: 500;
    }
    .turn-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.35);
      transition: background 0.25s, box-shadow 0.25s;
    }
    .turn-dot.white {
      background: radial-gradient(circle at 35% 30%, #fffdf7, #dfd2b6);
      box-shadow: 0 0 8px rgba(255, 238, 198, 0.5);
    }
    .turn-dot.black {
      background: radial-gradient(circle at 35% 30%, #444b5e, #0d0f15);
      box-shadow: 0 0 8px rgba(105, 165, 255, 0.45);
    }
    .status-text {
      flex: 1;
      color: #f0e6d2;
    }
    .status-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 2px 7px;
      border-radius: 999px;
      display: none;
    }
    .status-badge.check {
      display: inline-block;
      background: rgba(230, 52, 62, 0.22);
      border: 1px solid rgba(255, 76, 86, 0.65);
      color: #ff8c94;
      box-shadow: 0 0 12px rgba(255, 50, 65, 0.35);
    }
    .status-badge.mate {
      display: inline-block;
      background: rgba(218, 165, 65, 0.25);
      border: 1px solid rgba(242, 196, 98, 0.7);
      color: #ffd982;
    }

    /* Top-right Camera Presets */
    .hud-top-right {
      position: absolute;
      top: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
    }
    .cam-btn, .ctrl-btn, .pill-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(238, 228, 208, 0.78);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .cam-btn:hover, .ctrl-btn:hover, .pill-btn:hover {
      background: rgba(218, 180, 108, 0.12);
      color: #fff6e5;
      border-color: rgba(218, 180, 108, 0.25);
    }
    .cam-btn.active, .ctrl-btn.active, .pill-btn.active {
      background: rgba(214, 172, 92, 0.22);
      color: #ffe4a8;
      border-color: rgba(232, 190, 110, 0.55);
      box-shadow: 0 0 14px rgba(214, 172, 92, 0.16);
    }
    .hud-divider {
      width: 1px;
      height: 18px;
      background: rgba(214, 178, 108, 0.18);
      margin: 0 2px;
    }

    /* Right Panel: Game Selector & Move History */
    .hud-right-drawer {
      position: absolute;
      top: 72px;
      right: 18px;
      width: 244px;
      max-height: calc(100vh - 168px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .drawer-section {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(214, 178, 108, 0.14);
    }
    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(218, 186, 126, 0.68);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .game-select {
      width: 100%;
      background: rgba(25, 21, 28, 0.88);
      color: #f4ebd8;
      border: 1px solid rgba(214, 178, 108, 0.28);
      border-radius: 7px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    .game-select:focus {
      border-color: rgba(234, 194, 118, 0.65);
    }
    .game-meta {
      font-size: 10.5px;
      color: rgba(232, 220, 198, 0.54);
      margin-top: 5px;
      line-height: 1.35;
    }
    .moves-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px 10px;
      min-height: 120px;
      max-height: 290px;
      scrollbar-width: thin;
      scrollbar-color: rgba(214, 178, 108, 0.3) transparent;
    }
    .moves-wrap::-webkit-scrollbar { width: 5px; }
    .moves-wrap::-webkit-scrollbar-thumb {
      background: rgba(214, 178, 108, 0.3);
      border-radius: 4px;
    }
    .move-row {
      display: grid;
      grid-template-columns: 28px 1fr 1fr;
      gap: 4px;
      font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
      font-size: 11.5px;
      padding: 2px 0;
      align-items: center;
    }
    .move-num {
      color: rgba(218, 188, 130, 0.48);
      text-align: right;
      padding-right: 4px;
    }
    .move-cell {
      padding: 3px 6px;
      border-radius: 5px;
      color: rgba(242, 234, 218, 0.85);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .move-cell:hover {
      background: rgba(214, 178, 108, 0.14);
    }
    .move-cell.current {
      background: rgba(218, 174, 88, 0.28);
      color: #ffe7b0;
      font-weight: 600;
    }
    .move-empty {
      text-align: center;
      padding: 22px 8px;
      font-size: 11.5px;
      color: rgba(235, 222, 198, 0.42);
      font-style: italic;
    }

    /* Bottom-Center Playback & Options Bar */
    .hud-bottom-bar {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
    }
    .ctrl-btn.primary {
      background: linear-gradient(135deg, rgba(224, 178, 92, 0.3), rgba(182, 130, 50, 0.26));
      border-color: rgba(234, 192, 112, 0.55);
      color: #ffebc0;
      padding: 6px 13px;
      font-weight: 600;
    }
    .ctrl-btn.primary:hover {
      background: linear-gradient(135deg, rgba(234, 188, 102, 0.42), rgba(196, 142, 58, 0.36));
    }
    .ctrl-btn:disabled {
      opacity: 0.36;
      cursor: default;
      pointer-events: none;
    }
    .hint-pill {
      position: absolute;
      bottom: 66px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10.5px;
      color: rgba(240, 228, 205, 0.56);
      background: rgba(12, 10, 14, 0.52);
      border: 1px solid rgba(214, 178, 108, 0.14);
      padding: 3px 11px;
      border-radius: 999px;
      pointer-events: none;
      letter-spacing: 0.02em;
      white-space: nowrap;
      transition: opacity 0.6s ease;
    }
    .hint-pill.faded {
      opacity: 0;
    }
    .hud-unhide-wrap {
      position: absolute;
      top: 18px;
      right: 18px;
      padding: 4px;
      display: none;
    }
    .hud.hud-hidden .hud-unhide-wrap {
      display: block;
    }
    .hud.hud-hidden .hint-pill {
      opacity: 0;
    }

    @media (max-width: 820px) {
      .hud-right-drawer { display: none; }
      .hud-top-left { min-width: 195px; padding: 9px 12px; }
      .hint-pill { display: none; }
    }
  </style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ============================================================================
// 1. DETERMINISTIC PRNG & NOISE UTILITIES
// ============================================================================
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hash2i(ix, iy, seed = 0) {
  let n = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed, 1442695041);
  n = (n ^ (n >>> 13)) | 0;
  n = Math.imul(n, 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

function tileNoise2D(x, y, px, py, seed = 0) {
  const gx = ((x % px) + px) % px;
  const gy = ((y % py) + py) % py;
  const x0 = Math.floor(gx), y0 = Math.floor(gy);
  const x1 = (x0 + 1) % px, y1 = (y0 + 1) % py;
  const fx = gx - x0, fy = gy - y0;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const a = hash2i(x0, y0, seed), b = hash2i(x1, y0, seed);
  const c = hash2i(x0, y1, seed), d = hash2i(x1, y1, seed);
  return (a * (1 - ux) + b * ux) * (1 - uy) + (c * (1 - ux) + d * ux) * uy;
}

function tileFbm(u, v, freq, octaves, seed = 0) {
  let sum = 0, amp = 0.5, norm = 0, f = freq;
  for (let i = 0; i < octaves; i++) {
    sum += tileNoise2D(u * f, v * f, f, f, seed + i * 31) * amp;
    norm += amp;
    amp *= 0.5;
    f *= 2;
  }
  return sum / norm;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutQuint(t) { return t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2; }

// ============================================================================
// 2. PROCEDURAL PBR TEXTURE GENERATORS
// ============================================================================
function createCreamMarbleTextures(size = 512) {
  const diffCanvas = document.createElement('canvas');
  const roughCanvas = document.createElement('canvas');
  const bumpCanvas = document.createElement('canvas');
  diffCanvas.width = roughCanvas.width = bumpCanvas.width = size;
  diffCanvas.height = roughCanvas.height = bumpCanvas.height = size;

  const dCtx = diffCanvas.getContext('2d');
  const rCtx = roughCanvas.getContext('2d');
  const bCtx = bumpCanvas.getContext('2d');
  const dImg = dCtx.createImageData(size, size);
  const rImg = rCtx.createImageData(size, size);
  const bImg = bCtx.createImageData(size, size);

  for (let y = 0; y < size; y++) {
    const v = y / size;
    for (let x = 0; x < size; x++) {
      const u = x / size;
      const warp1 = tileFbm(u, v, 4, 4, 101);
      const warp2 = tileFbm(u + 0.37, v + 0.61, 8, 4, 211);
      const cloud = tileFbm(u, v, 3, 4, 307);

      // Soft multi-scale marble veining
      const t1 = (u * 2.0 + v * 1.4 + warp1 * 1.65 + warp2 * 0.45) * Math.PI * 2;
      const veinPrimary = Math.pow(1.0 - Math.abs(Math.sin(t1)), 9.0);
      const t2 = (u * 3.0 - v * 2.2 + warp2 * 1.9) * Math.PI * 2;
      const veinFine = Math.pow(1.0 - Math.abs(Math.sin(t2)), 14.0);
      const veinGold = Math.pow(1.0 - Math.abs(Math.sin(t1 + 0.45)), 18.0) * 0.6;

      const baseR = 239 + (cloud - 0.5) * 14;
      const baseG = 229 + (cloud - 0.5) * 14;
      const baseB = 208 + (cloud - 0.5) * 16;

      let r = baseR - veinPrimary * 48 - veinFine * 26 + veinGold * 10;
      let g = baseG - veinPrimary * 52 - veinFine * 28 - veinGold * 6;
      let b = baseB - veinPrimary * 56 - veinFine * 30 - veinGold * 28;

      const idx = (y * size + x) * 4;
      dImg.data[idx] = clamp(r, 0, 255);
      dImg.data[idx + 1] = clamp(g, 0, 255);
      dImg.data[idx + 2] = clamp(b, 0, 255);
      dImg.data[idx + 3] = 255;

      // Polished stone with very slight roughness rise inside mineral veins
      const rough = clamp(28 + veinPrimary * 34 + veinFine * 22 + (warp2 - 0.5) * 14, 14, 96);
      rImg.data[idx] = rImg.data[idx + 1] = rImg.data[idx + 2] = rough;
      rImg.data[idx + 3] = 255;

      const bump = clamp(128 - veinPrimary * 24 - veinFine * 14 + (cloud - 0.5) * 8, 0, 255);
      bImg.data[idx] = bImg.data[idx + 1] = bImg.data[idx + 2] = bump;
      bImg.data[idx + 3] = 255;
    }
  }
  dCtx.putImageData(dImg, 0, 0);
  rCtx.putImageData(rImg, 0, 0);
  bCtx.putImageData(bImg, 0, 0);

  const map = new THREE.CanvasTexture(diffCanvas);
  map.colorSpace = THREE.SRGBColorSpace;
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.anisotropy = 8;

  const roughnessMap = new THREE.CanvasTexture(roughCanvas);
  roughnessMap.wrapS = roughnessMap.wrapT = THREE.RepeatWrapping;

  const bumpMap = new THREE.CanvasTexture(bumpCanvas);
  bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;

  return { map, roughnessMap, bumpMap };
}

function createWoodTextures(options) {
  const {
    size = 512,
    seed = 500,
    lightRGB = [108, 62, 32],
    darkRGB = [40, 20, 10],
    ringScale = 14,
    grainStretch = 6,
    baseRough = 52,
    poreStrength = 0.25
  } = options;

  const diffCanvas = document.createElement('canvas');
  const roughCanvas = document.createElement('canvas');
  const bumpCanvas = document.createElement('canvas');
  diffCanvas.width = roughCanvas.width = bumpCanvas.width = size;
  diffCanvas.height = roughCanvas.height = bumpCanvas.height = size;

  const dCtx = diffCanvas.getContext('2d');
  const rCtx = roughCanvas.getContext('2d');
  const bCtx = bumpCanvas.getContext('2d');
  const dImg = dCtx.createImageData(size, size);
  const rImg = rCtx.createImageData(size, size);
  const bImg = bCtx.createImageData(size, size);

  for (let y = 0; y < size; y++) {
    const v = y / size;
    for (let x = 0; x < size; x++) {
      const u = x / size;
      const flow = tileFbm(u, v, 3, 4, seed);
      const fine = tileFbm(u * 2, v * 0.5, 8, 3, seed + 47);
      const streak = tileNoise2D(u * 64, v * 12, 64, 12, seed + 93);

      // Cathedral wood ring wave
      const ringCoord = (u * ringScale + flow * 4.2 + Math.sin(v * Math.PI * 2 + flow * 3.0) * 0.65);
      const ring = 0.5 + 0.5 * Math.sin(ringCoord * Math.PI * 2);
      const sharpRing = Math.pow(ring, 0.65);

      // Micro wood pores stretched along v
      const poreNoise = tileNoise2D(u * 96, v * (96 / grainStretch), 96, Math.round(96 / grainStretch), seed + 173);
      const pore = poreNoise < 0.14 ? (0.14 - poreNoise) / 0.14 : 0;

      const mix = clamp(sharpRing * 0.72 + fine * 0.22 + (streak - 0.5) * 0.12, 0, 1);
      const r = lerp(darkRGB[0], lightRGB[0], mix) * (1 - pore * poreStrength);
      const g = lerp(darkRGB[1], lightRGB[1], mix) * (1 - pore * poreStrength);
      const b = lerp(darkRGB[2], lightRGB[2], mix) * (1 - pore * poreStrength);

      const idx = (y * size + x) * 4;
      dImg.data[idx] = clamp(r, 0, 255);
      dImg.data[idx + 1] = clamp(g, 0, 255);
      dImg.data[idx + 2] = clamp(b, 0, 255);
      dImg.data[idx + 3] = 255;

      const rough = clamp(baseRough + (1 - sharpRing) * 26 + pore * 55 + (streak - 0.5) * 14, 16, 175);
      rImg.data[idx] = rImg.data[idx + 1] = rImg.data[idx + 2] = rough;
      rImg.data[idx + 3] = 255;

      const bump = clamp(128 + (sharpRing - 0.5) * 28 - pore * 65 + (streak - 0.5) * 12, 0, 255);
      bImg.data[idx] = bImg.data[idx + 1] = bImg.data[idx + 2] = bump;
      bImg.data[idx + 3] = 255;
    }
  }
  dCtx.putImageData(dImg, 0, 0);
  rCtx.putImageData(rImg, 0, 0);
  bCtx.putImageData(bImg, 0, 0);

  const map = new THREE.CanvasTexture(diffCanvas);
  map.colorSpace = THREE.SRGBColorSpace;
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.anisotropy = 8;

  const roughnessMap = new THREE.CanvasTexture(roughCanvas);
  roughnessMap.wrapS = roughnessMap.wrapT = THREE.RepeatWrapping;

  const bumpMap = new THREE.CanvasTexture(bumpCanvas);
  bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;

  return { map, roughnessMap, bumpMap };
}

function createPieceSurfaceTextures(isWhite) {
  const size = 256;
  const diffCanvas = document.createElement('canvas');
  const bumpCanvas = document.createElement('canvas');
  diffCanvas.width = bumpCanvas.width = size;
  diffCanvas.height = bumpCanvas.height = size;
  const dCtx = diffCanvas.getContext('2d');
  const bCtx = bumpCanvas.getContext('2d');
  const dImg = dCtx.createImageData(size, size);
  const bImg = bCtx.createImageData(size, size);

  for (let y = 0; y < size; y++) {
    const v = y / size;
    for (let x = 0; x < size; x++) {
      const u = x / size;
      const n1 = tileFbm(u, v, 6, 3, isWhite ? 901 : 1201);
      const band = Math.sin((u * 4 + v * 2 + n1 * 1.4) * Math.PI * 2) * 0.5 + 0.5;
      const idx = (y * size + x) * 4;
      if (isWhite) {
        // Subtle warm aged ivory Schreger micro-striation
        const tone = lerp(231, 246, band * 0.45 + n1 * 0.55);
        dImg.data[idx] = clamp(tone + 3, 0, 255);
        dImg.data[idx + 1] = clamp(tone - 3, 0, 255);
        dImg.data[idx + 2] = clamp(tone - 18, 0, 255);
      } else {
        // Glossy deep obsidian stone/ebony micro-variation
        const tone = lerp(13, 25, band * 0.4 + n1 * 0.6);
        dImg.data[idx] = clamp(tone, 0, 255);
        dImg.data[idx + 1] = clamp(tone + 1, 0, 255);
        dImg.data[idx + 2] = clamp(tone + 6, 0, 255);
      }
      dImg.data[idx + 3] = 255;
      const bVal = clamp(128 + (n1 - 0.5) * 18 + (band - 0.5) * 8, 0, 255);
      bImg.data[idx] = bImg.data[idx + 1] = bImg.data[idx + 2] = bVal;
      bImg.data[idx + 3] = 255;
    }
  }
  dCtx.putImageData(dImg, 0, 0);
  bCtx.putImageData(bImg, 0, 0);

  const map = new THREE.CanvasTexture(diffCanvas);
  map.colorSpace = THREE.SRGBColorSpace;
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  const bumpMap = new THREE.CanvasTexture(bumpCanvas);
  bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
  return { map, bumpMap };
}

function createFeltTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  const rand = mulberry32(777);
  for (let i = 0; i < size * size; i++) {
    const n = (rand() - 0.5) * 26;
    const idx = i * 4;
    img.data[idx] = clamp(18 + n * 0.5, 0, 255);
    img.data[idx + 1] = clamp(56 + n, 0, 255);
    img.data[idx + 2] = clamp(34 + n * 0.6, 0, 255);
    img.data[idx + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 4);

}

function createCoordinateStripTexture(labels) {

class ChessEngine {
  constructor() {
    this.reset();
  }

  reset() {
    this.board = Array.from({ length: 8 }, () => Array(8).fill(null));
    const back = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
    let uid = 1;
    for (let f = 0; f < 8; f++) {
      this.board[0][f] = { id: uid++, color: 'w', type: back[f] };
      this.board[1][f] = { id: uid++, color: 'w', type: 'p' };
      this.board[6][f] = { id: uid++, color: 'b', type: 'p' };
      this.board[7][f] = { id: uid++, color: 'b', type: back[f] };
    }
    this.turn = 'w';
    this.castling = { wK: true, wQ: true, bK: true, bQ: true };
    this.enPassant = null; // { r, f }
    this.history = [];
    this.nextId = uid;
  }

  cloneState() {
    return {
      board: this.board.map(row => row.map(p => (p ? { ...p } : null))),
      turn: this.turn,
      castling: { ...this.castling },
      enPassant: this.enPassant ? { ...this.enPassant } : null
    };
  }

  restoreState(s) {
    this.board = s.board.map(row => row.map(p => (p ? { ...p } : null)));
    this.turn = s.turn;
    this.castling = { ...s.castling };
    this.enPassant = s.enPassant ? { ...s.enPassant } : null;
  }

  inBounds(r, f) { return r >= 0 && r < 8 && f >= 0 && f < 8; }

  findKing(color) {
    for (let r = 0; r < 8; r++) {
      for (let f = 0; f < 8; f++) {
        const p = this.board[r][f];
        if (p && p.color === color && p.type === 'k') return { r, f };
      }
    }
    return null;
  }

  isSquareAttacked(tr, tf, byColor) {
    // Pawns
    const pDir = byColor === 'w' ? -1 : 1;
    for (const df of [-1, 1]) {
      const pr = tr + pDir, pf = tf + df;
      if (this.inBounds(pr, pf)) {
        const p = this.board[pr][pf];
        if (p && p.color === byColor && p.type === 'p') return true;
      }
    }
    // Knights
    const kn = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
    for (const [dr, df] of kn) {
      const nr = tr + dr, nf = tf + df;
      if (this.inBounds(nr, nf)) {
        const p = this.board[nr][nf];
        if (p && p.color === byColor && p.type === 'n') return true;
      }
    }
    // King
    for (let dr = -1; dr <= 1; dr++) {
      for (let df = -1; df <= 1; df++) {
        if (dr === 0 && df === 0) continue;
        const kr = tr + dr, kf = tf + df;
        if (this.inBounds(kr, kf)) {
          const p = this.board[kr][kf];
          if (p && p.color === byColor && p.type === 'k') return true;
        }
      }
    }
    // Diagonals (Bishop / Queen)
    for (const [dr, df] of [[-1,-1],[-1,1],[1,-1],[1,1]]) {
      let r = tr + dr, f = tf + df;
      while (this.inBounds(r, f)) {
        const p = this.board[r][f];
        if (p) {
          if (p.color === byColor && (p.type === 'b' || p.type === 'q')) return true;
          break;
        }
        r += dr; f += df;
      }
    }
    // Orthogonals (Rook / Queen)
    for (const [dr, df] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      let r = tr + dr, f = tf + df;
      while (this.inBounds(r, f)) {
        const p = this.board[r][f];
        if (p) {
          if (p.color === byColor && (p.type === 'r' || p.type === 'q')) return true;
          break;
        }
        r += dr; f += df;
      }
    }
    return false;
  }

  isInCheck(color) {
    const k = this.findKing(color);
    if (!k) return false;
    return this.isSquareAttacked(k.r, k.f, color === 'w' ? 'b' : 'w');
  }

  generatePseudoMoves(color) {
    const moves = [];
    const opp = color === 'w' ? 'b' : 'w';
    for (let r = 0; r < 8; r++) {
      for (let f = 0; f < 8; f++) {
        const p = this.board[r][f];
        if (!p || p.color !== color) continue;
        if (p.type === 'p') {
          const dir = color === 'w' ? 1 : -1;
          const startRank = color === 'w' ? 1 : 6;
          const promoRank = color === 'w' ? 7 : 0;
          const r1 = r + dir;
          if (this.inBounds(r1, f) && !this.board[r1][f]) {
            if (r1 === promoRank) {
              moves.push({ from: { r, f }, to: { r: r1, f }, piece: p, promotion: 'q' });
            } else {
              moves.push({ from: { r, f }, to: { r: r1, f }, piece: p });
              const r2 = r + 2 * dir;
              if (r === startRank && !this.board[r2][f]) {
                moves.push({ from: { r, f }, to: { r: r2, f }, piece: p, doublePush: true });
              }
            }
          }
          for (const df of [-1, 1]) {
            const cf = f + df;
            if (!this.inBounds(r1, cf)) continue;
            const target = this.board[r1][cf];
            if (target && target.color === opp) {
              if (r1 === promoRank) {
                moves.push({ from: { r, f }, to: { r: r1, f: cf }, piece: p, captured: target, promotion: 'q' });
              } else {
                moves.push({ from: { r, f }, to: { r: r1, f: cf }, piece: p, captured: target });
              }
            } else if (this.enPassant && this.enPassant.r === r1 && this.enPassant.f === cf) {
              const epCap = this.board[r][cf];
              if (epCap && epCap.color === opp && epCap.type === 'p') {
                moves.push({
                  from: { r, f }, to: { r: r1, f: cf }, piece: p,
                  captured: epCap, enPassant: true, capturedPos: { r, f: cf }
                });
              }
            }
          }
        } else if (p.type === 'n') {
          for (const [dr, df] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]) {
            const nr = r + dr, nf = f + df;
            if (!this.inBounds(nr, nf)) continue;
            const t = this.board[nr][nf];
            if (!t || t.color === opp) {
              moves.push({ from: { r, f }, to: { r: nr, f: nf }, piece: p, captured: t || null });
            }
          }
        } else if (p.type === 'b' || p.type === 'r' || p.type === 'q') {
          const dirs = [];
          if (p.type === 'b' || p.type === 'q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
          if (p.type === 'r' || p.type === 'q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
          for (const [dr, df] of dirs) {
            let nr = r + dr, nf = f + df;
            while (this.inBounds(nr, nf)) {
              const t = this.board[nr][nf];
              if (!t) {
                moves.push({ from: { r, f }, to: { r: nr, f: nf }, piece: p });
              } else {
                if (t.color === opp) {
                  moves.push({ from: { r, f }, to: { r: nr, f: nf }, piece: p, captured: t });
                }
                break;
              }
              nr += dr; nf += df;
            }
          }
        } else if (p.type === 'k') {
          for (let dr = -1; dr <= 1; dr++) {
            for (let df = -1; df <= 1; df++) {
              if (dr === 0 && df === 0) continue;
              const nr = r + dr, nf = f + df;
              if (!this.inBounds(nr, nf)) continue;
              const t = this.board[nr][nf];
              if (!t || t.color === opp) {
                moves.push({ from: { r, f }, to: { r: nr, f: nf }, piece: p, captured: t || null });
              }
            }
          }
          // Castling
          const homeRank = color === 'w' ? 0 : 7;
          if (r === homeRank && f === 4 && !this.isSquareAttacked(homeRank, 4, opp)) {
            const canK = color === 'w' ? this.castling.wK : this.castling.bK;
            const canQ = color === 'w' ? this.castling.wQ : this.castling.bQ;
            if (canK && !this.board[homeRank][5] && !this.board[homeRank][6]) {
              const rook = this.board[homeRank][7];
              if (rook && rook.color === color && rook.type === 'r' &&
                  !this.isSquareAttacked(homeRank, 5, opp) && !this.isSquareAttacked(homeRank, 6, opp)) {
                moves.push({
                  from: { r: homeRank, f: 4 }, to: { r: homeRank, f: 6 }, piece: p,
                  castle: 'K', rookFrom: { r: homeRank, f: 7 }, rookTo: { r: homeRank, f: 5 }, rookPiece: rook
                });
              }
            }
            if (canQ && !this.board[homeRank][3] && !this.board[homeRank][2] && !this.board[homeRank][1]) {
              const rook = this.board[homeRank][0];
              if (rook && rook.color === color && rook.type === 'r' &&
                  !this.isSquareAttacked(homeRank, 3, opp) && !this.isSquareAttacked(homeRank, 2, opp)) {
                moves.push({
                  from: { r: homeRank, f: 4 }, to: { r: homeRank, f: 2 }, piece: p,
                  castle: 'Q', rookFrom: { r: homeRank, f: 0 }, rookTo: { r: homeRank, f: 3 }, rookPiece: rook
                });
              }
            }
          }
        }
      }
    }
    return moves;
  }

  applyMoveRaw(m) {
    const p = this.board[m.from.r][m.from.f];
    this.board[m.from.r][m.from.f] = null;
    if (m.enPassant) {
      this.board[m.capturedPos.r][m.capturedPos.f] = null;
    }
    if (m.castle) {
      const rook = this.board[m.rookFrom.r][m.rookFrom.f];
      this.board[m.rookFrom.r][m.rookFrom.f] = null;
      this.board[m.rookTo.r][m.rookTo.f] = rook;
    }
    const moved = m.promotion ? { ...p, type: m.promotion } : p;
    this.board[m.to.r][m.to.f] = moved;

    // Castling rights
    if (p.type === 'k') {
      if (p.color === 'w') { this.castling.wK = false; this.castling.wQ = false; }
      else { this.castling.bK = false; this.castling.bQ = false; }
    }
    if (m.from.r === 0 && m.from.f === 0) this.castling.wQ = false;
    if (m.from.r === 0 && m.from.f === 7) this.castling.wK = false;
    if (m.from.r === 7 && m.from.f === 0) this.castling.bQ = false;
    if (m.from.r === 7 && m.from.f === 7) this.castling.bK = false;
    if (m.to.r === 0 && m.to.f === 0) this.castling.wQ = false;
    if (m.to.r === 0 && m.to.f === 7) this.castling.wK = false;
    if (m.to.r === 7 && m.to.f === 0) this.castling.bQ = false;
    if (m.to.r === 7 && m.to.f === 7) this.castling.bK = false;

    this.enPassant = m.doublePush ? { r: (m.from.r + m.to.r) / 2, f: m.from.f } : null;
    this.turn = this.turn === 'w' ? 'b' : 'w';
  }

  getLegalMoves(color = this.turn) {
    const pseudo = this.generatePseudoMoves(color);
    const legal = [];
    for (const m of pseudo) {
      const snap = this.cloneState();
      this.applyMoveRaw(m);
      if (!this.isInCheck(color)) legal.push(m);
      this.restoreState(snap);
    }
    return legal;
  }

  getLegalMovesFrom(r, f) {
    return this.getLegalMoves(this.turn).filter(m => m.from.r === r && m.from.f === f);
  }

  formatSAN(move, allLegal) {
    if (move.castle === 'K') return 'O-O';
    if (move.castle === 'Q') return 'O-O-O';
    const p = move.piece;
    let s = '';
    if (p.type !== 'p') {
      s += p.type.toUpperCase();
      const ambig = allLegal.filter(other =>
        !(other.from.r === move.from.r && other.from.f === move.from.f) &&
        other.piece.type === p.type &&
        other.to.r === move.to.r &&
        other.to.f === move.to.f
      );
      if (ambig.length > 0) {
        const sameFile = ambig.some(o => o.from.f === move.from.f);
        const sameRank = ambig.some(o => o.from.r === move.from.r);
        if (!sameFile) s += FILES[move.from.f];
        else if (!sameRank) s += (move.from.r + 1);
        else s += FILES[move.from.f] + (move.from.r + 1);
      }
    } else if (move.captured) {
      s += FILES[move.from.f];
    }
    if (move.captured) s += 'x';
    s += FILES[move.to.f] + (move.to.r + 1);
    if (move.promotion) s += '=' + move.promotion.toUpperCase();
    return s;
  }

  makeMove(move) {
    const allLegal = this.getLegalMoves(this.turn);
    let san = this.formatSAN(move, allLegal);
    const prevSnap = this.cloneState();
    this.applyMoveRaw(move);

    const oppMoves = this.getLegalMoves(this.turn);
    const inCheck = this.isInCheck(this.turn);
    if (inCheck) {
      san += oppMoves.length === 0 ? '#' : '+';
    }
    const record = {
      ...move,
      san,
      prevSnap,
      inCheck,
      checkmate: inCheck && oppMoves.length === 0,
      stalemate: !inCheck && oppMoves.length === 0
    };
    this.history.push(record);
    return record;
  }

  parseSAN(sanStr) {
    const clean = sanStr.replace(/[+#?!]/g, '').trim();
    const legal = this.getLegalMoves(this.turn);
    if (clean === 'O-O' || clean === '0-0') return legal.find(m => m.castle === 'K') || null;
    if (clean === 'O-O-O' || clean === '0-0-0') return legal.find(m => m.castle === 'Q') || null;

    let promo = null;
    let body = clean;
    const eqIdx = body.indexOf('=');
    if (eqIdx !== -1) {
      promo = body[eqIdx + 1].toLowerCase();
      body = body.slice(0, eqIdx);
    }

    const toFile = FILES.indexOf(body[body.length - 2]);
    const toRank = parseInt(body[body.length - 1], 10) - 1;
    let prefix = body.slice(0, body.length - 2).replace('x', '');
    let pieceType = 'p';
    if (prefix.length > 0 && prefix[0] >= 'A' && prefix[0] <= 'Z') {
      pieceType = prefix[0].toLowerCase();
      prefix = prefix.slice(1);
    }

    let disFile = -1, disRank = -1;
    for (const ch of prefix) {
      if (ch >= 'a' && ch <= 'h') disFile = FILES.indexOf(ch);
      else if (ch >= '1' && ch <= '8') disRank = parseInt(ch, 10) - 1;
    }

    return legal.find(m =>
      m.piece.type === pieceType &&
      m.to.r === toRank &&
      m.to.f === toFile &&
      (disFile === -1 || m.from.f === disFile) &&
      (disRank === -1 || m.from.r === disRank) &&
      (!promo || m.promotion === promo)
    ) || null;
  }

  getGameStatus() {
    const legal = this.getLegalMoves(this.turn);
    const inCheck = this.isInCheck(this.turn);
    if (legal.length === 0) {
      return inCheck
        ? { state: 'checkmate', winner: this.turn === 'w' ? 'b' : 'w', inCheck: true }
        : { state: 'stalemate', winner: null, inCheck: false };
    }
    return { state: 'playing', winner: null, inCheck };
  }

  // Lightweight 2-ply minimax with positional center bonus for Play vs AI
  chooseAIMove() {
    const legal = this.getLegalMoves(this.turn);
    if (legal.length === 0) return null;
    const aiColor = this.turn;
    const evalBoard = () => {
      let score = 0;
      for (let r = 0; r < 8; r++) {
        for (let f = 0; f < 8; f++) {
          const p = this.board[r][f];
          if (!p) continue;
          const centerDist = Math.abs(3.5 - f) + Math.abs(3.5 - r);
          let posBonus = (3.5 - centerDist * 0.5) * (p.type === 'p' ? 5 : p.type === 'n' ? 9 : p.type === 'b' ? 6 : 2);
          if (p.type === 'p') posBonus += (p.color === 'w' ? r : (7 - r)) * 6;
          const val = PIECE_VALUES[p.type] + posBonus;
          score += p.color === aiColor ? val : -val;
        }
      }
      return score;
    };

    let bestScore = -Infinity;
    let bestMoves = [];
    for (const m of legal) {
      const snap = this.cloneState();
      this.applyMoveRaw(m);
      const replies = this.getLegalMoves(this.turn);
      let score;
      if (replies.length === 0) {
        score = this.isInCheck(this.turn) ? 99999 : 0;
      } else {
        let worstReply = Infinity;
        for (const rMove of replies) {
          const snap2 = this.cloneState();
          this.applyMoveRaw(rMove);
          const s2 = evalBoard();
          if (s2 < worstReply) worstReply = s2;
          this.restoreState(snap2);
        }
        score = worstReply;
      }
      this.restoreState(snap);
      if (score > bestScore + 0.5) {
        bestScore = score;
        bestMoves = [m];
      } else if (Math.abs(score - bestScore) <= 0.5) {
        bestMoves.push(m);
      }
    }
    return bestMoves[Math.floor(Math.random() * bestMoves.length)];
  }
}

  hole.lineTo(inner, -inner);

    depth: 0.22,

function squareToWorld(r, f) {
  return new THREE.Vector3((f - 3.5) * SQ, BOARD_TOP_Y, (3.5 - r) * SQ);

function worldToSquare(x, z) {
  const f = Math.floor(x / SQ + 4.0);
  const r = Math.floor(4.0 - z / SQ);
  if (r < 0 || r > 7 || f < 0 || f > 7) return null;
  return { r, f };
}

// Build individually UV-shifted chamfered square tiles so no repetition is ever visible
const baseTileShape = new THREE.Shape();
const th = 0.486;

baseTileShape.lineTo(th, -th);
baseTileShape.lineTo(th, th);

for (let r = 0; r < 8; r++) {
  for (let f = 0; f < 8; f++) {
    const isLight = (r + f) % 2 === 1;
    const tileGeo = new THREE.ExtrudeGeometry(baseTileShape, {
      depth: 0.075,
      bevelEnabled: true,
      bevelThickness: 0.011,
      bevelSize: 0.011,
      bevelSegments: 2
    });
    tileGeo.rotateX(-Math.PI / 2);

    // Randomize UV slice & quarter rotation per square for organic marble/wood inlay
    const uvAttr = tileGeo.attributes.uv;
    const offU = squareRand() * 0.7;
    const offV = squareRand() * 0.7;
    const rotQ = Math.floor(squareRand() * 4);
    const scaleUV = isLight ? 0.42 : 0.48;
    for (let i = 0; i < uvAttr.count; i++) {
      let u = uvAttr.getX(i) * scaleUV;
      let v = uvAttr.getY(i) * scaleUV;
      if (rotQ === 1) { const t = u; u = -v; v = t; }
      else if (rotQ === 2) { u = -u; v = -v; }
      else if (rotQ === 3) { const t = u; u = v; v = -t; }
      uvAttr.setXY(i, u + offU, v + offV);
    }

    const tile = new THREE.Mesh(tileGeo, isLight ? creamMarbleMat : walnutWoodMat);
    const pos = squareToWorld(r, f);
    tile.position.set(pos.x, BOARD_TOP_Y - 0.086, pos.z);
    tile.receiveShadow = true;
    tile.userData = { isSquare: true, r, f };
    boardGroup.add(tile);
    squareMeshes.push(tile);
  }

  const body = new THREE.Mesh(new THREE.BoxGeometry(2.35, 1.15, 0.72), mahoganyMat);
  body.position.y = 0.575;
  body.castShadow = true;
  body.receiveShadow = true;
  clock.add(body);

  // Brass top rocker plungers
  const plungerGeo = new THREE.CylinderGeometry(0.16, 0.17, 0.18, 20);
  const pL = new THREE.Mesh(plungerGeo, brassInlayMat);
  pL.position.set(-0.56, 1.22, 0);
  pL.castShadow = true;
  const pR = new THREE.Mesh(plungerGeo, brassInlayMat);
  pR.position.set(0.56, 1.18, 0);
  pR.castShadow = true;
  clock.add(pL, pR);

  // Two ivory clock dials with brass bezels
  const dialCanvas = document.createElement('canvas');
  dialCanvas.width = dialCanvas.height = 256;
  const ctx = dialCanvas.getContext('2d');
  ctx.fillStyle = '#f3ead5';
  ctx.beginPath();
  ctx.arc(128, 128, 124, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#33281e';
  ctx.lineWidth = 4;
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(128 + Math.cos(a) * 96, 128 + Math.sin(a) * 96);
    ctx.lineTo(128 + Math.cos(a) * 112, 128 + Math.sin(a) * 112);
    ctx.stroke();
  }
  // Red flag & hands
  ctx.fillStyle = '#b92622';
  ctx.fillRect(118, 24, 9, 28);
  ctx.strokeStyle = '#151210';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(128, 128); ctx.lineTo(128, 52);
  ctx.moveTo(128, 128); ctx.lineTo(174, 152);
  ctx.stroke();
  const dialTex = new THREE.CanvasTexture(dialCanvas);
  dialTex.colorSpace = THREE.SRGBColorSpace;
  const dialMat = new THREE.MeshPhysicalMaterial({
    map: dialTex, roughness: 0.22, clearcoat: 0.9, clearcoatRoughness: 0.08
  });

  const bezelGeo = new THREE.TorusGeometry(0.41, 0.032, 12, 32);
  const faceGeo = new THREE.CircleGeometry(0.40, 32);
  for (const dx of [-0.56, 0.56]) {
    const face = new THREE.Mesh(faceGeo, dialMat);
    face.position.set(dx, 0.58, 0.365);
    const bezel = new THREE.Mesh(bezelGeo, brassInlayMat);
    bezel.position.set(dx, 0.58, 0.368);
    clock.add(face, bezel);
  }

  clock.position.set(-6.4, 0, -5.2);
  clock.rotation.y = 0.52;
  scene.add(clock);
  return { clock, pL, pR };
}

function makeLathe(pts, segs = 44) {
  const vecs = pts.map(([r, y]) => new THREE.Vector2(Math.max(0.0005, r), y));
  const geo = new THREE.LatheGeometry(vecs, segs);
  geo.computeVertexNormals();
  return geo;
}

function normalizeGeometry(geo) {
  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  if (!g.attributes.normal) g.computeVertexNormals();
  if (!g.attributes.uv) {
    const count = g.attributes.position.count;
    g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(count * 2), 2));
  }
  return g;
}

function buildRookGeometry() {
  const parts = [];
  // Turned tower pedestal & parapet cup
  const tower = makeLathe([
    [0.001, 0.025],
    [0.345, 0.025],
    [0.35, 0.08],
    [0.32, 0.12],
    [0.33, 0.16],
    [0.285, 0.215],
    [0.245, 0.275],
    [0.215, 0.45],
    [0.19, 0.72],
    [0.185, 0.88],
    [0.245, 0.94],
    [0.275, 1.00],
    [0.28, 1.09],
    [0.195, 1.09],
    [0.195, 1.02],
    [0.001, 1.02]
  ], 48);
  parts.push(normalizeGeometry(tower));

  // 6 sculpted crenellated battlements (merlons) around the parapet
  const merlonCount = 6;
  const arcSpan = (Math.PI * 2 / merlonCount) * 0.60;
  const rOut = 0.282, rIn = 0.192, hMerlon = 0.185;
  for (let i = 0; i < merlonCount; i++) {
    const a0 = (i / merlonCount) * Math.PI * 2;
    const a1 = a0 + arcSpan;
    const shape = new THREE.Shape();
    shape.absarc(0, 0, rOut, a0, a1, false);
    shape.absarc(0, 0, rIn, a1, a0, true);
    shape.closePath();

    const mGeo = new THREE.ExtrudeGeometry(shape, {
      depth: hMerlon - 0.02,
      bevelEnabled: true,
      bevelThickness: 0.014,
      bevelSize: 0.009,
      bevelSegments: 2,
      curveSegments: 8
    });
    mGeo.rotateX(-Math.PI / 2);
    mGeo.translate(0, 1.085, 0);
    parts.push(normalizeGeometry(mGeo));
  }
  return mergeGeometries(parts, false);
}

  ], 48);
  parts.push(normalizeGeometry(stem));

  // Sculpted mitre head with a REAL carved diagonal bishop notch (vertex-carved watertight lathe)
  const mitreProfile = [
    [0.135, 1.015],
    [0.185, 1.07],
    [0.225, 1.15],
    [0.232, 1.23],
    [0.215, 1.31],
    [0.175, 1.38],
    [0.118, 1.44],
    [0.055, 1.485],
    [0.001, 1.50]
  ];
  const mitreGeo = makeLathe(mitreProfile, 64);
  const pos = mitreGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    // Diagonal notch plane slicing into the +x / -z side of the mitre
    if (x > -0.02 && y > 1.12 && y < 1.46) {
      const planeDist = Math.abs((y - 1.29) - (x - 0.08) * 0.92);
      const notchHalfWidth = 0.048;
      if (planeDist < notchHalfWidth) {
        const t = 1.0 - planeDist / notchHalfWidth;
        const depthFactor = Math.pow(t, 1.35) * clamp((x + 0.02) / 0.20, 0, 1);
        const radial = Math.hypot(x, z);
        if (radial > 0.03) {
          const shrink = 1.0 - depthFactor * 0.72;
          x *= shrink;
          z *= shrink;
        }
        pos.setXYZ(i, x, y, z);
      }
    }
  }
  mitreGeo.computeVertexNormals();
  parts.push(normalizeGeometry(mitreGeo));

  // Classic finial orb on top of mitre
  const orb = new THREE.SphereGeometry(0.062, 24, 18);
  orb.translate(0, 1.545, 0);
  parts.push(normalizeGeometry(orb));

  return mergeGeometries(parts, false);
}

function createEmissiveRingMaterial(colorHex, intensity, style = 0) {
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uColor: { value: new THREE.Color(colorHex) },
      uIntensity: { value: intensity },
      uTime: { value: 0 },
      uStyle: { value: style } // 0: selected, 1: quiet target, 2: capture target, 3: check, 4: lastMove, 5: hover
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uIntensity;
      uniform float uTime;
      uniform float uStyle;
      varying vec2 vUv;

      void main() {
        vec2 p = vUv * 2.0 - 1.0;
        float dist = length(p);
        float angle = atan(p.y, p.x);
        float alpha = 0.0;

        if (uStyle < 0.5) {
          // Selected piece: warm glowing double ring
          float r1 = smoothstep(0.06, 0.0, abs(dist - 0.78));
          float r2 = smoothstep(0.14, 0.0, abs(dist - 0.78)) * 0.45;
          float inner = smoothstep(0.75, 0.25, dist) * 0.18;
          float pulse = 0.88 + 0.12 * sin(uTime * 3.2);
          alpha = (r1 + r2 + inner) * pulse;
        } else if (uStyle < 1.5) {
          // Legal quiet destination: soft ring + luminous center pip
          float ring = smoothstep(0.055, 0.0, abs(dist - 0.56)) * 0.85;
          float halo = smoothstep(0.16, 0.0, abs(dist - 0.56)) * 0.28;
          float dot = smoothstep(0.20, 0.08, dist) * 0.82;
          float pulse = 0.86 + 0.14 * sin(uTime * 2.8);
          alpha = (ring + halo + dot) * pulse;
        } else if (uStyle < 2.5) {
          // Capture destination: segmented rotating target ring
          float ring = smoothstep(0.065, 0.0, abs(dist - 0.80));
          float halo = smoothstep(0.18, 0.0, abs(dist - 0.80)) * 0.42;
          float seg = 0.65 + 0.35 * sin(angle * 4.0 + uTime * 2.4);
          float pulse = 0.84 + 0.16 * sin(uTime * 4.5);
          alpha = (ring * seg + halo) * pulse;
        } else if (uStyle < 3.5) {
          // Check warning: urgent pulsing crimson aura & tight ring
          float pulse = 0.72 + 0.28 * sin(uTime * 6.5);
          float ring = smoothstep(0.075, 0.0, abs(dist - 0.82));
          float aura = smoothstep(0.95, 0.15, dist) * 0.52;
          alpha = (ring + aura) * pulse;
        } else if (uStyle < 4.5) {
          // Last move subtle glowing square border
          vec2 edge = abs(p);
          float sqDist = max(edge.x, edge.y);
          float rim = smoothstep(0.055, 0.0, abs(sqDist - 0.88)) * 0.68;
          float wash = smoothstep(0.92, 0.45, sqDist) * 0.12;
          alpha = rim + wash;
        } else {
          // Hover legal target intensified ring
          float ring = smoothstep(0.075, 0.0, abs(dist - 0.82));
          float wash = smoothstep(0.84, 0.2, dist) * 0.35;
          alpha = ring + wash;
        }

        if (alpha < 0.005) discard;
        vec3 col = uColor * uIntensity;
        gl_FragColor = vec4(col, alpha);
      }
    `
  });
}
