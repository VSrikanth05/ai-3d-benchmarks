<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>JENSEN HUANG: 11-DAY COMEBACK</title>
<style>
  :root {
    --nv: #76B900;
    --nv-hi: #a6ff00;
    --cyan: #00f0ff;
    --red: #ff2947;
    --gold: #ffd24c;
    --glass: rgba(6, 11, 14, 0.56);
    --border: rgba(118, 185, 0, 0.36);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030608;
    color: #f4f9f6;
    font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    z-index: 1;
    touch-action: none;
  }

  /* Subtle outer-edge vignette + warp speed sheen (center 100% untouched) */
  #warpVignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background: radial-gradient(circle at 50% 50%, transparent 56%, rgba(2, 6, 8, 0.55) 100%);
    transition: box-shadow 0.2s ease;
  }
  #warpVignette.turbo {
    box-shadow: inset 0 0 110px rgba(118, 185, 0, 0.42);
  }
  #warpVignette.gold {
    box-shadow: inset 0 0 110px rgba(255, 210, 76, 0.38);
  }
  #warpVignette.hit {
    box-shadow: inset 0 0 130px rgba(255, 41, 71, 0.65);
  }

  /* ================= ULTRA-CLEAN MINIMAL CORNER HUD ================= */
  #hud {
    position: fixed;
    top: 14px;
    left: 16px;
    right: 16px;
    z-index: 30;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    pointer-events: none;
  }

  .hud-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.38);
  }

  /* Top-Left: NVDA Market Cap */
  .ticker-tag {
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.4px;
    color: var(--nv-hi);
    opacity: 0.9;
  }

  #mcapVal {
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: 18px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -0.3px;
    transition: transform 0.12s ease, color 0.14s ease;
  }
  #mcapVal.pulse {
    transform: scale(1.1);
    color: var(--nv-hi);
  }
  #mcapVal.dip {
    transform: scale(0.94);
    color: var(--red);
  }

  #mcapPct {
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: 11px;
    font-weight: 800;
    color: var(--nv-hi);
  }

  /* Top-Right: Day Progress + 3 Small Life Bars + Mute */
  .hud-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .day-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .day-lbl {
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.8px;
    color: rgba(235, 246, 240, 0.72);
    white-space: nowrap;
  }
  .day-lbl.hi {
    color: var(--nv-hi);
  }

  .day-track {
    width: 84px;
    height: 6px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.14);
    overflow: hidden;
  }

  #dayFill {
    width: 0%;
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--nv), var(--nv-hi));
    box-shadow: 0 0 10px rgba(166, 255, 0, 0.85);
    transition: width 0.08s linear;
  }

  .divider {
    width: 1px;
    height: 16px;
    background: rgba(255, 255, 255, 0.16);
  }

  .life-bars {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .life-bar {
    width: 18px;
    height: 7px;
    border-radius: 3px;
    background: var(--nv-hi);
    box-shadow: 0 0 8px rgba(118, 185, 0, 0.75);
    transition: opacity 0.22s ease, background 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  }
  .life-bar.lost {
    opacity: 0.16;
    background: #55616b;
    box-shadow: none;
  }
  .life-bar.gold {
    background: var(--gold);
    box-shadow: 0 0 10px rgba(255, 210, 76, 0.95);
    transform: scaleY(1.2);
  }

  #muteBtn {
    pointer-events: auto;
    cursor: pointer;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--glass);
    color: #e9f5ee;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: border-color 0.15s ease, transform 0.12s ease, color 0.15s ease;
  }
  #muteBtn:hover {
    border-color: var(--nv-hi);
    color: var(--nv-hi);
  }
  #muteBtn:active { transform: scale(0.92); }
  #muteBtn.muted {
    border-color: rgba(255, 41, 71, 0.55);
    color: #ff6e82;
  }

  /* ================= SLEEK MINIMAL TITLE & PLAY BUTTON ================= */
  #titleOverlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 74px 20px 44px;
    transition: opacity 0.4s ease;
  }
  #titleOverlay.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .title-header {
    text-align: center;
    pointer-events: none;
  }
  .title-header h1 {
    font-size: clamp(26px, 4.4vw, 50px);
    font-weight: 900;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 0 28px rgba(118, 185, 0, 0.7), 0 4px 18px rgba(0, 0, 0, 0.75);
  }
  .title-header .sub {
    display: inline-block;
    margin-top: 8px;
    padding: 4px 16px;
    border-radius: 999px;
    background: rgba(4, 10, 12, 0.65);
    border: 1px solid rgba(118, 185, 0, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: clamp(11px, 1.5vw, 13px);
    font-weight: 800;
    letter-spacing: 5px;
    color: var(--nv-hi);
    text-shadow: 0 0 12px rgba(118, 185, 0, 0.85);
  }

  .play-cta-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    pointer-events: auto;
  }

  .minimal-btn {
    cursor: pointer;
    pointer-events: auto;
    padding: 15px 54px;
    border-radius: 999px;
    border: 1.5px solid var(--nv-hi);
    background: rgba(118, 185, 0, 0.22);
    color: #ffffff;
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 0 32px rgba(118, 185, 0, 0.45), inset 0 0 16px rgba(166, 255, 0, 0.16);
    transition: transform 0.15s ease, background 0.18s ease, box-shadow 0.18s ease;
  }
  .minimal-btn:hover {
    background: rgba(118, 185, 0, 0.42);
    box-shadow: 0 0 44px rgba(166, 255, 0, 0.72), inset 0 0 20px rgba(166, 255, 0, 0.26);
    transform: translateY(-2px) scale(1.03);
  }
  .minimal-btn:active {
    transform: scale(0.96);
  }

  .key-micro {
    padding: 4px 14px;
    border-radius: 999px;
    background: rgba(4, 9, 12, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: 10.5px;
    letter-spacing: 1.6px;
    color: rgba(235, 246, 240, 0.85);
    text-transform: uppercase;
  }

  /* ================= CINEMATIC END CARDS (VICTORY / GAME OVER) ================= */
  .end-overlay {
    position: fixed;
    inset: 0;
    z-index: 25;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(circle at 50% 50%, rgba(3, 8, 6, 0.28), rgba(2, 5, 7, 0.68));
    transition: opacity 0.35s ease;
  }
  .end-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .end-card {
    width: min(440px, 92vw);
    background: rgba(7, 13, 15, 0.78);
    border: 1.5px solid rgba(166, 255, 0, 0.55);
    border-radius: 20px;
    padding: 30px 28px;
    text-align: center;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(118, 185, 0, 0.24);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    animation: cardRise 0.38s cubic-bezier(.2,1.2,.3,1);
  }
  .end-card.red {
    border-color: rgba(255, 41, 71, 0.6);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(255, 41, 71, 0.24);
  }

  @keyframes cardRise {
    0% { opacity: 0; transform: translateY(18px) scale(0.94); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .end-kicker {
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
    color: var(--nv-hi);
    text-transform: uppercase;
  }
  .end-card.red .end-kicker { color: #ff7a8f; }

  .end-title {
    font-size: clamp(28px, 5vw, 38px);
    font-weight: 900;
    letter-spacing: 3px;
    color: #ffffff;
    text-shadow: 0 0 24px rgba(118, 185, 0, 0.75);
  }
  .end-card.red .end-title {
    color: #ff4762;
    text-shadow: 0 0 24px rgba(255, 41, 71, 0.7);
  }

  .end-metrics {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 4px 0;
  }
  .metric {
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 10px 8px;
  }
  .metric .m-lbl {
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: 9.5px;
    letter-spacing: 1.4px;
    color: rgba(220, 238, 228, 0.62);
  }
  .metric .m-val {
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    font-size: 22px;
    font-weight: 900;
    color: var(--nv-hi);
    margin-top: 2px;
  }
  .end-card.red .metric .m-val { color: #ffffff; }

  .end-quote {
    font-style: italic;
    font-size: 14px;
    color: rgba(235, 245, 240, 0.82);
  }

  .end-card.red .minimal-btn {
    border-color: var(--red);
    background: rgba(255, 41, 71, 0.22);
    box-shadow: 0 0 28px rgba(255, 41, 71, 0.42);
  }

  @media (max-width: 640px) {
    #hud { top: 10px; left: 10px; right: 10px; }
    .hud-pill { padding: 6px 10px; gap: 7px; }
    #mcapVal { font-size: 15px; }
    .day-track { width: 52px; }
    .day-lbl { font-size: 9px; }
    .life-bar { width: 12px; height: 6px; }
    #muteBtn { width: 32px; height: 32px; font-size: 13px; }
  }
</style>

<body>

<div id="warpVignette"></div>

<!-- ULTRA-CLEAN MINIMAL CORNER HUD -->
<div id="hud">
  <div class="hud-pill">
    <span class="ticker-tag">NVDA</span>
    <span id="mcapVal">$2.80T</span>
    <span id="mcapPct">+0.0%</span>
  </div>

  <div class="hud-right">
    <div class="hud-pill">
      <div class="day-group">
        <span id="dayNow" class="day-lbl hi">NOV 12</span>
        <div class="day-track"><div id="dayFill"></div></div>
        <span class="day-lbl">NOV 23</span>
      </div>
      <div class="divider"></div>
      <div class="life-bars" id="lifeBars">
        <span class="life-bar"></span>
        <span class="life-bar"></span>

<!-- MINIMAL FRAME-0 TITLE + SINGLE PLAY BUTTON AT BOTTOM -->
<div id="titleOverlay">
  <div class="title-header">
    <h1>JENSEN HUANG</h1>
    <div class="sub">11-DAY COMEBACK</div>
  </div>
  <div class="play-cta-wrap">
    <button id="playBtn" class="minimal-btn" type="button">PLAY</button>
    <div class="key-micro">← → Lanes • ↑ / Space Jump • ↓ Slide • Swipe</div>
  </div>
</div>

<!-- CLEAN CINEMATIC VICTORY CARD -->
<div id="victoryOverlay" class="end-overlay hidden">
  <div class="end-card">
    <div class="end-kicker">NOV 23 • NVIDIA HQ PORTAL</div>
    <div class="end-title">JENSEN IS BACK</div>
    <div class="end-metrics">
      <div class="metric">
        <div class="m-lbl">FINAL MARKET CAP</div>
        <div id="vicMcap" class="m-val">$4.25T</div>
      </div>
      <div class="metric">
        <div class="m-lbl">REBOUND GAIN</div>

<!-- CLEAN GAME OVER CARD -->
<div id="gameOverOverlay" class="end-overlay hidden">
  <div class="end-card red">
    <div id="goDay" class="end-kicker">HALTED ON NOV 16</div>
    <div class="end-title">STOCK DIPPED</div>
    <div class="end-metrics">
      <div class="metric">

        <div id="goMcap" class="m-val">$3.10T</div>

      <div class="metric">

        <div id="goGpus" class="m-val">9</div>
      </div>
    </div>
    <button id="replayGoBtn" class="minimal-btn" type="button">RETRY</button>

</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============================================================================
// 1. DOM & CONSTANTS
// ============================================================================
const elMcapVal = document.getElementById('mcapVal');
const elMcapPct = document.getElementById('mcapPct');
const elDayNow = document.getElementById('dayNow');
const elDayFill = document.getElementById('dayFill');
const elLifeBars = Array.from(document.querySelectorAll('#lifeBars .life-bar'));
const elMuteBtn = document.getElementById('muteBtn');
const elVignette = document.getElementById('warpVignette');

const elTitleOverlay = document.getElementById('titleOverlay');
const elVictoryOverlay = document.getElementById('victoryOverlay');
const elGameOverOverlay = document.getElementById('gameOverOverlay');
const elPlayBtn = document.getElementById('playBtn');
const elReplayVicBtn = document.getElementById('replayVicBtn');
const elReplayGoBtn = document.getElementById('replayGoBtn');
const elVicMcap = document.getElementById('vicMcap');
const elVicGain = document.getElementById('vicGain');
const elGoDay = document.getElementById('goDay');
const elGoMcap = document.getElementById('goMcap');
const elGoGpus = document.getElementById('goGpus');

const LANES = [-3.2, 0, 3.2];
const RUN_DURATION = 25.0; // Fast 25-second sprint from Nov 12 -> Nov 23
const START_MCAP = 2800;   // $2.80T in billions
const BASE_SPEED = 42;
const MAX_SPEED = 62;
const TURBO_BONUS_SPEED = 30;
const GRAVITY = -48;
const JUMP_VEL = 18.2;

// ============================================================================
// 2. DARK SYNTHWAVE WEB AUDIO API ENGINE
// ============================================================================
class DarkSynthAudio {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.musicBus = null;
    this.sfxBus = null;
    this.muted = false;
    this.unlocked = false;
    this.running = false;
    this.step = 0;
    this.nextTime = 0;
    this.timer = null;
    this.turboLevel = 0;
    this.progress = 0;
  }

  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.78;
      this.master.connect(this.ctx.destination);

      this.musicBus = this.ctx.createGain();
      this.musicBus.gain.value = 0.44;
      this.musicBus.connect(this.master);

      this.sfxBus = this.ctx.createGain();
      this.sfxBus.gain.value = 0.82;
      this.sfxBus.connect(this.master);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    this.unlocked = true;
  }

  toggleMute() {
    this.muted = !this.muted;
    elMuteBtn.classList.toggle('muted', this.muted);
    elMuteBtn.textContent = this.muted ? '🔇' : '🔊';
    if (this.master && this.ctx) {
      this.master.gain.setTargetAtTime(this.muted ? 0 : 0.78, this.ctx.currentTime, 0.02);
    }
  }

  startMusic() {
    if (!this.unlocked || !this.ctx || this.running) return;
    this.running = true;
    this.step = 0;
    this.nextTime = this.ctx.currentTime + 0.04;
    this.timer = setInterval(() => this._tick(), 25);
  }

  stopMusic() {
    this.running = false;
    if (this.timer) {
      clearInterval(this.timer);
      this.timer = null;
    }
  }

  _tick() {
    if (!this.running || !this.ctx || document.hidden) return;
    const bpm = 132 + this.progress * 12 + this.turboLevel * 14;
    const stepDur = (60 / bpm) / 4;
    while (this.nextTime < this.ctx.currentTime + 0.12) {
      this._stepNote(this.step, this.nextTime, stepDur);
      this.nextTime += stepDur;
      this.step = (this.step + 1) % 32;
    }
  }

  _stepNote(step, t, dur) {
    // Dark synthwave rolling 16th bass: F#1 -> D1 -> A1 -> E1
    const bassSeq = [
      46.25, 46.25, 92.50, 46.25, 46.25, 46.25, 92.50, 55.00,
      36.71, 36.71, 73.42, 36.71, 36.71, 36.71, 73.42, 46.25,
      55.00, 55.00, 110.0, 55.00, 55.00, 55.00, 110.0, 61.74,
      41.20, 41.20, 82.41, 41.20, 41.20, 41.20, 82.41, 49.00
    ];
    const arpSeq = [
      369.99, 0, 440.0, 554.37, 0, 440.0, 369.99, 0,
      293.66, 0, 369.99, 440.0, 0, 587.33, 440.0, 0,
      440.0,  0, 554.37, 659.25, 0, 554.37, 440.0, 0,
      329.63, 0, 415.30, 493.88, 0, 659.25, 554.37, 0
    ];

    // Punchy synthwave kick
    if (step % 4 === 0) {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(145, t);
      osc.frequency.exponentialRampToValueAtTime(34, t + 0.13);
      g.gain.setValueAtTime(0.68, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      osc.connect(g);
      g.connect(this.musicBus);
      osc.start(t);
      osc.stop(t + 0.16);
    }

    // Gated dark snare on beats 2 & 4
    if (step % 8 === 4) {
      this._noise(t, 0.14, 'bandpass', 1500, 0.28, this.musicBus);
    }

    // Crisp offbeat hat
    if (step % 2 === 1) {
      this._noise(t, 0.03, 'highpass', 7200, 0.08, this.musicBus);
    }

    // Rolling analog bass pulse
    const bf = bassSeq[step];
    const osc = this.ctx.createOscillator();
    const flt = this.ctx.createBiquadFilter();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(bf, t);
    flt.type = 'lowpass';
    flt.Q.value = 4.2;
    const cutoff = 380 + this.progress * 380 + this.turboLevel * 550;
    flt.frequency.setValueAtTime(cutoff, t);
    flt.frequency.exponentialRampToValueAtTime(110, t + dur * 0.92);
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.94);
    osc.connect(flt);
    flt.connect(g);
    g.connect(this.musicBus);
    osc.start(t);
    osc.stop(t + dur);

    // Shimmering cyber arp
    const af = arpSeq[step];
    if (af) {
      const aOsc = this.ctx.createOscillator();
      const aG = this.ctx.createGain();
      aOsc.type = 'triangle';
      aOsc.frequency.setValueAtTime(af, t);
      aG.gain.setValueAtTime(0.095, t);
      aG.gain.exponentialRampToValueAtTime(0.001, t + dur * 1.8);
      aOsc.connect(aG);
      aG.connect(this.musicBus);
      aOsc.start(t);
      aOsc.stop(t + dur * 1.9);
    }
  }

  _noise(t, dur, type, freq, vol, bus) {
    const sr = this.ctx.sampleRate;
    const len = Math.max(1, Math.floor(sr * dur));
    const buf = this.ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const flt = this.ctx.createBiquadFilter();
    flt.type = type;
    flt.frequency.setValueAtTime(freq, t);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(flt);
    flt.connect(g);
    g.connect(bus);
    src.start(t);
  }

  sfxLaneSwitch(dir) {
    if (!this.unlocked || !this.ctx) return;
    const t = this.ctx.currentTime;
    const sr = this.ctx.sampleRate;
    const len = Math.floor(sr * 0.13);
    const buf = this.ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const flt = this.ctx.createBiquadFilter();
    flt.type = 'bandpass';
    flt.Q.value = 2.4;
    flt.frequency.setValueAtTime(dir > 0 ? 520 : 1200, t);
    flt.frequency.exponentialRampToValueAtTime(dir > 0 ? 1500 : 480, t + 0.12);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.24, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
    src.connect(flt);
    flt.connect(g);
    g.connect(this.sfxBus);
    src.start(t);
  }

  sfxJump() {
    if (!this.unlocked || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, t);
    osc.frequency.exponentialRampToValueAtTime(640, t + 0.14);
    g.gain.setValueAtTime(0.22, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(g);
    g.connect(this.sfxBus);
    osc.start(t);
    osc.stop(t + 0.16);
  }

  sfxSlide() {
    if (!this.unlocked || !this.ctx) return;
    const t = this.ctx.currentTime;
    this._noise(t, 0.22, 'bandpass', 720, 0.24, this.sfxBus);
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(240, t);
    osc.frequency.exponentialRampToValueAtTime(85, t + 0.18);
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.19);
    osc.connect(g);
    g.connect(this.sfxBus);
    osc.start(t);
    osc.stop(t + 0.2);
  }

  sfxGpuChime(combo = 0) {
    if (!this.unlocked || !this.ctx) return;
    const t = this.ctx.currentTime;
    const base = 740 * Math.pow(1.05946, Math.min(8, combo));
    [1, 1.5, 2].forEach((mult, idx) => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = idx === 0 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(base * mult, t + idx * 0.025);
      g.gain.setValueAtTime(idx === 0 ? 0.2 : 0.11, t + idx * 0.025);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.22 + idx * 0.03);
      osc.connect(g);
      g.connect(this.sfxBus);
      osc.start(t + idx * 0.025);
      osc.stop(t + 0.26 + idx * 0.03);
    });
  }

  sfxTurboRoar() {
    if (!this.unlocked || !this.ctx) return;
    const t = this.ctx.currentTime;
    // Deep turbine noise sweep + sub roar
    const sr = this.ctx.sampleRate;
    const len = Math.floor(sr * 0.85);
    const buf = this.ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const flt = this.ctx.createBiquadFilter();
    flt.type = 'bandpass';
    flt.Q.value = 1.8;
    flt.frequency.setValueAtTime(220, t);
    flt.frequency.exponentialRampToValueAtTime(2400, t + 0.35);
    flt.frequency.exponentialRampToValueAtTime(520, t + 0.82);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.01, t);
    g.gain.linearRampToValueAtTime(0.45, t + 0.12);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.84);
    src.connect(flt);
    flt.connect(g);
    g.connect(this.sfxBus);
    src.start(t);

    const sub = this.ctx.createOscillator();
    const sg = this.ctx.createGain();
    sub.type = 'sawtooth';
    sub.frequency.setValueAtTime(70, t);
    sub.frequency.exponentialRampToValueAtTime(220, t + 0.35);
    sub.frequency.exponentialRampToValueAtTime(95, t + 0.78);
    sg.gain.setValueAtTime(0.24, t);
    sg.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    sub.connect(sg);
    sg.connect(this.sfxBus);
    sub.start(t);
    sub.stop(t + 0.82);
  }

  sfxGoldOrb() {
    if (!this.unlocked || !this.ctx) return;
    const t = this.ctx.currentTime;
    [554.37, 659.25, 880, 1108.73].forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, t + i * 0.045);
      g.gain.setValueAtTime(0.22, t + i * 0.045);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.045 + 0.45);
      osc.connect(g);
      g.connect(this.sfxBus);
      osc.start(t + i * 0.045);
      osc.stop(t + i * 0.045 + 0.46);
    });
  }

  sfxShatterBoom() {
    if (!this.unlocked || !this.ctx) return;
    const t = this.ctx.currentTime;
    // Heavy sub boom
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(130, t);
    osc.frequency.exponentialRampToValueAtTime(28, t + 0.28);
    g.gain.setValueAtTime(0.65, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    osc.connect(g);
    g.connect(this.sfxBus);
    osc.start(t);
    osc.stop(t + 0.32);

    // Metallic glass shatter crackle
    this._noise(t, 0.26, 'highpass', 2200, 0.36, this.sfxBus);
    [1320, 1760, 2349].forEach((f, i) => {
      const sh = this.ctx.createOscillator();
      const sg = this.ctx.createGain();
      sh.type = 'triangle';
      sh.frequency.setValueAtTime(f, t + i * 0.02);
      sg.gain.setValueAtTime(0.11, t + i * 0.02);
      sg.gain.exponentialRampToValueAtTime(0.001, t + 0.16 + i * 0.03);
      sh.connect(sg);
      sg.connect(this.sfxBus);
      sh.start(t + i * 0.02);
      sh.stop(t + 0.2 + i * 0.03);
    });
  }

  sfxHit() {
    if (!this.unlocked || !this.ctx) return;
    const t = this.ctx.currentTime;
    this._noise(t, 0.25, 'lowpass', 900, 0.48, this.sfxBus);
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, t);
    osc.frequency.exponentialRampToValueAtTime(38, t + 0.28);
    g.gain.setValueAtTime(0.36, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    osc.connect(g);
    g.connect(this.sfxBus);
    osc.start(t);
    osc.stop(t + 0.32);
  }

  sfxVictory() {
    if (!this.unlocked || !this.ctx) return;
    const t = this.ctx.currentTime;
    // Wide triumphant synthwave chord swell
    [293.66, 369.99, 440.0, 587.33, 739.99, 880.0].forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = i % 2 === 0 ? 'sawtooth' : 'triangle';
      const flt = this.ctx.createBiquadFilter();
      flt.type = 'lowpass';
      flt.frequency.setValueAtTime(400, t);
      flt.frequency.exponentialRampToValueAtTime(3200, t + 0.55);
      osc.frequency.setValueAtTime(f, t + i * 0.05);
      g.gain.setValueAtTime(0.001, t + i * 0.05);
      g.gain.linearRampToValueAtTime(0.11, t + i * 0.05 + 0.14);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.65);
      osc.connect(flt);
      flt.connect(g);
      g.connect(this.sfxBus);
      osc.start(t + i * 0.05);
      osc.stop(t + 1.7);
    });
  }
}

function createRoadTextures() {
  const size = 512;
  const colC = document.createElement('canvas');
  colC.width = colC.height = size;
  const c = colC.getContext('2d');

  // Glossy obsidian carbon-silicon base
  c.fillStyle = '#070b0f';
  c.fillRect(0, 0, size, size);

  // Subtle metallic micro-grid & circuit traces
  c.strokeStyle = 'rgba(118, 185, 0, 0.14)';
  c.lineWidth = 2;
  for (let y = 0; y < size; y += 64) {
    c.beginPath();
    c.moveTo(0, y);
    c.lineTo(size, y);
    c.stroke();
  }
  c.strokeStyle = 'rgba(0, 240, 255, 0.12)';
  for (let x = 24; x < size; x += 48) {
    c.beginPath();
    c.moveTo(x, 0);
    c.lineTo(x, size);
    c.stroke();
  }

  // PCB circuit nodes inside lanes
  c.strokeStyle = 'rgba(118, 185, 0, 0.28)';
  c.lineWidth = 2.5;
  [88, 256, 424].forEach((lx) => {
    c.beginPath();
    c.moveTo(lx - 26, 0);
    c.lineTo(lx - 26, 180);
    c.lineTo(lx - 10, 210);
    c.lineTo(lx - 10, 512);
    c.moveTo(lx + 26, 512);
    c.lineTo(lx + 26, 310);
    c.lineTo(lx + 10, 280);
    c.lineTo(lx + 10, 0);
    c.stroke();

    c.fillStyle = 'rgba(166, 255, 0, 0.55)';
    c.fillRect(lx - 14, 206, 8, 8);
    c.fillRect(lx + 6, 276, 8, 8);
  });

  // Emissive map for crisp glowing lane dividers & outer curbs
  const emC = document.createElement('canvas');
  emC.width = emC.height = size;
  const e = emC.getContext('2d');
  e.fillStyle = '#000000';
  e.fillRect(0, 0, size, size);

  // Glowing outer highway edges
  e.fillStyle = '#76B900';
  e.fillRect(6, 0, 10, size);
  e.fillRect(size - 16, 0, 10, size);

  // Crisp 3-lane dashed laser dividers at x = 1/3 & 2/3
  const d1 = Math.round(size * 0.345);
  const d2 = Math.round(size * 0.655);
  e.fillStyle = '#9eff00';
  for (let y = 16; y < size; y += 128) {
    e.fillRect(d1 - 3, y, 6, 72);
    e.fillRect(d2 - 3, y, 6, 72);
  }

  // Subtle glowing horizontal tensor ticks
  e.fillStyle = 'rgba(0, 240, 255, 0.25)';
  for (let y = 0; y < size; y += 256) {
    e.fillRect(24, y, size - 48, 3);
  }

  const map = new THREE.CanvasTexture(colC);
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.repeat.set(1, 22);
  map.anisotropy = 8;

  const emMap = new THREE.CanvasTexture(emC);
  emMap.wrapS = emMap.wrapT = THREE.RepeatWrapping;
  emMap.repeat.set(1, 22);
  emMap.anisotropy = 8;

  return { map, emMap };
}

// Dual Glowing Neon-Green Motion Trails from Sneakers
function createSneakerTrail() {
  const segs = 18;
  const positions = new Float32Array(segs * 2 * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const indices = [];
  for (let i = 0; i < segs - 1; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    indices.push(a, b, c, b, d, c);
  }
  geo.setIndex(indices);
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(0.6, 2.1, 0.1),
    transparent: true,
    opacity: 0.52,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  scene.add(mesh);

  const history = [];
  for (let i = 0; i < segs; i++) history.push(new THREE.Vector3(0, 0.1, 0));
  return { mesh, geo, mat, history, segs };
}

const leftTrail = createSneakerTrail();
const rightTrail = createSneakerTrail();

const _tmpVec = new THREE.Vector3();
function updateSneakerTrail(trail, shoeObj, dt, speed, isGold, isTurbo) {
  shoeObj.getWorldPosition(_tmpVec);
  _tmpVec.y = Math.max(0.08, _tmpVec.y - 0.04);

  // Shift points backward along +Z at road speed so trail streams cleanly behind Jensen
  for (let i = trail.segs - 1; i > 0; i--) {
    trail.history[i].copy(trail.history[i - 1]);
    trail.history[i].z += speed * dt;
  }
  trail.history[0].copy(_tmpVec);

  const pos = trail.geo.attributes.position.array;
  const halfW = isTurbo ? 0.15 : 0.095;
  for (let i = 0; i < trail.segs; i++) {
    const p = trail.history[i];
    const taper = 1 - i / (trail.segs - 1);
    const w = halfW * taper;
    const idx = i * 6;
    pos[idx]     = p.x - w;
    pos[idx + 1] = p.y;
    pos[idx + 2] = p.z;
    pos[idx + 3] = p.x + w;
    pos[idx + 4] = p.y;
    pos[idx + 5] = p.z;
  }
  trail.geo.attributes.position.needsUpdate = true;

  if (isGold) trail.mat.color.setRGB(2.4, 1.85, 0.3);
  else if (isTurbo) trail.mat.color.setRGB(0.4, 2.5, 1.6);
  else trail.mat.color.setRGB(0.6, 2.1, 0.1);
}

function clearDynamicEntities() {
  for (const o of obstacles) scene.remove(o.mesh);
  for (const c of collectibles) scene.remove(c.mesh);
  for (const d of debris) scene.remove(d.mesh);
  for (const s of sparks) scene.remove(s.mesh);
  for (const f of fireworks) scene.remove(f.mesh);
  obstacles.length = 0;
  collectibles.length = 0;
  debris.length = 0;
  sparks.length = 0;
  fireworks.length = 0;
}

function updateLifeUI() {
  elLifeBars.forEach((bar, i) => {
    bar.classList.toggle('lost', i >= lives);
    bar.classList.toggle('gold', goldTimer > 0 && i < lives);
  });
}

function pulseMcap(delta) {
  mcap = Math.max(1900, mcap + delta);
  elMcapVal.classList.remove('pulse', 'dip');
  void elMcapVal.offsetWidth;
  elMcapVal.classList.add(delta >= 0 ? 'pulse' : 'dip');
  setTimeout(() => elMcapVal.classList.remove('pulse', 'dip'), 140);
}

function updateHudUI() {
  mcapDisplay += (mcap - mcapDisplay) * 0.18;
  elMcapVal.textContent = `$${(mcapDisplay / 1000).toFixed(2)}T`;
  const pct = ((mcapDisplay - START_MCAP) / START_MCAP) * 100;
  elMcapPct.textContent = `${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%`;
  elMcapPct.style.color = pct >= 0 ? '#a6ff00' : '#ff4d66';

  const prog = state === 'attract'
    ? 0
    : Math.min(1, elapsed / RUN_DURATION);
  elDayFill.style.width = `${(prog * 100).toFixed(1)}%`;
  const nov = 12 + Math.min(11, Math.floor(prog * 11));
  elDayNow.textContent = `NOV ${nov}`;
}

function resetRun(nextState) {
  clearDynamicEntities();
  state = nextState;
  elapsed = 0;
  mcap = START_MCAP;
  mcapDisplay = START_MCAP;
  lives = 3;
  gpusCollected = 0;
  gpuCombo = 0;
  comboTimer = 0;
  targetLane = 1;
  playerX = 0;
  playerY = 0;
  playerVY = 0;
  slideTimer = 0;

// Solvable High-Speed 3-Lane Pattern Director
function spawnWaveRow(z) {
  rowCount++;
  const prog = Math.min(1, elapsed / RUN_DURATION);
  const openLane = Math.floor(Math.random() * 3);
  const otherLanes = [0, 1, 2].filter(l => l !== openLane);

  // Guarantee early laser gates so player immediately sees pillars, low jump lasers & high slide lasers!
  let pattern = Math.random();
  if (rowCount === 1) pattern = 0.5;       // Row 1: Jumpable Low Red Laser Gate + GPU arc
  else if (rowCount === 2) pattern = 0.85; // Row 2: Slide-Under High Red Laser Gate + low GPU

  if (pattern < 0.36) {
    // Two crimson "-40%" Candlestick Pillars + 1 open lane with GPUs (or Turbo Pad!)
    spawnPillar(otherLanes[0], z);
    if (prog > 0.15 || Math.random() < 0.7) spawnPillar(otherLanes[1], z);
    if (rowCount % 4 === 0) {
      spawnTurboPad(openLane, z);
    } else {
      for (let k = 0; k < 3; k++) spawnGpuChip(openLane, z - 5 + k * 5.2);
    }
  } else if (pattern < 0.68) {
    // Low Jumpable Laser Hurdle + Crimson Pillar + Open Lane
    const lowLane = otherLanes[0];
    spawnLaserLow(lowLane, z);
    // Arc of emerald GPU chips over the jump hurdle!
    spawnGpuChip(lowLane, z, 3.0);
    spawnPillar(otherLanes[1], z);
    if (Math.random() < 0.45) spawnGpuChip(openLane, z);
  } else {
    // High Slide-Under Laser Gate + Crimson Pillar!
    const highLane = otherLanes[0];
    spawnLaserHigh(highLane, z);
    spawnGpuChip(highLane, z, 0.75); // Low GPU chip rewards sliding under!
    spawnPillar(otherLanes[1], z);
    if (Math.random() < 0.35) spawnTurboPad(openLane, z - 6);
  }

  // Guaranteed Rare Golden Leather Jacket Orb around Day 4 & Day 8!
  if ((elapsed > 6.5 && goldSpawnedCount === 0) || (elapsed > 16.0 && goldSpawnedCount === 1)) {
    goldSpawnedCount++;
    spawnGoldOrb(openLane, z - 14);
  }
}

function switchLane(dir) {
  if (state !== 'playing') return;
  const next = Math.max(0, Math.min(2, targetLane + dir));
  if (next !== targetLane) {
    targetLane = next;
    camBank += dir * -0.14; // Snappy banking tilt!
    audio.sfxLaneSwitch(dir);
  }
}

function triggerJump() {
  if (state !== 'playing') return;
  if (playerY <= 0.05) {
    playerVY = JUMP_VEL;
    slideTimer = 0;
    audio.sfxJump();
  }
}

function triggerSlide() {
  if (state !== 'playing') return;
  if (playerY > 0.15) {
    // Fast-slam downward from mid-air directly into slide!
    playerVY = -26;
  }
  slideTimer = 0.68;
  audio.sfxSlide();
}

window.addEventListener('keydown', (e) => {
  const c = e.code;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(c)) e.preventDefault();

  if (c === 'KeyM') {
    audio.unlock();
    audio.toggleMute();
    return;
  }

  if (state === 'attract' && (c === 'Space' || c === 'Enter')) {
    startGame();
    return;
  }
  if ((state === 'victory' || state === 'gameover') && (c === 'Space' || c === 'Enter')) {
    if (endLockTimer <= 0) startGame();
    return;
  }

  if (e.repeat) return;
  if (c === 'ArrowLeft' || c === 'KeyA') switchLane(-1);
  else if (c === 'ArrowRight' || c === 'KeyD') switchLane(1);
  else if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') triggerJump();
  else if (c === 'ArrowDown' || c === 'KeyS') triggerSlide();
});

// Touch Swipe Controls for Mobile
let swipeStartX = 0;
let swipeStartY = 0;
let swipeActive = false;

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (state !== 'playing') return;
  audio.unlock();
  swipeActive = true;
  swipeStartX = e.clientX;
  swipeStartY = e.clientY;
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!swipeActive || state !== 'playing') return;
  const dx = e.clientX - swipeStartX;
  const dy = e.clientY - swipeStartY;
  if (Math.abs(dx) > 28 || Math.abs(dy) > 28) {
    if (Math.abs(dx) > Math.abs(dy)) {
      switchLane(dx > 0 ? 1 : -1);
    } else {
      if (dy < 0) triggerJump();
      else triggerSlide();
    }
    swipeActive = false;
  }
});

renderer.domElement.addEventListener('pointerup', () => { swipeActive = false; });
renderer.domElement.addEventListener('pointercancel', () => { swipeActive = false; });

elMuteBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  audio.unlock();
  audio.toggleMute();
});
elPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });

elReplayGoBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });

// ============================================================================
// 10. CHARACTER ARTICULATION & MAIN 60FPS LOOP
// ============================================================================
function animateCharacter(dt, speed) {
  const isSliding = slideTimer > 0 && playerY <= 0.1;
  const isAirborne = playerY > 0.12;
  runPhase += dt * (speed * 0.34);

  // Lean body into lane change
  const targetX = LANES[targetLane];
  const lateralVel = (targetX - playerX);
  charBody.rotation.z = THREE.MathUtils.lerp(charBody.rotation.z, -lateralVel * 0.12, Math.min(1, dt * 14));

  if (isSliding) {
    // Dramatic low cyber baseball/power-slide (unmistakable silhouette from behind!)
    charBody.position.y = THREE.MathUtils.lerp(charBody.position.y, -0.78, Math.min(1, dt * 22));
    charBody.rotation.x = THREE.MathUtils.lerp(charBody.rotation.x, -0.78, Math.min(1, dt * 20));
    torsoGroup.rotation.x = THREE.MathUtils.lerp(torsoGroup.rotation.x, -0.18, Math.min(1, dt * 20));
    leftLeg.hip.rotation.x = -1.35;
    leftLeg.knee.rotation.x = 0.15;
    rightLeg.hip.rotation.x = -0.3;
    rightLeg.knee.rotation.x = 1.65;
    leftArm.shoulder.rotation.x = 0.55;
    leftArm.shoulder.rotation.z = -0.55;
    rightArm.shoulder.rotation.x = -0.35;
    rightArm.shoulder.rotation.z = 0.55;
    if (Math.random() < 0.45) {
      spawnSparks(new THREE.Vector3(playerX, 0.12, 0.35), 0x00f0ff, 2);
    }
  } else if (isAirborne) {
    // Athletic mid-air leap pose
    charBody.position.y = THREE.MathUtils.lerp(charBody.position.y, 0.08, Math.min(1, dt * 14));
    charBody.rotation.x = THREE.MathUtils.lerp(charBody.rotation.x, 0, Math.min(1, dt * 16));
    torsoGroup.rotation.x = THREE.MathUtils.lerp(torsoGroup.rotation.x, -0.18, Math.min(1, dt * 12));
    leftArm.shoulder.rotation.z = 0;
    rightArm.shoulder.rotation.z = 0;
    leftLeg.hip.rotation.x = -0.75;
    leftLeg.knee.rotation.x = 1.15;
    rightLeg.hip.rotation.x = 0.45;
    rightLeg.knee.rotation.x = 0.65;
    leftArm.shoulder.rotation.x = -1.2;
    leftArm.elbow.rotation.x = -0.7;
    rightArm.shoulder.rotation.x = 0.85;
    rightArm.elbow.rotation.x = -0.6;
  } else {
    // Smooth athletic sprint stride
    const s = Math.sin(runPhase);
    const c = Math.cos(runPhase);
    charBody.position.y = THREE.MathUtils.lerp(charBody.position.y, Math.abs(c) * 0.12, Math.min(1, dt * 16));
    charBody.rotation.x = THREE.MathUtils.lerp(charBody.rotation.x, 0, Math.min(1, dt * 16));
    torsoGroup.rotation.x = THREE.MathUtils.lerp(torsoGroup.rotation.x, -0.22 - (turboTimer > 0 ? 0.14 : 0), Math.min(1, dt * 12));
    leftArm.shoulder.rotation.z = 0;
    rightArm.shoulder.rotation.z = 0;

    leftLeg.hip.rotation.x = s * 0.95;
    leftLeg.knee.rotation.x = Math.max(0, -c * 1.15);
    rightLeg.hip.rotation.x = -s * 0.95;
    rightLeg.knee.rotation.x = Math.max(0, c * 1.15);

    leftArm.shoulder.rotation.x = -s * 0.85;
    leftArm.elbow.rotation.x = -0.85 - Math.max(0, -s * 0.35);
    rightArm.shoulder.rotation.x = s * 0.85;
    rightArm.elbow.rotation.x = -0.85 - Math.max(0, s * 0.35);
  }

  // Invulnerability flicker
  playerRoot.visible = !(invulnTimer > 0 && Math.floor(worldTime * 22) % 2 === 0);

  // Golden Leather Jacket Aura shell animation
  goldAuraGroup.visible = goldTimer > 0;
  if (goldTimer > 0) {
    goldHalo.rotation.z += dt * 4.5;
    goldHalo.position.y = 1.15 + Math.sin(worldTime * 8) * 0.18;
  }
}

function update(dt) {
  worldTime += dt;
  if (endLockTimer > 0) endLockTimer = Math.max(0, endLockTimer - dt);
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) gpuCombo = 0;
  }
  if (slideTimer > 0) slideTimer = Math.max(0, slideTimer - dt);
  if (invulnTimer > 0) invulnTimer = Math.max(0, invulnTimer - dt);
  if (hitFlashTimer > 0) hitFlashTimer = Math.max(0, hitFlashTimer - dt);
  if (turboTimer > 0) turboTimer = Math.max(0, turboTimer - dt);
  if (goldTimer > 0) {
    goldTimer = Math.max(0, goldTimer - dt);
    if (goldTimer === 0) updateLifeUI();
  }

  const prog = state === 'attract' ? 0.25 : Math.min(1, elapsed / RUN_DURATION);
  let speed = BASE_SPEED + prog * (MAX_SPEED - BASE_SPEED) + (turboTimer > 0 ? TURBO_BONUS_SPEED : 0);
  if (state === 'attract') speed = 36;
  if (state === 'victory') speed = 12;
  if (state === 'gameover') speed = 0;

  audio.progress = prog;
  audio.turboLevel = turboTimer > 0 ? 1 : 0;

  // Vignette state (outer edge only — center 100% clear)
  elVignette.className = hitFlashTimer > 0 ? 'hit' : (goldTimer > 0 ? 'gold' : (turboTimer > 0 ? 'turbo' : ''));

  // Dynamic under-player lighting color
  if (goldTimer > 0) playerLight.color.setHex(0xffd24c);
  else if (turboTimer > 0) playerLight.color.setHex(0x00ffaa);
  else playerLight.color.setHex(0x76B900);

  // Scroll mirror-reflective highway texture seamlessly
  const scrollDist = speed * dt;
  roadTex.map.offset.y = (roadTex.map.offset.y + scrollDist * 0.068) % 1;
  roadTex.emMap.offset.y = roadTex.map.offset.y;

  // Recycle overhead arches, skyscrapers & animated 3D stock holograms
  for (const a of arches) {
    a.position.z += scrollDist;
    if (a.position.z > 18) a.position.z -= 280;
  }
  for (const t of towers) {
    t.group.position.z += scrollDist;
    if (t.group.position.z > 24) t.group.position.z -= 276;
  }
  for (const h of holograms) {
    h.group.position.z += scrollDist;
    if (h.group.position.z > 20) h.group.position.z -= 260;
    for (const b of h.bars) {
      b.position.y = b.userData.baseY + Math.sin(worldTime * 3.2 + b.userData.phase) * 0.45;
    }
  }

  // Peripheral Warp Speed Lines (visible during Turbo Boost or high-speed sprint)
  const targetWarpOpacity = turboTimer > 0 ? 0.72 : (state === 'playing' && prog > 0.65 ? 0.22 : 0);
  warpMat.opacity += (targetWarpOpacity - warpMat.opacity) * Math.min(1, dt * 8);
  if (warpMat.opacity > 0.01) {
    for (const wl of warpLines) {
      wl.position.z += (speed * 2.4) * dt;
      if (wl.position.z > 12) wl.position.z = -90 - Math.random() * 20;
    }
  }

  // Player Lateral & Vertical Physics
  if (state === 'attract') {
    // Smooth scenic lane weaving in attract mode
    const waveLane = Math.sin(worldTime * 0.55) > 0.5 ? 2 : (Math.sin(worldTime * 0.55) < -0.5 ? 0 : 1);
    targetLane = waveLane;
  }

  const desiredX = LANES[targetLane];
  playerX += (desiredX - playerX) * Math.min(1, dt * 15);
  playerVY += GRAVITY * dt;
  playerY += playerVY * dt;
  if (playerY < 0) {
    playerY = 0;
    playerVY = 0;
  }

  // Ramp lift during HQ Portal finale
  let rampLift = 0;
  if (state === 'finale' && hqPortal.visible) {
    const dz = hqPortal.position.z;
    if (dz > -18 && dz < 4) {
      rampLift = Math.max(0, (1 - Math.abs(dz) / 18) * 2.8);
    }
  }

  playerRoot.position.set(playerX, playerY + rampLift, 0);
  playerLight.position.set(playerX, playerY + 2.2 + rampLift, 1.0);
  animateCharacter(dt, speed);
  updateSneakerTrail(leftTrail, leftLeg.shoe, dt, speed, goldTimer > 0, turboTimer > 0);
  updateSneakerTrail(rightTrail, rightLeg.shoe, dt, speed, goldTimer > 0, turboTimer > 0);

  // ================= ACTIVE PLAY LOOP =================
  if (state === 'playing') {
    elapsed += dt;
    // Steady comeback momentum
    mcap += (16 + prog * 18 + (turboTimer > 0 ? 28 : 0)) * dt;

    if (elapsed >= RUN_DURATION) {
      triggerFinale();
    } else if (elapsed < RUN_DURATION - 1.8) {
      distToNextRow -= scrollDist;
      if (distToNextRow <= 0) {
        spawnWaveRow(-138);
        distToNextRow = Math.max(25, 36 - prog * 9);
      }
    }

    // Move & Collide Obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const ob = obstacles[i];
      ob.mesh.position.z += scrollDist;
      const z = ob.mesh.position.z;

      if (!ob.hit && Math.abs(z) < 1.15 && Math.abs(ob.mesh.position.x - playerX) < 1.12) {
        let collided = false;
        if (ob.type === 'pillar') collided = true;
        else if (ob.type === 'laserLow') collided = playerY < 1.22;
        else if (ob.type === 'laserHigh') collided = !(slideTimer > 0 && playerY <= 0.15);

        if (collided) {
          ob.hit = true;
          if (goldTimer > 0) {
            // GOLDEN LEATHER JACKET SMASH WITH SHATTER PHYSICS!
            spawnShatter(ob.mesh.position);
            scene.remove(ob.mesh);
            obstacles.splice(i, 1);
            pulseMcap(120);
            camShake = 0.55;
            camFovKick = 8;
            audio.sfxShatterBoom();
            continue;
          } else if (invulnTimer <= 0) {
            lives--;
            invulnTimer = 1.25;
            hitFlashTimer = 0.28;
            camShake = 0.85;
            pulseMcap(-180);
            updateLifeUI();
            audio.sfxHit();
            spawnSparks(new THREE.Vector3(playerX, 1.3, 0), 0xff2947, 16);
            if (lives <= 0) {
              triggerGameOver();
              return;
            }
          }
        }
      }

      // Smoothly shrink passed obstacles well before the camera near plane (z = 8.4) so pillars NEVER clip the lens!
      if (z > 2.2) {
        const shrink = Math.max(0.001, 1 - (z - 2.2) / 2.6);
        ob.mesh.scale.setScalar(shrink);
      }
      if (z > 4.9) {
        scene.remove(ob.mesh);
        obstacles.splice(i, 1);
      }
    }

    // Move & Collect 3D Collectibles
    for (let i = collectibles.length - 1; i >= 0; i--) {
      const c = collectibles[i];
      c.mesh.position.z += scrollDist;
      const z = c.mesh.position.z;

      if (c.type === 'gpu') {
        c.mesh.rotation.y += dt * 3.4;
        c.mesh.position.y = c.y + Math.sin(worldTime * 5 + c.phase) * 0.16;
      } else if (c.type === 'gold') {
        c.mesh.rotation.y += dt * 2.8;
        c.mesh.children[1].rotation.x += dt * 3.6;
        c.mesh.position.y = c.y + Math.sin(worldTime * 4 + c.phase) * 0.22;
      }

      const zHit = c.type === 'turbo' ? 2.6 : 1.35;
      const yHit = c.type === 'turbo' ? (playerY < 0.7) : (Math.abs((playerY + 1.1) - c.mesh.position.y) < 1.35);

      if (Math.abs(z) < zHit && Math.abs(c.mesh.position.x - playerX) < 1.25 && yHit) {
        if (c.type === 'gpu') {
          gpusCollected++;
          gpuCombo++;
          comboTimer = 1.3;
          pulseMcap(100);
          camFovKick = Math.max(camFovKick, 3.8);
          spawnSparks(c.mesh.position, 0xa6ff00, 14);
          audio.sfxGpuChime(gpuCombo);
        } else if (c.type === 'turbo') {
          turboTimer = 2.6;
          pulseMcap(200);
          camShake = 0.35;
          camFovKick = 14;
          spawnSparks(new THREE.Vector3(playerX, 0.5, 0), 0x00ffaa, 22);
          audio.sfxTurboRoar();
        } else if (c.type === 'gold') {
          goldTimer = 4.0;
          pulseMcap(150);
          camFovKick = 9;
          updateLifeUI();
          spawnSparks(c.mesh.position, 0xffd24c, 26);
          audio.sfxGoldOrb();
        }
        scene.remove(c.mesh);
        collectibles.splice(i, 1);
        continue;
      }

      if (z > 14) {
        scene.remove(c.mesh);
        collectibles.splice(i, 1);
      }
    }
  }

  // ================= DAY 11 NVIDIA HQ PORTAL FINALE =================
  if (state === 'finale' || state === 'victory') {
    hqPortal.userData.ring1.rotation.z += dt * 1.4;
    hqPortal.userData.ring2.rotation.z -= dt * 2.1;

    if (state === 'finale') {
      hqPortal.position.z += scrollDist;
      finaleTimer += dt;

      if (Math.random() < dt * 4.5) {
        spawnFireworkBurst(
          (Math.random() - 0.5) * 26,
          9 + Math.random() * 14,
          hqPortal.position.z - 8 + (Math.random() - 0.5) * 14
        );
      }

      if (hqPortal.position.z >= -4) {
        spawnFireworkBurst(-7, 13, -12);
        spawnFireworkBurst(7, 15, -14);
        spawnFireworkBurst(0, 17, -10);
        showVictoryCard();
      }
    } else if (Math.random() < dt * 2.2) {
      spawnFireworkBurst((Math.random() - 0.5) * 24, 10 + Math.random() * 12, -16 - Math.random() * 10);
    }
  }

  // ================= SHATTER DEBRIS, SPARKS & FIREWORKS =================
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.vy -= 36 * dt;
    d.mesh.position.x += d.vx * dt;
    d.mesh.position.y += d.vy * dt;
    d.mesh.position.z += (d.vz + speed * 0.45) * dt;
    if (d.mesh.position.y < 0.25) {
      d.mesh.position.y = 0.25;
      d.vy = Math.abs(d.vy) * 0.45;
    }
    d.mesh.rotation.x += d.rx * dt;
    d.mesh.rotation.y += d.ry * dt;
    d.life -= dt;
    if (d.life <= 0) {
      scene.remove(d.mesh);
      debris.splice(i, 1);
    }
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.vy -= 24 * dt;
    s.mesh.position.x += s.vx * dt;
    s.mesh.position.y += s.vy * dt;
    s.mesh.position.z += s.vz * dt;
    s.life -= dt;
    s.mesh.scale.setScalar(Math.max(0.01, s.life / s.maxLife));
    if (s.life <= 0) {
      scene.remove(s.mesh);
      sparks.splice(i, 1);
    }
  }

  for (let i = fireworks.length - 1; i >= 0; i--) {
    const f = fireworks[i];
    f.vy -= 9.5 * dt;
    f.mesh.position.x += f.vx * dt;
    f.mesh.position.y += f.vy * dt;
    f.mesh.position.z += f.vz * dt;
    f.life -= dt;
    f.mesh.scale.setScalar(Math.max(0.01, f.life));
    if (f.life <= 0) {
      scene.remove(f.mesh);
      fireworks.splice(i, 1);
    }
  }

  // ================= 3RD-PERSON CHASE CAMERA WITH BANKING & FOV PUNCH =================
  camBank *= Math.pow(0.002, dt);
  camFovKick *= Math.pow(0.01, dt);
  camShake = Math.max(0, camShake - dt * 2.8);

  if (state === 'attract') {
    // Sleek cinematic orbital glide behind Jensen down the highway at Frame 0!
    const orbitX = playerX * 0.55 + Math.sin(worldTime * 0.52) * 3.8;
    const orbitY = 3.9 + Math.sin(worldTime * 0.7) * 0.55;
    const orbitZ = 7.4 + Math.cos(worldTime * 0.52) * 1.4;
    camera.position.lerp(new THREE.Vector3(orbitX, orbitY, orbitZ), Math.min(1, dt * 5));
    camera.lookAt(playerX * 0.4, 2.0, -18);
    camera.rotation.z = -Math.sin(worldTime * 0.52) * 0.04;
    camera.fov += (60 - camera.fov) * Math.min(1, dt * 6);
    camera.updateProjectionMatrix();
  } else if (state === 'victory') {
    const vx = Math.sin(worldTime * 0.65) * 6.5;
    camera.position.lerp(new THREE.Vector3(vx, 6.2, 12.5), Math.min(1, dt * 2.5));
    camera.lookAt(0, 6.5, -10);
  } else {
    const turboPull = turboTimer > 0 ? 2.4 : 0;
    const targetCamX = playerX * 0.62;
    const targetCamY = 4.45 + playerY * 0.34 - (slideTimer > 0 ? 0.45 : 0) + rampLift * 0.5;
    const targetCamZ = 8.4 + turboPull;

    camera.position.x += (targetCamX - camera.position.x) * Math.min(1, dt * 10);
    camera.position.y += (targetCamY - camera.position.y) * Math.min(1, dt * 10);
    camera.position.z += (targetCamZ - camera.position.z) * Math.min(1, dt * 7);

    const sx = (Math.random() - 0.5) * camShake * 0.75;
    const sy = (Math.random() - 0.5) * camShake * 0.75;
    camera.lookAt(playerX * 0.35 + sx, 2.1 + playerY * 0.22 + sy, -22);
    camera.rotation.z = camBank + (playerX - LANES[targetLane]) * 0.025;

    const desiredFov = (turboTimer > 0 ? 80 : 62) + camFovKick;
    camFov += (desiredFov - camFov) * Math.min(1, dt * 9);
    camera.fov = camFov;
    camera.updateProjectionMatrix();
  }

  updateHudUI();
}

// Responsive Resize
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloomPass.resolution.set(w, h);
});

// Boot live 3D camera motion at Frame 0!
resetRun('attract');

let lastNow = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, Math.max(0.001, (now - lastNow) / 1000));
  lastNow = now;
  update(dt);
  composer.render();
}
requestAnimationFrame(animate);
</script>
</body>
