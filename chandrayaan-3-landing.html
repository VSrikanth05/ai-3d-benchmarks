// ============================================================================
// 1. DETERMINISTIC PRNG, NOISE & MATH UTILITIES
// ============================================================================
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
const smootherstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * t * (t * (t * 6 - 15) + 10);
};

// Fast 2D hash & value noise
function hash2(ix, iy) {
  const n = Math.sin(ix * 127.1 + iy * 311.7) * 43758.5453123;
  return n - Math.floor(n);
}

function noise2D(x, y) {
  const ix = Math.floor(x);
  const iy = Math.floor(y);
  const fx = x - ix;
  const fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy);
  const b = hash2(ix + 1, iy);
  const c = hash2(ix, iy + 1);
  const d = hash2(ix + 1, iy + 1);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}

function fbm2D(x, y, octaves = 5) {
  let sum = 0;
  let amp = 0.5;
  let freq = 1.0;
  let norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += amp * noise2D(x * freq, y * freq);
    norm += amp;
    freq *= 2.03;
    amp *= 0.5;
  }
  return sum / norm;
}

function ridged2D(x, y, octaves = 4) {
  let sum = 0;
  let amp = 0.5;
  let freq = 1.0;
  let norm = 0;
  for (let i = 0; i < octaves; i++) {
    const n = 1.0 - Math.abs(noise2D(x * freq, y * freq) * 2.0 - 1.0);
    sum += amp * n * n;
    norm += amp;
    freq *= 2.1;
    amp *= 0.48;
  }
  return sum / norm;
}

// ============================================================================

// ============================================================================
const renderer = new THREE.WebGLRenderer({

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.08, 600);

// Low-angle South Pole Sun (~11.8 deg elevation, raking from left-front)
const SUN_DIR = new THREE.Vector3(-0.845, 0.205, 0.494).normalize();
// Earth position in upper-left black sky (clearly visible in orbit and final hero shot)
const EARTH_DIR = new THREE.Vector3(-0.55, 0.245, -0.798).normalize();
const EARTH_DIST = 165;

const LUNAR_GRAVITY = 1.62; // m/s^2

// ============================================================================
// 3. PROCEDURAL SPACE HDR ENVIRONMENT MAP (PMREM)
// ============================================================================
function createLunarSpaceEnvironment() {
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();

  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x010102);

  // Blazing hard solar disc in environment map for crisp metallic foil speculars
  const sunSphere = new THREE.Mesh(
    new THREE.SphereGeometry(2.6, 24, 24),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(42, 40.5, 38) })
  );
  sunSphere.position.copy(SUN_DIR).multiplyScalar(40);
  envScene.add(sunSphere);

  // Subtle solar corona halo for wider foil grazing highlights
  const sunGlow = new THREE.Mesh(
    new THREE.SphereGeometry(6.8, 20, 20),
    new THREE.MeshBasicMaterial({
      color: new THREE.Color(4.5, 4.3, 4.0),
      transparent: true,
      opacity: 0.35
    })
  );
  sunGlow.position.copy(SUN_DIR).multiplyScalar(42);
  envScene.add(sunGlow);

  // Small blue Earth light source in reflection map
  const earthEnv = new THREE.Mesh(
    new THREE.SphereGeometry(3.2, 16, 16),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(0.55, 0.95, 1.9) })
  );
  earthEnv.position.copy(EARTH_DIR).multiplyScalar(38);
  envScene.add(earthEnv);

  // Sunlit dusty lunar ground bounce hemisphere (strictly below horizon)
  const groundBounce = new THREE.Mesh(
    new THREE.SphereGeometry(35, 32, 16, 0, Math.PI * 2, Math.PI * 0.52, Math.PI * 0.48),
    new THREE.MeshBasicMaterial({
      color: new THREE.Color(0.24, 0.24, 0.25),
      side: THREE.BackSide
    })
  );
  envScene.add(groundBounce);

  // Brighter sunlit ground patch beneath the lander for realistic bottom-up foil bounce
  const nadirPatch = new THREE.Mesh(
    new THREE.CircleGeometry(20, 24),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(0.45, 0.45, 0.47) })
  );
  nadirPatch.rotation.x = -Math.PI / 2;
  nadirPatch.position.y = -18;
  envScene.add(nadirPatch);

  const rt = pmrem.fromScene(envScene, 0.015);
  pmrem.dispose();
  return rt.texture;
}

scene.environment = createLunarSpaceEnvironment();

// ============================================================================
// 4. LIGHTING (HARD SOUTH-POLE SUN + SUBTLE BOUNCE + EARTHSHINE)

// Dynamic thruster plume ground-illumination light (active during descent only)

// ============================================================================
// 5. PROCEDURAL PBR TEXTURE GENERATORS
// ============================================================================
function heightFieldToNormalCanvas(heightData, size, strength) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;
  const idx = (x, y) => ((y + size) % size) * size + ((x + size) % size);

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const tl = heightData[idx(x - 1, y - 1)];
      const t  = heightData[idx(x,     y - 1)];
      const tr = heightData[idx(x + 1, y - 1)];
      const l  = heightData[idx(x - 1, y    )];
      const r  = heightData[idx(x + 1, y    )];
      const bl = heightData[idx(x - 1, y + 1)];
      const b  = heightData[idx(x,     y + 1)];
      const br = heightData[idx(x + 1, y + 1)];

      const dx = (tr + 2 * r + br - tl - 2 * l - bl) * strength;
      const dy = (bl + 2 * b + br - tl - 2 * t - tr) * strength;
      const dz = 1.0;
      const invLen = 1.0 / Math.hypot(dx, dy, dz);

      const p = (y * size + x) * 4;
      d[p]     = clamp(Math.round((-dx * invLen * 0.5 + 0.5) * 255), 0, 255);
      d[p + 1] = clamp(Math.round((-dy * invLen * 0.5 + 0.5) * 255), 0, 255);
      d[p + 2] = clamp(Math.round(( dz * invLen * 0.5 + 0.5) * 255), 0, 255);
      d[p + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

// Crinkled Kapton Gold / Silver Mylar MLI Foil PBR Texture Set
function createFoilTextureSet(variant = 'gold', seed = 101) {
  const size = 512;
  const rand = mulberry32(seed);
  const height = new Float32Array(size * size);

  // Generate Voronoi-style crumpled polygonal facets for authentic MLI crinkles
  const numPts = variant === 'gold' ? 72 : 96;
  const pts = [];
  for (let i = 0; i < numPts; i++) {
    pts.push({
      x: rand() * size,
      y: rand() * size,
      tiltX: (rand() - 0.5) * 2.2,
      tiltY: (rand() - 0.5) * 2.2,
      base: rand() * 0.45
    });
  }

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      let d1 = 1e9, d2 = 1e9;
      let nearest = pts[0];
      let ndx = 0, ndy = 0;
      for (let i = 0; i < numPts; i++) {
        let dx = x - pts[i].x;
        let dy = y - pts[i].y;
        if (dx > size * 0.5) dx -= size;
        if (dx < -size * 0.5) dx += size;
        if (dy > size * 0.5) dy -= size;
        if (dy < -size * 0.5) dy += size;
        const dist = dx * dx + dy * dy;
        if (dist < d1) {
          d2 = d1;
          d1 = dist;
          nearest = pts[i];
          ndx = dx;
          ndy = dy;
        } else if (dist < d2) {
          d2 = dist;
        }
      }
      const edge = Math.sqrt(d2) - Math.sqrt(d1);
      const crease = smoothstep(0, 7.5, edge);
      const facetPlane = nearest.base + (ndx * nearest.tiltX + ndy * nearest.tiltY) / size * 3.5;

      // Secondary micro-crinkles + quilted thermal blanket seam grid
      const u = x / size;
      const v = y / size;
      const micro = ridged2D(u * 14 + seed, v * 14 + seed, 3) * 0.24;
      const fine = noise2D(u * 42 + 7, v * 42 + 13) * 0.08;

      // Thermal blanket quilt stitch lines (every 1/4 tile)
      const qx = Math.abs(((u * 4) % 1) - 0.5);
      const qy = Math.abs(((v * 4) % 1) - 0.5);
      const quiltPinch = smoothstep(0.46, 0.5, Math.max(qx, qy)) * 0.22;

      height[y * size + x] = (facetPlane * 0.55 + crease * 0.35 + micro + fine) - quiltPinch;
    }
  }

  const normalCanvas = heightFieldToNormalCanvas(height, size, 3.6);
  const albedoCanvas = document.createElement('canvas');
  albedoCanvas.width = size;
  albedoCanvas.height = size;
  const actx = albedoCanvas.getContext('2d');
  const aimg = actx.createImageData(size, size);

  const roughCanvas = document.createElement('canvas');
  roughCanvas.width = size;
  roughCanvas.height = size;
  const rctx = roughCanvas.getContext('2d');
  const rimg = rctx.createImageData(size, size);

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const h = height[y * size + x];
      const u = x / size;
      const v = y / size;
      const tonal = fbm2D(u * 6 + seed * 0.1, v * 6 + 3.1, 3);
      const p = (y * size + x) * 4;

      // Seam tape lines
      const seamX = Math.abs(((u * 4) % 1) - 0.5) > 0.484;
      const seamY = Math.abs(((v * 4) % 1) - 0.5) > 0.484;
      const isSeam = seamX || seamY;

      if (variant === 'gold') {
        // Rich aerospace Kapton gold-amber foil
        const shade = clamp(0.84 + h * 0.22 + (tonal - 0.5) * 0.16, 0.62, 1.15);
        let r = 228 * shade;
        let g = 160 * shade;
        let b = 36 * shade;
        if (isSeam) {
          r *= 0.80;
          g *= 0.72;
          b *= 0.55;
        }
        aimg.data[p]     = clamp(Math.round(r), 0, 255);
        aimg.data[p + 1] = clamp(Math.round(g), 0, 255);
        aimg.data[p + 2] = clamp(Math.round(b), 0, 255);
        aimg.data[p + 3] = 255;

        const roughVal = clamp(0.24 + (1.0 - clamp(h, 0, 1)) * 0.18 + (isSeam ? 0.14 : 0), 0.18, 0.54);
        const rv = Math.round(roughVal * 255);
        rimg.data[p] = rimg.data[p + 1] = rimg.data[p + 2] = rv;
        rimg.data[p + 3] = 255;
      } else {
        // Silver aluminized Mylar MLI blanket
        const shade = clamp(0.86 + h * 0.18 + (tonal - 0.5) * 0.12, 0.68, 1.12);
        let r = 208 * shade;
        let g = 213 * shade;
        let b = 220 * shade;
        if (isSeam) {
          r *= 0.82;
          g *= 0.83;
          b *= 0.85;
        }
        aimg.data[p]     = clamp(Math.round(r), 0, 255);
        aimg.data[p + 1] = clamp(Math.round(g), 0, 255);
        aimg.data[p + 2] = clamp(Math.round(b), 0, 255);
        aimg.data[p + 3] = 255;

        const roughVal = clamp(0.20 + (1.0 - clamp(h, 0, 1)) * 0.16 + (isSeam ? 0.12 : 0), 0.16, 0.48);
        const rv = Math.round(roughVal * 255);
        rimg.data[p] = rimg.data[p + 1] = rimg.data[p + 2] = rv;
        rimg.data[p + 3] = 255;
      }
    }
  }
  actx.putImageData(aimg, 0, 0);
  rctx.putImageData(rimg, 0, 0);

  const map = new THREE.CanvasTexture(albedoCanvas);
  const normalMap = new THREE.CanvasTexture(normalCanvas);
  const roughnessMap = new THREE.CanvasTexture(roughCanvas);
  map.colorSpace = THREE.SRGBColorSpace;
  [map, normalMap, roughnessMap].forEach(t => {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8;
  });
  return { map, normalMap, roughnessMap };
}

// Brushed Aerospace Aluminum Texture Set
function createBrushedAluminumTextures() {
  const size = 256;
  const rand = mulberry32(404);
  const albedo = document.createElement('canvas');
  albedo.width = albedo.height = size;
  const actx = albedo.getContext('2d');
  actx.fillStyle = '#bcc2ca';
  actx.fillRect(0, 0, size, size);

  const rough = document.createElement('canvas');
  rough.width = rough.height = size;
  const rctx = rough.getContext('2d');
  rctx.fillStyle = '#5c5c5c';
  rctx.fillRect(0, 0, size, size);

  const height = new Float32Array(size * size);
  for (let y = 0; y < size; y++) {
    const streak = (rand() - 0.5) * 18;
    const rStreak = Math.round(88 + (rand() - 0.5) * 28);
    actx.fillStyle = `rgb(${188 + streak}, ${193 + streak}, ${201 + streak})`;
    actx.fillRect(0, y, size, 1);
    rctx.fillStyle = `rgb(${rStreak}, ${rStreak}, ${rStreak})`;
    rctx.fillRect(0, y, size, 1);
    for (let x = 0; x < size; x++) {
      height[y * size + x] = streak * 0.02 + (rand() - 0.5) * 0.08;
    }
  }

  const normalCanvas = heightFieldToNormalCanvas(height, size, 1.5);
  const map = new THREE.CanvasTexture(albedo);
  const normalMap = new THREE.CanvasTexture(normalCanvas);
  const roughnessMap = new THREE.CanvasTexture(rough);
  map.colorSpace = THREE.SRGBColorSpace;
  [map, normalMap, roughnessMap].forEach(t => {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8;
  });
  return { map, normalMap, roughnessMap };
}

// Photovoltaic Solar Panel Texture Set
function createSolarPanelTextures(cols = 6, rows = 10) {
  const w = 512, h = 512;
  const albedo = document.createElement('canvas');
  albedo.width = w; albedo.height = h;
  const ctx = albedo.getContext('2d');

  // Deep silicon photovoltaic substrate
  ctx.fillStyle = '#091224';
  ctx.fillRect(0, 0, w, h);

  const rough = document.createElement('canvas');
  rough.width = w; rough.height = h;
  const rctx = rough.getContext('2d');
  rctx.fillStyle = '#383838';
  rctx.fillRect(0, 0, w, h);

  const cellW = w / cols;
  const cellH = h / rows;
  const pad = 4;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c * cellW + pad;
      const y = r * cellH + pad;
      const cw = cellW - pad * 2;
      const ch = cellH - pad * 2;

      // Subtle variation between solar wafers
      const v = hash2(c * 3.1, r * 5.7);
      const grad = ctx.createLinearGradient(x, y, x + cw, y + ch);
      grad.addColorStop(0, `rgb(${12 + v * 8}, ${26 + v * 12}, ${58 + v * 20})`);
      grad.addColorStop(0.5, `rgb(${16 + v * 10}, ${35 + v * 14}, ${74 + v * 22})`);
      grad.addColorStop(1, `rgb(${10 + v * 7}, ${22 + v * 10}, ${52 + v * 18})`);
      ctx.fillStyle = grad;

      // Chamfered silicon cell corners (classic space-grade GaAs / Si cells)
      const cut = 5;
      ctx.beginPath();
      ctx.moveTo(x + cut, y);
      ctx.lineTo(x + cw - cut, y);
      ctx.lineTo(x + cw, y + cut);
      ctx.lineTo(x + cw, y + ch - cut);
      ctx.lineTo(x + cw - cut, y + ch);
      ctx.lineTo(x + cut, y + ch);
      ctx.lineTo(x, y + ch - cut);
      ctx.lineTo(x, y + cut);
      ctx.closePath();
      ctx.fill();

      // Fine horizontal collector fingers
      ctx.strokeStyle = 'rgba(175, 196, 222, 0.24)';
      ctx.lineWidth = 0.7;
      for (let fy = y + 5; fy < y + ch - 3; fy += 5.5) {
        ctx.beginPath();
        ctx.moveTo(x + 2, fy);
        ctx.lineTo(x + cw - 2, fy);
        ctx.stroke();
      }

      // Twin vertical silver busbars
      ctx.fillStyle = 'rgba(215, 224, 236, 0.82)';
      ctx.fillRect(x + cw * 0.28, y, 1.6, ch);
      ctx.fillRect(x + cw * 0.72, y, 1.6, ch);

      // Shiny silver corner interconnect tab
      ctx.fillStyle = '#c8d0dc';
      ctx.fillRect(x + cw * 0.45, y - 2, cw * 0.1, 3);

      // Smooth glass cell surface in roughness map
      rctx.fillStyle = '#262626';
      rctx.fillRect(x, y, cw, ch);
    }
  }

  const map = new THREE.CanvasTexture(albedo);
  const roughnessMap = new THREE.CanvasTexture(rough);
  map.colorSpace = THREE.SRGBColorSpace;
  map.anisotropy = 8;
  roughnessMap.anisotropy = 8;
  return { map, roughnessMap };
}

// Matte Lunar South Pole Regolith Texture Set (Granular Dust & Micro-Pits)
function createRegolithTextures() {
  const size = 1024;
  const rand = mulberry32(9001);
  const height = new Float32Array(size * size);

  // Generate micro-craters baked into normal/albedo tile
  const microCraters = [];
  for (let i = 0; i < 110; i++) {
    microCraters.push({
      x: rand() * size,
      y: rand() * size,
      r: 4 + Math.pow(rand(), 2.2) * 32,
      depth: 0.14 + rand() * 0.28
    });
  }

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size;
      const v = y / size;
      // Seamless periodic approx via folded coordinates
      const n1 = fbm2D(u * 12, v * 12, 4);
      const n2 = noise2D(u * 48 + 11.3, v * 48 + 7.9);
      const grain = (rand() - 0.5) * 0.14;
      height[y * size + x] = n1 * 0.55 + n2 * 0.25 + grain;
    }
  }

  // Stamp micro-craters with raised rims
  for (const c of microCraters) {
    const rOuter = Math.ceil(c.r * 1.45);
    const cx = Math.floor(c.x);
    const cy = Math.floor(c.y);
    for (let dy = -rOuter; dy <= rOuter; dy++) {
      for (let dx = -rOuter; dx <= rOuter; dx++) {
        const dist = Math.hypot(dx, dy) / c.r;
        if (dist > 1.45) continue;
        let dh = 0;
        if (dist < 1.0) {
          dh = -c.depth * (1.0 - dist * dist);
        } else {
          const t = (dist - 1.0) / 0.45;
          dh = c.depth * 0.24 * Math.sin((1.0 - t) * Math.PI);
        }
        const px = (cx + dx + size) % size;
        const py = (cy + dy + size) % size;
        height[py * size + px] += dh;
      }
    }
  }

  const normalCanvas = heightFieldToNormalCanvas(height, size, 3.2);
  const albedoCanvas = document.createElement('canvas');
  albedoCanvas.width = albedoCanvas.height = size;
  const actx = albedoCanvas.getContext('2d');
  const aimg = actx.createImageData(size, size);

  const roughCanvas = document.createElement('canvas');
  roughCanvas.width = roughCanvas.height = size;
  const rctx = roughCanvas.getContext('2d');
  const rimg = rctx.createImageData(size, size);

  for (let i = 0; i < size * size; i++) {
    const x = i % size;
    const y = (i / size) | 0;
    const u = x / size;
    const v = y / size;
    const h = height[i];
    const patch = fbm2D(u * 5.0 + 3.2, v * 5.0 + 9.4, 3);
    const speck = (hash2(x * 1.3, y * 1.7) - 0.5) * 18;

    // Calibrated lunar highland anorthosite grey (slightly warm neutral)
    const lum = clamp(104 + (h - 0.42) * 34 + (patch - 0.5) * 28 + speck, 62, 152);
    const p = i * 4;
    aimg.data[p]     = clamp(Math.round(lum * 1.01), 0, 255);
    aimg.data[p + 1] = clamp(Math.round(lum * 1.00), 0, 255);
    aimg.data[p + 2] = clamp(Math.round(lum * 0.99), 0, 255);
    aimg.data[p + 3] = 255;

    const rv = clamp(Math.round((0.91 + (1.0 - clamp(h, 0, 1)) * 0.08) * 255), 224, 254);
    rimg.data[p] = rimg.data[p + 1] = rimg.data[p + 2] = rv;
    rimg.data[p + 3] = 255;
  }
  actx.putImageData(aimg, 0, 0);
  rctx.putImageData(rimg, 0, 0);

  const map = new THREE.CanvasTexture(albedoCanvas);
  const normalMap = new THREE.CanvasTexture(normalCanvas);
  const roughnessMap = new THREE.CanvasTexture(roughCanvas);
  map.colorSpace = THREE.SRGBColorSpace;
  [map, normalMap, roughnessMap].forEach(t => {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(22, 22);
    t.anisotropy = 8;
  });
  return { map, normalMap, roughnessMap };
}

// Pragyan Rover Wheel Track Imprint Texture (Chevron Cleats + Compacted Trough)
function createWheelTrackTextures() {
  const w = 128, h = 256;
  const height = new Float32Array(w * h);
  const albedo = document.createElement('canvas');
  albedo.width = w; albedo.height = h;
  const actx = albedo.getContext('2d');
  const aimg = actx.createImageData(w, h);

  const alpha = document.createElement('canvas');
  alpha.width = w; alpha.height = h;
  const alctx = alpha.getContext('2d');
  const alimg = alctx.createImageData(w, h);

  for (let y = 0; y < h; y++) {
    const v = y / h;
    for (let x = 0; x < w; x++) {
      const u = x / w; // 0..1 across track width
      const cx = Math.abs(u - 0.5) * 2.0; // 0 at center, 1 at edge

      // Compacted center trough + raised outer berms
      let hVal = 0;
      if (cx < 0.68) {
        hVal = -0.55;
        // Repeating transverse rover cleat ridges (8 treads per repeat)
        const chevronPhase = (v * 8.0 + cx * 0.35) % 1.0;
        const cleat = Math.exp(-Math.pow((chevronPhase - 0.5) * 7.0, 2));
        hVal -= cleat * 0.42;
      } else if (cx < 0.94) {
        const bt = (cx - 0.68) / 0.26;
        hVal = Math.sin(bt * Math.PI) * 0.42;
      }
      const grit = (hash2(x * 0.9, y * 0.9) - 0.5) * 0.14;
      height[y * w + x] = hVal + grit;

      const p = (y * w + x) * 4;
      // Darkened compacted lunar regolith in trough, brighter disturbed edge dust
      const shade = cx < 0.68
        ? clamp(54 + (hVal + 0.85) * 32 + grit * 45, 34, 96)
        : clamp(114 + hVal * 36 + grit * 35, 80, 146);
      aimg.data[p] = aimg.data[p + 1] = aimg.data[p + 2] = Math.round(shade);
      aimg.data[p + 3] = 255;

      const edgeAlpha = 1.0 - smoothstep(0.76, 0.98, cx);
      alimg.data[p] = alimg.data[p + 1] = alimg.data[p + 2] = Math.round(edgeAlpha * 255);
      alimg.data[p + 3] = 255;
    }
  }
  actx.putImageData(aimg, 0, 0);
  alctx.putImageData(alimg, 0, 0);

  // Normal map (non-square helper inline)
  const normCanvas = document.createElement('canvas');
  normCanvas.width = w; normCanvas.height = h;
  const nctx = normCanvas.getContext('2d');
  const nimg = nctx.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const xm = (x - 1 + w) % w, xp = (x + 1) % w;
      const ym = (y - 1 + h) % h, yp = (y + 1) % h;
      const dx = (height[y * w + xp] - height[y * w + xm]) * 4.5;
      const dy = (height[yp * w + x] - height[ym * w + x]) * 4.5;
      const dz = 1.0;
      const inv = 1.0 / Math.hypot(dx, dy, dz);
      const p = (y * w + x) * 4;
      nimg.data[p]     = clamp(Math.round((-dx * inv * 0.5 + 0.5) * 255), 0, 255);
      nimg.data[p + 1] = clamp(Math.round((-dy * inv * 0.5 + 0.5) * 255), 0, 255);
      nimg.data[p + 2] = clamp(Math.round(( dz * inv * 0.5 + 0.5) * 255), 0, 255);
      nimg.data[p + 3] = 255;
    }
  }
  nctx.putImageData(nimg, 0, 0);

  const map = new THREE.CanvasTexture(albedo);
  const normalMap = new THREE.CanvasTexture(normCanvas);
  const alphaMap = new THREE.CanvasTexture(alpha);
  map.colorSpace = THREE.SRGBColorSpace;
  [map, normalMap, alphaMap].forEach(t => {
    t.wrapS = THREE.ClampToEdgeWrapping;
    t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8;
  });
  return { map, normalMap, alphaMap };
}

// Soft Wispy Radial Lunar Dust Sprite Texture
function createDustSpriteTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = (x / size) * 2 - 1;
      const v = (y / size) * 2 - 1;
      const r = Math.hypot(u, v);
      const puff1 = fbm2D(u * 2.6 + 4.1, v * 2.6 + 2.7, 4);
      const puff2 = fbm2D(u * 5.2 + 9.3, v * 5.2 + 1.4, 3);
      const radial = Math.pow(1.0 - smoothstep(0.02, 0.96, r), 2.35);
      const wisp = clamp(0.32 + puff1 * 0.65 + (puff2 - 0.5) * 0.35, 0, 1);
      const a = clamp(radial * wisp, 0, 1);
      const p = (y * size + x) * 4;
      img.data[p] = 205;
      img.data[p + 1] = 204;
      img.data[p + 2] = 202;
      img.data[p + 3] = Math.round(a * 255);
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Soft Contact Shadow Texture
function createContactShadowTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0.0, 'rgba(0, 0, 0, 0.88)');
  grad.addColorStop(0.32, 'rgba(0, 0, 0, 0.68)');
  grad.addColorStop(0.65, 'rgba(0, 0, 0, 0.25)');
  grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}

// Procedural Earth Surface & Clouds Texture
function createEarthTextures() {
  const w = 512, h = 256;
  const surf = document.createElement('canvas');
  surf.width = w; surf.height = h;
  const sctx = surf.getContext('2d');
  const simg = sctx.createImageData(w, h);

  const cloud = document.createElement('canvas');
  cloud.width = w; cloud.height = h;
  const cctx = cloud.getContext('2d');
  const cimg = cctx.createImageData(w, h);

  for (let y = 0; y < h; y++) {
    const v = y / h;
    const lat = (v - 0.5) * Math.PI;
    const cosLat = Math.cos(lat);
    const absLat = Math.abs(v - 0.5) * 2.0; // 0 eq, 1 pole

    for (let x = 0; x < w; x++) {
      const u = x / w;
      const lon = u * Math.PI * 2;
      // Seamless 3D spherical coordinates projected into 2D domain-warped fBM
      const sx = Math.cos(lon) * cosLat;
      const sy = Math.sin(lat);
      const sz = Math.sin(lon) * cosLat;

      const cont = fbm2D(sx * 2.1 + sz * 1.1 + 4.3, sy * 2.2 - sz * 0.8 + 7.1, 5);
      const detail = fbm2D(sx * 5.2 + 12.1, sy * 5.2 + sz * 3.1, 4);
      const p = (y * w + x) * 4;

      let r, g, b;
      const iceMask = smoothstep(0.76, 0.91, absLat + (detail - 0.5) * 0.14);
      if (iceMask > 0.5) {
        r = 228; g = 236; b = 244;
      } else if (cont > 0.535) {
        // Continents: lush greens & arid ochres
        const arid = smoothstep(0.38, 0.68, detail) * (1.0 - smoothstep(0.35, 0.65, absLat));
        const elev = smoothstep(0.535, 0.78, cont);
        r = lerp(42, 162, arid) + elev * 38;
        g = lerp(96, 138, arid) + elev * 24;
        b = lerp(46, 86, arid) + elev * 14;
      } else {
        // Deep vivid oceanic blues
        const shallow = smoothstep(0.47, 0.535, cont);
        r = lerp(10, 26, shallow);
        g = lerp(44, 96, shallow);
        b = lerp(128, 178, shallow);
      }

      simg.data[p]     = clamp(Math.round(r), 0, 255);
      simg.data[p + 1] = clamp(Math.round(g), 0, 255);
      simg.data[p + 2] = clamp(Math.round(b), 0, 255);
      simg.data[p + 3] = 255;

      // Swirling weather cloud bands
      const swirl = fbm2D(sx * 3.4 + sy * 1.9 + 21.5, sz * 3.4 - sx * 1.2 + 15.2, 5);
      const band = smoothstep(0.48, 0.72, swirl + Math.sin(lat * 6.0) * 0.06);
      cimg.data[p] = 245;
      cimg.data[p + 1] = 248;
      cimg.data[p + 2] = 255;
      cimg.data[p + 3] = Math.round(band * 235);
    }
  }
  sctx.putImageData(simg, 0, 0);
  cctx.putImageData(cimg, 0, 0);

  const map = new THREE.CanvasTexture(surf);
  const cloudsMap = new THREE.CanvasTexture(cloud);
  map.colorSpace = THREE.SRGBColorSpace;
  cloudsMap.colorSpace = THREE.SRGBColorSpace;
  return { map, cloudsMap };
}

function buildStarField() {
  const count = 2100;
  const rand = mulberry32(314159);
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  const starTints = [
    new THREE.Color(0xcad8ff),
    new THREE.Color(0xeef2ff),
    new THREE.Color(0xfff6e8),
    new THREE.Color(0xffe4c4),
    new THREE.Color(0xdbe8ff)
  ];

  for (let i = 0; i < count; i++) {
    // Upper hemisphere + slight margin below horizon
    const u = rand();
    const v = rand();
    const theta = u * Math.PI * 2;
    const sinPhi = Math.sqrt(clamp(1 - Math.pow(v * 0.94, 2), 0, 1));
    const y = v * 0.94 + 0.015;
    const rad = 360 + rand() * 80;
    const x = Math.cos(theta) * sinPhi * rad;
    const z = Math.sin(theta) * sinPhi * rad;

    positions[i * 3] = x;
    positions[i * 3 + 1] = y * rad;
    positions[i * 3 + 2] = z;

    // Realistic faint magnitude power-law distribution (subtle against bright lunar surface)
    const mag = Math.pow(rand(), 3.6);
    const brightness = 0.16 + mag * 0.58;
    const tint = starTints[(rand() * starTints.length) | 0];
    colors[i * 3]     = tint.r * brightness;
    colors[i * 3 + 1] = tint.g * brightness;
    colors[i * 3 + 2] = tint.b * brightness;
    sizes[i] = 1.05 + mag * 1.45;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
    },
    vertexShader: `
      attribute float aSize;
      varying vec3 vColor;
      uniform float uPixelRatio;
      void main() {
        vColor = color;
        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * uPixelRatio;
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        float d = length(c);
        if (d > 0.5) discard;
        float falloff = smoothstep(0.5, 0.04, d);
        gl_FragColor = vec4(vColor * falloff, falloff * 0.85);
      }
    `,
    vertexColors: true,
    transparent: true,
    depthWrite: false
  });

  const stars = new THREE.Points(geo, mat);
  stars.frustumCulled = false;
  scene.add(stars);
}
buildStarField();

function buildEarthInSky() {
  const earthGroup = new THREE.Group();
  earthGroup.position.copy(EARTH_DIR).multiplyScalar(EARTH_DIST);

  const earthRadius = 3.95; // ~2.75 deg apparent angular diameter: small, crisp blue marble

  // Custom shader for phase-accurate sunlit Earth with clouds & atmospheric scattering
  const earthMat = new THREE.ShaderMaterial({
    uniforms: {
      uSurface: { value: earthTextures.map },
      uClouds: { value: earthTextures.cloudsMap },
      uSunDir: { value: SUN_DIR.clone() }
    },
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;
      void main() {
        vUv = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform sampler2D uSurface;
      uniform sampler2D uClouds;
      uniform vec3 uSunDir;
      varying vec2 vUv;
      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;
      void main() {
        vec3 N = normalize(vWorldNormal);
        vec3 V = normalize(cameraPosition - vWorldPos);
        vec3 L = normalize(uSunDir);

        float ndl = dot(N, L);
        float day = smoothstep(-0.08, 0.14, ndl);
        float diffuse = max(ndl, 0.0);

        vec3 surf = texture2D(uSurface, vUv).rgb;
        vec4 cld = texture2D(uClouds, vUv + vec2(0.08, 0.0)).rgba;
        vec3 albedo = mix(surf, cld.rgb, cld.a * 0.92);

        // Subtle solar glint on ocean
        vec3 H = normalize(L + V);
        float spec = pow(max(dot(N, H), 0.0), 28.0) * (1.0 - cld.a) * 0.25 * day;

        // Rayleigh atmospheric limb scattering on sunlit hemisphere
        float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.2);
        vec3 atmoColor = vec3(0.24, 0.58, 1.0);
        float atmoTerm = fresnel * smoothstep(-0.18, 0.28, ndl);

        vec3 color = albedo * (diffuse * 1.48 + 0.015 * day) + vec3(0.85, 0.93, 1.0) * spec + atmoColor * atmoTerm * 0.95;
        gl_FragColor = vec4(color, 1.0);
      }
    `
  });

  const earthSphere = new THREE.Mesh(new THREE.SphereGeometry(earthRadius, 48, 48), earthMat);
  earthSphere.rotation.y = 2.4;
  earthSphere.rotation.z = 0.32;
  earthGroup.add(earthSphere);

  // Outer translucent atmospheric limb halo
  const haloMat = new THREE.ShaderMaterial({
    uniforms: {
      uSunDir: { value: SUN_DIR.clone() }
    },
    vertexShader: `
      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform vec3 uSunDir;
      varying vec3 vWorldNormal;
      varying vec3 vWorldPos;
      void main() {
        vec3 N = normalize(vWorldNormal);
        vec3 V = normalize(cameraPosition - vWorldPos);
        float limb = pow(clamp(1.0 - abs(dot(N, V)), 0.0, 1.0), 4.0);
        float sunSide = smoothstep(-0.25, 0.35, dot(N, normalize(uSunDir)));
        vec3 col = vec3(0.28, 0.62, 1.0) * limb * sunSide * 0.72;
        gl_FragColor = vec4(col, limb * sunSide * 0.65);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    depthWrite: false
  });
  const haloSphere = new THREE.Mesh(new THREE.SphereGeometry(earthRadius * 1.08, 36, 36), haloMat);
  earthGroup.add(haloSphere);

  scene.add(earthGroup);
  return earthSphere;
}
const earthMesh = buildEarthInSky();

function getTerrainHeight(x, z) {
  const rOrigin = Math.hypot(x, z);

  // Safe flat pad around landing legs (r < 1.9m) and gently level along ramp/rollout path
  const padFlat = smoothstep(1.45, 3.4, rOrigin);

  // Corridor mask along rover rollout (+Z from z = 0 to z = 6.2)
  const inCorridorZ = smoothstep(-0.5, 0.8, z) * (1.0 - smoothstep(5.4, 7.6, z));
  const corridorFlat = 1.0 - inCorridorZ * (1.0 - smoothstep(0.65, 2.1, Math.abs(x + 0.12)));

  const reliefMask = padFlat * lerp(0.18, 1.0, corridorFlat);

  // Broad lunar rolling highlands + subtle local regolith ripples
  let h = (fbm2D(x * 0.045 + 12.4, z * 0.045 + 7.2, 4) - 0.5) * 1.45 * smoothstep(2.0, 14.0, rOrigin);
  h += (fbm2D(x * 0.24 + 3.1, z * 0.24 + 8.7, 3) - 0.5) * 0.14 * reliefMask;
  h += (noise2D(x * 1.15 + 5.2, z * 1.15 + 1.9) - 0.5) * 0.028 * reliefMask;

  // Impact craters (parabolic bowl + raised ejecta rim)
  for (let i = 0; i < CRATERS.length; i++) {
    const c = CRATERS[i];
    const dx = x - c.x;
    const dz = z - c.z;
    const maxR = c.r * 1.65;
    if (Math.abs(dx) > maxR || Math.abs(dz) > maxR) continue;
    const distSq = dx * dx + dz * dz;
    if (distSq >= maxR * maxR) continue;
    const q = Math.sqrt(distSq) / c.r;
    let ch = 0;
    if (q < 1.0) {
      // Bowl floor with gentle flattening at very bottom + inner wall rise
      const bowl = (q * q - 1.0);
      const rimRise = Math.pow(q, 4) * 0.26;
      ch = c.d * (bowl * 0.86 + rimRise);
    } else {
      // Smooth raised ejecta blanket decaying away from rim
      const t = (q - 1.0) / 0.65;
      const e = 1.0 - t;
      ch = c.d * 0.26 * e * e * (1.0 + 0.6 * t);
    }
    h += ch * reliefMask;
  }

  // Dramatic distant south-pole crater rim ridges on the horizon
  if (rOrigin > 26) {
    const rimDist = smoothstep(26, 72, rOrigin);
    const angle = Math.atan2(z, x);
    const ridgeWave = fbm2D(Math.cos(angle) * 2.6 + 5.0, Math.sin(angle) * 2.6 + 9.0, 4);
    const ridgePeak = Math.pow(ridgeWave, 1.4) * 7.8 * rimDist;
    // Slight lunar curvature dropoff beyond 75m so the horizon feels stark and airless
    const curveDrop = -Math.max(0, rOrigin - 55) * Math.max(0, rOrigin - 55) * 0.0014;
    h += ridgePeak + curveDrop;
  }

  return h;
}

function getTerrainNormal(x, z) {
  const eps = 0.06;
  const hL = getTerrainHeight(x - eps, z);
  const hR = getTerrainHeight(x + eps, z);
  const hD = getTerrainHeight(x, z - eps);
  const hU = getTerrainHeight(x, z + eps);
  return new THREE.Vector3(hL - hR, 2 * eps, hD - hU).normalize();
}

function buildLunarTerrain() {
  // Radial non-uniform polar grid: ultra-dense around landing & rover zone, sweeping out to 125m horizon
  const rings = 135;
  const segs = 160;
  const maxRadius = 122;

  const verts = [];
  const uvs = [];
  const indices = [];

  // Center vertex
  verts.push(0, getTerrainHeight(0, 0), 0);
  uvs.push(0, 0);

  for (let rIdx = 1; rIdx <= rings; rIdx++) {
    const t = rIdx / rings;
    // Cubic-blended radial spacing: ~0.08m resolution near center, expanding smoothly toward horizon
    const radius = maxRadius * (0.09 * t + 0.25 * t * t + 0.66 * t * t * t);
    for (let s = 0; s < segs; s++) {
      const ang = (s / segs) * Math.PI * 2;
      const x = Math.cos(ang) * radius;
      const z = Math.sin(ang) * radius;
      const y = getTerrainHeight(x, z);
      verts.push(x, y, z);
      uvs.push(x * 0.14, z * 0.14);
    }
  }

  // Center fan
  for (let s = 0; s < segs; s++) {
    const next = (s + 1) % segs;
    indices.push(0, 1 + next, 1 + s);
  }
  // Concentric rings
  for (let rIdx = 1; rIdx < rings; rIdx++) {
    const rowA = 1 + (rIdx - 1) * segs;
    const rowB = 1 + rIdx * segs;
    for (let s = 0; s < segs; s++) {
      const next = (s + 1) % segs;
      const a0 = rowA + s;
      const a1 = rowA + next;
      const b0 = rowB + s;
      const b1 = rowB + next;
      indices.push(a0, a1, b1);
      indices.push(a0, b1, b0);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    map: regolithTex.map,
    normalMap: regolithTex.normalMap,
    normalScale: new THREE.Vector2(1.05, 1.05),
    roughnessMap: regolithTex.roughnessMap,
    roughness: 0.98,
    metalness: 0.0,
    envMapIntensity: 0.12
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  mesh.castShadow = true;
  scene.add(mesh);
  return mesh;
}
buildLunarTerrain();

// Angular Lunar Rocks & Boulders (InstancedMesh)
function buildLunarRocks() {
  const rockMat = new THREE.MeshStandardMaterial({
    map: regolithTex.map,
    normalMap: regolithTex.normalMap,
    normalScale: new THREE.Vector2(1.4, 1.4),
    color: 0xb8bcc2,
    roughness: 0.94,
    metalness: 0.02,
    envMapIntensity: 0.15
  });

  function makeRockGeo(seed, detail) {
    const rand = mulberry32(seed);
    const geo = new THREE.IcosahedronGeometry(1.0, detail);
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    // Random cleavage planes for angular fractured lunar basalt/anorthosite
    const planes = [];
    for (let p = 0; p < 5; p++) {
      planes.push({
        n: new THREE.Vector3(rand() - 0.5, rand() - 0.5, rand() - 0.5).normalize(),
        d: 0.55 + rand() * 0.35
      });
    }
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const n = fbm2D(v.x * 2.1 + seed, v.z * 2.1 + v.y * 1.7, 3);
      let r = 0.72 + n * 0.42;
      for (const pl of planes) {
        const proj = v.dot(pl.n);
        if (proj > pl.d) {
          r *= 1.0 - (proj - pl.d) * 0.42;
        }
      }
      v.multiplyScalar(r);
      v.y *= 0.68; // Slightly flattened resting profile
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();
    return geo;
  }

  const geos = [makeRockGeo(11, 2), makeRockGeo(29, 2), makeRockGeo(53, 2)];
  const counts = [140, 140, 220];
  const rand = mulberry32(4242);
  const dummy = new THREE.Object3D();
  const color = new THREE.Color();

  geos.forEach((geo, gIdx) => {
    const count = counts[gIdx];
    const inst = new THREE.InstancedMesh(geo, rockMat, count);
    inst.castShadow = true;
    inst.receiveShadow = true;

    let placed = 0;
    let tries = 0;
    while (placed < count && tries < count * 8) {
      tries++;
      const ang = rand() * Math.PI * 2;
      const dist = 2.4 + Math.pow(rand(), 1.55) * 34.0;
      const x = Math.cos(ang) * dist;
      const z = Math.sin(ang) * dist;

      // Exclude landing zone and Pragyan rollout path
      if (Math.hypot(x, z) < 2.25) continue;
      if (Math.abs(x + 0.12) < 1.35 && z > -0.8 && z < 6.4) continue;

      const baseScale = gIdx === 2
        ? (0.04 + Math.pow(rand(), 2.4) * 0.14)
        : (0.07 + Math.pow(rand(), 2.2) * (dist < 8 ? 0.24 : 0.62));

      const y = getTerrainHeight(x, z);
      dummy.position.set(x, y - baseScale * 0.18, z);
      dummy.rotation.set(rand() * 0.5, rand() * Math.PI * 2, rand() * 0.5);
      dummy.scale.set(
        baseScale * (0.75 + rand() * 0.6),
        baseScale * (0.65 + rand() * 0.5),
        baseScale * (0.75 + rand() * 0.6)
      );
      dummy.updateMatrix();
      inst.setMatrixAt(placed, dummy.matrix);

      const shade = 0.72 + rand() * 0.36;
      color.setRGB(shade, shade * 0.99, shade * 0.98);
      inst.setColorAt(placed, color);
      placed++;
    }
    inst.count = placed;
    inst.instanceMatrix.needsUpdate = true;
    if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
    scene.add(inst);
  });
}
buildLunarRocks();

const CHASSIS_UNCOMPRESSED_Y = 0.78;

const RAMP_TOTAL_LEN = RAMP_SEG_LEN * 2;
const RAMP_WIDTH = 0.86;

// Helper: orient a unit-length cylinder along Y between two 3D points in parent space
const _tmpDir = new THREE.Vector3();
const _tmpMid = new THREE.Vector3();
const _upAxis = new THREE.Vector3(0, 1, 0);
function placeStrutBetween(mesh, pA, pB, radiusScale = 1.0) {
  _tmpDir.subVectors(pB, pA);
  const len = _tmpDir.length();
  if (len < 1e-5) return;
  _tmpMid.addVectors(pA, pB).multiplyScalar(0.5);
  mesh.position.copy(_tmpMid);
  mesh.quaternion.setFromUnitVectors(_upAxis, _tmpDir.divideScalar(len));
  mesh.scale.set(radiusScale, len, radiusScale);
}

// Helper: create faceted octagonal prism (chamfered square profile matching real Vikram)
function createOctagonalProfile(halfSpan, chamfer) {
  const s = new THREE.Shape();
  const a = halfSpan;
  const b = halfSpan - chamfer;
  s.moveTo(-b, -a);
  s.lineTo( b, -a);
  s.lineTo( a, -b);
  s.lineTo( a,  b);
  s.lineTo( b,  a);
  s.lineTo(-b,  a);
  s.lineTo(-a,  b);
  s.lineTo(-a, -b);
  s.closePath();
  return s;
}

  const root = new THREE.Group();

      bevelSize: 0.015,

  // ---- B. SOLAR PANEL ARRAYS (MOUNTED ON -X, +X, AND -Z FACES LIKE REAL CHANDRAYAAN-3) ----
  function addSideSolarPanel(px, py, pz, rotY, width, height) {

  // Prominent side solar arrays (left -X faces the low sun brilliantly; right +X and rear -Z wrap the bus)

  // ---- C. FOUR 800N MAIN THROTTLEABLE ENGINES + VACUUM PLUMES ----
  const nozzleProfile = [

  const nozzleGeo = new THREE.LatheGeometry(nozzleProfile, 28);

  const plumeShaderMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uThrottle: { value: 0 }
    },
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      void main() {
        vUv = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vNormal = normalize(mat3(modelMatrix) * normal);
        vViewDir = normalize(cameraPosition - wp.xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
