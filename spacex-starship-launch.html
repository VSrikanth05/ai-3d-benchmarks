      roughness: 0.22,
      metalness: 0.35
    })
  );

  // --------------------------------------------------------------------------
  // 8H. THREE SWEEPING, TAPERED REAR TAIL FINS ACTING AS LANDING LEGS
  // --------------------------------------------------------------------------
  // Spaced 120° apart around the lower fuselage and extending down to y = 0.0
  // on the concrete launchpad. Angles chosen so all 3 sweeping fins are clearly
  // silhouetted from the low-angle hero view!
  function buildThreeSweepingTailFins() {
    const finsGroup = new THREE.Group();
    const finAzimuths = [
      -0.96,                 // Left-front sweeping fin (-55°)
      -0.96 + (Math.PI * 2) / 3, // Right-front sweeping fin (+65°)
      -0.96 + (Math.PI * 4) / 3  // Rear-left sweeping fin (+185°)
    ];

    // Build custom smooth 3D swept-delta fin geometry with curved leading chine
    function createSingleSweepingFinGeometry() {
      const uSteps = 28; // Vertical stations from tip (y = 0.18m) to upper root (y = 19.6m)
      const vSteps = 10; // Radial stations from hull root to outer swept leading edge

      const positions = [];
      const uvs = [];
      const indices = [];

      // Helper: outer radial reach rOut(t) and half-thickness th(t, s)
      // t = 0 at bottom landing leg tip (y = 0.18m, rOut = 9.15m)
      // t = 1 at upper fuselage blend root (y = 19.6m, rOut = 4.52m)
      function evalFinStation(t) {
        const y = lerp(0.18, 19.6, t);
        // Sweeping concave-to-convex OG curve from wide landing stance up into fuselage
        const sweepCurve = Math.pow(1.0 - t, 1.38);
        const rOut = ROCKET_R + 0.05 + 4.65 * sweepCurve;

        // Inner boundary stays flush inside the fuselage cylinder above skirt (y >= 3.8),
        // and sweeps outward from the skirt rim down to the landing tip below y = 3.8!
        let rIn = ROCKET_R - 0.25;
        if (y < SKIRT_Y) {
          const legT = (SKIRT_Y - y) / (SKIRT_Y - 0.18); // 0 at skirt, 1 at tip
          rIn = lerp(ROCKET_R - 0.15, rOut - 0.62, Math.pow(legT, 0.88));
        }
        return { y, rIn, rOut };
      }

      // Generate Top (+Z) and Bottom (-Z) airfoil skins
      for (let side of [1, -1]) {
        const baseVertexOffset = positions.length / 3;

        for (let iu = 0; iu <= uSteps; iu++) {
          const t = iu / uSteps;
          const { y, rIn, rOut } = evalFinStation(t);

          for (let iv = 0; iv <= vSteps; iv++) {
            const s = iv / vSteps; // 0 at root, 1 at outer leading edge
            const r = lerp(rIn, rOut, s);

            // Airfoil thickness profile: thick near root/mid-chord, sharp at outer leading edge & upper root
            const chordArch = Math.sin(Math.pow(s, 0.65) * Math.PI);
            const heightTaper = Math.sin(Math.pow(t, 0.55) * Math.PI) * 0.75 + (1.0 - t) * 0.45;
            const zHalf = 0.46 * chordArch * heightTaper;

            positions.push(r, y, side * zHalf);
            uvs.push(s, t);
          }
        }

        const stride = vSteps + 1;
        for (let iu = 0; iu < uSteps; iu++) {
          for (let iv = 0; iv < vSteps; iv++) {
            const a = baseVertexOffset + iu * stride + iv;
            const b = a + 1;
            const c = a + stride;
            const d = c + 1;
            if (side === 1) {
              indices.push(a, b, c, b, d, c);
            } else {
              indices.push(a, c, b, b, c, d);
            }
          }
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    const finGeo = createSingleSweepingFinGeometry();

    for (let i = 0; i < 3; i++) {
      const finUnit = new THREE.Group();
      const finMesh = new THREE.Mesh(finGeo, noseAndFinChromeMat);
      finMesh.castShadow = true;
      finMesh.receiveShadow = true;
      finUnit.add(finMesh);

      // Vertical aerodynamic root fairing & actuation housing along hull junction
      const rootFairing = new THREE.Mesh(
        new THREE.CylinderGeometry(0.26, 0.48, 15.6, 16),
        noseAndFinChromeMat
      );
      rootFairing.position.set(ROCKET_R + 0.04, 11.6, 0);
      finUnit.add(rootFairing);

      // Integrated Heavy-Duty Landing Footpad & Shock Strut at Fin Tip (y = 0.0m)
      const tipX = ROCKET_R + 4.42;
      const shockCylinder = new THREE.Mesh(
        new THREE.CylinderGeometry(0.24, 0.20, 1.35, 16),
        darkStructuralMat
      );
      shockCylinder.position.set(tipX, 0.68, 0);
      shockCylinder.rotation.z = 0.22;
      finUnit.add(shockCylinder);

      const footPad = new THREE.Mesh(
        new THREE.CylinderGeometry(0.52, 0.68, 0.18, 20),
        darkStructuralMat
      );
      footPad.position.set(tipX + 0.12, 0.09, 0);
      footPad.castShadow = true;
      finUnit.add(footPad);

      finUnit.rotation.y = Math.PI * 0.5 - finAzimuths[i];
      finsGroup.add(finUnit);
    }

    return finsGroup;
  }
  starship.add(buildThreeSweepingTailFins());

  // --------------------------------------------------------------------------
  // 8I. CLUSTERED RAPTOR ENGINE NOZZLES BENEATH THE AFT SKIRT
  // --------------------------------------------------------------------------
  const nozzleInteriorMats = [];

  function buildClusteredEngineNozzles() {
    const engineGroup = new THREE.Group();

    // Recessed dark thermal dome bulkhead inside the aft skirt at y = 4.55m
    const thrustDome = new THREE.Mesh(
      new THREE.CircleGeometry(ROCKET_R - 0.04, 64),
      darkStructuralMat
    );
    thrustDome.rotation.x = Math.PI / 2;
    thrustDome.position.y = 4.55;
    engineGroup.add(thrustDome);

    // Inner aft skirt liner wall (visible from low-angle camera)
    const innerSkirtWall = new THREE.Mesh(
      new THREE.CylinderGeometry(ROCKET_R - 0.05, ROCKET_R - 0.05, 1.15, 64, 1, true),
      new THREE.MeshStandardMaterial({
        color: 0x222834,
        metalness: 0.78,
        roughness: 0.35,
        side: THREE.BackSide,
        envMap: cubeRenderTarget.texture
      })
    );
    innerSkirtWall.position.y = SKIRT_Y + 0.55;
    engineGroup.add(innerSkirtWall);

    // Outer nozzle bell material (dark copper-inconel regenerative cooling patina)
    const nozzleOuterMat = new THREE.MeshStandardMaterial({
      color: 0x2c303a,
      metalness: 0.88,
      roughness: 0.28,
      envMap: cubeRenderTarget.texture,
      envMapIntensity: 1.2
    });

    const coolingRingMat = new THREE.MeshStandardMaterial({
      color: 0x5c4b3e,
      metalness: 0.85,
      roughness: 0.32,
      envMap: cubeRenderTarget.texture
    });

    // Parabolic De Laval Rocket Nozzle Lathe Profile
    function createSingleRaptorNozzle(exitRadius, length) {
      const nGroup = new THREE.Group();
      const pts = [];
      const segs = 20;
      for (let i = 0; i <= segs; i++) {
        const t = i / segs; // 0 at exit bottom, 1 at throat top
        const y = t * length;
        const r = lerp(exitRadius, exitRadius * 0.36, Math.pow(t, 1.45));
        pts.push(new THREE.Vector2(r, y));
      }
      const bellGeo = new THREE.LatheGeometry(pts, 32);

      // Outer metallic bell
      const outerBell = new THREE.Mesh(bellGeo, nozzleOuterMat);
      outerBell.castShadow = true;
      nGroup.add(outerBell);

      // Glowing inner combustion throat & chamber liner (emissive driven by engine throttle!)
      const innerMat = new THREE.MeshStandardMaterial({
        color: 0x181412,
        emissive: new THREE.Color(0xff6a14),
        emissiveIntensity: 0.0,
        roughness: 0.4,
        side: THREE.BackSide
      });
      nozzleInteriorMats.push(innerMat);

      const innerBell = new THREE.Mesh(bellGeo, innerMat);
      innerBell.scale.set(0.97, 1.0, 0.97);
      nGroup.add(innerBell);

      // Glowing injector throat disc at top of nozzle bell
      const throatDisc = new THREE.Mesh(
        new THREE.CircleGeometry(exitRadius * 0.35, 20),
        innerMat
      );
      throatDisc.rotation.x = Math.PI / 2;
      throatDisc.position.y = length - 0.05;
      nGroup.add(throatDisc);

      // External regenerative cooling reinforcement bands
      for (const bandT of [0.06, 0.38, 0.72]) {
        const rBand = lerp(exitRadius, exitRadius * 0.36, Math.pow(bandT, 1.45)) + 0.02;
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(rBand, 0.028, 8, 28),
          coolingRingMat
        );
        ring.rotation.x = Math.PI / 2;
        ring.position.y = bandT * length;
        nGroup.add(ring);
      }

      return nGroup;
    }

    // 3 Central Sea-Level Gimbaled Raptors + 6 Outer Large Vacuum Raptors (9-Raptor Cluster clearly visible beneath skirt)
    for (let i = 0; i < 3; i++) {
      const angSL = (i * Math.PI * 2) / 3 + 0.25;
      const slNozzle = createSingleRaptorNozzle(0.68, 2.05);
      slNozzle.position.set(Math.cos(angSL) * 1.15, 2.30, Math.sin(angSL) * 1.15);
      engineGroup.add(slNozzle);
    }
    for (let i = 0; i < 6; i++) {
      const angVac = (i * Math.PI * 2) / 6 + 0.12;
      const vacNozzle = createSingleRaptorNozzle(0.96, 2.45);
      vacNozzle.position.set(Math.cos(angVac) * 2.85, 1.95, Math.sin(angVac) * 2.85);
      engineGroup.add(vacNozzle);
    }

    return engineGroup;
  }
  starship.add(buildClusteredEngineNozzles());

  return { root: starship, nozzleInteriorMats };
}

const starshipObj = createStarshipModel();
const starshipGroup = starshipObj.root;
scene.add(starshipGroup);

// ============================================================================
// 9. RAZOR-SHARP SUPERSONIC PLASMA EXHAUST, MACH DIAMONDS & 9-NOZZLE EXIT JETS
// ============================================================================
function createPlasmaExhaustSystem() {
  const exhaustGroup = new THREE.Group();

  // Shared uniforms across outer plasma sheath, inner Mach shock diamond core, and 9 nozzle exit jets
  const sharedExhaustUniforms = {
    uTime: { value: 0 },
    uThrottle: { value: 0 },
    uGroundClipY: { value: -2.2 } // Clips plume cleanly at the concrete launchpad surface
  };

  // 9A. Outer Turbulent Orange-Red-Amber Supersonic Plasma Sheath (NormalBlending so it never washes out to white!)
  const coneLen = 24.0;
  const coneGeo = new THREE.CylinderGeometry(3.15, 5.4, coneLen, 48, 48, true);
  coneGeo.translate(0, -coneLen * 0.5, 0);

  const exhaustMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.NormalBlending,
    uniforms: sharedExhaustUniforms,
    vertexShader: /* glsl */ `
      varying vec2 vUv;
      varying vec3 vLocalPos;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      uniform float uTime;
      uniform float uThrottle;

      void main() {
        vUv = uv;
        vec3 pos = position;

        // High-velocity supersonic shear-layer flutter along the exhaust boundary
        float downT = 1.0 - uv.y; // 0 at nozzle exit, 1 at bottom tip
        float shockRipple = sin(downT * 34.0 - uTime * 22.0) * 0.06 * (1.0 - downT * 0.6);
        float flutter = sin(downT * 24.0 - uTime * 68.0) * 0.11 + cos(downT * 11.0 - uTime * 42.0) * 0.16;
        pos.xz *= 1.0 + shockRipple + flutter * downT * 0.38 * uThrottle;

        vLocalPos = pos;
        vec4 wp = modelMatrix * vec4(pos, 1.0);
        vNormal = normalize(mat3(modelMatrix) * normal);
        vViewDir = normalize(cameraPosition - wp.xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */ `
      varying vec2 vUv;
      varying vec3 vLocalPos;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      uniform float uTime;
      uniform float uThrottle;
      uniform float uGroundClipY;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
          mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }

      // Ridged cellular flame FBM for crisp supersonic flame tongues
      float flameFbm(vec2 p) {
        float s = 0.0;
        float a = 0.52;
        for (int i = 0; i < 5; i++) {
          float n = noise(p);
          float ridge = 1.0 - abs(n * 2.0 - 1.0);
          s += a * ridge;
          p *= 2.12;
          a *= 0.48;
        }
        return s;
      }

      void main() {
        if (uThrottle <= 0.005) discard;
        if (vLocalPos.y < uGroundClipY) discard;

        float downT = 1.0 - vUv.y; // 0 at nozzle exit, 1 at bottom tip
        float activeLen = clamp(uThrottle, 0.18, 1.0);
        if (downT > activeLen) discard;

        float ndv = abs(dot(normalize(vNormal), normalize(vViewDir)));
        float cylCore = pow(ndv, 1.15);

        // High-speed downward scrolling cellular flame streaks
        vec2 flowUV = vec2(vUv.x * 8.0, downT * 6.5 - uTime * 22.0);
        float flameCells = flameFbm(flowUV);
        float fineStreaks = noise(vec2(vUv.x * 24.0, downT * 14.0 - uTime * 38.0));

        // Crisp standing Mach shock diamond nodes along the supersonic jet
        float shockPeriod = downT * 46.0 - uTime * 6.0;
        float machDiamond = pow(max(0.0, cos(shockPeriod)), 6.0) * smoothstep(0.72, 0.0, downT) * pow(ndv, 1.8);
        float machXWave   = pow(max(0.0, sin(shockPeriod)), 4.0) * smoothstep(0.60, 0.02, downT) * smoothstep(0.3, 0.85, ndv);

        // Erode outer edge & lower tail into distinct flame tongues
        float groundDist = vLocalPos.y - uGroundClipY;
        float groundFade = smoothstep(0.0, 0.65, groundDist);
        float tailErode = smoothstep(activeLen, activeLen * 0.25, downT + (1.0 - flameCells) * 0.22 * downT);
        float edgeErode = smoothstep(0.08, 0.48, cylCore + (flameCells - 0.42) * 0.38);

        float alpha = clamp(edgeErode * tailErode * groundFade * uThrottle * 0.94, 0.0, 0.96);
        if (alpha < 0.02) discard;

        // High-contrast physical rocket flame palette (NormalBlending preserves rich orange-red in daylight!)
        vec3 colCrimsonEdge = vec3(0.88, 0.14, 0.01);
        vec3 colMoltenOrange = vec3(1.22, 0.44, 0.03);
        vec3 colGoldenYellow = vec3(1.48, 0.95, 0.28);
        vec3 colShockWhite   = vec3(1.85, 1.72, 1.38);

        float heat = clamp(
          pow(cylCore, 1.45) * (1.08 - downT * 0.78) +
          (flameCells - 0.45) * 0.35 +
          (fineStreaks - 0.5) * 0.18 +
          machXWave * 0.32,
          0.0, 1.0
        );

        vec3 col = mix(colCrimsonEdge, colMoltenOrange, smoothstep(0.05, 0.42, heat));
        col = mix(col, colGoldenYellow, smoothstep(0.40, 0.78, heat));
        col = mix(col, colShockWhite, clamp(smoothstep(0.76, 0.98, heat) + machDiamond * 0.95, 0.0, 1.0));

        gl_FragColor = vec4(col, alpha);
      }
    `
  });

  const outerPlumeMesh = new THREE.Mesh(coneGeo, exhaustMat);
  outerPlumeMesh.renderOrder = 2;
  exhaustGroup.add(outerPlumeMesh);

  // 9B. Razor-Sharp Inner Mach Shock-Diamond Core & 9 Individual Raptor Nozzle Exit Streams
  const machCoreMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.NormalBlending,
    uniforms: sharedExhaustUniforms,
    vertexShader: /* glsl */ `
      varying vec2 vUv;
      varying vec3 vLocalPos;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      void main() {
        vUv = uv;
        vLocalPos = position;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vNormal = normalize(mat3(modelMatrix) * normal);
        vViewDir = normalize(cameraPosition - wp.xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */ `
      varying vec2 vUv;
      varying vec3 vLocalPos;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      uniform float uTime;
      uniform float uThrottle;
      uniform float uGroundClipY;

      void main() {
        if (uThrottle <= 0.01) discard;
        if (vLocalPos.y < uGroundClipY) discard;

        float downT = 1.0 - vUv.y;
        float ndv = abs(dot(normalize(vNormal), normalize(vViewDir)));

        // Standing supersonic Mach shock diamonds (7 sharp nodes down the core)
        float phase = downT * 44.0 - uTime * 5.0;
        float diamondNode = pow(max(0.0, cos(phase)), 5.0);
        float coreAxis = pow(ndv, 1.5);

        float groundFade = smoothstep(0.0, 0.45, vLocalPos.y - uGroundClipY);
        float axialFade = smoothstep(1.0, 0.08, downT) * smoothstep(0.0, 0.03, downT);

        float alpha = clamp(coreAxis * axialFade * groundFade * (0.55 + 0.45 * diamondNode) * uThrottle, 0.0, 0.96);
        if (alpha < 0.02) discard;

        vec3 colAmber  = vec3(1.25, 0.58, 0.08);
        vec3 colYellow = vec3(1.60, 1.28, 0.52);
        vec3 colWhite  = vec3(2.10, 1.98, 1.70);

        float tCol = clamp(coreAxis * 0.65 + diamondNode * 0.55, 0.0, 1.0);
        vec3 col = mix(colAmber, colYellow, smoothstep(0.1, 0.55, tCol));
        col = mix(col, colWhite, smoothstep(0.52, 0.92, tCol));

        gl_FragColor = vec4(col, alpha);
      }
    `
  });

  // Central coalesced Mach shock diamond core
  const innerCoreGeo = new THREE.CylinderGeometry(1.85, 0.45, 16.0, 32, 32, true);
  innerCoreGeo.translate(0, -16.0 * 0.5, 0);
  const innerCoreMesh = new THREE.Mesh(innerCoreGeo, machCoreMat);
  innerCoreMesh.renderOrder = 3;
  exhaustGroup.add(innerCoreMesh);

  // 9 Individual High-Velocity Raptor Nozzle Exit Jets (3 inner sea-level + 6 outer vacuum)
  const nozzleJetGeo = new THREE.CylinderGeometry(0.62, 0.28, 6.2, 16, 16, true);
  nozzleJetGeo.translate(0, -6.2 * 0.5, 0);
  for (let i = 0; i < 3; i++) {
    const angSL = (i * Math.PI * 2) / 3 + 0.25;
    const jet = new THREE.Mesh(nozzleJetGeo, machCoreMat);
    jet.position.set(Math.cos(angSL) * 1.15, 0.1, Math.sin(angSL) * 1.15);
    jet.renderOrder = 3;
    exhaustGroup.add(jet);
  }
  const vacJetGeo = new THREE.CylinderGeometry(0.88, 0.42, 7.2, 16, 16, true);
  vacJetGeo.translate(0, -7.2 * 0.5, 0);
  for (let i = 0; i < 6; i++) {
    const angVac = (i * Math.PI * 2) / 6 + 0.12;
    const jet = new THREE.Mesh(vacJetGeo, machCoreMat);
    jet.position.set(Math.cos(angVac) * 2.85, -0.25, Math.sin(angVac) * 2.85);
    jet.renderOrder = 3;
    exhaustGroup.add(jet);
  }

  // 9C. Concrete Pad Plasma Impingement Deflection Disc (when rocket is near pad)
  const padFlareGeo = new THREE.RingGeometry(0.3, 17.5, 48, 8);
  padFlareGeo.rotateX(-Math.PI / 2);

  const padFlareMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.NormalBlending,
    uniforms: {
      uTime: { value: 0 },
      uPadIntensity: { value: 0 }
    },
    vertexShader: /* glsl */ `
      varying vec3 vPos;
      void main() {
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */ `
      varying vec3 vPos;
      uniform float uTime;
      uniform float uPadIntensity;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }
      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
          mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }

      void main() {
        if (uPadIntensity <= 0.005) discard;
        float r = length(vPos.xz);
        float normR = clamp(r / 17.5, 0.0, 1.0);
        float ang = atan(vPos.z, vPos.x);

        // Radial supersonic ground-wash flame streaks shooting outward across the concrete pad
        float n1 = 1.0 - abs(noise(vec2(ang * 8.0, normR * 6.0 - uTime * 14.0)) * 2.0 - 1.0);
        float n2 = noise(vec2(ang * 16.0 + 3.1, normR * 10.0 - uTime * 22.0));
        float radialFalloff = pow(1.0 - normR, 1.85) * smoothstep(0.0, 0.06, normR);

        float val = clamp(radialFalloff * (0.42 + 0.68 * n1 * n2) * uPadIntensity, 0.0, 0.92);
        vec3 col = mix(vec3(1.05, 0.25, 0.02), vec3(1.65, 1.32, 0.68), pow(1.0 - normR, 2.0));

        gl_FragColor = vec4(col, val);
      }
    `
  });

  const padFlareMesh = new THREE.Mesh(padFlareGeo, padFlareMat);
  padFlareMesh.position.y = 0.06;
  scene.add(padFlareMesh);

  return { exhaustGroup, exhaustMat, padFlareMesh, padFlareMat };
}

const plasmaSystem = createPlasmaExhaustSystem();
plasmaSystem.exhaustGroup.position.y = 2.25; // Directly at Raptor nozzle exits
starshipGroup.add(plasmaSystem.exhaustGroup);

// ============================================================================
// 10. HIGH-CONTRAST SCULPTED CAULIFLOWER VOLUMETRIC SMOKE, DUST & SPARKS SYSTEM
// ============================================================================
function createVolumetricSmokeAndSparksSystem() {
  const MAX_SMOKE = 1600;
  const positions = new Float32Array(MAX_SMOKE * 3);
  const velocities = new Float32Array(MAX_SMOKE * 3);
  const params = new Float32Array(MAX_SMOKE * 4); // x: age, y: maxAge, z: startSize, w: endSize
  const extras = new Float32Array(MAX_SMOKE * 4); // x: rotAngle, y: rotSpeed, z: shadeSeed, w: kind (0=padSmoke, 1=plumeTrail, 2=cryoVent)

  for (let i = 0; i < MAX_SMOKE; i++) {
    params[i * 4] = 999.0; // Inactive initially
    params[i * 4 + 1] = 1.0;
  }

  const smokeGeo = new THREE.BufferGeometry();
  const posAttr = new THREE.BufferAttribute(positions, 3);
  const paramAttr = new THREE.BufferAttribute(params, 4);
  const extraAttr = new THREE.BufferAttribute(extras, 4);
  posAttr.setUsage(THREE.DynamicDrawUsage);
  paramAttr.setUsage(THREE.DynamicDrawUsage);
  extraAttr.setUsage(THREE.DynamicDrawUsage);

  smokeGeo.setAttribute('position', posAttr);
  smokeGeo.setAttribute('aParams', paramAttr);
  smokeGeo.setAttribute('aExtras', extraAttr);

  const smokeMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: {
      uTex: { value: puffNormalAlphaTex },
      uScale: { value: window.innerHeight * renderer.getPixelRatio() * 0.55 },
      uSunDir: { value: sunLight.position.clone().normalize() },
      uFlamePos: { value: new THREE.Vector3(0, 2.0, 0) },
      uFlameIntensity: { value: 0.0 }
    },
    vertexShader: /* glsl */ `
      attribute vec4 aParams;
      attribute vec4 aExtras;

      varying float vLife;
      varying float vRot;
      varying float vSeed;
      varying float vKind;
      varying vec3 vWorldPos;

      uniform float uScale;

      void main() {
        float age = aParams.x;
        float maxAge = aParams.y;
        vLife = clamp(age / max(maxAge, 0.001), 0.0, 1.0);

        if (age >= maxAge) {
          gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
          gl_PointSize = 0.0;
          return;
        }

        vRot = aExtras.x + age * aExtras.y;
        vSeed = aExtras.z;
        vKind = aExtras.w;
        vWorldPos = position;

        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        // Smooth billowing expansion curve
        float grow = 1.0 - pow(1.0 - vLife, 2.3);
        float worldSize = mix(aParams.z, aParams.w, grow);

        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = clamp((worldSize * uScale) / max(-mvPosition.z, 1.0), 2.0, 380.0);
      }
    `,
    fragmentShader: /* glsl */ `
      varying float vLife;
      varying float vRot;
      varying float vSeed;
      varying float vKind;
      varying vec3 vWorldPos;

      uniform sampler2D uTex;
      uniform vec3 uSunDir;
      uniform vec3 uFlamePos;
      uniform float uFlameIntensity;

      vec2 hash22(vec2 p) {
        p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
        return fract(sin(p) * 43758.5453123);
      }

      // Isotropic round cauliflower bubble detail for crisp 3D smoke folds
      float roundSmokePuffs(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        float maxP = 0.0;
        for (int y = -1; y <= 1; y++) {
          for (int x = -1; x <= 1; x++) {
            vec2 nb = vec2(float(x), float(y));
            vec2 rnd = hash22(i + nb);
            vec2 center = nb + 0.5 + 0.35 * sin(rnd * 6.2831853);
            float r = length(f - center);
            float rad = 0.65 + 0.25 * rnd.x;
            maxP = max(maxP, smoothstep(rad, rad * 0.10, r));
          }
        }
        return maxP;
      }

      void main() {
        if (vLife >= 1.0) discard;

        // Rotate sprite UV for organic rolling motion
        vec2 centered = gl_PointCoord - 0.5;
        float c = cos(vRot);
        float s = sin(vRot);
        vec2 rotUV = vec2(centered.x * c - centered.y * s, centered.x * s + centered.y * c) + 0.5;

        vec4 samp = texture2D(uTex, rotUV);
        float texAlpha = samp.a;
        if (texAlpha < 0.02) discard;

        // Unpack normal (R,G) and cauliflower crease AO (B)
        vec2 nXY = samp.rg * 2.0 - 1.0;
        float creaseAO = samp.b;
        float nz = sqrt(max(0.05, 1.0 - min(0.95, dot(nXY, nXY))));
        vec3 nWorld = normalize(vec3(
          nXY.x * c - nXY.y * s,
          nXY.x * s + nXY.y * c,
          nz
        ));

        // Add crisp per-pixel isotropic round cauliflower folds
        vec2 pSeed = vec2(vSeed * 11.3, vSeed * 7.1);
        float procBillow = roundSmokePuffs(rotUV * 3.6 + pSeed) * 0.62 +
                           roundSmokePuffs(rotUV * 7.4 - pSeed) * 0.38;
        float foldRelief = clamp(creaseAO * 0.52 + procBillow * 0.58, 0.0, 1.0);

        // 1. High-Contrast Directional Sunlight + Deep Cauliflower Crevice Shadowing
        float sunDiff = clamp(dot(nWorld, uSunDir) * 0.58 + 0.42, 0.0, 1.0);
        float dustWarmth = (1.0 - clamp(vWorldPos.y / 18.0, 0.0, 1.0)) * 0.48;

        vec3 deepCrevice = mix(vec3(0.14, 0.17, 0.23), vec3(0.22, 0.19, 0.17), dustWarmth);
        vec3 midBillow   = mix(vec3(0.52, 0.58, 0.67), vec3(0.60, 0.56, 0.52), dustWarmth);
        vec3 litCrown    = mix(vec3(0.99, 0.98, 0.96), vec3(0.95, 0.91, 0.85), dustWarmth * 0.45);

        float lightTerm = clamp(sunDiff * pow(foldRelief, 1.25) * (0.85 + 0.15 * vSeed), 0.0, 1.0);
        vec3 smokeCol = mix(deepCrevice, midBillow, smoothstep(0.06, 0.44, lightTerm));
        smokeCol = mix(smokeCol, litCrown, smoothstep(0.42, 0.82, lightTerm));

        // 2. Internal Molten Orange-Red Fire Glow inside the smoke collar near the exhaust jet
        if (uFlameIntensity > 0.01 && vKind < 1.5) {
          vec3 toFlame = uFlamePos - vWorldPos;
          float dist = length(toFlame);
          vec3 flameDir = toFlame / max(dist, 0.1);
          float flameFace = clamp(dot(nWorld, flameDir) * 0.6 + 0.4, 0.0, 1.0);
          float atten = 1.0 / (1.0 + dist * 0.075 + dist * dist * 0.0042);

          vec3 fireAmber = vec3(1.05, 0.52, 0.08);
          vec3 fireDeep  = vec3(0.92, 0.22, 0.02);
          vec3 fireTint  = mix(fireDeep, fireAmber, clamp(atten * 1.6, 0.0, 1.0));
          // Glow strongest inside the billow crevices facing the flame
          smokeCol = mix(smokeCol, fireTint, clamp(atten * flameFace * uFlameIntensity * 1.45, 0.0, 0.88));
        }

        // Erode outer edge with procedural billow detail so puffs never look like smooth circles
        float crispAlpha = smoothstep(0.08, 0.55, texAlpha * (0.65 + 0.55 * procBillow));
        float fadeIn = smoothstep(0.0, 0.06, vLife);
        float fadeOut = pow(1.0 - vLife, 1.45);
        float baseOpacity = (vKind > 1.5) ? 0.42 : 0.78;
        float finalAlpha = crispAlpha * fadeIn * fadeOut * baseOpacity;

        gl_FragColor = vec4(smokeCol, finalAlpha);
      }
    `
  });

  const smokePoints = new THREE.Points(smokeGeo, smokeMat);
  smokePoints.frustumCulled = false;
  smokePoints.renderOrder = 1;
  scene.add(smokePoints);

  // Hot Ignition Sparks & Pad Cinders Particle System
  const MAX_SPARKS = 260;
  const sparkPos = new Float32Array(MAX_SPARKS * 3);
  const sparkVel = new Float32Array(MAX_SPARKS * 3);
  const sparkLife = new Float32Array(MAX_SPARKS * 2); // age, maxAge
  for (let i = 0; i < MAX_SPARKS; i++) {
    sparkLife[i * 2] = 999.0;
    sparkLife[i * 2 + 1] = 1.0;
  }
  const sparkGeo = new THREE.BufferGeometry();
  const sparkPosAttr = new THREE.BufferAttribute(sparkPos, 3);
  sparkPosAttr.setUsage(THREE.DynamicDrawUsage);
  sparkGeo.setAttribute('position', sparkPosAttr);

  const sparkMat = new THREE.PointsMaterial({
    color: 0xff9a2e,
    size: 0.46,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const sparkPoints = new THREE.Points(sparkGeo, sparkMat);
  sparkPoints.frustumCulled = false;
  scene.add(sparkPoints);

  let nextSmokeIdx = 0;
  let nextSparkIdx = 0;
  const prng = mulberry32(77319);

  function spawnSmoke({
    x, y, z,
    vx, vy, vz,
    maxAge = 4.5,
    startSize = 3.5,
    endSize = 18.0,
    kind = 0
  }) {
    const i = nextSmokeIdx;
    nextSmokeIdx = (nextSmokeIdx + 1) % MAX_SMOKE;

    positions[i * 3] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;

    velocities[i * 3] = vx;
    velocities[i * 3 + 1] = vy;
    velocities[i * 3 + 2] = vz;

    params[i * 4] = 0.0;
    params[i * 4 + 1] = maxAge;
    params[i * 4 + 2] = startSize;
    params[i * 4 + 3] = endSize;

    extras[i * 4] = prng() * Math.PI * 2;
    extras[i * 4 + 1] = (prng() - 0.5) * 1.15;
    extras[i * 4 + 2] = prng();
    extras[i * 4 + 3] = kind;
  }

  function spawnSpark(x, y, z, vx, vy, vz, maxAge) {
    const i = nextSparkIdx;
    nextSparkIdx = (nextSparkIdx + 1) % MAX_SPARKS;
    sparkPos[i * 3] = x;
    sparkPos[i * 3 + 1] = y;
    sparkPos[i * 3 + 2] = z;
    sparkVel[i * 3] = vx;
    sparkVel[i * 3 + 1] = vy;
    sparkVel[i * 3 + 2] = vz;
    sparkLife[i * 2] = 0.0;
    sparkLife[i * 2 + 1] = maxAge;
  }

  function update(dt, rocketY, rocketVel, throttle) {
    // 1. Crisp Quick-Disconnect (QD) Umbilical Cryogenic LOX Venting on Pad & Liftoff Disconnect
    if (rocketY < 35 && prng() < 0.65) {
      spawnSmoke({
        x: -ROCKET_R - 0.35 - prng() * 0.4,
        y: 14.5 + (prng() - 0.5) * 0.8,
        z: -1.1 + (prng() - 0.5) * 0.5,
        vx: -1.8 - prng() * 1.6,
        vy: -0.9 - prng() * 0.8,
        vz: (prng() - 0.5) * 1.2,
        maxAge: 1.4 + prng() * 0.9,
        startSize: 0.9,
        endSize: 3.4,
        kind: 2
      });
    }

    // 2. Engine Ignition & Liftoff Sculpted Cauliflower Smoke + Pad Dust Emission
    if (throttle > 0.02) {
      const nozzleWorldY = rocketY + 2.25;
      const padProximity = clamp(1.0 - rocketY / 48.0, 0.0, 1.0);

      // A. Radial Ground-Surge Cauliflower Smoke & Dust Rolling Outward Across the Concrete Pad
      // Spawned at rStart >= 4.2m so the central supersonic orange-white plasma jet stays 100% clear!
      if (padProximity > 0.05) {
        const groundSpawnCount = Math.ceil((8 + 14 * throttle) * padProximity);
        for (let k = 0; k < groundSpawnCount; k++) {
          const az = prng() * Math.PI * 2;
          const rStart = 4.2 + prng() * 5.2 + (1.0 - padProximity) * 3.5;
          const speed = (14.0 + prng() * 22.0) * throttle * (0.55 + 0.45 * padProximity);

          spawnSmoke({
            x: Math.cos(az) * rStart,
            y: 0.9 + prng() * 2.4,
            z: Math.sin(az) * rStart,
            vx: Math.cos(az) * speed,
            vy: 1.1 + prng() * 3.8,
            vz: Math.sin(az) * speed,
            maxAge: 3.4 + prng() * 3.2,
            startSize: 3.8 + prng() * 3.2,
            endSize: 18.5 + prng() * 14.5,
            kind: 0
          });
        }

        // B. Incandescent Pad Deflection Sparks & Cinders
        const sparkCount = Math.ceil(6 * throttle * padProximity);
        for (let s = 0; s < sparkCount; s++) {
          const az = prng() * Math.PI * 2;
          const spd = (18.0 + prng() * 28.0) * throttle;
          spawnSpark(
            Math.cos(az) * (2.2 + prng() * 2.5),
            0.35 + prng() * 0.9,
            Math.sin(az) * (2.2 + prng() * 2.5),
            Math.cos(az) * spd,
            4.5 + prng() * 9.5,
            Math.sin(az) * spd,
            0.55 + prng() * 0.75
          );
        }
      }

      // C. Vertical Exhaust Smoke Wake Trailing BELOW the Supersonic Plasma Flame Cone
      // Starts at distDown >= 8.5m below the nozzles so the upper plasma flame & Mach shock diamonds are unobstructed!
      const columnSpawnCount = Math.ceil(6 + 9 * throttle);
      for (let k = 0; k < columnSpawnCount; k++) {
        const az = prng() * Math.PI * 2;
        const distDown = 8.5 + prng() * 14.5 * throttle;
        const spawnY = Math.max(1.0, nozzleWorldY - distDown);
        const hitsPad = spawnY < 2.6;
        const rSpread = hitsPad ? (4.2 + prng() * 3.5) : (1.6 + prng() * 2.6 + (distDown - 8.0) * 0.18);
        const lateralSpd = (2.8 + prng() * 6.0) * throttle;

        const outBoost = hitsPad ? (12.0 + prng() * 14.0) * throttle : lateralSpd;
        const downVel = hitsPad ? (1.4 + prng() * 3.0) : (-16.0 - prng() * 12.0 + rocketVel * 0.25);

        spawnSmoke({
          x: Math.cos(az) * rSpread,
          y: spawnY,
          z: Math.sin(az) * rSpread,
          vx: Math.cos(az) * outBoost,
          vy: downVel,
          vz: Math.sin(az) * outBoost,
          maxAge: 2.8 + prng() * 2.6,
          startSize: 3.6 + prng() * 2.8,
          endSize: 16.5 + prng() * 13.5,
          kind: 1
        });
      }
    }

    // 3. Integrate Smoke Particle Physics (Drag, Thermal Buoyancy, Turbulent Curl & Ground Collision)
    for (let i = 0; i < MAX_SMOKE; i++) {
      const i4 = i * 4;
      let age = params[i4];
      const maxAge = params[i4 + 1];
      if (age >= maxAge) continue;

      age += dt;
      params[i4] = age;
      if (age >= maxAge) continue;

      const i3 = i * 3;
      let x = positions[i3];
      let y = positions[i3 + 1];
      let z = positions[i3 + 2];
      let vx = velocities[i3];
      let vy = velocities[i3 + 1];
      let vz = velocities[i3 + 2];
      const kind = extras[i4 + 3];

      const drag = Math.exp(-(kind === 0 ? 1.32 : 1.05) * dt);
      vx *= drag;
      vz *= drag;

      if (kind < 1.5) {
        vy = vy * Math.exp(-1.4 * dt) + (2.6 + extras[i4 + 2] * 2.4) * dt;
      } else {
        vx -= 1.1 * dt;
      }

      x += vx * dt;
      y += vy * dt;
      z += vz * dt;

      const minY = Math.max(0.85, params[i4 + 2] * 0.22);
      if (y < minY) {
        y = minY;
        if (vy < 0) {
          const rHoriz = Math.hypot(x, z) + 0.001;
          const push = Math.abs(vy) * 0.55;
          vx += (x / rHoriz) * push;
          vz += (z / rHoriz) * push;
          vy = 0.65 + extras[i4 + 2] * 1.1;
        }
      }

      positions[i3] = x;
      positions[i3 + 1] = y;
      positions[i3 + 2] = z;
      velocities[i3] = vx;
      velocities[i3 + 1] = vy;
      velocities[i3 + 2] = vz;
    }

    // 4. Integrate Ignition Sparks
    for (let i = 0; i < MAX_SPARKS; i++) {
      const i2 = i * 2;
      let age = sparkLife[i2];
      const maxAge = sparkLife[i2 + 1];
      if (age >= maxAge) {
        sparkPos[i * 3 + 1] = -999;
        continue;
      }
      age += dt;
      sparkLife[i2] = age;

      const i3 = i * 3;
      sparkVel[i3 + 1] -= 18.0 * dt;
      sparkPos[i3] += sparkVel[i3] * dt;
      sparkPos[i3 + 1] += sparkVel[i3 + 1] * dt;
      sparkPos[i3 + 2] += sparkVel[i3 + 2] * dt;

      if (sparkPos[i3 + 1] < 0.08) {
        sparkPos[i3 + 1] = 0.08;
        sparkVel[i3 + 1] *= -0.42;
      }
    }

    posAttr.needsUpdate = true;
    paramAttr.needsUpdate = true;
    extraAttr.needsUpdate = true;
    sparkPosAttr.needsUpdate = true;

    smokeMat.uniforms.uFlamePos.value.set(0, Math.max(2.0, rocketY - 2.5), 0);
    smokeMat.uniforms.uFlameIntensity.value = throttle * 1.45;
  }

  function reset() {
    for (let i = 0; i < MAX_SMOKE; i++) {
      params[i * 4] = 999.0;
    }
    for (let i = 0; i < MAX_SPARKS; i++) {
      sparkLife[i * 2] = 999.0;
      sparkPos[i * 3 + 1] = -999;
    }
    posAttr.needsUpdate = true;
    paramAttr.needsUpdate = true;
    sparkPosAttr.needsUpdate = true;
  }

  return { update, reset, smokeMat };
}

const particleSystem = createVolumetricSmokeAndSparksSystem();

// ============================================================================
// 11. LAUNCH SEQUENCE STATE MACHINE, PHYSICS, CAMERA SHAKE & HUD CONTROLS
// ============================================================================
// Launch Timeline (seconds):
//   t in [0.0, 1.8)   : Pre-Launch Countdown on Pad (T - 00:01.8 -> T - 00:00.0)
//   t in [1.8, 4.4)   : Raptor Engine Ignition, Plasma Exhaust Build, Pad Smoke & Seismic Shake
//   t >= 4.4          : Liftoff & Gravity-Defying Acceleration into the Starry Upper Sky
const T_IGNITION = 1.8;
const T_LIFTOFF = 4.4;

let simTime = 0.0;
let isPaused = false;
let waitingForManualTrigger = false; // If user clicks Reset, hold at pad until they click Launch
let rocketY = 0.0;
let rocketVel = 0.0;
let prevTrackedY = HERO_CAM_TARGET.y;
let cubeFrameCounter = 0;

// UI DOM Elements
const statusDotEl = document.getElementById('status-dot');
const statusTextEl = document.getElementById('status-text');
const teleTimeEl = document.getElementById('tele-time');
const teleAltEl = document.getElementById('tele-alt');
const teleVelEl = document.getElementById('tele-vel');
const btnLaunch = document.getElementById('btn-launch');
const btnLaunchLabel = document.getElementById('btn-launch-label');
const btnPause = document.getElementById('btn-pause');
const btnPauseLabel = document.getElementById('btn-pause-label');
const btnReset = document.getElementById('btn-reset');

function triggerLaunchNow() {
  isPaused = false;
  waitingForManualTrigger = false;
  userInteractingWithCam = false;
  btnPause.classList.remove('active-toggle');
  btnPauseLabel.textContent = 'Pause';

  if (simTime < T_IGNITION || simTime > T_LIFTOFF + 1.0) {
    // Reset to exact Engine Ignition moment (T-0)
    particleSystem.reset();
    simTime = T_IGNITION;
    rocketY = 0.0;
    rocketVel = 0.0;
    prevTrackedY = HERO_CAM_TARGET.y;
    starshipGroup.position.set(0, 0, 0);
    starshipGroup.rotation.set(0, 0, 0);
    controls.reset();
    camera.position.copy(HERO_CAM_POS);
    controls.target.copy(HERO_CAM_TARGET);
    controls.update();
  }
}

function togglePause() {
  isPaused = !isPaused;
  if (isPaused) {
    btnPause.classList.add('active-toggle');
    btnPauseLabel.textContent = 'Resume';
  } else {
    btnPause.classList.remove('active-toggle');
    btnPauseLabel.textContent = 'Pause';
  }
}

function resetToPad() {
  isPaused = false;
  waitingForManualTrigger = true;
  userInteractingWithCam = false;
  btnPause.classList.remove('active-toggle');
  btnPauseLabel.textContent = 'Pause';
  btnLaunchLabel.textContent = 'Launch';

  simTime = 0.0;
  rocketY = 0.0;
  rocketVel = 0.0;
  prevTrackedY = HERO_CAM_TARGET.y;

  starshipGroup.position.set(0, 0, 0);
  starshipGroup.rotation.set(0, 0, 0);
  particleSystem.reset();

  controls.reset();
  camera.position.copy(HERO_CAM_POS);
  controls.target.copy(HERO_CAM_TARGET);
  controls.update();
}

btnLaunch.addEventListener('click', triggerLaunchNow);
btnPause.addEventListener('click', togglePause);
btnReset.addEventListener('click', resetToPad);

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (waitingForManualTrigger) triggerLaunchNow();
    else togglePause();
  } else if (e.key === 'r' || e.key === 'R') {
    resetToPad();
  } else if (e.key === 'l' || e.key === 'L') {
    triggerLaunchNow();
  }
});

const _shakeOffset = new THREE.Vector3();
let _prevShakeApplied = new THREE.Vector3();

function updateSimulation(dt) {
  // Remove previous frame's camera shake before OrbitControls & camera tracking update
  camera.position.sub(_prevShakeApplied);
  _prevShakeApplied.set(0, 0, 0);

  if (!isPaused && !waitingForManualTrigger) {
    simTime += dt;
  }

  // --------------------------------------------------------------------------
  // A. EVALUATE ENGINE THROTTLE, ROCKET ALTITUDE, VELOCITY & PITCH
  // --------------------------------------------------------------------------
  let throttle = 0.0;
  if (simTime >= T_IGNITION) {
    const igElapsed = simTime - T_IGNITION;
    // Rapid staggered Raptor startup ramp with high-frequency combustion flicker
    const baseRamp = smootherstep(0.0, 1.45, igElapsed);
    const flicker = 0.94 + 0.06 * Math.sin(simTime * 54.0) * Math.cos(simTime * 37.0);
    throttle = clamp(baseRamp * flicker, 0.0, 1.0);
  }

  if (simTime < T_LIFTOFF) {
    rocketY = 0.0;
    rocketVel = 0.0;
    starshipGroup.position.set(0, 0, 0);
    starshipGroup.rotation.set(0, 0, 0);
  } else {
    const flightT = simTime - T_LIFTOFF;
    // Realistic heavy-lift gravity-defying acceleration profile:
    // Slow majestic initial pad clearance (T/W ~ 1.22), progressively building acceleration as propellant burns
    const a0 = 1.65; // initial net upward acceleration (m/s^2)
    const jerk = 0.24; // progressive acceleration increase (m/s^3)
    rocketY = 0.5 * a0 * flightT * flightT + (1.0 / 6.0) * jerk * flightT * flightT * flightT;
    rocketVel = a0 * flightT + 0.5 * jerk * flightT * flightT;

    // Subtle aerodynamic gravity-turn pitch maneuver above 65m altitude
    const pitchT = smootherstep(4.5, 22.0, flightT);
    const downrangeX = pitchT * pitchT * 14.0;
    const pitchAngle = -pitchT * 0.075;

    starshipGroup.position.set(downrangeX, rocketY, 0);
    starshipGroup.rotation.set(0, 0, pitchAngle);
  }

  // Update the Rocket Launch Holder Tower, Chopstick Arms, QD Umbilical & Base Hold-Down Clamps
  rocketHolderSystem.update(simTime, T_IGNITION, T_LIFTOFF);
  skyDomeMat.uniforms.uRocketAlt.value = rocketY;

  // --------------------------------------------------------------------------
  // B. UPDATE PLASMA EXHAUST CONE, RAPTOR THROATS & DYNAMIC POINT LIGHTS
  // --------------------------------------------------------------------------
  plasmaSystem.exhaustMat.uniforms.uTime.value = simTime * 1.0;
  plasmaSystem.exhaustMat.uniforms.uThrottle.value = throttle;
  // Local Y of the concrete pad relative to the Raptor nozzle exits (at starshipY + 2.25)
  plasmaSystem.exhaustMat.uniforms.uGroundClipY.value = -(rocketY + 2.20);

  // Pad impingement radial plasma flare disc intensity
  const padFlareFactor = throttle * smoothstep(26.0, 0.0, rocketY);
  plasmaSystem.padFlareMat.uniforms.uTime.value = simTime;
  plasmaSystem.padFlareMat.uniforms.uPadIntensity.value = padFlareFactor;
  plasmaSystem.padFlareMesh.position.x = starshipGroup.position.x;

  // Raptor combustion chamber throat glow
  for (const mat of starshipObj.nozzleInteriorMats) {
    mat.emissiveIntensity = throttle * 6.5;
  }

  // Dynamic Point Lights reflecting fiery warmth across metallic hull & concrete ground
  const lightPulse = 0.88 + 0.12 * Math.sin(simTime * 63.0) * Math.sin(simTime * 41.0);
  engineCoreLight.position.set(starshipGroup.position.x, rocketY + 1.8, 1.5);
  engineCoreLight.intensity = throttle * 145.0 * lightPulse;

  const padAtten = smoothstep(75.0, 0.0, rocketY);
  padBounceLight.position.set(starshipGroup.position.x * 0.4, 2.6, 5.5);
  padBounceLight.intensity = throttle * padAtten * 195.0 * lightPulse;

  // Keep directional sun shadow frustum centered on the Starship during ascent
  if (rocketY < 160) {
    sunLight.target.position.set(starshipGroup.position.x, rocketY + 18, 0);
    sunLight.position.set(starshipGroup.position.x + 110, rocketY + 145, 130);
  }

  // --------------------------------------------------------------------------
  // C. UPDATE GPU VOLUMETRIC SMOKE, DUST & SPARKS
  // --------------------------------------------------------------------------
  if (!isPaused) {
    particleSystem.update(dt, rocketY, rocketVel, throttle);
  }

  // --------------------------------------------------------------------------
  // D. CAMERA ASCENT TRACKING, ORBITCONTROLS & SEISMIC CAMERA SHAKE
  // --------------------------------------------------------------------------
  // Smoothly tilt and track the Starship's ascent toward the upper sky,
  // dipping slightly at liftoff so both the full 53.8m stainless-steel Starship
  // and its 26m orange-white plasma exhaust cone stay completely framed in view!
  const liftoffDip = smoothstep(0.0, 22.0, rocketY) * 4.2;
  const desiredTrackY = HERO_CAM_TARGET.y + rocketY - liftoffDip;
  const trackDeltaY = desiredTrackY - prevTrackedY;
  prevTrackedY = desiredTrackY;

  // Always move OrbitControls target up with the rocket so the camera tilts smoothly toward the sky
  controls.target.y += trackDeltaY;
  controls.target.x = lerp(controls.target.x, starshipGroup.position.x, 1.0 - Math.exp(-3.0 * dt));

  // Elevate camera position smoothly once the rocket clears the launch tower so the full
  // rocket hull + Mach-diamond plasma plume remain dramatically framed at all altitudes
  if (!userInteractingWithCam && rocketY > 6.0) {
    const chaseClimbFactor = lerp(0.24, 0.93, smoothstep(18.0, 88.0, rocketY));
    camera.position.y += trackDeltaY * chaseClimbFactor;
  }

  controls.update();

  // Seismic Camera Shake during Engine Ignition & Low-Altitude Liftoff
  if (!isPaused && throttle > 0.02) {
    const distToRocket = camera.position.distanceTo(starshipGroup.position);
    const seismicEnv =
      throttle *
      smoothstep(T_IGNITION, T_IGNITION + 0.9, simTime) *
      (1.0 / (1.0 + Math.max(0, distToRocket - 55.0) * 0.018));

    const shakeAmp = 0.24 * seismicEnv;
    const tS = simTime * 38.0;
    _shakeOffset.set(
      (Math.sin(tS * 1.13) * 0.6 + Math.cos(tS * 2.41) * 0.4) * shakeAmp,
      (Math.sin(tS * 1.77 + 1.2) * 0.65 + Math.sin(tS * 3.15) * 0.35) * shakeAmp,
      (Math.cos(tS * 1.39 + 2.4) * 0.45) * shakeAmp
    );
    camera.position.add(_shakeOffset);
    _prevShakeApplied.copy(_shakeOffset);
  }

  // Keep the celestial Sky Dome and Blazing Sun Corona anchored at infinity relative to the camera
  skyDome.position.copy(camera.position);
  blazingSunGroup.position.copy(camera.position).add(SUN_WORLD_POS);

  // --------------------------------------------------------------------------
  // E. UPDATE REAL-TIME CUBE ENVIRONMENT MAP FOR MIRROR-POLISHED CHROME HULL
  // --------------------------------------------------------------------------
  cubeFrameCounter++;
  if (cubeFrameCounter % 2 === 0) {
    starshipGroup.visible = false;
    cubeCamera.position.set(starshipGroup.position.x, rocketY + 24.0, 0);
    skyDome.position.copy(cubeCamera.position);
    blazingSunGroup.position.copy(cubeCamera.position).add(SUN_WORLD_POS);
    cubeCamera.update(renderer, scene);
    skyDome.position.copy(camera.position);
    blazingSunGroup.position.copy(camera.position).add(SUN_WORLD_POS);
    starshipGroup.visible = true;
  }

  // --------------------------------------------------------------------------
  // F. UPDATE ON-SCREEN HUD TELEMETRY & STATUS
  // --------------------------------------------------------------------------
  skyDomeMat.uniforms.uTime.value = simTime;
  skyDomeMat.uniforms.uRocketAlt.value = rocketY;

  const missionClock = simTime - T_IGNITION;
  const signChar = missionClock < 0 ? 'T- ' : 'T+ ';
  const absClock = Math.abs(missionClock);
  const mins = String(Math.floor(absClock / 60)).padStart(2, '0');
  const secs = (absClock % 60).toFixed(1).padStart(4, '0');
  teleTimeEl.textContent = `${signChar}${mins}:${secs}`;
  teleAltEl.textContent = rocketY >= 1000 ? `${(rocketY / 1000).toFixed(2)} km` : `${rocketY.toFixed(1)} m`;
  teleVelEl.textContent = `${rocketVel.toFixed(1)} m/s`;

  statusDotEl.className = 'status-dot';
  if (isPaused) {
    statusDotEl.classList.add('paused');
    statusTextEl.textContent = 'STARSHIP \u2022 PAUSED';
  } else if (waitingForManualTrigger) {
    statusTextEl.textContent = 'STARSHIP \u2022 READY ON PAD';
  } else if (simTime < T_IGNITION) {
    statusTextEl.textContent = 'STARSHIP \u2022 AUTO-SEQUENCE';
  } else if (simTime < T_LIFTOFF) {
    statusDotEl.classList.add('ignition');
    statusTextEl.textContent = 'RAPTOR IGNITION \u2022 THRUST BUILD';
  } else {
    statusDotEl.classList.add('liftoff');
    statusTextEl.textContent = rocketY > 250 ? 'STARSHIP \u2022 ASCENT' : 'STARSHIP \u2022 LIFTOFF';
    btnLaunchLabel.textContent = 'Relaunch';
  }
}

// ============================================================================
// 12. POST-PROCESSING (SUBTLE UNREAL BLOOM FOR GLOWING EXHAUST + ACES OUTPUT)
// ============================================================================
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.28, // Subtle optical bloom strength for the glowing orange-white plasma exhaust & sun glints
  0.45, // Bloom radius
  1.08  // High threshold so only HDR exhaust cone, sparks & concentrated sun glints bloom
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// ============================================================================
// 13. RESIZE HANDLER & MAIN ANIMATION LOOP
// ============================================================================
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  particleSystem.smokeMat.uniforms.uScale.value = h * renderer.getPixelRatio() * 0.55;
});

// Initialize frame 0 immediately
updateSimulation(1 / 60);

let lastNow = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const rawDt = (now - lastNow) * 0.001;
  lastNow = now;
  const dt = clamp(rawDt, 0.001, 0.05);

  updateSimulation(dt);
  composer.render();
}
requestAnimationFrame(animate);
</script>
</body>
</html>
