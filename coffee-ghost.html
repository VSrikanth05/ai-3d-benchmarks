          uTime: sharedClothUniforms.uTime,
          uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
        },
        vertexShader: `
          attribute vec4 aSeed;
          uniform float uTime;
          uniform float uPixelRatio;
          varying float vType;
          varying float vLife;
          varying float vTwinkle;

          void main() {
            float phase = aSeed.x;
            float speed = aSeed.y;
            float sizeBase = aSeed.z;
            vType = aSeed.w;

            // Continuous looping upward drift
            float cycle = fract(uTime * speed * 0.24 + phase * 0.01);
            vLife = smoothstep(0.0, 0.16, cycle) * (1.0 - smoothstep(0.68, 1.0, cycle));

            vec3 p = position;
            p.y = mix(-0.85, 1.65, cycle) + (position.y * 0.25);

            // Gentle helical curl + wind drift toward trailing tail (-X, -Z)
            float swirl = uTime * (0.9 + speed) + phase;
            p.x += sin(swirl) * 0.16 + cos(swirl * 0.63) * 0.08 - cycle * 0.35;
            p.z += cos(swirl * 0.85) * 0.14 - cycle * 0.25;

            vTwinkle = 0.55 + 0.45 * sin(uTime * (3.2 + speed * 5.0) + phase * 3.1);

            vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = (sizeBase * uPixelRatio * (0.65 + 0.55 * vLife)) / max(1.0, -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          varying float vType;
          varying float vLife;
          varying float vTwinkle;

          void main() {
            vec2 uv = gl_PointCoord - 0.5;
            float r = length(uv) * 2.0;
            if (r > 1.0) discard;

            float glow = exp(-r * r * 5.5);

            // Crisp 4-point star flare for sparkles
            float ax = abs(uv.x) * 2.0;
            float ay = abs(uv.y) * 2.0;
            float star = exp(-ax * 14.0) * exp(-ay * 2.6) + exp(-ay * 14.0) * exp(-ax * 2.6);
            float core = exp(-r * r * 18.0);

            float intensity;
            vec3 col;
            if (vType > 0.5) {
              // Twinkling golden-amber sparkle (HDR > 1.0 for subtle bloom)
              intensity = (core * 1.45 + star * 0.72 + glow * 0.35) * vLife * vTwinkle;
              col = mix(vec3(1.15, 0.58, 0.18), vec3(1.45, 1.18, 0.72), core);
            } else {
              // Soft glowing warm orange ember
              intensity = (glow * 0.88 + core * 0.65) * vLife * (0.72 + 0.28 * vTwinkle);
              col = mix(vec3(1.05, 0.32, 0.05), vec3(1.35, 0.76, 0.28), core);
            }

            if (intensity < 0.005) discard;
            gl_FragColor = vec4(col * intensity, intensity);
          }
        `,
      });

      return new THREE.Points(geo, mat);
    }

    const embersPoints = createEmbersAndSparkles(165);
    scene.add(embersPoints);

    // =========================================================================
    // 11. SOFT BLURRED CONTACT GLOW BENEATH THE GHOST (NO FLOOR)
    // =========================================================================
    const contactGlowUniforms = {
      uBobHeight: { value: 0 },
    };

    const contactGlowMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      blending: THREE.NormalBlending,
      uniforms: contactGlowUniforms,
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vWorldPos;
        void main() {
          vUv = uv;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform float uBobHeight;
        varying vec2 vUv;
        varying vec3 vWorldPos;

        void main() {
          vec2 p = (vUv - 0.5) * 2.0;

          // Slightly elongated toward trailing tail (-X, -Z) so the glow echoes the silhouette
          vec2 tailShift = p - vec2(-0.14, -0.10);
          float rTeal = length(vec2(tailShift.x * 0.84, tailShift.y * 0.92));

          // Warm orange coffee bounce pocket shifted gently forward-right beneath the mug
          vec2 warmShift = p - vec2(0.10, 0.28);
          float rWarm = length(warmShift * 1.38);

          // Bob height modulates spread & softness
          float prox = 1.0 - uBobHeight * 0.22;
          float auraTeal = exp(-rTeal * rTeal * (3.1 - uBobHeight * 0.35));
          float auraInner = exp(-rTeal * rTeal * 8.5);
          float auraWarm = exp(-rWarm * rWarm * 6.0);

          float edgeClip = 1.0 - smoothstep(0.65, 1.0, length(p));

          // Soft grazing angle attenuation so orbiting edge-on stays silky
          vec3 V = normalize(cameraPosition - vWorldPos);
          float viewAngle = pow(abs(V.y), 0.32);

          vec3 tealCol = vec3(0.08, 0.44, 0.58) * auraTeal + vec3(0.18, 0.64, 0.78) * auraInner * 0.38;
          vec3 warmCol = vec3(0.75, 0.32, 0.10) * auraWarm * 0.46;

          vec3 col = (tealCol + warmCol) * prox;
          float alpha = clamp((auraTeal * 0.42 + auraWarm * 0.24) * edgeClip * viewAngle * prox, 0.0, 0.72);
          if (alpha < 0.002) discard;

          gl_FragColor = vec4(col, alpha);
        }
      `,
    });

    const contactGlowPlane = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 4.4), contactGlowMat);
    contactGlowPlane.rotation.x = -Math.PI * 0.5;
    contactGlowPlane.position.set(-0.08, -1.34, -0.04);
    scene.add(contactGlowPlane);

    // =========================================================================
    // 12. CALIBRATED LIGHTING (COOL RIM + WARM COFFEE GLOW + SOFT KEY)
    // =========================================================================
    // Soft deep teal-navy ambient hemisphere
    const hemiLight = new THREE.HemisphereLight(0x52b6d4, 0x041520, 0.40);
    scene.add(hemiLight);

    // Gentle cool moonlight key from upper-front-left so cotton folds read cleanly
    const frontKeyLight = new THREE.DirectionalLight(0xbbe7f7, 0.58);
    frontKeyLight.position.set(-1.8, 3.0, 2.8);
    scene.add(frontKeyLight);

    // Cool cyan rim light skimming the ghost's back edge, crown, and trailing tail
    const backRimLight = new THREE.DirectionalLight(0x52d8ff, 1.65);
    backRimLight.position.set(-2.9, 2.1, -3.3);
    scene.add(backRimLight);

    // Secondary subtle cool back-right edge catchlight
    const backSideRim = new THREE.DirectionalLight(0x3ba4cc, 0.62);
    backSideRim.position.set(2.5, 1.3, -2.9);
    scene.add(backSideRim);

    // Warm orange glow from the coffee cup illuminating chest, hands & lower face
    const coffeeGlowLight = new THREE.PointLight(0xff5e14, 0.44, 3.0, 2.0);
    coffeeGlowLight.position.set(0.12, 0.22, 0.92);
    ghostRoot.add(coffeeGlowLight);

    // Soft wider warm amber bounce light for gentle chest & chin fill
    const coffeeBounceLight = new THREE.PointLight(0xff8432, 0.20, 3.4, 1.8);
    coffeeBounceLight.position.set(0.08, 0.14, 1.04);
    ghostRoot.add(coffeeBounceLight);

    // =========================================================================
    // 13. ANIMATION LOOP (BOBBING, CLOTH SWAY, BLINK, SMILE PULSE, RIPPLES)
    // =========================================================================
    const clock = new THREE.Clock();
    const tmpCoffeeWorld = new THREE.Vector3();

    // Deterministic organic blink cycle with occasional playful double-blinks
    function computeBlinkAmount(t) {
      const cycleLen = 4.2;
      const cycleIdx = Math.floor(t / cycleLen);
      const localT = t - cycleIdx * cycleLen;

      const evalSingleBlink = (dt, dur = 0.26) => {
        if (dt < 0 || dt > dur) return 0;
        const u = dt / dur;
        // Fast close, smooth open
        const s = u < 0.42 ? u / 0.42 : (1.0 - (u - 0.42) / 0.58);
        return s * s * (3 - 2 * s);
      };

      let blink = evalSingleBlink(localT - 2.6, 0.25);
      // Every 3rd cycle adds a quick cute double-blink
      if (cycleIdx % 3 === 1) {
        blink = Math.max(blink, evalSingleBlink(localT - 2.94, 0.22));
      }
      return blink;
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      sharedClothUniforms.uTime.value = t;
      coffeeUniforms.uTime.value = t;

      // 1. Slow bobbing float with subtle weightless sway
      const bobPhase = t * 1.18;
      const bobY = Math.sin(bobPhase) * 0.085 + Math.sin(t * 0.62) * 0.022;
      const bobVel = Math.cos(bobPhase) * 1.18 * 0.085;
      coffeeUniforms.uBobVel.value = bobVel;

      ghostRoot.position.y = bobY;
      ghostRoot.rotation.z = Math.sin(t * 0.74) * 0.026;
      ghostRoot.rotation.x = Math.cos(t * 0.88) * 0.018;
      ghostRoot.rotation.y = Math.sin(t * 0.52) * 0.032;

      // Update world-space coffee light position for subsurface scattering shader
      coffeeMesh.getWorldPosition(tmpCoffeeWorld);
      sharedClothUniforms.uCoffeePos.value.copy(tmpCoffeeWorld);

      // Subtle warm coffee glow flicker
      const coffeePulse = 1.0 + 0.06 * Math.sin(t * 2.9) + 0.03 * Math.cos(t * 4.7);
      coffeeGlowLight.intensity = 0.44 * coffeePulse;
      coffeeMaterial.emissiveIntensity = 0.45 * coffeePulse;

      // 2. Blinking oval eyes + subtle smile pulse
      const blink = computeBlinkAmount(t);
      const eyeScaleY = 1.0 - blink * 0.91;
      const eyeScaleX = 1.0 + blink * 0.09;
      leftEye.pivot.scale.set(eyeScaleX, eyeScaleY, 1.0 - blink * 0.35);
      rightEye.pivot.scale.set(eyeScaleX, eyeScaleY, 1.0 - blink * 0.35);

      const smilePulse = Math.sin(t * 1.18 - 0.35) * 0.045 + blink * 0.035;
      mouthPivot.scale.set(1.0 + smilePulse * 0.65, 1.0 + smilePulse, 1.0);

      // 3. Soft contact glow breathing inversely with bob height
      contactGlowUniforms.uBobHeight.value = (bobY + 0.11) / 0.22;

      controls.update();
      composer.render();
    }

    // =========================================================================
    // 14. RESIZE HANDLER
    // =========================================================================
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const pr = Math.min(window.devicePixelRatio, 2);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(pr);
      renderer.setSize(w, h);
      composer.setPixelRatio(pr);
      composer.setSize(w, h);
      bloomPass.resolution.set(w, h);
    });

    animate();
  </script>
</body>
</html>
