  // Local grandstand front (-Z) faces the track; back wall sits at +Z behind the tiers
  const standConfigs = [
    // Main straight massive grandstands (opposite pits, +X side, facing -X toward track)
    { pos: new THREE.Vector3(22.5, 0, 15), rotY: Math.PI / 2, len: 105, tiers: 14 },
    { pos: new THREE.Vector3(22.5, 0, 132), rotY: Math.PI / 2, len: 92, tiers: 13 },
    // Turn 1 sweeping grandstand (facing -Z toward Turn 1)
    { pos: new THREE.Vector3(-42, 4.2, 314), rotY: -0.22, len: 86, tiers: 12 },
    // Turn 6 Parabolica grandstand (facing +Z toward Parabolica)
    { pos: new THREE.Vector3(-188, 3.0, -334), rotY: Math.PI + 0.14, len: 84, tiers: 12 },
    // Final Chicane grandstand (facing +Z toward Final Corner)
    { pos: new THREE.Vector3(-46, 0.5, -294), rotY: Math.PI - 0.25, len: 68, tiers: 11 }
  ];

  const crowdPalette = [
    new THREE.Color(0xd6242a), // crimson fans
    new THREE.Color(0x1664f0), // electric blue fans
    new THREE.Color(0xff7414), // papaya orange fans
    new THREE.Color(0xe6ebf2), // white/silver fans
    new THREE.Color(0xf2c830), // yellow
    new THREE.Color(0x283446), // navy
    new THREE.Color(0x1eb090), // teal
    new THREE.Color(0x8838a8), // violet
    new THREE.Color(0x3a3d45)  // charcoal
  ];
  const skinTones = [
    new THREE.Color(0xf2c9a6),
    new THREE.Color(0xdba67c),
    new THREE.Color(0xa6704c),
    new THREE.Color(0x704930)
  ];

  const tmpPos = new THREE.Vector3();
  const tmpMat = new THREE.Matrix4();
  const tmpQuat = new THREE.Quaternion();
  const tmpScale = new THREE.Vector3(1, 1, 1);

  for (const cfg of standConfigs) {
    const stand = new THREE.Group();
    stand.position.copy(cfg.pos);
    stand.rotation.y = cfg.rotY;

    const depthStep = 1.05;
    const heightStep = 0.68;
    const totalDepth = cfg.tiers * depthStep;
    const totalHeight = cfg.tiers * heightStep + 1.8;

    // Tiered seating deck
    const tierGeos = [];
    for (let t = 0; t < cfg.tiers; t++) {
      const box = new THREE.BoxGeometry(cfg.len, 0.55, depthStep + 0.15);
      box.translate(0, 1.4 + t * heightStep, t * depthStep);
      tierGeos.push(box);
    }
    // Back wall & support columns
    const backWall = new THREE.BoxGeometry(cfg.len, totalHeight + 3.2, 0.9);
    backWall.translate(0, (totalHeight + 3.2) * 0.5, totalDepth + 0.4);
    tierGeos.push(backWall);

    const baseWall = new THREE.BoxGeometry(cfg.len, 1.6, 0.5);
    baseWall.translate(0, 0.8, -0.55);
    tierGeos.push(baseWall);

    const mergedDeck = mergeGeometries(tierGeos);
    const deckMesh = new THREE.Mesh(mergedDeck, concreteMat);
    deckMesh.castShadow = true;
    deckMesh.receiveShadow = true;
    stand.add(deckMesh);

    // Cantilevered shade canopy & support trusses
    const roof = new THREE.Mesh(new THREE.BoxGeometry(cfg.len + 3, 0.45, totalDepth + 4.5), roofMat);
    roof.position.set(0, totalHeight + 4.4, totalDepth * 0.45);
    roof.rotation.x = -0.14;
    roof.castShadow = true;
    stand.add(roof);

    const nCols = Math.max(4, Math.floor(cfg.len / 18));
    for (let c = 0; c <= nCols; c++) {
      const cx = lerp(-cfg.len * 0.48, cfg.len * 0.48, c / nCols);
      const col = new THREE.Mesh(new THREE.BoxGeometry(0.55, totalHeight + 4.6, 0.65), frameMat);
      col.position.set(cx, (totalHeight + 4.6) * 0.5, totalDepth + 0.2);
      stand.add(col);

      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.55, totalDepth + 4.0), frameMat);
      arm.position.set(cx, totalHeight + 4.0, totalDepth * 0.45);
      arm.rotation.x = -0.14;
      stand.add(arm);
    }

    stand.updateMatrixWorld(true);
    trackGroup.add(stand);

    // Populate spectators densely across every tier
    const seatSpacing = 1.05;
    const colsPerRow = Math.floor((cfg.len - 2.4) / seatSpacing);
    for (let t = 0; t < cfg.tiers; t++) {
      for (let s = 0; s < colsPerRow; s++) {
        if (rng() < 0.14) continue; // natural sparse empty seats
        const lx = -cfg.len * 0.5 + 1.4 + s * seatSpacing + (rng() - 0.5) * 0.22;
        const ly = 1.68 + t * heightStep;
        const lz = t * depthStep + (rng() - 0.5) * 0.14;

        tmpPos.set(lx, ly, lz).applyMatrix4(stand.matrixWorld);
        const bodyCol = crowdPalette[Math.floor(rng() * crowdPalette.length)];
        const skinCol = skinTones[Math.floor(rng() * skinTones.length)];
        spectatorInstData.push({
          x: tmpPos.x,
          y: tmpPos.y,
          z: tmpPos.z,
          rotY: cfg.rotY + (rng() - 0.5) * 0.4,
          phase: rng() * Math.PI * 2,
          bodyCol,
          skinCol
        });
      }
    }
  }

  const count = spectatorInstData.length;
  const bodyGeo = new THREE.CylinderGeometry(0.18, 0.23, 0.66, 6);
  bodyGeo.translate(0, 0.33, 0);
  const headGeo = new THREE.SphereGeometry(0.14, 6, 5);
  headGeo.translate(0, 0.80, 0);

  const specMat = new THREE.MeshStandardMaterial({ roughness: 0.86, metalness: 0.02 });
  spectatorBodyInst = new THREE.InstancedMesh(bodyGeo, specMat, count);
  spectatorHeadInst = new THREE.InstancedMesh(headGeo, specMat, count);

  for (let i = 0; i < count; i++) {
    const d = spectatorInstData[i];
    tmpQuat.setFromAxisAngle(worldUp, d.rotY);
    tmpMat.compose(tmpPos.set(d.x, d.y, d.z), tmpQuat, tmpScale);
    spectatorBodyInst.setMatrixAt(i, tmpMat);
    spectatorHeadInst.setMatrixAt(i, tmpMat);
    spectatorBodyInst.setColorAt(i, d.bodyCol);
    spectatorHeadInst.setColorAt(i, d.skinCol);
  }
  spectatorBodyInst.instanceMatrix.needsUpdate = true;
  spectatorHeadInst.instanceMatrix.needsUpdate = true;
  spectatorBodyInst.instanceColor.needsUpdate = true;
  spectatorHeadInst.instanceColor.needsUpdate = true;
  trackGroup.add(spectatorBodyInst);
  trackGroup.add(spectatorHeadInst);
}

// Shared animation uniforms for wind-swaying plants & fluttering trackside flags
const foliageWindUniform = { value: 0 };
const flagMaterials = [];

function sampleTerrainHeight(x, z, info) {
  const radialDist = Math.hypot(x + 155, z + 10);
  const hillMask = smoothstep(210, 580, radialDist);
  const n1 = fbm2D(x * 0.0042 + 12.3, z * 0.0042 - 7.1, 4);
  const n2 = fbm2D(x * 0.015 - 3.4, z * 0.015 + 9.2, 3);
  const naturalY = -1.2 + (n1 - 0.36) * 28 + (n2 - 0.5) * 6 + hillMask * (34 + n1 * 72);
  let y = lerp(info.trackY - 0.28, naturalY, smoothstep(22, 58, info.dist));
  const inPitPlateau = x > -58 && x < 42 && z > -175 && z < 205;
  if (inPitPlateau) {
    const pitBlend = smoothstep(58, 36, Math.abs(x + 8)) * smoothstep(205, 175, Math.abs(z - 15));
    y = lerp(y, -0.22, pitBlend * 0.92);
  }
  return y;
}

function isInsideStructureZone(x, z) {
  if (x > -54 && x < 44 && z > -170 && z < 210) return true; // Main straight, pits & main grandstands
  if (x > -92 && x < 8 && z > 282 && z < 350) return true;   // Turn 1 grandstand
  if (x > -242 && x < -134 && z > -368 && z < -305) return true; // Parabolica grandstand
  if (x > -90 && x < -4 && z > -325 && z < -274) return true; // Final chicane grandstand
  return false;
}

function displaceOrganicGeo(geo, amount, freq, seedOffset) {
  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const vx = pos.getX(i);
    const vy = pos.getY(i);
    const vz = pos.getZ(i);
    const n = fbm2D(vx * freq + seedOffset, vz * freq + vy * freq * 0.7 - seedOffset, 2) - 0.5;
    const scale = 1.0 + n * amount;
    pos.setXYZ(i, vx * scale, vy * (1 + n * amount * 0.45), vz * scale);
  }
  g.computeVertexNormals();
  return g;
}

      vertexShader: /* glsl */ `
        uniform float uTime;
        uniform float uPhase;
        varying vec2 vUv;
        varying float vWave;
        void main() {

// 7. PARAMETRIC LOFTING ENGINE WITH ANALYTIC NORMALS (NO PLACEHOLDER BOXES)
// ============================================================================
/**
 * Builds a smooth parametric surface from P(u, v) with analytic normals
 * computed from exact tangent cross-product (∂P/∂u × ∂P/∂v).
 */
function buildParametricLoft(uSegs, vSegs, evalPos, opts = {}) {
  const closedU = !!opts.closedU;
  const closedV = !!opts.closedV;
  const flipNormal = !!opts.flipNormal;
  const epsU = 0.0008;
  const epsV = 0.0008;

  const verts = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  const p0 = new THREE.Vector3();
  const pu1 = new THREE.Vector3();
  const pu2 = new THREE.Vector3();
  const pv1 = new THREE.Vector3();
  const pv2 = new THREE.Vector3();
  const du = new THREE.Vector3();
  const dv = new THREE.Vector3();
  const n = new THREE.Vector3();

  for (let i = 0; i <= uSegs; i++) {
    const u = i / uSegs;
    const uA = closedU ? wrapMod(u - epsU, 1) : Math.max(0, u - epsU);
    const uB = closedU ? wrapMod(u + epsU, 1) : Math.min(1, u + epsU);

    for (let j = 0; j <= vSegs; j++) {
      const v = j / vSegs;
      const vA = closedV ? wrapMod(v - epsV, 1) : Math.max(0, v - epsV);
      const vB = closedV ? wrapMod(v + epsV, 1) : Math.min(1, v + epsV);

      evalPos(u, v, p0);
      evalPos(uA, v, pu1);
      evalPos(uB, v, pu2);
      evalPos(u, vA, pv1);
      evalPos(u, vB, pv2);

      du.subVectors(pu2, pu1);
      dv.subVectors(pv2, pv1);
      n.crossVectors(du, dv);
      if (n.lengthSq() < 1e-12 || !isFinite(n.x) || !isFinite(n.y) || !isFinite(n.z)) {
        // Pole fallback (nose tip or tail cone)
        n.set(0, 0, u < 0.5 ? 1 : -1);
      } else {
        n.normalize();
      }
      if (flipNormal) n.negate();

      verts.push(p0.x, p0.y, p0.z);
      normals.push(n.x, n.y, n.z);
      uvs.push(u * (opts.uvU || 1), v * (opts.uvV || 1));
    }
  }

  const row = vSegs + 1;
  for (let i = 0; i < uSegs; i++) {
    for (let j = 0; j < vSegs; j++) {
      const a = i * row + j;
      const b = (i + 1) * row + j;
      const c = (i + 1) * row + j + 1;
      const d = i * row + j + 1;
      if (flipNormal) {
        indices.push(a, d, b, b, d, c);
      } else {
        indices.push(a, b, d, b, c, d);
      }
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  return geo;
}

// Helper: Swept parametric airfoil tube along a 3D curve (for halo & suspension arms)
function buildAirfoilStrut(pA, pB, chord, thickness, radialSegs = 12, lenSegs = 6) {
  const dir = new THREE.Vector3().subVectors(pB, pA);
  const upRef = Math.abs(dir.clone().normalize().y) > 0.92 ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0);
  const side = new THREE.Vector3().crossVectors(dir, upRef).normalize();
  const up = new THREE.Vector3().crossVectors(side, dir).normalize();
  // Orient chord along horizontal airflow (Z-ish)
  const chordDir = side.clone().multiplyScalar(0.85).addScaledVector(up, 0.15).normalize();
  const thickDir = new THREE.Vector3().crossVectors(dir.clone().normalize(), chordDir).normalize();

  return buildParametricLoft(lenSegs, radialSegs, (u, v, out) => {
    const theta = v * Math.PI * 2;
    const c = Math.cos(theta) * chord * 0.5;
    const t = Math.sin(theta) * thickness * 0.5 * (0.75 + 0.25 * Math.cos(theta));
    out.lerpVectors(pA, pB, u)
      .addScaledVector(chordDir, c)
      .addScaledVector(thickDir, t);
  }, { closedV: true, flipNormal: true });
}

// Helper: Cambered NACA-inspired F1 aero wing element loft
function buildWingElementLoft(spanHalf, chordFn, yFn, zFn, camberFn, aoaFn, uSegs = 26, vSegs = 14) {
  return buildParametricLoft(uSegs, vSegs, (u, v, out) => {
    const s = (u * 2 - 1); // -1..+1 spanwise
    const x = s * spanHalf;
    const chord = chordFn(Math.abs(s));
    const yBase = yFn(Math.abs(s));
    const zBase = zFn(Math.abs(s));
    const camber = camberFn(Math.abs(s));
    const aoa = aoaFn(Math.abs(s));

    const theta = v * Math.PI * 2;
    // Closed airfoil cross section: xc in [0, 1] from leading edge (+Z) to trailing edge (-Z)
    const xc = 0.5 * (1 - Math.cos(theta));
    const halfThick = 0.12 * chord * (1.4 * Math.sqrt(Math.max(xc, 0.0001)) - 0.65 * xc - 0.68 * xc * xc);
    const sign = Math.sin(theta) >= 0 ? 1 : -1;
    const yc = camber * chord * Math.sin(xc * Math.PI) + sign * halfThick;

    // Local Z goes backward from leading edge; rotate by Angle of Attack
    const lz = (0.35 - xc) * chord;
    const cosA = Math.cos(aoa);
    const sinA = Math.sin(aoa);
    const rz = lz * cosA - yc * sinA;
    const ry = lz * sinA + yc * cosA;

    out.set(x, yBase + ry, zBase + rz);
  }, { closedV: true, flipNormal: false });
}

// Build shared parametric geometries ONCE (reused cleanly across all 4 cars for 60 FPS!)
function buildSharedCarGeometries() {
  // 1. Main Monocoque & Engine Cover Upper Painted Bodywork (lofted from nose tip to rear tail)
  const monocoqueGeo = buildParametricLoft(54, 28, (u, v, out) => {
    // z from +2.68 (nose tip) to -2.26 (rear engine tail)
    const z = lerp(2.68, -2.26, u);
    const theta = v * Math.PI * 2;
    const sinT = Math.sin(theta);
    const cosT = Math.cos(theta);

    // Parametric half-width profile along car length
    let halfW;
    if (u < 0.08) {
      halfW = 0.025 + 0.115 * Math.sqrt(u / 0.08);
    } else if (u < 0.40) {
      halfW = lerp(0.14, 0.34, smoothstep(0.08, 0.40, u));
    } else if (u < 0.64) {
      halfW = lerp(0.34, 0.31, smoothstep(0.40, 0.64, u));
    } else {
      // Dramatic coke-bottle rear taper
      halfW = lerp(0.31, 0.095, smoothstep(0.64, 0.96, u)) * (1 - 0.35 * smoothstep(0.95, 1.0, u));
    }

        r = outerR - 0.025 * Math.pow(1 - shoulder, 2.2);

        const t = (v - 0.72) / 0.28;
        const bulge = Math.sin(t * Math.PI) * 0.022;
        x = halfW + bulge;
        r = lerp(outerR - 0.025, rimR, t);

      out.set(x, Math.cos(ang) * r, Math.sin(ang) * r);
    }, { closedU: true, flipNormal: false });

    const hub = new THREE.CylinderGeometry(0.058, 0.068, width * 0.55, 14);
    hub.rotateZ(Math.PI / 2);
    hub.translate(width * 0.10, 0, 0);
    parts.push(hub);

    // 10 sculpted Y-spokes connecting hub to outer rim barrel (leaving gaps so glowing brake disc shines through!)
    const nSpokes = 10;
    for (let k = 0; k < nSpokes; k++) {
      const a = (k / nSpokes) * Math.PI * 2;
      const p1 = new THREE.Vector3(width * 0.24, Math.cos(a) * 0.055, Math.sin(a) * 0.055);
      const p2 = new THREE.Vector3(width * 0.36, Math.cos(a) * (rimR - 0.008), Math.sin(a) * (rimR - 0.008));
      parts.push(buildAirfoilStrut(p1, p2, 0.028, 0.014, 6, 3));
    }
    return mergeGeometries(parts);
  }

  // Merge static sub-meshes by material for ultra-low draw calls!
  const paintedBodyGeo = mergeGeometries([
    monocoqueGeo,
    sidepodL,
    sidepodR,
    sharkFinGeo,
    fwFlap1Painted,
    fwFlap2Painted
  ]);

  const accentBodyGeo = mergeGeometries([
    accentStripeGeo,
    fwFlap3Accent
  ]);

  const carbonBodyGeo = mergeGeometries([
    ...floorGeos,
    fwMainCarbon,
    ...fwEndplates,
    rwMainCarbon,
    rwBeamCarbon,
    ...rwEndplates,
    ...haloGeos,
    ...suspGeos,
    ...inletGeos
  ]);

  // Exhaust tailpipe & titanium underfloor skid block
  const exhaustPipe = new THREE.CylinderGeometry(0.052, 0.056, 0.36, 14, 1, true);
  exhaustPipe.rotateX(Math.PI / 2);
  exhaustPipe.translate(0, 0.44, -2.14);

  // Brake disc & sculpted curved multi-piston caliper (mounted on non-rotating upright)
  const brakeDiscGeo = new THREE.CylinderGeometry(0.168, 0.168, 0.036, 22);
  brakeDiscGeo.rotateZ(Math.PI / 2);

  const caliperGeo = buildParametricLoft(12, 10, (u, v, out) => {
    const arcAng = lerp(-0.58, 0.58, u);
    const theta = v * Math.PI * 2;
    const r = 0.155 + Math.cos(theta) * 0.032;
    const x = Math.sin(theta) * 0.036;
    out.set(x, Math.sin(arcAng) * r - 0.015, Math.cos(arcAng) * r);
  }, { closedV: true, flipNormal: false });

  // Simplified distant LOD bodywork shell (for cars > 110 m away)
  const lodShellGeo = buildParametricLoft(16, 10, (u, v, out) => {
    const z = lerp(2.62, -2.26, u);
    const theta = v * Math.PI * 2;
    const halfW = lerp(0.14, 0.68, Math.sin(u * Math.PI)) * 0.92;
    const yTop = lerp(0.28, 0.94, Math.sin(u * Math.PI * 0.85));
    const yMid = 0.5 * (0.12 + yTop);
    const yRad = 0.5 * (yTop - 0.12);
    out.set(Math.sin(theta) * halfW, yMid + Math.cos(theta) * yRad, z);
  }, { closedV: true, flipNormal: true });

  return {
    paintedBodyGeo,
    accentBodyGeo,
    carbonBodyGeo,
    drsFlapGeo,
    drsGlowStripGeo,
    drsPivotY,
    drsPivotZ,
    helmetGeo,
    visorGeo,
    driverBodyGeo,
    exhaustPipe,
    brakeDiscGeo,
    caliperGeo,
    lodShellGeo,
    frontTireGeo: buildSlickTireGeo(0.305, 0.360, 0.228),
    rearTireGeo: buildSlickTireGeo(0.405, 0.365, 0.228),
    frontRimGeo: buildRimGeo(0.305, 0.228),
    rearRimGeo: buildRimGeo(0.405, 0.228)
  };
}

// Custom Heat-Shimmer Exhaust Plume Shader
function createHeatShimmerMaterial() {
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 },
      uIntensity: { value: 0.7 }
    },
    vertexShader: /* glsl */ `
      uniform float uTime;
      varying vec2 vUv;
      void main() {
        vUv = uv;
        vec3 p = position;
        float dist = uv.y;
        // High-frequency turbulent thermal flutter behind exhaust
        float w1 = sin(dist * 18.0 - uTime * 34.0) * 0.055 * dist;
        float w2 = cos(dist * 27.0 - uTime * 46.0 + position.x * 8.0) * 0.035 * dist;
        p.x += w1;
        p.y += w2 + 0.08 * dist * dist;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }
    `,
    fragmentShader: /* glsl */ `
      uniform float uTime;
      uniform float uIntensity;
      varying vec2 vUv;
      void main() {
        float radial = 1.0 - abs(vUv.x * 2.0 - 1.0);
        radial = smoothstep(0.0, 0.85, radial);
        float along = smoothstep(0.0, 0.14, vUv.y) * (1.0 - smoothstep(0.28, 1.0, vUv.y));
        float wave = 0.55 + 0.45 * sin(vUv.y * 32.0 - uTime * 42.0 + sin(vUv.x * 12.0) * 2.0);
        float alpha = radial * along * wave * 0.22 * uIntensity;
        vec3 col = mix(vec3(1.0, 0.72, 0.36), vec3(0.95, 0.85, 0.75), vUv.y);
        gl_FragColor = vec4(col, alpha);
      }
    `
  });
}

// 9. FOUR-CAR RACE SIMULATION (SLIPSTREAM, OVERTAKES, BRAKING, DYNAMICS)

const cars = LIVERIES.map((livery, idx) => {
  const visual = createFormulaCar(livery);

    id: idx,
    visual,
    s: wrapMod(startS, TRACK_LENGTH),
    totalDist: startS,
    lat: startLat,
    targetLat: startLat,
    latVel: 0,
    speed: 74 - idx * 0.6,
    prevSpeed: 74 - idx * 0.6,
    accel: 0,
    brakeHeat: 0,
    drsOpen: 0,
    steerAngle: 0,
    rollAngle: 0,
    pitchAngle: 0,
    wheelRot: 0,
    pacePhase: idx * 1.62 + 0.4,
    paceFreq: 0.16 + idx * 0.023,
    overtakeSide: idx % 2 === 0 ? 1 : -1,
    overtakeTimer: 0,
    worldPos: new THREE.Vector3(),
    worldVel: new THREE.Vector3(),
    worldQuat: new THREE.Quaternion(),
    forward: new THREE.Vector3(0, 0, 1),
    up: new THREE.Vector3(0, 1, 0),
    right: new THREE.Vector3(-1, 0, 0),
    onCurb: false,
    curbSide: 0,
    slipstream: 0,
    rpm: 10500,
    gear: 6
  };
});

const _sampleNow = {};
const _sampleAhead = {};
const _rotMat = new THREE.Matrix4();
const _targetQuat = new THREE.Quaternion();

function updateRaceSimulation(dt, elapsed) {
  // 1. Sort ranking order by totalDist (for slipstream, chasing & camera director)
  const ranked = [...cars].sort((a, b) => b.totalDist - a.totalDist);
  const leaderDist = ranked[0].totalDist;

  for (let i = 0; i < cars.length; i++) {
    const car = cars[i];
    sampleTrack(car.s, _sampleNow);
    sampleTrack(car.s + 38, _sampleAhead);

    // Organic pace rhythm + subtle rubber-band keeps all 4 cars in thrilling wheel-to-wheel battles!
    const paceWave = Math.sin(elapsed * car.paceFreq + car.pacePhase) * 2.8
      + Math.cos(elapsed * 0.075 + car.id * 2.1) * 1.6;
    const gapToLeader = leaderDist - car.totalDist;
    const packTension = clamp((gapToLeader - 10) * 0.16, -2.0, 5.2);

    // Slipstream draft & overtaking logic against cars ahead
    let slipBoost = 0;
    let blockingCar = null;
    let minGapAhead = 999;

    for (let j = 0; j < cars.length; j++) {
      if (i === j) continue;
      const other = cars[j];
      const deltaS = other.totalDist - car.totalDist;
      const latGap = Math.abs(other.lat - car.lat);

      // Aerodynamic slipstream tow when 5..30 m behind and roughly aligned
      if (deltaS > 4.5 && deltaS < 32 && latGap < 2.5) {
        const align = 1 - latGap / 2.5;
        const distFactor = smoothstep(32, 8, deltaS);
        slipBoost = Math.max(slipBoost, align * distFactor * 6.4);
      }

      if (deltaS > 0.5 && deltaS < minGapAhead && deltaS < 18) {
        minGapAhead = deltaS;
        blockingCar = other;
      }
    }
    car.slipstream = lerp(car.slipstream, slipBoost / 6.4, Math.min(1, dt * 5));

    // Decide desired lateral line (ideal apex line vs clean overtaking lane)
    let desiredLat = _sampleNow.idealLine;
    if (blockingCar && minGapAhead < 16.5) {
      const latDiff = car.lat - blockingCar.lat;
      if (Math.abs(latDiff) < 3.1) {
        if (car.overtakeTimer <= 0) {
          // Pick whichever side has more open track space
          car.overtakeSide = (blockingCar.lat > 0.4) ? -1 : (blockingCar.lat < -0.4 ? 1 : -car.overtakeSide);
          car.overtakeTimer = 2.8;
        }
        desiredLat = clamp(blockingCar.lat + car.overtakeSide * 3.45, -TRACK_HALF_W + 1.85, TRACK_HALF_W - 1.85);
      }
    }
    car.overtakeTimer = Math.max(0, car.overtakeTimer - dt);

    // Hard lateral separation so side-by-side battles never touch or clip
    for (let j = 0; j < cars.length; j++) {
      if (i === j) continue;
      const other = cars[j];
      const dS = Math.abs(other.totalDist - car.totalDist);
      if (dS < 6.4) {
        const dLat = car.lat - other.lat;
        const minLat = 2.55;
        if (Math.abs(dLat) < minLat) {
          const pushDir = dLat >= 0 ? 1 : -1;
          desiredLat = clamp(other.lat + pushDir * (minLat + 0.35), -TRACK_HALF_W + 1.6, TRACK_HALF_W - 1.6);
        }
      }
    }

    // Target speed with corner profile, slipstream & DRS
    const wantsDRS = _sampleNow.isStraight && car.speed > 62 && (slipBoost > 0.6 || _sampleNow.isMainStraight);
    car.drsOpen = lerp(car.drsOpen, wantsDRS ? 1.0 : 0.0, Math.min(1, dt * 6.5));
    const drsBonus = car.drsOpen * 3.6;

    let desiredSpeed = _sampleNow.targetSpeed + paceWave + packTension + slipBoost + drsBonus;
    // Prevent rear-ending if directly lined up behind a car in a tight corner
    if (blockingCar && minGapAhead < 8.5 && Math.abs(blockingCar.lat - car.lat) < 2.2) {
      desiredSpeed = Math.min(desiredSpeed, blockingCar.speed - 2.0);
    }
    desiredSpeed = clamp(desiredSpeed, 26, 95);

    // Realistic acceleration & heavy corner braking
    const speedErr = desiredSpeed - car.speed;
    const maxRate = speedErr >= 0 ? 19.5 : 46.0;
    const dv = clamp(speedErr * 3.2, -maxRate, maxRate);
    car.prevSpeed = car.speed;
    car.speed = Math.max(22, car.speed + dv * dt);
    car.accel = (car.speed - car.prevSpeed) / Math.max(dt, 0.001);

    // Smooth lateral steering dynamics
    const latErr = desiredLat - car.lat;
    const latForce = clamp(latErr * 6.2 - car.latVel * 4.2, -16, 16);
    car.latVel += latForce * dt;
    car.lat = clamp(car.lat + car.latVel * dt, -TRACK_HALF_W + 1.25, TRACK_HALF_W - 1.25);

    // Advance along spline
    car.s = wrapMod(car.s + car.speed * dt, TRACK_LENGTH);
    car.totalDist += car.speed * dt;

    // Sample updated exact 3D track pose
    sampleTrack(car.s, _sampleNow);
    const prevPos = car.worldPos.clone();
    car.worldPos.copy(_sampleNow.pos)
      .addScaledVector(_sampleNow.right, car.lat)
      .addScaledVector(_sampleNow.up, 0.04);

    // Smooth world velocity (used for Doppler audio & particle launch velocity)
    if (elapsed > 0.05) {
      car.worldVel.subVectors(car.worldPos, prevPos).divideScalar(Math.max(dt, 0.001));
    } else {
      car.worldVel.copy(_sampleNow.tangent).multiplyScalar(car.speed);
    }

    // Yaw heading includes subtle lateral slip / lane-change angle
    const latHeadingAngle = clamp(-car.latVel / Math.max(car.speed, 18), -0.14, 0.14);
    car.forward.copy(_sampleNow.tangent).addScaledVector(_sampleNow.right, -latHeadingAngle).normalize();
    car.up.copy(_sampleNow.up);
    car.right.crossVectors(car.forward, car.up).normalize();
    car.up.crossVectors(car.right, car.forward).normalize();

    // Basis matrix: local +Z = forward, +Y = up, +X = left (-right)
    const left = car.right.clone().negate();
    _rotMat.makeBasis(left, car.up, car.forward);
    _targetQuat.setFromRotationMatrix(_rotMat);
    car.worldQuat.slerp(_targetQuat, Math.min(1, dt * 16));

    // Curb contact detection
    const nearRightCurb = _sampleNow.curbRight && car.lat > TRACK_HALF_W - 2.35;
    const nearLeftCurb = _sampleNow.curbLeft && car.lat < -(TRACK_HALF_W - 2.35);
    car.onCurb = nearRightCurb || nearLeftCurb;
    car.curbSide = nearRightCurb ? 1 : (nearLeftCurb ? -1 : 0);

    // Braking thermal glow (heats fiercely under heavy corner braking, cools smoothly)
    const brakeIntensity = clamp(-car.accel / 26.0, 0, 1);
    if (brakeIntensity > 0.12) {
      car.brakeHeat = Math.min(1.0, car.brakeHeat + brakeIntensity * dt * 2.8);
    } else {
      car.brakeHeat = Math.max(0.0, car.brakeHeat - dt * 0.62);
    }

    // Steering input & dynamic body roll / pitch / curb vibration
    const targetSteer = clamp(-_sampleNow.curvature * 14.5 - latHeadingAngle * 1.4, -0.38, 0.38);
    car.steerAngle = lerp(car.steerAngle, targetSteer, Math.min(1, dt * 12));

    const latG = car.speed * car.speed * _sampleNow.curvature;
    const targetRoll = clamp(latG * 0.0014, -0.048, 0.048);
    const targetPitch = clamp(-car.accel * 0.0011, -0.032, 0.036);
    car.rollAngle = lerp(car.rollAngle, targetRoll, Math.min(1, dt * 10));
    car.pitchAngle = lerp(car.pitchAngle, targetPitch, Math.min(1, dt * 10));

    const curbVib = car.onCurb ? Math.sin(elapsed * 92 + car.id) * 0.022 : 0;
    const aeroSquat = -smoothstep(40, 92, car.speed) * 0.024;

    // Virtual 8-speed gearbox RPM curve (for audio & steering wheel shift LEDs)
    const speedNorm = clamp((car.speed - 20) / 74, 0, 1);
    const gearFloat = 1 + speedNorm * 7.0;
    car.gear = clamp(Math.floor(gearFloat), 1, 8);
    const gearFrac = gearFloat - Math.floor(gearFloat);
    car.rpm = 7800 + gearFrac * 4900 + (car.gear === 8 ? speedNorm * 950 : 0);

    // Apply transforms & materials to visual rig
    const v = car.visual;
    v.root.position.copy(car.worldPos);
    v.root.quaternion.copy(car.worldQuat);

    v.chassisPivot.position.y = aeroSquat + curbVib;
    v.chassisPivot.rotation.z = car.rollAngle + (car.onCurb ? curbVib * 1.4 : 0);
    v.chassisPivot.rotation.x = car.pitchAngle;

    // Steering wheel & front wheel upright steering
    v.steeringPivot.rotation.z = car.steerAngle * 2.4;
    car.wheelRot += (car.speed / 0.362) * dt;
    const blurAlpha = smoothstep(14, 52, car.speed) * 0.84;
    v.blurDiscMat.opacity = blurAlpha;

    for (const w of v.wheels) {
      w.spinGroup.rotation.x = car.wheelRot;
      if (w.front) {
        w.steerGroup.rotation.y = car.steerAngle;
      }
    }

    // Glowing DRS flap articulation & emissive glow
    v.drsPivot.rotation.x = -car.drsOpen * 0.48;
    v.drsGlowMat.emissiveIntensity = 0.8 + car.drsOpen * 3.8;

    // Pulsing rear LED rain light (brightens/flashes under heavy braking & harvest)
    const rainPulse = brakeIntensity > 0.25 ? (0.5 + 0.5 * Math.sin(elapsed * 26)) : 0.35;
    v.rainLightMat.emissiveIntensity = 1.6 + rainPulse * 3.2;

    // Glowing brake discs (front discs glow hotter than rears, blackbody shift from cherry to incandescent orange)
    const heatF = car.brakeHeat;
    const heatR = car.brakeHeat * 0.72;
    v.frontBrakeMat.emissive.setHSL(lerp(0.015, 0.085, heatF), 1.0, lerp(0.32, 0.56, heatF));
    v.frontBrakeMat.emissiveIntensity = heatF * heatF * 6.2;
    v.rearBrakeMat.emissive.setHSL(lerp(0.012, 0.072, heatR), 1.0, lerp(0.28, 0.50, heatR));
    v.rearBrakeMat.emissiveIntensity = heatR * heatR * 4.5;

    // Exhaust heat shimmer shader uniforms
    v.shimmerMat.uniforms.uTime.value = elapsed + car.id * 1.7;
    v.shimmerMat.uniforms.uIntensity.value = clamp(0.45 + (car.speed / 90) * 0.75 + (car.accel > 0 ? 0.35 : 0), 0.35, 1.35);
  }

  return ranked;
}

// ============================================================================
// 10. VFX SYSTEMS: UNDERFLOOR SPARKS, TIRE SMOKE & CURB DUST (POOLED)
// ============================================================================
// 10.1 Titanium Underfloor Sparks (Instanced glowing streaks with gravity & ground bounce)
const MAX_SPARKS = 320;
const sparkGeo = new THREE.BoxGeometry(0.022, 0.022, 0.58);
const sparkMat = new THREE.MeshBasicMaterial({
  color: 0xffd27a,
  blending: THREE.AdditiveBlending,
  transparent: true,
  opacity: 0.95,
  depthWrite: false
});
const sparkInst = new THREE.InstancedMesh(sparkGeo, sparkMat, MAX_SPARKS);
sparkInst.frustumCulled = false;
scene.add(sparkInst);

const sparks = [];
for (let i = 0; i < MAX_SPARKS; i++) {
  sparks.push({
    active: false,
    life: 0,
    maxLife: 0.35,
    pos: new THREE.Vector3(),
    vel: new THREE.Vector3(),
    groundY: 0
  });
}
let sparkCursor = 0;

function emitSpark(pos, vel, groundY) {
  const sp = sparks[sparkCursor];
  sparkCursor = (sparkCursor + 1) % MAX_SPARKS;
  sp.active = true;
  sp.life = 0;
  sp.maxLife = 0.22 + rng() * 0.26;
  sp.pos.copy(pos);
  sp.vel.copy(vel);
  sp.groundY = groundY;
}

// 10.2 Tire Smoke & Curb Dust Puffs (Instanced soft billboard quads)
const MAX_SMOKE = 180;
const smokeGeo = new THREE.PlaneGeometry(1, 1);
const smokeMat = new THREE.MeshBasicMaterial({
  map: softSmokeTex,
  transparent: true,
  opacity: 0.19,
  depthWrite: false,
  color: 0xe2d9cc
});
const smokeInst = new THREE.InstancedMesh(smokeGeo, smokeMat, MAX_SMOKE);
smokeInst.frustumCulled = false;
scene.add(smokeInst);

const smokePuffs = [];
for (let i = 0; i < MAX_SMOKE; i++) {
  smokePuffs.push({
    active: false,
    life: 0,
    maxLife: 0.85,
    pos: new THREE.Vector3(),
    vel: new THREE.Vector3(),
    size: 1.0,
    color: new THREE.Color(0xe2d9cc)
  });
}
let smokeCursor = 0;

function emitSmoke(pos, vel, isDust) {
  const p = smokePuffs[smokeCursor];
  smokeCursor = (smokeCursor + 1) % MAX_SMOKE;
  p.active = true;
  p.life = 0;
  p.maxLife = isDust ? (0.65 + rng() * 0.45) : (0.75 + rng() * 0.5);
  p.pos.copy(pos);
  p.vel.copy(vel);
  p.size = isDust ? 1.15 : 0.92;
  p.color.setHex(isDust ? 0xc2ab88 : 0xd8dde4);
}

const _vfxMat = new THREE.Matrix4();
const _vfxQuat = new THREE.Quaternion();
const _vfxScale = new THREE.Vector3();
const _vfxDir = new THREE.Vector3();
const _zAxis = new THREE.Vector3(0, 0, 1);
const _zeroMat = new THREE.Matrix4().makeScale(0, 0, 0);
const _sparkCol = new THREE.Color();

function updateVFX(dt, elapsed) {
  // Emit sparks & curb dust/tire smoke from cars
  for (let i = 0; i < cars.length; i++) {
    const car = cars[i];
    // High-speed underfloor bottoming on bumps, crests & curbs triggers titanium spark showers!
    const bumpWave = Math.sin(car.s * 0.085) * Math.cos(car.s * 0.21);
    const sparkChance = (car.speed > 66 && bumpWave > 0.38) || (car.onCurb && car.speed > 46);
    if (sparkChance && rng() < 0.78) {
      const burst = car.onCurb ? 4 : 3;
      for (let b = 0; b < burst; b++) {
        const origin = car.worldPos.clone()
          .addScaledVector(car.forward, -0.55 - rng() * 0.9)
          .addScaledVector(car.right, (rng() - 0.5) * 0.42)
          .addScaledVector(car.up, 0.07);
        const vel = car.worldVel.clone().multiplyScalar(0.32)
          .addScaledVector(car.forward, -(14 + rng() * 14))
          .addScaledVector(car.right, (rng() - 0.5) * 6.5)
          .addScaledVector(car.up, 1.8 + rng() * 4.2);
        emitSpark(origin, vel, car.worldPos.y + 0.03);
      }
    }

    // Curb dust & lock-up braking tire smoke
    if (car.onCurb && rng() < 0.65) {
      const wheelPos = car.worldPos.clone()
        .addScaledVector(car.forward, -1.65)
        .addScaledVector(car.right, car.curbSide * 0.82)
        .addScaledVector(car.up, 0.16);
      const vel = car.worldVel.clone().multiplyScalar(0.15)
        .addScaledVector(car.right, car.curbSide * (1.8 + rng() * 2.2))
        .addScaledVector(car.up, 1.4 + rng() * 1.8);
      emitSmoke(wheelPos, vel, true);
    } else if (car.brakeHeat > 0.58 && car.accel < -16 && rng() < 0.45) {
      // Heavy braking front tire smoke puff
      const side = rng() < 0.5 ? 1 : -1;
      const wheelPos = car.worldPos.clone()
        .addScaledVector(car.forward, 1.55)
        .addScaledVector(car.right, side * 0.80)
        .addScaledVector(car.up, 0.14);
      const vel = car.worldVel.clone().multiplyScalar(0.18)
        .addScaledVector(car.up, 1.2 + rng() * 1.4);
      emitSmoke(wheelPos, vel, false);
    }
  }

  // Integrate sparks
  for (let i = 0; i < MAX_SPARKS; i++) {
    const sp = sparks[i];
    if (!sp.active) {
      sparkInst.setMatrixAt(i, _zeroMat);
      continue;
    }
    sp.life += dt;
    if (sp.life >= sp.maxLife) {
      sp.active = false;
      sparkInst.setMatrixAt(i, _zeroMat);
      continue;
    }
    sp.vel.y -= 18.0 * dt;
    sp.pos.addScaledVector(sp.vel, dt);
    if (sp.pos.y < sp.groundY) {
      sp.pos.y = sp.groundY;
      sp.vel.y = Math.abs(sp.vel.y) * 0.45;
      sp.vel.x *= 0.85;
      sp.vel.z *= 0.85;
    }

    const fade = 1 - sp.life / sp.maxLife;
    _vfxDir.copy(sp.vel);
    const spd = _vfxDir.length();
    if (spd > 0.01) _vfxDir.divideScalar(spd);
    else _vfxDir.set(0, 0, 1);
    _vfxQuat.setFromUnitVectors(_zAxis, _vfxDir);
    _vfxScale.set(fade, fade, clamp(spd * 0.045, 0.4, 2.4) * fade);
    _vfxMat.compose(sp.pos, _vfxQuat, _vfxScale);
    sparkInst.setMatrixAt(i, _vfxMat);
    _sparkCol.setRGB(2.8 * fade, 1.65 * fade * fade, 0.55 * fade * fade);
    sparkInst.setColorAt(i, _sparkCol);
  }
  sparkInst.instanceMatrix.needsUpdate = true;
  if (sparkInst.instanceColor) sparkInst.instanceColor.needsUpdate = true;

  // Integrate billboarded smoke & curb dust puffs
  for (let i = 0; i < MAX_SMOKE; i++) {
    const p = smokePuffs[i];
    if (!p.active) {
      smokeInst.setMatrixAt(i, _zeroMat);
      continue;
    }
    p.life += dt;
    if (p.life >= p.maxLife) {
      p.active = false;
      smokeInst.setMatrixAt(i, _zeroMat);
      continue;
    }
    p.vel.multiplyScalar(1 - dt * 2.2);
    p.vel.y += 1.4 * dt;
    p.pos.addScaledVector(p.vel, dt);

    const t = p.life / p.maxLife;
    const sc = p.size * (0.8 + t * 3.1) * Math.sin(Math.min(1, t * 1.15) * Math.PI);
    _vfxScale.set(sc, sc, sc);
    _vfxMat.compose(p.pos, camera.quaternion, _vfxScale);
    smokeInst.setMatrixAt(i, _vfxMat);
    smokeInst.setColorAt(i, p.color);
  }
  smokeInst.instanceMatrix.needsUpdate = true;
  if (smokeInst.instanceColor) smokeInst.instanceColor.needsUpdate = true;
}

// ============================================================================
// 11. CINEMATIC BROADCAST CAMERA SYSTEM + DAMPED ORBITCONTROLS FREE MODE
// ============================================================================
const CAM_MODES = ['helicopter', 'trackside', 'chase', 'onboard'];
let broadcastModeIdx = 0;
let shotTimer = 0;
let shotDuration = 7.2;
let freeCamActive = false;
let onboardCarIdx = 0;

// Trackside crane state
const tracksidePos = new THREE.Vector3();
let tracksideSide = 1;
const smoothCamPos = new THREE.Vector3(24, 14, 30);
const smoothCamTarget = new THREE.Vector3(0, 1, 0);
const prevCamPos = new THREE.Vector3().copy(camera.position);
const camVelocity = new THREE.Vector3();
const prevPackCenter = new THREE.Vector3();
let packCenterInitialized = false;
let currentFocusDist = 18.0;

function pickTracksideStation(leadCar) {
  // Place virtual broadcast camera crane 85m ahead of lead car on an unobstructed outer vantage
  const aheadSample = sampleTrack(leadCar.s + 88);
  tracksideSide = aheadSample.curvature >= 0 ? -1 : 1;
  if (aheadSample.isMainStraight) tracksideSide = -1; // Grandstand side
  const distOut = aheadSample.isMainStraight ? 11.5 : 13.5;
  tracksidePos.copy(aheadSample.pos)
    .addScaledVector(aheadSample.right, tracksideSide * distOut)
    .addScaledVector(worldUp, 3.1);
}

function cutToBroadcastMode(modeIdx, ranked) {
  broadcastModeIdx = modeIdx % CAM_MODES.length;
  shotTimer = 0;
  const mode = CAM_MODES[broadcastModeIdx];
  const leader = ranked[0];
  const packCenter = new THREE.Vector3();
  for (const c of cars) packCenter.add(c.worldPos);
  packCenter.multiplyScalar(0.25);

  if (mode === 'helicopter') {
    shotDuration = 8.0;
    const orbitAng = elapsed * 0.22 + 2.55;
    const heliP = packCenter.clone().add(new THREE.Vector3(
      Math.cos(orbitAng) * 38,
      19.0,
      Math.sin(orbitAng) * 38
    ));
    smoothCamPos.copy(heliP);
    smoothCamTarget.copy(packCenter).add(new THREE.Vector3(0, 1.4, 0));
    camera.position.copy(heliP);
    camera.lookAt(smoothCamTarget);
    camera.fov = 46;
    camera.updateProjectionMatrix();
  } else if (mode === 'trackside') {
    shotDuration = 6.2;
    pickTracksideStation(leader);
    smoothCamPos.copy(tracksidePos);
    camera.position.copy(tracksidePos);
    camera.fov = 34; // Telephoto broadcast lens compression!
    camera.updateProjectionMatrix();
  } else if (mode === 'chase') {
    shotDuration = 7.6;
    const chaseP = leader.worldPos.clone()
      .addScaledVector(leader.forward, -9.2)
      .addScaledVector(leader.up, 2.75);
    smoothCamPos.copy(chaseP);
    camera.position.copy(chaseP);
    camera.fov = 52;
    camera.updateProjectionMatrix();
  } else if (mode === 'onboard') {
    shotDuration = 6.8;
    // Choose P2 (chasing the leader right ahead!) for maximum wheel-to-wheel drama
    onboardCarIdx = ranked[1].id;
    camera.fov = 62;
    camera.updateProjectionMatrix();
  }
}

// Seamless transition into smooth damped OrbitControls on user pointer drag or scroll
let pointerDownPos = { x: 0, y: 0 };
let pointerIsDown = false;

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerIsDown = true;
  pointerDownPos.x = e.clientX;
  pointerDownPos.y = e.clientY;
  unlockAudio();
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!pointerIsDown || freeCamActive) return;
  const moved = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
  if (moved > 6) {
    enterFreeOrbitMode();
  }
});

renderer.domElement.addEventListener('pointerup', () => {
  pointerIsDown = false;
});

renderer.domElement.addEventListener('wheel', () => {
  unlockAudio();
  if (!freeCamActive) enterFreeOrbitMode();
}, { passive: true });

renderer.domElement.addEventListener('dblclick', () => {
  if (freeCamActive) {
    freeCamActive = false;
    controls.enabled = false;
    const ranked = [...cars].sort((a, b) => b.totalDist - a.totalDist);
    cutToBroadcastMode((broadcastModeIdx + 1) % CAM_MODES.length, ranked);
  }
});

// Silent keyboard shortcuts (no UI overlays): 1-4 broadcast shots, 5 free orbit, Space/C resume broadcast
window.addEventListener('keydown', (e) => {
  unlockAudio();
  const ranked = [...cars].sort((a, b) => b.totalDist - a.totalDist);
  if (e.key === '1') { freeCamActive = false; controls.enabled = false; cutToBroadcastMode(0, ranked); }
  else if (e.key === '2') { freeCamActive = false; controls.enabled = false; cutToBroadcastMode(1, ranked); }
  else if (e.key === '3') { freeCamActive = false; controls.enabled = false; cutToBroadcastMode(2, ranked); }
  else if (e.key === '4') { freeCamActive = false; controls.enabled = false; cutToBroadcastMode(3, ranked); }
  else if (e.key === '5') { enterFreeOrbitMode(); }
  else if (e.key === ' ' || e.key.toLowerCase() === 'c') {
    freeCamActive = false;
    controls.enabled = false;
    cutToBroadcastMode((broadcastModeIdx + 1) % CAM_MODES.length, ranked);
  }
});

function enterFreeOrbitMode() {
  freeCamActive = true;
  controls.enabled = true;
  camera.fov = 46;
  camera.updateProjectionMatrix();
  const packCenter = new THREE.Vector3();
  for (const c of cars) packCenter.add(c.worldPos);
  packCenter.multiplyScalar(0.25);
  packCenter.y += 0.9;
  controls.target.copy(packCenter);
  // If coming from tight onboard cam, pull smoothly back to an ideal orbit distance
  if (camera.position.distanceTo(packCenter) < 6.0) {
    camera.position.copy(packCenter).add(new THREE.Vector3(12, 6.5, -14));
  }
  prevPackCenter.copy(packCenter);
  packCenterInitialized = true;
  controls.update();
}

function updateCameraAndShadows(dt, elapsed, ranked) {
  const leader = ranked[0];
  const packCenter = new THREE.Vector3();
  for (const c of cars) packCenter.add(c.worldPos);
  packCenter.multiplyScalar(0.25);

  if (!packCenterInitialized) {
    prevPackCenter.copy(packCenter);
    packCenterInitialized = true;
  }

  prevCamPos.copy(camera.position);

  if (freeCamActive) {
    // Carry OrbitControls smoothly alongside the 300 km/h pack so free-orbiting stays locked to the race!
    const deltaPack = new THREE.Vector3().subVectors(packCenter, prevPackCenter);
    camera.position.add(deltaPack);
    controls.target.add(deltaPack);
    controls.update();
    currentFocusDist = camera.position.distanceTo(controls.target);
  } else {
    shotTimer += dt;
    if (shotTimer >= shotDuration) {
      cutToBroadcastMode((broadcastModeIdx + 1) % CAM_MODES.length, ranked);
    }

    const mode = CAM_MODES[broadcastModeIdx];
    if (mode === 'helicopter') {
      const orbitAng = elapsed * 0.22 + 2.55;
      const rad = 38 + Math.sin(elapsed * 0.4) * 4.5;
      const desiredPos = packCenter.clone().add(new THREE.Vector3(
        Math.cos(orbitAng) * rad,
        19.0 + Math.sin(elapsed * 0.35) * 3.0,
        Math.sin(orbitAng) * rad
      ));
      const desiredTarget = packCenter.clone().add(new THREE.Vector3(0, 1.4, 0));
      smoothCamPos.lerp(desiredPos, Math.min(1, dt * 4.0));
      smoothCamTarget.lerp(desiredTarget, Math.min(1, dt * 6.5));
      camera.position.copy(smoothCamPos);
      camera.lookAt(smoothCamTarget);
      currentFocusDist = camera.position.distanceTo(smoothCamTarget);

    } else if (mode === 'trackside') {
      // If the entire pack has passed far beyond the crane, relocate to a fresh ahead vantage
      if (tracksidePos.distanceTo(packCenter) > 140) {
        pickTracksideStation(leader);
      }
      camera.position.copy(tracksidePos);
      const desiredTarget = packCenter.clone().add(new THREE.Vector3(0, 0.75, 0));
      smoothCamTarget.lerp(desiredTarget, Math.min(1, dt * 9.5));
      camera.lookAt(smoothCamTarget);
      // Dynamic telephoto zoom tightening as cars approach
      const dist = camera.position.distanceTo(smoothCamTarget);
      const targetFov = clamp(24 + (dist / 110) * 18, 24, 44);
      camera.fov = lerp(camera.fov, targetFov, Math.min(1, dt * 4));
      camera.updateProjectionMatrix();
      currentFocusDist = dist;

    } else if (mode === 'chase') {
      const hero = leader;
      const sway = Math.sin(elapsed * 0.75) * 1.45;
      const desiredPos = hero.worldPos.clone()
        .addScaledVector(hero.forward, -8.8)
        .addScaledVector(hero.up, 2.55)
        .addScaledVector(hero.right, sway);
      const desiredTarget = hero.worldPos.clone()
        .addScaledVector(hero.forward, 8.5)
        .addScaledVector(hero.up, 0.85);
      smoothCamPos.lerp(desiredPos, Math.min(1, dt * 8.5));
      smoothCamTarget.lerp(desiredTarget, Math.min(1, dt * 10.5));
      camera.position.copy(smoothCamPos);
      camera.lookAt(smoothCamTarget);
      const speedFov = 48 + smoothstep(35, 92, hero.speed) * 11;
      camera.fov = lerp(camera.fov, speedFov, Math.min(1, dt * 4));
      camera.updateProjectionMatrix();
      currentFocusDist = camera.position.distanceTo(hero.worldPos);

    } else if (mode === 'onboard') {
      const car = cars[onboardCarIdx];
      // Classic T-Cam perspective mounted above airbox looking over helmet, halo & rival ahead
      const tCamPos = car.worldPos.clone()
        .addScaledVector(car.forward, -0.34)
        .addScaledVector(car.up, 1.18)
        .addScaledVector(car.right, 0.04);
      const lookAhead = car.worldPos.clone()
        .addScaledVector(car.forward, 18.0)
        .addScaledVector(car.up, 0.62);
      camera.position.copy(tCamPos);
      camera.up.lerp(car.up, Math.min(1, dt * 14));
      camera.lookAt(lookAhead);
      currentFocusDist = 14.0;
    }

    if (mode !== 'onboard') {
      camera.up.lerp(worldUp, Math.min(1, dt * 8));
    }
  }

  prevPackCenter.copy(packCenter);
  camVelocity.subVectors(camera.position, prevCamPos).divideScalar(Math.max(dt, 0.001));

  // Keep sky dome centered around camera so horizon is infinite
  skyMesh.position.copy(camera.position);

  // Dynamically center crisp directional sun shadows on the active pack (texel-snapped to eliminate shimmer)
  const snap = (SHADOW_EXTENT * 2) / 2048;
  const focusX = Math.round(packCenter.x / snap) * snap;
  const focusY = Math.round(packCenter.y / snap) * snap;
  const focusZ = Math.round(packCenter.z / snap) * snap;
  sunLight.target.position.set(focusX, focusY, focusZ);
  sunLight.position.set(
    focusX + SUN_DIR.x * 165,
    focusY + SUN_DIR.y * 165,
    focusZ + SUN_DIR.z * 165
  );
  sunLight.target.updateMatrixWorld();
}

// ============================================================================
// 12. POST-PROCESSING: BLOOM, REAL DEPTH-OF-FIELD & SUBTLE FILM GRAIN
// ============================================================================
const rtWidth = Math.floor(window.innerWidth * renderer.getPixelRatio());
const rtHeight = Math.floor(window.innerHeight * renderer.getPixelRatio());

function makeHDRDepthTarget(w, h) {
  const depthTex = new THREE.DepthTexture(w, h);
  depthTex.type = THREE.UnsignedIntType;
  depthTex.format = THREE.DepthFormat;
  return new THREE.WebGLRenderTarget(w, h, {
    type: THREE.HalfFloatType,
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    depthBuffer: true,
    depthTexture: depthTex
  });
}

const composerTarget = makeHDRDepthTarget(rtWidth, rtHeight);
const composer = new EffectComposer(renderer, composerTarget);
// Ensure secondary target also carries a depth texture just in case of swaps
composer.renderTarget2.depthTexture = new THREE.DepthTexture(rtWidth, rtHeight);
composer.renderTarget2.depthTexture.type = THREE.UnsignedIntType;
composer.renderTarget2.depthTexture.format = THREE.DepthFormat;

const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.30, // calibrated golden-hour bloom strength
  0.48, // smooth optical bloom radius
  1.12  // HDR threshold so brake glow, sparks, DRS, rain light & floodlights bloom cleanly without washing paint
);
composer.addPass(bloomPass);

class CinematicFinishPass extends Pass {
  constructor() {
    super();
    this.uniforms = {
      tDiffuse: { value: null },
      tDepth: { value: null },
      uResolution: { value: new THREE.Vector2(rtWidth, rtHeight) },
      uNear: { value: camera.near },
      uFar: { value: camera.far },
      uFocusDist: { value: 22.0 },
      uDofStrength: { value: 1.0 },
      uTime: { value: 0.0 }
    };
    this.material = new THREE.ShaderMaterial({
      uniforms: this.uniforms,
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        #include <packing>
        uniform sampler2D tDiffuse;
        uniform sampler2D tDepth;
        uniform vec2 uResolution;
        uniform float uNear;
        uniform float uFar;
        uniform float uFocusDist;
        uniform float uDofStrength;
        uniform float uTime;
        varying vec2 vUv;

        float linearizeDepth(float depthSample) {
          float viewZ = perspectiveDepthToViewZ(depthSample, uNear, uFar);
          return -viewZ;
        }

        // Narkowicz ACES Filmic Tone Mapping
        vec3 acesFilm(vec3 x) {
          const float a = 2.51;
          const float b = 0.03;
          const float c = 2.43;
          const float d = 0.59;
          const float e = 0.14;
          return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
        }

        float grainHash(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }

        void main() {
          float rawDepth = texture2D(tDepth, vUv).x;
          float dist = linearizeDepth(rawDepth);

          // Subtle cinematic Depth-of-Field circle of confusion
          float focusBand = max(uFocusDist * 0.45, 7.0);
          float coc = clamp((abs(dist - uFocusDist) - focusBand * 0.35) / (focusBand * 2.2), 0.0, 1.0);
          // Keep sky crisp enough while gently softening far background & close foreground edge
          if (rawDepth > 0.9995) coc *= 0.35;
          float radiusPx = coc * 2.65 * uDofStrength;

          vec3 col = texture2D(tDiffuse, vUv).rgb;
          if (radiusPx > 0.18) {
            vec2 texel = radiusPx / uResolution;
            vec3 acc = col * 1.4;
            float wSum = 1.4;
            // 8-tap golden-angle circular bokeh disk
            const vec2 taps[8] = vec2[8](
              vec2( 0.85,  0.12), vec2(-0.62,  0.58),
              vec2(-0.18, -0.84), vec2( 0.56, -0.64),
              vec2( 0.32,  0.42), vec2(-0.48, -0.18),
              vec2(-0.12,  0.52), vec2( 0.44, -0.26)
            );
            for (int i = 0; i < 8; i++) {
              vec2 sampleUv = clamp(vUv + taps[i] * texel, vec2(0.001), vec2(0.999));
              acc += texture2D(tDiffuse, sampleUv).rgb;
              wSum += 1.0;
            }
            col = acc / wSum;
          }

          // Calibrated golden-hour exposure & ACES Filmic tone mapping
          col = clamp(col, vec3(0.0), vec3(64.0));
          col *= 0.96;
          col = acesFilm(col);

          // Subtle warm golden highlights & rich shadow contrast
          vec3 lumaW = vec3(0.2126, 0.7152, 0.0722);
          float luma = dot(col, lumaW);
          col = mix(col, col * vec3(1.03, 1.00, 0.96), smoothstep(0.35, 0.95, luma) * 0.45);
          col = mix(col, col * vec3(0.97, 0.98, 1.03), (1.0 - smoothstep(0.0, 0.35, luma)) * 0.25);

          // Gentle broadcast optical vignette
          vec2 vigUv = vUv * 2.0 - 1.0;
          float vig = 1.0 - dot(vigUv, vigUv) * 0.14;
          col *= clamp(vig, 0.74, 1.0);

          // Linear -> sRGB gamma encoding (strictly positive base -> zero NaN)
          col = pow(max(col, vec3(0.00001)), vec3(1.0 / 2.2));

          // Subtle photographic animated film grain
          float g = grainHash(gl_FragCoord.xy + fract(uTime * 17.31) * 913.7) - 0.5;
          col += g * (0.022 + 0.014 * (1.0 - luma));

          gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
        }
      `
    });
    this.fsQuad = new FullScreenQuad(this.material);
    this.needsSwap = false;
  }

  render(renderer, writeBuffer, readBuffer) {
    this.uniforms.tDiffuse.value = readBuffer.texture;
    this.uniforms.tDepth.value = readBuffer.depthTexture || composer.renderTarget1.depthTexture;
    if (this.renderToScreen) {
      renderer.setRenderTarget(null);
      this.fsQuad.render(renderer);
    } else {
      renderer.setRenderTarget(writeBuffer);
      this.fsQuad.render(renderer);
    }
  }
}

const finishPass = new CinematicFinishPass();
composer.addPass(finishPass);

// ============================================================================
// 13. SYNTHESIZED WEBAUDIO ENGINE WHINE + REAL-TIME DOPPLER EFFECT
// ============================================================================
let audioCtx = null;
let audioMaster = null;
let audioUnlocked = false;
const engineVoices = [];

function makeExhaustWaveshaper(ctx) {
  const shaper = ctx.createWaveShaper();
  const samples = 256;
  const curve = new Float32Array(samples);
  for (let i = 0; i < samples; i++) {
    const x = (i * 2) / samples - 1;
    curve[i] = Math.tanh(x * 2.6);
  }
  shaper.curve = curve;
  return shaper;
}

function unlockAudio() {
  if (audioUnlocked) {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    audioCtx = new AudioContextClass();
    audioUnlocked = true;

    audioMaster = audioCtx.createGain();
    audioMaster.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    audioMaster.gain.exponentialRampToValueAtTime(0.32, audioCtx.currentTime + 0.6);
    audioMaster.connect(audioCtx.destination);

    // Build 4 individual harmonic Formula engine voices (one per car!)
    for (let i = 0; i < cars.length; i++) {
      const oscMain = audioCtx.createOscillator();
      const oscHarm = audioCtx.createOscillator();
      const oscTurbo = audioCtx.createOscillator();

      oscMain.type = 'sawtooth';
      oscHarm.type = 'triangle';
      oscTurbo.type = 'sine';

      const gMain = audioCtx.createGain();
      const gHarm = audioCtx.createGain();
      const gTurbo = audioCtx.createGain();
      gMain.gain.value = 0.42;
      gHarm.gain.value = 0.28;
      gTurbo.gain.value = 0.14;

      const shaper = makeExhaustWaveshaper(audioCtx);
      const formant = audioCtx.createBiquadFilter();
      formant.type = 'bandpass';
      formant.frequency.value = 680;
      formant.Q.value = 1.35;

      const lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 2600;

      const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      const voiceGain = audioCtx.createGain();
      voiceGain.gain.value = 0.0001;

      oscMain.connect(gMain).connect(shaper);
      oscHarm.connect(gHarm).connect(shaper);
      shaper.connect(formant).connect(lp).connect(voiceGain);
      oscTurbo.connect(gTurbo).connect(lp);

      if (panner) {
        voiceGain.connect(panner).connect(audioMaster);
      } else {
        voiceGain.connect(audioMaster);
      }

      const t0 = audioCtx.currentTime;
      oscMain.start(t0);
      oscHarm.start(t0);
      oscTurbo.start(t0);

      engineVoices.push({
        oscMain,
        oscHarm,
        oscTurbo,
        formant,
        lp,
        panner,
        voiceGain,
        detuneScale: 0.96 + i * 0.028 // Distinct engine harmonic timbre per car
      });
    }
  } catch (_) {
    // WebAudio unavailable
  }
}

const _camRight = new THREE.Vector3();
const _toCar = new THREE.Vector3();
const _relVel = new THREE.Vector3();

function updateEngineAudio() {
  if (!audioUnlocked || !audioCtx || audioCtx.state !== 'running') return;

  const now = audioCtx.currentTime;
  const SPEED_OF_SOUND = 343.0;
  _camRight.set(1, 0, 0).applyQuaternion(camera.quaternion);

  for (let i = 0; i < cars.length; i++) {
    const car = cars[i];
    const voice = engineVoices[i];
    if (!voice) continue;

    _toCar.subVectors(car.worldPos, camera.position);
    const dist = Math.max(_toCar.length(), 1.8);
    _toCar.divideScalar(dist);

    // Real physical Doppler pitch factor: c / (c + v_radial)
    _relVel.subVectors(car.worldVel, camVelocity);
    const radialVel = _relVel.dot(_toCar); // > 0 moving away, < 0 approaching
    const doppler = clamp(SPEED_OF_SOUND / (SPEED_OF_SOUND + radialVel), 0.62, 1.58);

    // High-revving Formula firing frequency scaled by RPM + Doppler shift
    const baseFreq = (car.rpm / 60) * 3.0 * voice.detuneScale; // 3 firings/rev (V6/V10 bark)
    const fMain = clamp(baseFreq * doppler, 90, 1400);
    const fHarm = clamp(fMain * 1.5, 130, 2200);
    const fTurbo = clamp((950 + car.speed * 26) * doppler, 600, 4800);

    voice.oscMain.frequency.setTargetAtTime(fMain, now, 0.025);
    voice.oscHarm.frequency.setTargetAtTime(fHarm, now, 0.025);
    voice.oscTurbo.frequency.setTargetAtTime(fTurbo, now, 0.03);

    // Exhaust filter opens dramatically on full throttle & narrows with distance
    const throttleOpen = car.accel > -2 ? 1.0 : 0.45;
    const distAirAbsorb = clamp(1.0 / (1.0 + dist * 0.015), 0.18, 1.0);
    voice.formant.frequency.setTargetAtTime(clamp(fMain * 1.65, 280, 1900), now, 0.04);
    voice.lp.frequency.setTargetAtTime(clamp((1200 + 2800 * throttleOpen) * distAirAbsorb, 350, 4400), now, 0.04);

    // Distance attenuation & stereo panning
    const gain = clamp(1.0 / (1.0 + 0.0085 * dist * dist * 0.18 + 0.045 * dist), 0.0, 0.48)
      * (0.55 + 0.45 * throttleOpen);
    voice.voiceGain.gain.setTargetAtTime(gain, now, 0.03);

    if (voice.panner) {
      const pan = clamp(_toCar.dot(_camRight), -0.92, 0.92);
      voice.panner.pan.setTargetAtTime(pan, now, 0.03);
    }
  }
}

// ============================================================================
// 14. RESIZE HANDLER & MAIN 60 FPS ANIMATION LOOP
// ============================================================================
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio, 1.75);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h);
  composer.setSize(w, h);
  const pw = Math.floor(w * dpr);
  const ph = Math.floor(h * dpr);
  if (composer.renderTarget1.depthTexture) {
    composer.renderTarget1.depthTexture.dispose();
    composer.renderTarget1.depthTexture = new THREE.DepthTexture(pw, ph);
    composer.renderTarget1.depthTexture.type = THREE.UnsignedIntType;
    composer.renderTarget1.depthTexture.format = THREE.DepthFormat;
  }
  if (composer.renderTarget2.depthTexture) {
    composer.renderTarget2.depthTexture.dispose();
    composer.renderTarget2.depthTexture = new THREE.DepthTexture(pw, ph);
    composer.renderTarget2.depthTexture.type = THREE.UnsignedIntType;
    composer.renderTarget2.depthTexture.format = THREE.DepthFormat;
  }
  bloomPass.resolution.set(w, h);
  finishPass.uniforms.uResolution.value.set(pw, ph);
});

let lastTime = performance.now();
let elapsed = 0;

// Initialize initial poses & launch directly into dramatic helicopter broadcast shot
const initialRanked = updateRaceSimulation(0.016, 0.016);
cutToBroadcastMode(0, initialRanked);
updateCameraAndShadows(0.016, 0.016, initialRanked);

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) * 0.001, 0.05);
  lastTime = now;
  elapsed += dt;

  // 1. Update 4-car Grand Prix race physics, overtakes, slipstream, braking, DRS & wheels
  const ranked = updateRaceSimulation(dt, elapsed);

  // 2. Update pooled sparks, tire smoke & curb dust VFX
  updateVFX(dt, elapsed);

  // 3. Update cinematic broadcast camera (or damped OrbitControls) & dynamic sun shadows
  updateCameraAndShadows(dt, elapsed, ranked);

  // 4. Update car LODs against active camera
  for (let i = 0; i < cars.length; i++) {
    cars[i].visual.lod.update(camera);
  }

  // 5. Update synthesized WebAudio engine whine + Doppler shift
  updateEngineAudio();

  // 6. Update wind foliage/flag animation & post-processing uniforms, then render
  foliageWindUniform.value = elapsed;
  finishPass.uniforms.uFocusDist.value = lerp(finishPass.uniforms.uFocusDist.value, currentFocusDist, Math.min(1, dt * 8));
  finishPass.uniforms.uTime.value = elapsed;
  composer.render();
}

requestAnimationFrame(animate);
</script>
