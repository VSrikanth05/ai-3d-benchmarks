<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ============================================================================
// 1. DETERMINISTIC PRNG & MATH UTILITIES
// ============================================================================
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rng = mulberry32(20261119);
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
const wrapMod = (x, m) => ((x % m) + m) % m;

function hash2D(ix, iz) {
  let n = Math.imul(ix, 374761393) + Math.imul(iz, 668265263);
  n = (n ^ (n >>> 13)) >>> 0;
  n = Math.imul(n, 1274126177) >>> 0;
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

function valueNoise2D(x, z) {
  const ix = Math.floor(x);
  const iz = Math.floor(z);
  const fx = x - ix;
  const fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx);
  const uz = fz * fz * (3 - 2 * fz);
  const a = hash2D(ix, iz);
  const b = hash2D(ix + 1, iz);
  const c = hash2D(ix, iz + 1);
  const d = hash2D(ix + 1, iz + 1);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uz);
}

function fbm2D(x, z, octaves = 4) {
  let sum = 0;
  let amp = 0.5;
  let freq = 1;
  let norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += amp * valueNoise2D(x * freq, z * freq);
    norm += amp;
    amp *= 0.5;
    freq *= 2.03;
  }
  return sum / norm;
}

// ============================================================================
// 2. RENDERER, SCENE, CAMERA & CONTROLS
// ============================================================================
const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: 'high-performance',
  stencil: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping; // Handled in final HDR post-process pass
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xd89d6e, 0.00145);

const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.25, 1600);
camera.position.set(22, 11, 28);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = true;
controls.minDistance = 4.2;
controls.maxDistance = 260;
controls.maxPolarAngle = Math.PI * 0.488;
controls.rotateSpeed = 0.65;
controls.zoomSpeed = 0.85;
controls.enabled = false;

// ============================================================================
// 3. GOLDEN-HOUR SKY DOME, SUN LIGHTING & PMREM ENVIRONMENT
// ============================================================================
const SUN_AZIMUTH = 0.62; // Warm low golden-hour sun across the track
const SUN_ELEVATION = 0.21; // ~12 degrees above horizon
const SUN_DIR = new THREE.Vector3(
  Math.cos(SUN_ELEVATION) * Math.sin(SUN_AZIMUTH),
  Math.sin(SUN_ELEVATION),
  Math.cos(SUN_ELEVATION) * Math.cos(SUN_AZIMUTH)
).normalize();

function createGoldenHourSkyMaterial() {
  return new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      uSunDir: { value: SUN_DIR.clone() }
    },
    vertexShader: /* glsl */ `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */ `
      uniform vec3 uSunDir;
      varying vec3 vDir;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }
      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
          mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }
      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
        for (int i = 0; i < 4; i++) {
          v += a * noise(p);
          p = rot * p * 2.06;
          a *= 0.5;
        }
        return v;
      }

      void main() {
        vec3 d = normalize(vDir);
        float y = max(d.y, 0.0);
        float sunCos = max(dot(d, normalize(uSunDir)), 0.0001);

        // Zenith to warm golden-hour horizon gradient (strictly positive pow bases -> zero NaNs)
        vec3 zenithCol = vec3(0.08, 0.16, 0.34);
        vec3 midSkyCol = vec3(0.32, 0.42, 0.58);
        vec3 horizonCol = vec3(0.95, 0.56, 0.30);
        vec3 groundHaze = vec3(0.36, 0.23, 0.16);

        float horizT = pow(max(smoothstep(0.0, 0.38, y), 0.0001), 0.72);
        vec3 sky = mix(horizonCol, midSkyCol, horizT);
        sky = mix(sky, zenithCol, smoothstep(0.24, 0.92, y));

        // Mie forward scattering golden glow around sun
        float mieWide = pow(sunCos, 4.0);
        float mieTight = pow(sunCos, 48.0);
        float sunDisc = smoothstep(0.9986, 0.9996, sunCos);

        sky += vec3(1.0, 0.52, 0.22) * mieWide * (0.48 + 0.55 * (1.0 - smoothstep(0.0, 0.45, y)));
        sky += vec3(1.5, 0.92, 0.48) * mieTight * 0.95;
        sky += vec3(5.2, 3.8, 2.2) * sunDisc;

        // High-altitude sunlit golden cirrus clouds
        if (d.y > 0.015) {
          vec2 cloudUV = d.xz / (d.y + 0.16) * 0.65 + vec2(1.4, -0.8);
          float c1 = fbm(cloudUV * 1.4);
          float c2 = fbm(cloudUV * 3.1 + vec2(4.2, 2.7));
          float cloudMask = smoothstep(0.48, 0.78, c1 * 0.72 + c2 * 0.28);
          cloudMask *= smoothstep(0.015, 0.14, d.y) * (1.0 - smoothstep(0.58, 0.96, d.y));
          vec3 cloudDark = vec3(0.45, 0.32, 0.34);
          vec3 cloudLit = mix(vec3(1.1, 0.68, 0.38), vec3(1.7, 1.15, 0.65), pow(sunCos, 2.5));
          vec3 cloudCol = mix(cloudDark, cloudLit, smoothstep(0.2, 0.85, c2 + sunCos * 0.45));
          sky = mix(sky, cloudCol, cloudMask * 0.62);
        }

        // Below horizon warm hazy blend
        float below = smoothstep(0.03, -0.14, d.y);
        sky = mix(sky, groundHaze, below);

        gl_FragColor = vec4(clamp(sky, vec3(0.0), vec3(12.0)), 1.0);
      }
    `
  });
}

const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(1250, 48, 28), createGoldenHourSkyMaterial());
scene.add(skyMesh);

function buildGoldenHourPMREM() {
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const envScene = new THREE.Scene();
  const envSky = new THREE.Mesh(new THREE.SphereGeometry(40, 32, 20), createGoldenHourSkyMaterial());
  envScene.add(envSky);

  // Subtle warm ground bounce disc for realistic underside metallic reflections
  const groundBounce = new THREE.Mesh(
    new THREE.CircleGeometry(35, 32),
    new THREE.MeshBasicMaterial({ color: 0x3b2b20 })
  );
  groundBounce.rotation.x = -Math.PI / 2;
  groundBounce.position.y = -4;
  envScene.add(groundBounce);

  const rt = pmrem.fromScene(envScene, 0.025);
  pmrem.dispose();
  return rt.texture;
}

scene.environment = buildGoldenHourPMREM();
scene.environmentIntensity = 0.88;

// Primary Golden-Hour Sun Light (dynamic shadow frustum tracks the race pack)
const sunLight = new THREE.DirectionalLight(0xffb56e, 3.4);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 10;
sunLight.shadow.camera.far = 360;
const SHADOW_EXTENT = 72;
sunLight.shadow.camera.left = -SHADOW_EXTENT;
sunLight.shadow.camera.right = SHADOW_EXTENT;
sunLight.shadow.camera.top = SHADOW_EXTENT;
sunLight.shadow.camera.bottom = -SHADOW_EXTENT;
sunLight.shadow.bias = -0.00045;
sunLight.shadow.normalBias = 0.035;
scene.add(sunLight);
scene.add(sunLight.target);

// Cool sky / warm earth hemisphere fill
const hemiLight = new THREE.HemisphereLight(0x88a8dc, 0x4c3626, 0.78);
scene.add(hemiLight);

// Subtle warm rim bounce from opposite horizon
const rimLight = new THREE.DirectionalLight(0x7ca2d8, 0.42);
rimLight.position.copy(SUN_DIR).multiplyScalar(-120);
rimLight.position.y = 42;
scene.add(rimLight);

// ============================================================================
// 4. PROCEDURAL PBR TEXTURES (CARBON WEAVE, ASPHALT, GRAVEL, RUBBER, FENCE)
// ============================================================================
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

function createCarbonTextures() {
  const size = 256;
  const colCanvas = makeCanvas(size, size);
  const cctx = colCanvas.getContext('2d');
  const normCanvas = makeCanvas(size, size);
  const nctx = normCanvas.getContext('2d');
  const roughCanvas = makeCanvas(size, size);
  const rctx = roughCanvas.getContext('2d');

  const colImg = cctx.createImageData(size, size);
  const normImg = nctx.createImageData(size, size);
  const roughImg = rctx.createImageData(size, size);

  const cell = 16; // 2x2 twill weave repeat
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const gx = Math.floor(x / (cell / 2));
      const gy = Math.floor(y / (cell / 2));
      const lx = (x % (cell / 2)) / (cell / 2);
      const ly = (y % (cell / 2)) / (cell / 2);

      // 2x2 twill pattern
      const twill = ((gx + gy) % 4) < 2;
      const fiber = twill
        ? Math.sin(lx * Math.PI) * (0.85 + 0.15 * Math.sin(ly * Math.PI * 3))
        : Math.sin(ly * Math.PI) * (0.85 + 0.15 * Math.sin(lx * Math.PI * 3));

      const base = twill ? 20 + fiber * 24 : 14 + fiber * 19;
      const idx = (y * size + x) * 4;
      colImg.data[idx] = base;
      colImg.data[idx + 1] = base + 1;
      colImg.data[idx + 2] = base + 3;
      colImg.data[idx + 3] = 255;

      // Subtle twill normal slope
      const nx = twill ? Math.cos(lx * Math.PI) * 0.42 : 0.0;
      const ny = twill ? 0.0 : Math.cos(ly * Math.PI) * 0.42;
      normImg.data[idx] = Math.round((nx * 0.5 + 0.5) * 255);
      normImg.data[idx + 1] = Math.round((ny * 0.5 + 0.5) * 255);
      normImg.data[idx + 2] = 238;
      normImg.data[idx + 3] = 255;

      const rough = Math.round((twill ? 0.24 : 0.34) * 255 + (1 - fiber) * 24);
      roughImg.data[idx] = rough;
      roughImg.data[idx + 1] = rough;
      roughImg.data[idx + 2] = rough;
      roughImg.data[idx + 3] = 255;
    }
  }
  cctx.putImageData(colImg, 0, 0);
  nctx.putImageData(normImg, 0, 0);
  rctx.putImageData(roughImg, 0, 0);

  const map = new THREE.CanvasTexture(colCanvas);
  const normalMap = new THREE.CanvasTexture(normCanvas);
  const roughnessMap = new THREE.CanvasTexture(roughCanvas);
  for (const t of [map, normalMap, roughnessMap]) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(14, 14);
    t.anisotropy = 8;
  }
  map.colorSpace = THREE.SRGBColorSpace;
  return { map, normalMap, roughnessMap };
}

function createAsphaltTextures() {
  const size = 512;
  const colCanvas = makeCanvas(size, size);
  const cctx = colCanvas.getContext('2d');
  const normCanvas = makeCanvas(size, size);
  const nctx = normCanvas.getContext('2d');
  const roughCanvas = makeCanvas(size, size);
  const rctx = roughCanvas.getContext('2d');

  const colImg = cctx.createImageData(size, size);
  const normImg = nctx.createImageData(size, size);
  const roughImg = rctx.createImageData(size, size);

  const hField = new Float32Array(size * size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const n1 = hash2D(x, y);
      const n2 = valueNoise2D(x * 0.14, y * 0.14);
      const n3 = valueNoise2D(x * 0.035, y * 0.035);
      // Longitudinal subtle tire wear streaks along V (y)
      const streak = valueNoise2D(x * 0.09, y * 0.008);
      const h = n1 * 0.45 + n2 * 0.35 + n3 * 0.2;
      hField[y * size + x] = h;

      const idx = (y * size + x) * 4;
      const pebble = (n1 > 0.86 ? 20 : 0) + (n1 < 0.12 ? -10 : 0);
      const val = clamp(50 + n3 * 18 + (n2 - 0.5) * 14 + pebble - streak * 8, 28, 92);
      colImg.data[idx] = val;
      colImg.data[idx + 1] = val + 1;
      colImg.data[idx + 2] = val + 3;
      colImg.data[idx + 3] = 255;

      const rough = clamp(Math.round((0.72 + (1 - n2) * 0.2 - streak * 0.08) * 255), 115, 245);
      roughImg.data[idx] = rough;
      roughImg.data[idx + 1] = rough;
      roughImg.data[idx + 2] = rough;
      roughImg.data[idx + 3] = 255;
    }
  }

  for (let y = 0; y < size; y++) {
    const ym = (y - 1 + size) % size;
    const yp = (y + 1) % size;
    for (let x = 0; x < size; x++) {
      const xm = (x - 1 + size) % size;
      const xp = (x + 1) % size;
      const dx = (hField[y * size + xp] - hField[y * size + xm]) * 2.4;
      const dy = (hField[yp * size + x] - hField[ym * size + x]) * 2.4;
      const idx = (y * size + x) * 4;
      normImg.data[idx] = clamp(Math.round((-dx * 0.5 + 0.5) * 255), 0, 255);
      normImg.data[idx + 1] = clamp(Math.round((-dy * 0.5 + 0.5) * 255), 0, 255);
      normImg.data[idx + 2] = 235;
      normImg.data[idx + 3] = 255;
    }
  }
  cctx.putImageData(colImg, 0, 0);
  nctx.putImageData(normImg, 0, 0);
  rctx.putImageData(roughImg, 0, 0);

  const map = new THREE.CanvasTexture(colCanvas);
  const normalMap = new THREE.CanvasTexture(normCanvas);
  const roughnessMap = new THREE.CanvasTexture(roughCanvas);
  for (const t of [map, normalMap, roughnessMap]) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 12;
  }
  map.colorSpace = THREE.SRGBColorSpace;
  return { map, normalMap, roughnessMap };
}

function createGravelTextures() {
  const size = 256;
  const colCanvas = makeCanvas(size, size);
  const cctx = colCanvas.getContext('2d');
  const normCanvas = makeCanvas(size, size);
  const nctx = normCanvas.getContext('2d');
  const colImg = cctx.createImageData(size, size);
  const normImg = nctx.createImageData(size, size);
  const hf = new Float32Array(size * size);

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      // Raked gravel furrows along track length (y)
      const rake = Math.sin(x * 0.34) * 0.5 + 0.5;
      const stone = hash2D(x, y);
      const lump = valueNoise2D(x * 0.25, y * 0.25);
      const h = rake * 0.45 + stone * 0.35 + lump * 0.2;
      hf[y * size + x] = h;
      const idx = (y * size + x) * 4;
      const base = 152 + (stone - 0.5) * 42 + (rake - 0.5) * 18;
      colImg.data[idx] = clamp(base + 14, 95, 220);
      colImg.data[idx + 1] = clamp(base + 4, 85, 210);
      colImg.data[idx + 2] = clamp(base - 14, 70, 195);
      colImg.data[idx + 3] = 255;
    }
  }
  for (let y = 0; y < size; y++) {
    const ym = (y - 1 + size) % size;
    const yp = (y + 1) % size;
    for (let x = 0; x < size; x++) {
      const xm = (x - 1 + size) % size;
      const xp = (x + 1) % size;
      const dx = (hf[y * size + xp] - hf[y * size + xm]) * 3.0;
      const dy = (hf[yp * size + x] - hf[ym * size + x]) * 3.0;
      const idx = (y * size + x) * 4;
      normImg.data[idx] = clamp(Math.round((-dx * 0.5 + 0.5) * 255), 0, 255);
      normImg.data[idx + 1] = clamp(Math.round((-dy * 0.5 + 0.5) * 255), 0, 255);
      normImg.data[idx + 2] = 220;
      normImg.data[idx + 3] = 255;
    }
  }
  cctx.putImageData(colImg, 0, 0);
  nctx.putImageData(normImg, 0, 0);
  const map = new THREE.CanvasTexture(colCanvas);
  const normalMap = new THREE.CanvasTexture(normCanvas);
  for (const t of [map, normalMap]) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8;
  }
  map.colorSpace = THREE.SRGBColorSpace;
  return { map, normalMap };
}

function createFenceTexture() {
  const size = 128;
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  ctx.strokeStyle = 'rgba(185, 192, 200, 0.78)';
  ctx.lineWidth = 2.0;
  const step = 16;
  for (let i = -size; i < size * 2; i += step) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i + size, size);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(i, size);
    ctx.lineTo(i + size, 0);
    ctx.stroke();
  }
  // Horizontal tension cables
  ctx.strokeStyle = 'rgba(215, 220, 226, 0.92)';
  ctx.lineWidth = 3.0;
  for (const y of [16, 48, 80, 112]) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(size, y);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  return tex;
}

function createSlickRubberTextures(stripeHex) {
  const w = 256;
  const h = 256;
  const col = makeCanvas(w, h);
  const cctx = col.getContext('2d');
  const rough = makeCanvas(w, h);
  const rctx = rough.getContext('2d');

  // V coordinate runs across tire profile: 0..0.28 inner sidewall, 0.28..0.72 tread-less slick crown, 0.72..1.0 outer sidewall
  cctx.fillStyle = '#1b1c1f';
  cctx.fillRect(0, 0, w, h);

  // Subtle scrubbed contact patch grain (tread-less racing slick)
  for (let y = 0; y < h; y++) {
    const v = y / h;
    const isCrown = v > 0.27 && v < 0.73;
    const scrub = isCrown ? 0.85 : 0.4;
    for (let x = 0; x < w; x += 2) {
      const n = hash2D(x, y);
      const val = Math.round(22 + n * 16 * scrub);
      cctx.fillStyle = `rgb(${val},${val},${val + 1})`;
      cctx.fillRect(x, y, 2, 1);
    }
  }

  // Clean geometric colored compound sidewall ring (no text/logos)
  cctx.fillStyle = stripeHex;
  cctx.fillRect(0, Math.round(h * 0.81), w, Math.round(h * 0.042));
  cctx.fillRect(0, Math.round(h * 0.148), w, Math.round(h * 0.042));

  // Roughness: sidewall slightly satin, scrubbed crown slightly smoother glossy rubber
  const rgrad = rctx.createLinearGradient(0, 0, 0, h);
  rgrad.addColorStop(0.0, '#c8c8c8');
  rgrad.addColorStop(0.26, '#b8b8b8');
  rgrad.addColorStop(0.36, '#7a7a7a');
  rgrad.addColorStop(0.64, '#7a7a7a');
  rgrad.addColorStop(0.74, '#b8b8b8');
  rgrad.addColorStop(1.0, '#c8c8c8');
  rctx.fillStyle = rgrad;
  rctx.fillRect(0, 0, w, h);

  const map = new THREE.CanvasTexture(col);
  map.colorSpace = THREE.SRGBColorSpace;
  map.wrapS = THREE.RepeatWrapping;
  map.wrapT = THREE.ClampToEdgeWrapping;
  map.anisotropy = 8;

  const roughnessMap = new THREE.CanvasTexture(rough);
  roughnessMap.wrapS = THREE.RepeatWrapping;
  roughnessMap.wrapT = THREE.ClampToEdgeWrapping;
  return { map, roughnessMap };
}

function createMotionBlurWheelTexture(rimTint) {
  const size = 256;
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');
  const cx = size / 2;
  const cy = size / 2;

  ctx.clearRect(0, 0, size, size);
  // Radial spinning spoke blur rings
  const grad = ctx.createRadialGradient(cx, cy, size * 0.08, cx, cy, size * 0.48);
  grad.addColorStop(0.0, 'rgba(30,34,42,0.92)');
  grad.addColorStop(0.18, 'rgba(200,210,225,0.65)');
  grad.addColorStop(0.55, 'rgba(130,140,155,0.42)');
  grad.addColorStop(0.84, rimTint);
  grad.addColorStop(0.95, 'rgba(220,228,240,0.85)');
  grad.addColorStop(1.0, 'rgba(0,0,0,0.0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.48, 0, Math.PI * 2);
  ctx.fill();

  // Subtle concentric streaks simulating rapid spoke rotation
  for (let r = 24; r < 118; r += 5) {
    ctx.strokeStyle = `rgba(235, 240, 250, ${0.06 + (r % 10 === 0 ? 0.14 : 0.04)})`;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createTerrainGrassTextures() {
  const size = 512;
  const colCanvas = makeCanvas(size, size);
  const cctx = colCanvas.getContext('2d');
  const normCanvas = makeCanvas(size, size);
  const nctx = normCanvas.getContext('2d');
  const colImg = cctx.createImageData(size, size);
  const normImg = nctx.createImageData(size, size);
  const hf = new Float32Array(size * size);

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const nFine = hash2D(x, y);
      const nBlade = valueNoise2D(x * 0.28, y * 0.14);
      const nClump = valueNoise2D(x * 0.045, y * 0.045);
      const nPatch = valueNoise2D(x * 0.018 + 7.1, y * 0.018 - 3.4);
      const h = nFine * 0.35 + nBlade * 0.40 + nClump * 0.25;
      hf[y * size + x] = h;

      const idx = (y * size + x) * 4;
      // Rich sunlit grass + dry meadow straw + dark soil micro-variation (neutral-bright to multiply vertexColors)
      const dry = smoothstep(0.45, 0.78, nPatch);
      const r = clamp(150 + dry * 48 + (nBlade - 0.5) * 42 + (nFine - 0.5) * 28, 95, 240);
      const g = clamp(172 + (1 - dry) * 32 + (nBlade - 0.5) * 46 + (nFine - 0.5) * 26, 110, 245);
      const b = clamp(118 + dry * 12 + (nClump - 0.5) * 28 + (nFine - 0.5) * 22, 75, 195);
      colImg.data[idx] = r;
      colImg.data[idx + 1] = g;
      colImg.data[idx + 2] = b;
      colImg.data[idx + 3] = 255;
    }
  }
  for (let y = 0; y < size; y++) {
    const ym = (y - 1 + size) % size;
    const yp = (y + 1) % size;
    for (let x = 0; x < size; x++) {
      const xm = (x - 1 + size) % size;
      const xp = (x + 1) % size;
      const dx = (hf[y * size + xp] - hf[y * size + xm]) * 2.6;
      const dy = (hf[yp * size + x] - hf[ym * size + x]) * 2.6;
      const idx = (y * size + x) * 4;
      normImg.data[idx] = clamp(Math.round((-dx * 0.5 + 0.5) * 255), 0, 255);
      normImg.data[idx + 1] = clamp(Math.round((-dy * 0.5 + 0.5) * 255), 0, 255);
      normImg.data[idx + 2] = 228;
      normImg.data[idx + 3] = 255;
    }
  }
  cctx.putImageData(colImg, 0, 0);
  nctx.putImageData(normImg, 0, 0);

  const map = new THREE.CanvasTexture(colCanvas);
  const normalMap = new THREE.CanvasTexture(normCanvas);
  for (const t of [map, normalMap]) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(76, 76);
    t.anisotropy = 8;
  }
  map.colorSpace = THREE.SRGBColorSpace;
  return { map, normalMap };
}

// High-Resolution Side-by-Side Trackside Motorsport Graphic Boards (pure geometric, zero text/logos)
function createBarrierGraphicAtlas() {
  const w = 2048;
  const h = 256;
  const col = makeCanvas(w, h);
  const ctx = col.getContext('2d');
  const norm = makeCanvas(w, h);
  const nctx = norm.getContext('2d');

  // Neutral normal base
  nctx.fillStyle = 'rgb(128,128,255)';
  nctx.fillRect(0, 0, w, h);

  const panels = [
    { bgA: '#0d1526', bgB: '#162542', acc1: '#e01b24', acc2: '#f4f7fb', style: 'chevrons' },
    { bgA: '#f0f3f8', bgB: '#dde3ee', acc1: '#0c56f0', acc2: '#14d8ff', style: 'slashes' },
    { bgA: '#0a2926', bgB: '#11443e', acc1: '#eab338', acc2: '#22e0b0', style: 'rings' },
    { bgA: '#15171d', bgB: '#222630', acc1: '#ff6a08', acc2: '#f5f7fa', style: 'velocity' },
    { bgA: '#b8101c', bgB: '#850812', acc1: '#f4f6fa', acc2: '#171920', style: 'checkerWave' },
    { bgA: '#cad2dc', bgB: '#9aa4b2', acc1: '#0d4be0', acc2: '#181c24', style: 'prism' },
    { bgA: '#191b22', bgB: '#292420', acc1: '#f59c24', acc2: '#ffdf88', style: 'pulse' },
    { bgA: '#1c2432', bgB: '#0f141e', acc1: '#18e0b2', acc2: '#eef4fa', style: 'splitDiag' }
  ];

  const pw = w / panels.length; // 256 px per graphic board side-by-side
  for (let i = 0; i < panels.length; i++) {
    const p = panels[i];
    const x0 = i * pw;

    ctx.save();
    ctx.beginPath();
    ctx.rect(x0, 0, pw, h);
    ctx.clip();

    // Gradient graphic base
    const grad = ctx.createLinearGradient(x0, 0, x0 + pw, h);
    grad.addColorStop(0, p.bgA);
    grad.addColorStop(1, p.bgB);
    ctx.fillStyle = grad;
    ctx.fillRect(x0, 0, pw, h);

    // Subtle micro-carbon diagonal grid overlay on every board
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 2;
    for (let d = -h; d < pw + h; d += 18) {
      ctx.beginPath();
      ctx.moveTo(x0 + d, 0);
      ctx.lineTo(x0 + d + h * 0.65, h);
      ctx.stroke();
    }

    // Distinct authentic motorsport graphic motif per panel (purely geometric, zero text!)
    if (p.style === 'chevrons') {
      for (let k = 0; k < 4; k++) {
        const cx = x0 + 38 + k * 54;
        ctx.fillStyle = k % 2 === 0 ? p.acc1 : p.acc2;
        ctx.beginPath();
        ctx.moveTo(cx, 38);
        ctx.lineTo(cx + 34, 38);
        ctx.lineTo(cx + 68, h * 0.5);
        ctx.lineTo(cx + 34, h - 38);
        ctx.lineTo(cx, h - 38);
        ctx.lineTo(cx + 34, h * 0.5);
        ctx.closePath();
        ctx.fill();
      }
    } else if (p.style === 'slashes') {
      ctx.fillStyle = p.acc1;
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.moveTo(x0 + 28 + k * 66, h);
        ctx.lineTo(x0 + 72 + k * 66, 0);
        ctx.lineTo(x0 + 106 + k * 66, 0);
        ctx.lineTo(x0 + 62 + k * 66, h);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = p.acc2;
      ctx.fillRect(x0, h * 0.72, pw, 16);
    } else if (p.style === 'rings') {
      ctx.strokeStyle = p.acc1;
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.arc(x0 + pw * 0.36, h * 0.5, 62, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = p.acc2;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(x0 + pw * 0.36, h * 0.5, 36, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = p.acc1;
      ctx.fillRect(x0 + pw * 0.62, h * 0.34, 72, 16);
      ctx.fillStyle = p.acc2;
      ctx.fillRect(x0 + pw * 0.62, h * 0.54, 54, 14);
    } else if (p.style === 'velocity') {
      ctx.fillStyle = p.acc1;
      ctx.beginPath();
      ctx.moveTo(x0, h * 0.24);
      ctx.lineTo(x0 + pw * 0.78, h * 0.24);
      ctx.lineTo(x0 + pw * 0.62, h * 0.62);
      ctx.lineTo(x0, h * 0.62);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = p.acc2;
      ctx.beginPath();
      ctx.moveTo(x0 + pw * 0.26, h * 0.68);
      ctx.lineTo(x0 + pw, h * 0.68);
      ctx.lineTo(x0 + pw, h * 0.82);
      ctx.lineTo(x0 + pw * 0.18, h * 0.82);
      ctx.closePath();
      ctx.fill();
    } else if (p.style === 'checkerWave') {
      const sq = 24;
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 4; c++) {
          ctx.fillStyle = (r + c) % 2 === 0 ? p.acc1 : p.acc2;
          ctx.fillRect(x0 + 18 + c * sq + r * 6, 48 + r * sq, sq, sq);
        }
      }
      ctx.fillStyle = p.acc1;
      ctx.fillRect(x0 + 148, 76, 86, 20);
      ctx.fillRect(x0 + 148, 114, 62, 16);
      ctx.fillRect(x0 + 148, 148, 86, 12);
    } else if (p.style === 'prism') {
      ctx.fillStyle = p.acc2;
      ctx.beginPath();
      ctx.moveTo(x0 + 24, h);
      ctx.lineTo(x0 + 108, 22);
      ctx.lineTo(x0 + 232, 22);
      ctx.lineTo(x0 + 148, h);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = p.acc1;
      ctx.beginPath();
      ctx.moveTo(x0 + 56, h);
      ctx.lineTo(x0 + 124, 52);
      ctx.lineTo(x0 + 188, 52);
      ctx.lineTo(x0 + 120, h);
      ctx.closePath();
      ctx.fill();
    } else if (p.style === 'pulse') {
      for (let b = 0; b < 9; b++) {
        const bh = 38 + Math.round(Math.sin(b * 0.85 + 0.5) * 58 + 52);
        ctx.fillStyle = b % 3 === 0 ? p.acc2 : p.acc1;
        ctx.fillRect(x0 + 22 + b * 24, h - 38 - bh, 14, bh);
      }
    } else {
      ctx.fillStyle = p.acc1;
      ctx.beginPath();
      ctx.moveTo(x0, 0);
      ctx.lineTo(x0 + pw * 0.58, 0);
      ctx.lineTo(x0 + pw * 0.34, h);
      ctx.lineTo(x0, h);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = p.acc2;
      ctx.fillRect(x0 + pw * 0.52, h * 0.38, pw * 0.38, 18);
      ctx.fillRect(x0 + pw * 0.46, h * 0.56, pw * 0.32, 12);
    }

    // Glossy top & bottom aluminum barrier trim rails + subtle concrete kicker at base
    ctx.fillStyle = '#d4d9e2';
    ctx.fillRect(x0, 0, pw, 14);
    ctx.fillStyle = '#252932';
    ctx.fillRect(x0, 14, pw, 5);
    ctx.fillStyle = '#7e828a';
    ctx.fillRect(x0, h - 28, pw, 28);
    ctx.fillStyle = 'rgba(0,0,0,0.42)';
    ctx.fillRect(x0, h - 32, pw, 5);

    // Side-by-side panel vertical anodized frame seam
    ctx.fillStyle = '#12151c';
    ctx.fillRect(x0, 0, 5, h);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(x0 + 5, 0, 2, h);

    // Matching normal bevel along panel seams & top/bottom frame rails
    nctx.fillStyle = 'rgb(70,128,235)';
    nctx.fillRect(x0, 0, 4, h);
    nctx.fillStyle = 'rgb(186,128,235)';
    nctx.fillRect(x0 + 4, 0, 4, h);
    nctx.fillStyle = 'rgb(128,185,235)';
    nctx.fillRect(x0, 12, pw, 5);
    nctx.fillStyle = 'rgb(128,72,235)';
    nctx.fillRect(x0, h - 32, pw, 5);

    ctx.restore();
  }

  const map = new THREE.CanvasTexture(col);
  map.colorSpace = THREE.SRGBColorSpace;
  map.wrapS = THREE.RepeatWrapping;
  map.wrapT = THREE.ClampToEdgeWrapping;
  map.anisotropy = 12;

  const normalMap = new THREE.CanvasTexture(norm);
  normalMap.wrapS = THREE.RepeatWrapping;
  normalMap.wrapT = THREE.ClampToEdgeWrapping;
  normalMap.anisotropy = 8;
  return { map, normalMap };
}

// Botanical alpha-tested sunlit grass tuft & meadow plant sprite
function createGrassTuftTexture() {
  const size = 128;
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, size, size);

  const blades = 15;
  for (let i = 0; i < blades; i++) {
    const t = i / (blades - 1);
    const bx = 18 + t * 92 + (hash2D(i, 3) - 0.5) * 10;
    const h = 58 + hash2D(i, 7) * 58;
    const bend = (t - 0.5) * 44 + (hash2D(i, 11) - 0.5) * 22;
    const wBase = 5.5 + hash2D(i, 17) * 4.5;

    const grad = ctx.createLinearGradient(bx, size, bx + bend, size - h);
    grad.addColorStop(0.0, '#273818');
    grad.addColorStop(0.55, '#4c6928');
    grad.addColorStop(1.0, '#96a846');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(bx - wBase * 0.5, size);
    ctx.quadraticCurveTo(bx + bend * 0.35 - wBase * 0.3, size - h * 0.55, bx + bend, size - h);
    ctx.quadraticCurveTo(bx + bend * 0.35 + wBase * 0.3, size - h * 0.55, bx + wBase * 0.5, size);
    ctx.closePath();
    ctx.fill();

    // Occasional tiny sunlit wildflower seedhead tip
    if (i % 5 === 2) {
      ctx.fillStyle = i % 10 === 2 ? '#f0d878' : '#f4eee0';
      ctx.beginPath();
      ctx.arc(bx + bend, size - h + 3, 3.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Procedural Multi-Color Geometric Car Livery Graphics (zero text/logos)
function createCarLiveryTexture(livery) {
  const w = 512;
  const h = 512;
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');

  const pCol = '#' + livery.primary.toString(16).padStart(6, '0');
  const sCol = '#' + livery.secondary.toString(16).padStart(6, '0');
  const aCol = '#' + livery.accent.toString(16).padStart(6, '0');

  // Primary paint base
  ctx.fillStyle = pCol;
  ctx.fillRect(0, 0, w, h);

  // Rear coke-bottle carbon-contrast sweep (u > 0.62 -> right side of texture)
  ctx.fillStyle = sCol;
  ctx.beginPath();
  ctx.moveTo(w * 0.60, 0);
  ctx.lineTo(w, 0);
  ctx.lineTo(w, h);
  ctx.lineTo(w * 0.74, h);
  ctx.closePath();
  ctx.fill();

  // Lower undercut dark carbon belt running along sides
  ctx.fillStyle = sCol;
  ctx.fillRect(0, h * 0.36, w, h * 0.28);

  // Crisp sweeping aerodynamic accent graphics along nose, sidepods & engine cover
  ctx.strokeStyle = aCol;
  ctx.lineWidth = 11;
  ctx.beginPath();
  ctx.moveTo(w * 0.06, h * 0.35);
  ctx.bezierCurveTo(w * 0.32, h * 0.32, w * 0.52, h * 0.14, w * 0.88, h * 0.10);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(w * 0.06, h * 0.65);
  ctx.bezierCurveTo(w * 0.32, h * 0.68, w * 0.52, h * 0.86, w * 0.88, h * 0.90);
  ctx.stroke();

  // Sharp parallel pinstripe accents
  ctx.strokeStyle = '#f2f5fa';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(w * 0.14, h * 0.32);
  ctx.bezierCurveTo(w * 0.38, h * 0.28, w * 0.56, h * 0.10, w * 0.92, h * 0.06);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(w * 0.14, h * 0.68);
  ctx.bezierCurveTo(w * 0.38, h * 0.72, w * 0.56, h * 0.90, w * 0.92, h * 0.94);
  ctx.stroke();

  // Geometric forward speed chevrons on nose & engine cover flanks
  ctx.fillStyle = aCol;
  for (let k = 0; k < 3; k++) {
    const cx = w * (0.18 + k * 0.055);
    ctx.beginPath();
    ctx.moveTo(cx, h * 0.22);
    ctx.lineTo(cx + 16, h * 0.22);
    ctx.lineTo(cx + 6, h * 0.30);
    ctx.lineTo(cx - 10, h * 0.30);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx, h * 0.78);
    ctx.lineTo(cx + 16, h * 0.78);
    ctx.lineTo(cx + 6, h * 0.70);
    ctx.lineTo(cx - 10, h * 0.70);
    ctx.closePath();
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

// ============================================================================
// 5. GRAND PRIX CIRCUIT SPLINE, BANKING & PHYSICS LOOKUP TABLE
// ============================================================================
const TRACK_WIDTH = 14.5;
const TRACK_HALF_W = TRACK_WIDTH * 0.5;
const TRACK_SAMPLES = 1200;

// Closed flowing FIA Grade 1 circuit (clockwise from above, zero self-intersections)
// Straight along +Z at x = 0 from z = -155 to z = +200 (~355 m!)
const rawControlPoints = [
  new THREE.Vector3(   0,  0.0, -155), // Main straight start
  new THREE.Vector3(   0,  0.0,  -40), // Grid zone
  new THREE.Vector3(   0,  0.0,   80), // Start/Finish Gantry at z=45
  new THREE.Vector3(   0,  0.4,  200), // Heavy braking into Turn 1
  new THREE.Vector3( -38,  2.6,  270), // Turn 1 fast right apex
  new THREE.Vector3(-120,  6.8,  286), // Climbing out of T1
  new THREE.Vector3(-206, 11.4,  242), // Turn 2 banked high-speed right
  new THREE.Vector3(-250, 13.0,  154), // Sweeping crest
  new THREE.Vector3(-212,  9.8,   68), // Turn 3 fast left sweeper
  new THREE.Vector3(-256,  6.5,  -18), // Turn 4 flowing right kink
  new THREE.Vector3(-322,  3.4, -108), // Back straight acceleration
  new THREE.Vector3(-312,  1.8, -214), // Back straight braking zone
  new THREE.Vector3(-244,  2.4, -284), // Turn 5 wide banked Parabolica entry
  new THREE.Vector3(-164,  3.4, -296), // Turn 6 banked carousel apex
  new THREE.Vector3(-108,  2.6, -226), // Technical S-chicane left
  new THREE.Vector3( -60,  1.0, -258), // Final banked corner apex
  new THREE.Vector3(  -4,  0.1, -208)  // Exit onto main straight
];

const trackSpline = new THREE.CatmullRomCurve3(rawControlPoints, true, 'centripetal', 0.45);
const TRACK_LENGTH = trackSpline.getLength();

// Build dense arc-length-parameterized circuit table
const trackTable = [];
const worldUp = new THREE.Vector3(0, 1, 0);

{
  const pts = trackSpline.getSpacedPoints(TRACK_SAMPLES);
  const tangents = [];
  const rawCurvature = new Float32Array(TRACK_SAMPLES);

  for (let i = 0; i < TRACK_SAMPLES; i++) {
    const prev = pts[(i - 1 + TRACK_SAMPLES) % TRACK_SAMPLES];
    const next = pts[(i + 1) % TRACK_SAMPLES];
    const t = new THREE.Vector3().subVectors(next, prev).normalize();
    tangents.push(t);
  }

  const ds = TRACK_LENGTH / TRACK_SAMPLES;
  for (let i = 0; i < TRACK_SAMPLES; i++) {
    const tPrev = tangents[(i - 2 + TRACK_SAMPLES) % TRACK_SAMPLES];
    const tNext = tangents[(i + 2) % TRACK_SAMPLES];
    const dT = new THREE.Vector3().subVectors(tNext, tPrev).divideScalar(4 * ds);
    const flatRight = new THREE.Vector3().crossVectors(tangents[i], worldUp).normalize();
    // Positive curvature => turning RIGHT (toward flatRight)
    rawCurvature[i] = dT.dot(flatRight);
  }

  // Smooth curvature for silky C2 banking and ideal racing line
  const smoothCurv = new Float32Array(TRACK_SAMPLES);
  const wideCurv = new Float32Array(TRACK_SAMPLES);
  const kernelA = 14;
  const kernelB = 28;
  for (let i = 0; i < TRACK_SAMPLES; i++) {
    let sA = 0, wA = 0;
    for (let k = -kernelA; k <= kernelA; k++) {
      const w = Math.exp(-0.5 * (k / (kernelA * 0.45)) ** 2);
      sA += rawCurvature[(i + k + TRACK_SAMPLES) % TRACK_SAMPLES] * w;
      wA += w;
    }
    smoothCurv[i] = sA / wA;

    let sB = 0, wB = 0;
    for (let k = -kernelB; k <= kernelB; k++) {
      const w = Math.exp(-0.5 * (k / (kernelB * 0.45)) ** 2);
      sB += rawCurvature[(i + k + TRACK_SAMPLES) % TRACK_SAMPLES] * w;
      wB += w;
    }
    wideCurv[i] = sB / wB;
  }

  // Compute physical speed profile around circuit (forward & backward braking pass)
  const MAX_SPEED = 91.0; // ~328 km/h
  const MAX_LAT_G = 42.0; // High downforce F1 cornering grip (~4.3 G!)
  const MAX_BRAKE_DECEL = 44.0; // Carbon-ceramic braking (~4.5 G!)
  const MAX_ACCEL = 18.5;

  const targetSpeed = new Float32Array(TRACK_SAMPLES);
  for (let i = 0; i < TRACK_SAMPLES; i++) {
    const kAbs = Math.max(Math.abs(smoothCurv[i]), 0.0004);
    const vCorner = Math.sqrt(MAX_LAT_G / kAbs);
    targetSpeed[i] = Math.min(MAX_SPEED, Math.max(29.0, vCorner));
  }

  // Two backward passes for realistic braking zones into corners
  for (let pass = 0; pass < 2; pass++) {
    for (let i = TRACK_SAMPLES - 1; i >= 0; i--) {
      const next = (i + 1) % TRACK_SAMPLES;
      const vNext = targetSpeed[next];
      const vMaxEntry = Math.sqrt(vNext * vNext + 2 * MAX_BRAKE_DECEL * ds);
      if (targetSpeed[i] > vMaxEntry) targetSpeed[i] = vMaxEntry;
    }
  }
  // Two forward passes for realistic corner-exit acceleration
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < TRACK_SAMPLES; i++) {
      const prev = (i - 1 + TRACK_SAMPLES) % TRACK_SAMPLES;
      const vPrev = targetSpeed[prev];
      const vMaxExit = Math.sqrt(vPrev * vPrev + 2 * MAX_ACCEL * ds);
      if (targetSpeed[i] > vMaxExit) targetSpeed[i] = vMaxExit;
    }
  }

  // Compute ideal racing line offset (outside -> inside apex -> outside)
  const idealLine = new Float32Array(TRACK_SAMPLES);
  for (let i = 0; i < TRACK_SAMPLES; i++) {
    const kNow = smoothCurv[i];
    const kAhead = smoothCurv[(i + 24) % TRACK_SAMPLES];
    const kBehind = smoothCurv[(i - 24 + TRACK_SAMPLES) % TRACK_SAMPLES];
    // Push toward inside (+sign of kNow) at apex, swing wide opposite before/after
    let offset = clamp(kNow * 320, -4.6, 4.6) - clamp((kAhead + kBehind - 2 * kNow) * 140, -2.2, 2.2);
    idealLine[i] = clamp(offset, -4.7, 4.7);
  }
  // Smooth ideal line
  const smoothLine = new Float32Array(TRACK_SAMPLES);
  for (let i = 0; i < TRACK_SAMPLES; i++) {
    let acc = 0;
    for (let k = -10; k <= 10; k++) {
      acc += idealLine[(i + k + TRACK_SAMPLES) % TRACK_SAMPLES];
    }
    smoothLine[i] = acc / 21;
  }

  for (let i = 0; i < TRACK_SAMPLES; i++) {
    const pos = pts[i].clone();
    const tangent = tangents[i].clone();
    const flatRight = new THREE.Vector3().crossVectors(tangent, worldUp).normalize();
    const flatUp = new THREE.Vector3().crossVectors(flatRight, tangent).normalize();

    // Bank inward on corners (keep main straight strictly flat!)
    const isMainStraight = Math.abs(pos.x) < 12 && pos.z > -165 && pos.z < 190;
    const bankAngle = isMainStraight ? 0 : clamp(wideCurv[i] * 8.2, -0.17, 0.21);

    const cosB = Math.cos(bankAngle);
    const sinB = Math.sin(bankAngle);
    const right = flatRight.clone().multiplyScalar(cosB).addScaledVector(flatUp, -sinB).normalize();
    const up = flatUp.clone().multiplyScalar(cosB).addScaledVector(flatRight, sinB).normalize();

    // Determine curb flags (inside apex & outside exit of corners)
    const k = smoothCurv[i];
    const kPrev = smoothCurv[(i - 20 + TRACK_SAMPLES) % TRACK_SAMPLES];
    const curbRight = !isMainStraight && (k > 0.0072 || kPrev < -0.0082);
    const curbLeft = !isMainStraight && (k < -0.0072 || kPrev > 0.0082);
    const isStraight = Math.abs(wideCurv[i]) < 0.0032;

    trackTable.push({
      s: i * ds,
      pos,
      tangent,
      right,
      up,
      bank: bankAngle,
      curvature: k,
      targetSpeed: targetSpeed[i],
      idealLine: smoothLine[i],
      curbRight,
      curbLeft,
      isStraight,
      isMainStraight
    });
  }
}

const _tmpV1 = new THREE.Vector3();
const _tmpV2 = new THREE.Vector3();

function sampleTrack(s, out = {}) {
  const sWrap = wrapMod(s, TRACK_LENGTH);
  const f = (sWrap / TRACK_LENGTH) * TRACK_SAMPLES;
  const i0 = Math.floor(f) % TRACK_SAMPLES;
  const i1 = (i0 + 1) % TRACK_SAMPLES;
  const t = f - Math.floor(f);
  const a = trackTable[i0];
  const b = trackTable[i1];

  out.pos = (out.pos || new THREE.Vector3()).lerpVectors(a.pos, b.pos, t);
  out.tangent = (out.tangent || new THREE.Vector3()).lerpVectors(a.tangent, b.tangent, t).normalize();
  out.right = (out.right || new THREE.Vector3()).lerpVectors(a.right, b.right, t).normalize();
  out.up = (out.up || new THREE.Vector3()).lerpVectors(a.up, b.up, t).normalize();
  out.bank = lerp(a.bank, b.bank, t);
  out.curvature = lerp(a.curvature, b.curvature, t);
  out.targetSpeed = lerp(a.targetSpeed, b.targetSpeed, t);
  out.idealLine = lerp(a.idealLine, b.idealLine, t);
  out.curbRight = a.curbRight || b.curbRight;
  out.curbLeft = a.curbLeft || b.curbLeft;
  out.isStraight = a.isStraight && b.isStraight;
  out.isMainStraight = a.isMainStraight && b.isMainStraight;
  return out;
}

// Find arc-length 's' of the Start/Finish line near (0, 0, 42)
let START_FINISH_S = 195;
{
  let bestD = Infinity;
  for (let i = 0; i < TRACK_SAMPLES; i++) {
    const p = trackTable[i].pos;
    if (Math.abs(p.x) < 10) {
      const d = Math.abs(p.z - 42);
      if (d < bestD) {
        bestD = d;
        START_FINISH_S = trackTable[i].s;
      }
    }
  }
}

// Helper for terrain heightfield matching track corridor smoothly
function nearestTrackInfo(x, z) {
  let minD2 = Infinity;
  let bestIdx = 0;
  // Coarse stride 4, then refine locally
  for (let i = 0; i < TRACK_SAMPLES; i += 4) {
    const p = trackTable[i].pos;
    const dx = x - p.x;
    const dz = z - p.z;
    const d2 = dx * dx + dz * dz;
    if (d2 < minD2) {
      minD2 = d2;
      bestIdx = i;
    }
  }
  for (let k = -4; k <= 4; k++) {
    const idx = (bestIdx + k + TRACK_SAMPLES) % TRACK_SAMPLES;
    const p = trackTable[idx].pos;
    const dx = x - p.x;
    const dz = z - p.z;
    const d2 = dx * dx + dz * dz;
    if (d2 < minD2) {
      minD2 = d2;
      bestIdx = idx;
    }
  }
  const sample = trackTable[bestIdx];
  const relX = x - sample.pos.x;
  const relZ = z - sample.pos.z;
  const lat = relX * sample.right.x + relZ * sample.right.z;
  const trackY = sample.pos.y + lat * sample.right.y;
  return { dist: Math.sqrt(minD2), lat, trackY, sample, idx: bestIdx };
}

// 6.1 Sculpted Rolling Golden-Hour Terrain (carved cleanly to match track)
function buildTerrain() {
  const size = 1480;
  const segs = 190;
  const geo = new THREE.PlaneGeometry(size, size, segs, segs);
  geo.rotateX(-Math.PI / 2);
  // Center terrain around circuit centroid (-155, -10)
  const cx = -155;
  const cz = -10;
  geo.translate(cx, 0, cz);

  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const grassA = new THREE.Color(0x46522e);
  const grassB = new THREE.Color(0x6e5f38);
  const rockCol = new THREE.Color(0x5b5245);
  const vergeCol = new THREE.Color(0x4f5a33);
  const tmpC = new THREE.Color();

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const info = nearestTrackInfo(x, z);

    // Pit-lane flat apron zone (x in [-48, +26], z in [-165, 195])
    const inPitPlateau = x > -58 && x < 42 && z > -175 && z < 205;
    const pitBlend = inPitPlateau
      ? smoothstep(58, 36, Math.abs(x + 8)) * smoothstep(205, 175, Math.abs(z - 15))
      : 0;

    // Natural rolling surrounding hills rising toward outer horizon
    const radialDist = Math.hypot(x - cx, z - cz);
    const hillMask = smoothstep(210, 580, radialDist);
    const n1 = fbm2D(x * 0.0042 + 12.3, z * 0.0042 - 7.1, 4);
    const n2 = fbm2D(x * 0.015 - 3.4, z * 0.015 + 9.2, 3);
    const naturalY = -1.2 + (n1 - 0.36) * 28 + (n2 - 0.5) * 6 + hillMask * (34 + n1 * 72);

    // Keep terrain strictly below track surface inside corridor (zero z-fighting!)
    const trackFloorY = info.trackY - 0.28;
    const corridorBlend = smoothstep(22, 58, info.dist);
    let y = lerp(trackFloorY, naturalY, corridorBlend);
    if (pitBlend > 0) {
      y = lerp(y, -0.22, pitBlend * 0.92);
    }
    // Never poke above track anywhere close to asphalt
    if (info.dist < 18.0) {
      y = Math.min(y, info.trackY - 0.24);
    }
    pos.setY(i, y);

    // Subtle sunlit Mediterranean meadow/dry-hill vertex shading
    const patch = fbm2D(x * 0.012, z * 0.012, 3);
    tmpC.lerpColors(grassA, grassB, smoothstep(0.28, 0.72, patch));
    tmpC.lerp(rockCol, smoothstep(22, 62, y) * 0.65);
    tmpC.lerp(vergeCol, (1 - corridorBlend) * 0.55);
    colors[i * 3] = tmpC.r;
    colors[i * 3 + 1] = tmpC.g;
    colors[i * 3 + 2] = tmpC.b;
  }

  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    map: terrainGrassTex.map,
    normalMap: terrainGrassTex.normalMap,
    normalScale: new THREE.Vector2(0.95, 0.95),
    vertexColors: true,
    roughness: 0.92,
    metalness: 0.0
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  trackGroup.add(mesh);
}
buildTerrain();

// 6.2 Main Asphalt Track Ribbon with PBR Tire-Rubber Racing Line & Edge Markings
function buildTrackSurface() {
  const segsU = TRACK_SAMPLES;
  const segsV = 14;
  const verts = [];
  const normals = [];
  const uvs = [];
  const colors = [];
  const indices = [];

  // Slightly wider asphalt runoff verges beyond painted white boundary lines
  const VERGE_W = 1.65;
  const totalHalfW = TRACK_HALF_W + VERGE_W;
  const asphaltBase = new THREE.Color(0x888b92);
  const rubberDark = new THREE.Color(0x3a3c42);
  const edgePaint = new THREE.Color(0xe6e8ec);
  const vergeDark = new THREE.Color(0x6b6f75);
  const tmpC = new THREE.Color();

  for (let i = 0; i <= segsU; i++) {
    const sample = trackTable[i % segsU];
    const uCoord = (i / segsU) * (TRACK_LENGTH / 7.5);

    for (let j = 0; j <= segsV; j++) {
      const f = j / segsV; // 0..1 across width
      const lat = lerp(-totalHalfW, totalHalfW, f);
      // Tiny drainage crown (+0.035m center)
      const crown = (1 - (lat / totalHalfW) ** 2) * 0.035;
      const p = sample.pos.clone()
        .addScaledVector(sample.right, lat)
        .addScaledVector(sample.up, crown);

      verts.push(p.x, p.y, p.z);
      normals.push(sample.up.x, sample.up.y, sample.up.z);
      uvs.push(f * 2.4, uCoord);

      // Compute realistic rubbered-in racing line & crisp painted white track boundary lines
      const dToLine = Math.abs(lat - sample.idealLine);
      const rubberStrength = Math.exp(-0.5 * (dToLine / 1.45) ** 2) * 0.85
        + Math.exp(-0.5 * (Math.abs(lat - sample.idealLine * 0.65) / 2.9) ** 2) * 0.25;

      // Extra braking-zone rubber marks before corners
      const brakeZone = clamp((trackTable[(i - 4 + segsU) % segsU].targetSpeed - sample.targetSpeed) * 0.35, 0, 1);

      tmpC.copy(asphaltBase);
      tmpC.lerp(rubberDark, clamp(rubberStrength * 0.72 + brakeZone * 0.28, 0, 0.88));

      // Verge darkening outside white lines
      const absLat = Math.abs(lat);
      if (absLat > TRACK_HALF_W + 0.15) {
        tmpC.lerp(vergeDark, 0.45);
      }

      // Crisp painted white track edge boundary lines (at +-TRACK_HALF_W)
      const lineDist = Math.abs(absLat - (TRACK_HALF_W - 0.15));
      if (lineDist < 0.22) {
        tmpC.lerp(edgePaint, smoothstep(0.22, 0.04, lineDist) * 0.92);
      }

      colors.push(tmpC.r, tmpC.g, tmpC.b);
    }
  }

  const row = segsV + 1;
  for (let i = 0; i < segsU; i++) {
    for (let j = 0; j < segsV; j++) {
      const a = i * row + j;
      const b = (i + 1) * row + j;
      const c = (i + 1) * row + j + 1;
      const d = i * row + j + 1;
      // Right x Tangent = +Up (counter-clockwise when viewed from above!)
      indices.push(a, d, b, b, d, c);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);

  const mat = new THREE.MeshStandardMaterial({
    map: asphaltTex.map,
    normalMap: asphaltTex.normalMap,
    normalScale: new THREE.Vector2(0.85, 0.85),
    roughnessMap: asphaltTex.roughnessMap,
    roughness: 0.84,
    metalness: 0.04,
    vertexColors: true
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  trackGroup.add(mesh);
}
buildTrackSurface();

// 6.3 Painted Start/Finish Checkered Line, Starting Grid Boxes & Pit Lane Apron
function buildTrackMarkingsAndPitLane() {
  // Checkered start-finish strip (pure geometric pattern, no text)
  const checkCanvas = makeCanvas(256, 64);
  const ctx = checkCanvas.getContext('2d');
  const sq = 16;
  for (let y = 0; y < 64; y += sq) {
    for (let x = 0; x < 256; x += sq) {
      ctx.fillStyle = ((x / sq + y / sq) % 2 === 0) ? '#eceff4' : '#181a1f';
      ctx.fillRect(x, y, sq, sq);
    }
  }
  const checkTex = new THREE.CanvasTexture(checkCanvas);
  checkTex.colorSpace = THREE.SRGBColorSpace;
  checkTex.anisotropy = 8;

  const sf = sampleTrack(START_FINISH_S);
  const checkGeo = new THREE.PlaneGeometry(TRACK_WIDTH - 0.5, 2.2);
  checkGeo.rotateX(-Math.PI / 2);
  const checkMat = new THREE.MeshStandardMaterial({
    map: checkTex,
    roughness: 0.72,
    polygonOffset: true,
    polygonOffsetFactor: -2,
    polygonOffsetUnits: -2
  });
  const checkMesh = new THREE.Mesh(checkGeo, checkMat);
  checkMesh.position.copy(sf.pos).addScaledVector(sf.up, 0.055);
  checkMesh.receiveShadow = true;
  trackGroup.add(checkMesh);

  // Starting Grid Boxes (8 staggered white racing grid brackets behind start line)
  const paintMat = new THREE.MeshStandardMaterial({
    color: 0xe8ebf0,
    roughness: 0.65,
    polygonOffset: true,
    polygonOffsetFactor: -2,
    polygonOffsetUnits: -2
  });

  const gridGeos = [];
  for (let slot = 0; slot < 8; slot++) {
    const sPos = START_FINISH_S - 11 - slot * 8.0;
    const latOffset = (slot % 2 === 0 ? -3.1 : 3.1);
    const sp = sampleTrack(sPos);

    // Front bar + two side brackets forming clean U-shaped starting box
    const frontBar = new THREE.PlaneGeometry(2.6, 0.26);
    frontBar.rotateX(-Math.PI / 2);
    frontBar.translate(sp.pos.x + sp.right.x * latOffset, sp.pos.y + 0.055, sp.pos.z + 2.1);
    gridGeos.push(frontBar);

    for (const side of [-1.22, 1.22]) {
      const sideBar = new THREE.PlaneGeometry(0.18, 1.9);
      sideBar.rotateX(-Math.PI / 2);
      sideBar.translate(sp.pos.x + sp.right.x * (latOffset + side), sp.pos.y + 0.055, sp.pos.z + 1.22);
      gridGeos.push(sideBar);
    }
  }
  const mergedGrid = mergeGeometries(gridGeos);
  const gridMesh = new THREE.Mesh(mergedGrid, paintMat);
  gridMesh.receiveShadow = true;
  trackGroup.add(gridMesh);

  // Pit Lane Asphalt Apron (parallel to main straight on the right / -X side)
  const pitApronGeo = new THREE.PlaneGeometry(17.5, 290);
  pitApronGeo.rotateX(-Math.PI / 2);
  pitApronGeo.translate(-17.8, -0.02, 15);
  const pitApronMat = new THREE.MeshStandardMaterial({
    color: 0x62666e,
    map: asphaltTex.map,
    normalMap: asphaltTex.normalMap,
    normalScale: new THREE.Vector2(0.55, 0.55),
    roughness: 0.86
  });
  const pitApron = new THREE.Mesh(pitApronGeo, pitApronMat);
  pitApron.receiveShadow = true;
  trackGroup.add(pitApron);

  // Pit lane white speed-limit lane stripe & garage box lines
  const pitLineGeos = [];
  const laneLine = new THREE.PlaneGeometry(0.28, 255);
  laneLine.rotateX(-Math.PI / 2);
  laneLine.translate(-15.0, 0.02, 15);
  pitLineGeos.push(laneLine);

  const outerPitLine = new THREE.PlaneGeometry(0.28, 255);
  outerPitLine.rotateX(-Math.PI / 2);
  outerPitLine.translate(-20.4, 0.02, 15);
  pitLineGeos.push(outerPitLine);

  for (let b = 0; b < 10; b++) {
    const bz = -90 + b * 22;
    const divider = new THREE.PlaneGeometry(5.6, 0.22);
    divider.rotateX(-Math.PI / 2);
    divider.translate(-23.2, 0.02, bz);
    pitLineGeos.push(divider);
  }
  const pitLinesMesh = new THREE.Mesh(mergeGeometries(pitLineGeos), paintMat);
  pitLinesMesh.receiveShadow = true;
  trackGroup.add(pitLinesMesh);
}
buildTrackMarkingsAndPitLane();

// 6.4 3D Profiled Red-and-White Curbs on Corner Apexes & Exits
function buildCurbs() {
  const verts = [];
  const normals = [];
  const colors = [];
  const indices = [];
  const redCol = new THREE.Color(0xc81c22);
  const whiteCol = new THREE.Color(0xe6e7e9);

  // Cross-section profile of beveled racing rumble curb (width ~1.35 m, height 0.09 m)
  const profX = [0.0, 0.18, 0.88, 1.32];
  const profY = [0.01, 0.085, 0.095, 0.015];

  function addCurbSide(sideSign) {
    let i = 0;
    while (i < TRACK_SAMPLES) {
      const has = sideSign > 0 ? trackTable[i].curbRight : trackTable[i].curbLeft;
      if (!has) { i++; continue; }
      const start = i;
      while (i < TRACK_SAMPLES && (sideSign > 0 ? trackTable[i].curbRight : trackTable[i].curbLeft)) {
        i++;
      }
      const end = i;
      if (end - start < 4) continue;

      const baseVert = verts.length / 3;
      const len = end - start;
      for (let k = 0; k <= len; k++) {
        const idx = (start + k) % TRACK_SAMPLES;
        const sp = trackTable[idx];
        const taper = smoothstep(0, 3, k) * smoothstep(0, 3, len - k);
        const col = ((Math.floor(k * 0.65) % 2) === 0) ? redCol : whiteCol;

        for (let p = 0; p < profX.length; p++) {
          const lat = sideSign * (TRACK_HALF_W - 0.08 + profX[p]);
          const h = profY[p] * (0.25 + 0.75 * taper);
          const pt = sp.pos.clone()
            .addScaledVector(sp.right, lat)
            .addScaledVector(sp.up, h);
          verts.push(pt.x, pt.y, pt.z);
          normals.push(sp.up.x, sp.up.y, sp.up.z);
          colors.push(col.r, col.g, col.b);
        }
      }

      const stride = profX.length;
      for (let k = 0; k < len; k++) {
        for (let p = 0; p < stride - 1; p++) {
          const a = baseVert + k * stride + p;
          const b = baseVert + (k + 1) * stride + p;
          const c = baseVert + (k + 1) * stride + p + 1;
          const d = baseVert + k * stride + p + 1;
          if (sideSign > 0) {
            indices.push(a, d, b, b, d, c);
          } else {
            indices.push(a, b, d, b, c, d);
          }
        }
      }
    }
  }

  addCurbSide(1);
  addCurbSide(-1);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.76,
    metalness: 0.04
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  trackGroup.add(mesh);
}
buildCurbs();

// 6.5 Gravel Traps on Corner Runoffs
function buildGravelTraps() {
  const verts = [];
  const uvs = [];
  const indices = [];

  function addGravelSide(sideSign) {
    let i = 0;
    while (i < TRACK_SAMPLES) {
      const sp = trackTable[i];
      // Place gravel on the OUTSIDE of corners (opposite to turn direction)
      const needsGravel = !sp.isMainStraight && (sideSign > 0 ? sp.curvature < -0.0068 : sp.curvature > 0.0068);
      if (!needsGravel) { i++; continue; }
      const start = Math.max(0, i - 6);
      while (i < TRACK_SAMPLES) {
        const s2 = trackTable[i];
        const ok = !s2.isMainStraight && (sideSign > 0 ? s2.curvature < -0.0052 : s2.curvature > 0.0052);
        if (!ok) break;
        i++;
      }
      const end = Math.min(TRACK_SAMPLES - 1, i + 10);
      if (end - start < 10) continue;

      const base = verts.length / 3;
      const len = end - start;
      for (let k = 0; k <= len; k++) {
        const spk = trackTable[(start + k) % TRACK_SAMPLES];
        const bell = smoothstep(0, 7, k) * smoothstep(0, 8, len - k);
        const wInner = TRACK_HALF_W + 1.85;
        const wOuter = TRACK_HALF_W + 2.4 + 10.5 * bell;

        const pIn = spk.pos.clone().addScaledVector(spk.right, sideSign * wInner).addScaledVector(spk.up, -0.06);
        const pOut = spk.pos.clone().addScaledVector(spk.right, sideSign * wOuter).addScaledVector(spk.up, -0.14);
        verts.push(pIn.x, pIn.y, pIn.z, pOut.x, pOut.y, pOut.z);
        uvs.push(0, k * 0.45, 2.2 * bell + 0.3, k * 0.45);
      }

      for (let k = 0; k < len; k++) {
        const a = base + k * 2;
        const b = base + (k + 1) * 2;
        const c = base + (k + 1) * 2 + 1;
        const d = base + k * 2 + 1;
        if (sideSign > 0) indices.push(a, d, b, b, d, c);
        else indices.push(a, b, d, b, c, d);
      }
    }
  }

  addGravelSide(1);
  addGravelSide(-1);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    map: gravelTex.map,
    normalMap: gravelTex.normalMap,
    normalScale: new THREE.Vector2(1.1, 1.1),
    roughness: 0.96,
    metalness: 0.0
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  trackGroup.add(mesh);
}
buildGravelTraps();

// 6.5b Painted High-Friction Trackside Runoff Graphics (Cobalt & Crimson Geometric Aprons)
function buildPaintedRunoffGraphics() {
  const c = makeCanvas(256, 256);
  const ctx = c.getContext('2d');
  // Modern Grand Prix painted runoff stripe graphics (Paul Ricard / Yas Marina style)
  ctx.fillStyle = '#1b3564';
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#1450b8' : '#0f2348';
    ctx.fillRect(0, i * 32, 256, 16);
  }
  // Outer crimson high-friction grip zone bands
  ctx.fillStyle = '#b41c24';
  ctx.fillRect(168, 0, 88, 256);
  ctx.fillStyle = '#d6282e';
  for (let i = 0; i < 8; i++) {
    ctx.fillRect(168, i * 32, 88, 12);
  }
  // Crisp white separator line
  ctx.fillStyle = '#e8ecf2';
  ctx.fillRect(162, 0, 6, 256);
  ctx.fillRect(0, 0, 6, 256);

  const runoffTex = new THREE.CanvasTexture(c);
  runoffTex.colorSpace = THREE.SRGBColorSpace;
  runoffTex.wrapS = runoffTex.wrapT = THREE.RepeatWrapping;
  runoffTex.anisotropy = 8;

  const verts = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  for (const sideSign of [-1, 1]) {
    let i = 0;
    while (i < TRACK_SAMPLES) {
      const sp = trackTable[i];
      // Place painted graphic runoff aprons on inside apexes & sweeping curves where there isn't a gravel trap
      const hasCurb = sideSign > 0 ? sp.curbRight : sp.curbLeft;
      const isGravel = !sp.isMainStraight && (sideSign > 0 ? sp.curvature < -0.0055 : sp.curvature > 0.0055);
      if (!hasCurb || isGravel) { i++; continue; }
      const start = Math.max(0, i - 3);
      while (i < TRACK_SAMPLES) {
        const s2 = trackTable[i];
        const ok = (sideSign > 0 ? s2.curbRight : s2.curbLeft) && !(sideSign > 0 ? s2.curvature < -0.0055 : s2.curvature > 0.0055);
        if (!ok) break;
        i++;
      }
      const end = Math.min(TRACK_SAMPLES - 1, i + 3);
      if (end - start < 5) continue;

      const base = verts.length / 3;
      const len = end - start;
      for (let k = 0; k <= len; k++) {
        const spk = trackTable[(start + k) % TRACK_SAMPLES];
        const bell = smoothstep(0, 4, k) * smoothstep(0, 4, len - k);
        const wIn = TRACK_HALF_W + 1.25;
        const wOut = TRACK_HALF_W + 1.45 + 3.1 * bell;
        const pIn = spk.pos.clone().addScaledVector(spk.right, sideSign * wIn).addScaledVector(spk.up, 0.015);
        const pOut = spk.pos.clone().addScaledVector(spk.right, sideSign * wOut).addScaledVector(spk.up, -0.02);
        verts.push(pIn.x, pIn.y, pIn.z, pOut.x, pOut.y, pOut.z);
        normals.push(spk.up.x, spk.up.y, spk.up.z, spk.up.x, spk.up.y, spk.up.z);
        uvs.push(0, k * 0.35, 1, k * 0.35);
      }
      for (let k = 0; k < len; k++) {
        const a = base + k * 2;
        const b = base + (k + 1) * 2;
        const c = base + (k + 1) * 2 + 1;
        const d = base + k * 2 + 1;
        if (sideSign > 0) indices.push(a, d, b, b, d, c);
        else indices.push(a, b, d, b, c, d);
      }
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);

  const mat = new THREE.MeshStandardMaterial({
    map: runoffTex,
    normalMap: asphaltTex.normalMap,
    normalScale: new THREE.Vector2(0.55, 0.55),
    roughness: 0.78,
    metalness: 0.04
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  trackGroup.add(mesh);
}
buildPaintedRunoffGraphics();

// 6.6 Side-by-Side Trackside Graphic Barrier Boards, Tire Walls, Catch Fencing & LED Marshal Panels
function buildBarriersTiresAndFencing() {
  const wallVerts = [];
  const wallNormals = [];
  const wallUvs = [];
  const wallIndices = [];

  const fenceVerts = [];
  const fenceUvs = [];
  const fenceIndices = [];

  const postTransforms = [];
  const tireTransforms = [];
  const tireColors = [];

  const redBand = new THREE.Color(0xc22026);
  const whiteBand = new THREE.Color(0xe2e4e8);
  const darkTire = new THREE.Color(0x1f2024);

  const step = 3; // every 3 samples (~4.2m)
  const nPts = Math.floor(TRACK_SAMPLES / step);

  for (const sideSign of [-1, 1]) {
    const wallBase = wallVerts.length / 3;
    const fenceBase = fenceVerts.length / 3;

    for (let k = 0; k <= nPts; k++) {
      const idx = (k * step) % TRACK_SAMPLES;
      const sp = trackTable[idx];

      // Widen corridor on outside of corners (for gravel traps) & pit wall on main straight
      const isOutsideCorner = (sideSign > 0 && sp.curvature < -0.0055) || (sideSign < 0 && sp.curvature > 0.0055);
      let wallDist = TRACK_HALF_W + 4.8;
      if (isOutsideCorner && !sp.isMainStraight) {
        wallDist += 9.0 * smoothstep(0.0055, 0.013, Math.abs(sp.curvature));
      }
      // Pit wall right side of main straight sits closer as crisp pit wall
      if (sp.isMainStraight && sideSign > 0) {
        wallDist = TRACK_HALF_W + 2.2;
      }

      const basePos = sp.pos.clone().addScaledVector(sp.right, sideSign * wallDist);
      const topPos = basePos.clone().addScaledVector(worldUp, 1.32);
      const fenceTop = basePos.clone().addScaledVector(worldUp, 3.85);

      const nOut = sp.right.clone().multiplyScalar(-sideSign);

      // Wall vertical face with crisp side-by-side graphic panel UVs (8 panels per ~34m)
      wallVerts.push(basePos.x, basePos.y - 0.20, basePos.z);
      wallVerts.push(topPos.x, topPos.y, topPos.z);
      wallNormals.push(nOut.x, nOut.y, nOut.z, nOut.x, nOut.y, nOut.z);
      const panelU = k * 0.125; // Each 4.2m segment = 1 distinct side-by-side graphic panel!
      wallUvs.push(panelU, 0, panelU, 1);

      // Catch fencing ribbon above the graphic barrier wall
      fenceVerts.push(topPos.x, topPos.y, topPos.z);
      fenceVerts.push(fenceTop.x, fenceTop.y, fenceTop.z);
      fenceUvs.push(k * 1.4, 0, k * 1.4, 1.6);

      // Fence posts every 2nd segment
      if (k < nPts && k % 2 === 0) {
        const m = new THREE.Matrix4();
        const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1, 0, 0), sp.right);
        m.compose(
          basePos.clone().add(new THREE.Vector3(0, 1.92, 0)),
          q,
          new THREE.Vector3(1, 1, 1)
        );
        postTransforms.push(m);
      }

      // Instanced tire-wall stacks lining outside of corners
      if (k < nPts && isOutsideCorner && !sp.isMainStraight) {
        const tireBasePos = sp.pos.clone().addScaledVector(sp.right, sideSign * (wallDist - 0.72));
        for (let row = 0; row < 2; row++) {
          const stackPos = tireBasePos.clone().addScaledVector(sp.tangent, (row - 0.5) * 1.65);
          for (let tier = 0; tier < 3; tier++) {
            const tm = new THREE.Matrix4();
            tm.makeTranslation(stackPos.x, stackPos.y + 0.16 + tier * 0.34, stackPos.z);
            tireTransforms.push(tm);
            const bandColor = ((k + row) % 4 < 2) ? redBand : ((tier === 1) ? whiteBand : darkTire);
            tireColors.push(bandColor);
          }
        }
      }
    }

    for (let k = 0; k < nPts; k++) {
      const a = wallBase + k * 2;
      const b = wallBase + (k + 1) * 2;
      const c = wallBase + (k + 1) * 2 + 1;
      const d = wallBase + k * 2 + 1;
      wallIndices.push(a, b, d, b, c, d);

      const fa = fenceBase + k * 2;
      const fb = fenceBase + (k + 1) * 2;
      const fc = fenceBase + (k + 1) * 2 + 1;
      const fd = fenceBase + k * 2 + 1;
      fenceIndices.push(fa, fb, fd, fb, fc, fd);
    }
  }

  // Glossy Laminated Side-by-Side Trackside Graphic Barrier Boards
  const wallGeo = new THREE.BufferGeometry();
  wallGeo.setAttribute('position', new THREE.Float32BufferAttribute(wallVerts, 3));
  wallGeo.setAttribute('normal', new THREE.Float32BufferAttribute(wallNormals, 3));
  wallGeo.setAttribute('uv', new THREE.Float32BufferAttribute(wallUvs, 2));
  wallGeo.setIndex(wallIndices);
  const wallMat = new THREE.MeshPhysicalMaterial({
    map: barrierGraphicAtlas.map,
    normalMap: barrierGraphicAtlas.normalMap,
    normalScale: new THREE.Vector2(0.85, 0.85),
    roughness: 0.34,
    metalness: 0.14,
    clearcoat: 0.72,
    clearcoatRoughness: 0.18,
    side: THREE.DoubleSide
  });
  const wallMesh = new THREE.Mesh(wallGeo, wallMat);
  wallMesh.receiveShadow = true;
  wallMesh.castShadow = true;
  trackGroup.add(wallMesh);

  // Catch fence mesh (with exact outward normals -> zero NaN in PBR shader!)
  const fenceGeo = new THREE.BufferGeometry();
  fenceGeo.setAttribute('position', new THREE.Float32BufferAttribute(fenceVerts, 3));
  fenceGeo.setAttribute('normal', new THREE.Float32BufferAttribute(wallNormals, 3));
  fenceGeo.setAttribute('uv', new THREE.Float32BufferAttribute(fenceUvs, 2));
  fenceGeo.setIndex(fenceIndices);
  const fenceMat = new THREE.MeshStandardMaterial({
    map: fenceTex,
    transparent: true,
    alphaTest: 0.18,
    side: THREE.DoubleSide,
    roughness: 0.55,
    metalness: 0.65
  });
  trackGroup.add(new THREE.Mesh(fenceGeo, fenceMat));

  // Instanced Catch Fence Steel Posts
  const postGeo = new THREE.CylinderGeometry(0.055, 0.065, 3.85, 6);
  const postMat = new THREE.MeshStandardMaterial({ color: 0x8e959e, metalness: 0.78, roughness: 0.38 });
  const postInst = new THREE.InstancedMesh(postGeo, postMat, postTransforms.length);
  for (let i = 0; i < postTransforms.length; i++) postInst.setMatrixAt(i, postTransforms[i]);
  postInst.instanceMatrix.needsUpdate = true;
  trackGroup.add(postInst);

  // Instanced Tire-Wall Barriers
  const tireGeo = new THREE.TorusGeometry(0.32, 0.16, 8, 14);
  tireGeo.rotateX(Math.PI / 2);
  const tireMat = new THREE.MeshStandardMaterial({ roughness: 0.86, metalness: 0.04 });
  const tireInst = new THREE.InstancedMesh(tireGeo, tireMat, tireTransforms.length);
  for (let i = 0; i < tireTransforms.length; i++) {
    tireInst.setMatrixAt(i, tireTransforms[i]);
    tireInst.setColorAt(i, tireColors[i]);
  }
  tireInst.instanceMatrix.needsUpdate = true;
  tireInst.instanceColor.needsUpdate = true;
  tireInst.castShadow = true;
  tireInst.receiveShadow = true;
  trackGroup.add(tireInst);

  // Glowing Trackside FIA-style LED Marshal Light Panels + Striped Braking Marker Boards
  const housingMat = new THREE.MeshStandardMaterial({ color: 0x181b22, metalness: 0.55, roughness: 0.4 });
  const greenPanelMat = new THREE.MeshStandardMaterial({
    color: 0x16ff70,
    emissive: 0x12ff64,
    emissiveIntensity: 3.2,
    roughness: 0.2
  });
  const amberPanelMat = new THREE.MeshStandardMaterial({
    color: 0xffb218,
    emissive: 0xff9a08,
    emissiveIntensity: 3.0,
    roughness: 0.2
  });

  // 16 Trackside LED Marshal Light Panels spaced around circuit
  for (let m = 0; m < 16; m++) {
    const sp = trackTable[Math.floor((m / 16) * TRACK_SAMPLES)];
    const side = m % 2 === 0 ? -1 : 1;
    const dist = sp.isMainStraight && side > 0 ? TRACK_HALF_W + 2.4 : TRACK_HALF_W + 4.9;
    const base = sp.pos.clone().addScaledVector(sp.right, side * dist);
    const panelGrp = new THREE.Group();
    panelGrp.position.copy(base);
    // Aim panel face slightly toward oncoming cars (-tangent)
    const lookPt = base.clone().addScaledVector(sp.tangent, -12).addScaledVector(sp.right, -side * 3);
    panelGrp.lookAt(lookPt);

    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 2.75, 6), postMat);
    mast.position.y = 1.38;
    panelGrp.add(mast);

    const frame = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.72, 0.12), housingMat);
    frame.position.y = 2.65;
    panelGrp.add(frame);

    const ledFace = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 0.58), m % 4 === 1 ? amberPanelMat : greenPanelMat);
    ledFace.position.set(0, 2.65, 0.065);
    panelGrp.add(ledFace);
    trackGroup.add(panelGrp);
  }

  // Geometric Striped Braking-Zone Distance Boards (3-bar, 2-bar, 1-bar — zero numbers/text)
  function makeBrakeBoardTex(bars) {
    const bc = makeCanvas(128, 96);
    const bctx = bc.getContext('2d');
    bctx.fillStyle = '#eff2f7';
    bctx.fillRect(0, 0, 128, 96);
    bctx.strokeStyle = '#181b22';
    bctx.lineWidth = 6;
    bctx.strokeRect(3, 3, 122, 90);
    bctx.fillStyle = '#d41a24';
    for (let b = 0; b < bars; b++) {
      const bx = 24 + b * 32;
      bctx.beginPath();
      bctx.moveTo(bx, 78);
      bctx.lineTo(bx + 18, 18);
      bctx.lineTo(bx + 34, 18);
      bctx.lineTo(bx + 16, 78);
      bctx.closePath();
      bctx.fill();
    }
    const t = new THREE.CanvasTexture(bc);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  const brakeMats = [1, 2, 3].map(n => new THREE.MeshStandardMaterial({ map: makeBrakeBoardTex(n), roughness: 0.45 }));

  // Place 3-2-1 braking boards ahead of Turn 1 (main straight end) and Turn 5 (back straight end)
  const brakeAnchorSs = [START_FINISH_S + 145, START_FINISH_S + 985];
  for (const anchorS of brakeAnchorSs) {
    for (let b = 0; b < 3; b++) {
      const sp = sampleTrack(anchorS - b * 34);
      const base = sp.pos.clone().addScaledVector(sp.right, -(TRACK_HALF_W + 3.4));
      const grp = new THREE.Group();
      grp.position.copy(base);
      grp.lookAt(base.clone().addScaledVector(sp.tangent, -15));
      const board = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.85, 0.08), brakeMats[b]);
      board.position.y = 0.78;
      board.castShadow = true;
      grp.add(board);
      trackGroup.add(grp);
    }
  }
}
buildBarriersTiresAndFencing();

// 6.7 Start-Finish Gantry (Sleek Truss + Glowing Start Signal Lights, No Text)
function buildStartFinishGantry() {
  const sf = sampleTrack(START_FINISH_S);
  const g = new THREE.Group();
  g.position.copy(sf.pos);

  const steelMat = new THREE.MeshStandardMaterial({ color: 0xd0d6df, metalness: 0.72, roughness: 0.28 });
  const darkTrimMat = new THREE.MeshStandardMaterial({ color: 0x1e222b, metalness: 0.45, roughness: 0.42 });
  const accentMat = new THREE.MeshStandardMaterial({ color: 0xd4222a, metalness: 0.35, roughness: 0.32 });

  const span = TRACK_WIDTH + 6.4;
  const height = 8.4;

  // Dual tapered support towers on left & right of track
  for (const s of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(1.15, height, 1.35), darkTrimMat);
    leg.position.set(s * (span * 0.5), height * 0.5, 0);
    leg.castShadow = true;
    g.add(leg);

    const accentStripe = new THREE.Mesh(new THREE.BoxGeometry(1.22, 1.4, 1.42), accentMat);
    accentStripe.position.set(s * (span * 0.5), height * 0.72, 0);
    g.add(accentStripe);
  }

  // Main overhead bridge beam + curved aerodynamic fascia
  const beam = new THREE.Mesh(new THREE.BoxGeometry(span + 1.4, 2.0, 2.2), darkTrimMat);
  beam.position.set(0, height - 0.5, 0);
  beam.castShadow = true;
  g.add(beam);

  const upperTrim = new THREE.Mesh(new THREE.BoxGeometry(span + 1.6, 0.28, 2.32), steelMat);
  upperTrim.position.set(0, height + 0.52, 0);
  g.add(upperTrim);

  const lowerTrim = new THREE.Mesh(new THREE.BoxGeometry(span + 1.6, 0.24, 2.32), accentMat);
  lowerTrim.position.set(0, height - 1.52, 0);
  g.add(lowerTrim);

  // Geometric speed-stripe accent panels on bridge face (purely geometric, zero text)
  for (let i = -4; i <= 4; i++) {
    const chev = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.15, 2.34), i % 2 === 0 ? steelMat : accentMat);
    chev.position.set(i * 1.9, height - 0.5, 0);
    chev.rotation.z = -0.26;
    g.add(chev);
  }

  // 5 Motorsport Start Light Pods hanging beneath gantry (glowing green race-active LEDs)
  const podMat = new THREE.MeshStandardMaterial({ color: 0x15171c, roughness: 0.4, metalness: 0.5 });
  const greenLedMat = new THREE.MeshStandardMaterial({
    color: 0x20ff78,
    emissive: 0x14ff66,
    emissiveIntensity: 3.4,
    roughness: 0.2
  });
  for (let i = -2; i <= 2; i++) {
    const pod = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.05, 0.36), podMat);
    pod.position.set(i * 1.45, height - 2.15, 0.45);
    g.add(pod);
    for (const dy of [-0.24, 0.24]) {
      const led = new THREE.Mesh(new THREE.CircleGeometry(0.16, 14), greenLedMat);
      led.position.set(i * 1.45, height - 2.15 + dy, 0.26);
      led.rotation.y = Math.PI;
      g.add(led);
      const ledBack = led.clone();
      ledBack.position.z = 0.64;
      ledBack.rotation.y = 0;
      g.add(ledBack);
    }
  }

  trackGroup.add(g);
}
buildStartFinishGantry();

// 6.9 Grandstands Full of Colorful Instanced Spectators (with LOD & subtle wave)
const spectatorInstData = [];
let spectatorHeadInst = null;
let spectatorBodyInst = null;

function buildGrandstandsAndSpectators() {
  const concreteMat = new THREE.MeshStandardMaterial({ color: 0xc8ccd2, roughness: 0.82, metalness: 0.05 });
  const roofMat = new THREE.MeshStandardMaterial({ color: 0xe6e8ee, roughness: 0.48, metalness: 0.22 });
